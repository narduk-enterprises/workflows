version: 2
updates:
  # Keep the SHA-pinned actions in the callables current (workflows#184: the
  # pnpm/action-setup pin went stale for months because nothing flagged it).
  # Dependabot rewrites the `# vX.Y.Z` comment alongside the SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
