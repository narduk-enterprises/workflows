name: Reusable PR Closing-Syntax Check

# Distributes agent-infrastructure's scripts/check_pr_closing_syntax.py to the
# rest of the estate (agent-infrastructure#837): the 2026-08-21 pacc-trac merge
# train produced two live near-misses of exactly what this checker exists to
# catch -- PR #67's body-edited-five-minutes-before-merge `fix #47`, and PR
# #66's merged `Closes #49` inside an inline code span -- in a repository that
# had no gate at all, because the checker was required CI in
# narduk-enterprises/agent-infrastructure only.
#
# Validates BOTH channels GitHub's own auto-close scan reads:
#   - the PR body: an ambiguous comma-separated closing list, or a closing
#     keyword-plus-reference adjacency anywhere outside a canonical closing
#     line/list item (quoted, backticked, blockquoted, mid-sentence, and a
#     wrapped prose line are not escapes -- agent-infrastructure#755);
#   - every individual commit message in the PR's own commit range. On a
#     squash merge, GitHub's default merge-commit message concatenates every
#     squashed commit's own subject and body and scans THAT landed commit for
#     closing keywords independently of the curated, checker-validated PR
#     body. agent-infrastructure PR #1080 hit exactly this: an early commit's
#     message said `Closes #1056`, a later commit on the same branch reverted
#     that change, and the PR's own body correctly said `Refs #1056` -- but
#     the squash-merge commit auto-closed #1056 anyway, because the stale
#     trailer survived inside the commit history (agent-infrastructure#1085).
#     A closing keyword in a commit message has no canonical-position escape
#     at all: closing keywords belong in the PR body only.
#
# THIS FILE IS THE VENDORED COPY -- deliberately. A cross-repo checkout of
# agent-infrastructure's own script would need a token with read access to a
# THIRD private repo, which the workflow_call default GITHUB_TOKEN does not
# grant (it is scoped to the calling repo only; the "Actions access:
# organization" setting that makes the workflow_call itself resolve does not
# extend to actions/checkout of a different repo's files). Embedding the
# checker's source directly here is what actually delivers "one `uses:` block
# and no vendored copy" for every ADOPTING repo -- the one copy left lives in
# this distribution point, not fetched at run time and not duplicated by hand
# into each consumer.
#
# KEEPING THE VENDORED CHECKER IN SYNC: when
# narduk-enterprises/agent-infrastructure's scripts/check_pr_closing_syntax.py
# changes, re-embed the new source into the "Write vendored checker" step
# below in the same PR, verify `git diff` against that file's exact content,
# and advance this repo's `v1` tag once merged (adding/updating a callable is
# within-major per the Versioning policy in README.md). There is no automated
# drift check between the two repos as of this writing.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          JSON-encoded runner for the jobs in this workflow: a plain string
          ("ubuntu-latest"), a JSON array, or a JSON object
          ({"group":"linux-ci","labels":[...]}) matching the runner-fleet
          manifest's `runsOn` shape. Decoded with fromJSON(), so the value
          must be valid JSON -- a bare string needs its own quotes. Defaults
          to GitHub-hosted ubuntu-latest. A PUBLIC (or possibly-future-public)
          CALLER MUST NEVER PASS A SELF-HOSTED LABEL: a fork PR would run
          attacker-controlled code on estate self-hosted infrastructure. The
          constraint is the caller's visibility, not this repo's (private,
          org-scoped Actions access -- D-VIS-1, workflows#2).
        required: false
        type: string
        default: '"ubuntu-latest"'

jobs:
  check:
    name: check
    # ---------------------------------------------------------------------
    # Blacksmith overflow (D-CI-CAP-1 (c), extends D-BLACKSMITH-2; company-hq
    # DECISIONS.md, fleet#337). Manual, kill-switched overflow for the
    # `linux-ci` class's ordinary private CI -- never deploy or tailnet work.
    # The org Actions variable `BLACKSMITH_RUNNERS_ENABLED` (default `false`,
    # visibility: private repos) is the switch; a repo-level variable of the
    # same name overrides it for exactly that repo (GitHub's normal
    # repo > org precedence), which is how a canary is scoped to one adopter
    # without moving the org default. Exact `true` selects the vendor's
    # documented `blacksmith-2vcpu-ubuntu-2404` label (override via
    # `vars.BLACKSMITH_LINUX_LABEL`) -- a label-only route, per D-BLACKSMITH-4:
    # provider-created runner groups are not a stable contract and are never
    # pinned here. Any other value, and any caller still on the public
    # `"ubuntu-latest"` default, keeps the caller's own `inputs.runner` route
    # unchanged -- this never touches a public repo's runner. This is a
    # MANUAL switch, not automatic provider fallback: GitHub does not move an
    # already-queued job to another runs-on target, so the fallback is
    # flipping the variable back to false (or deleting the repo override) and
    # rerunning. Kill conditions (D-BLACKSMITH-2/3, unchanged by this
    # extension): disable at 2,400 equivalent 2-vCPU minutes in a monthly
    # cycle, at any non-zero amount due, or on any unexpected billing state --
    # whichever comes first. No payment method or paid overage is authorized.
    # Policy-exception annotation (CI-RUNNER-POLICY.md Sec 2 exception 4, as
    # expanded by D-CI-CAP-1 (c)): a job landing on Blacksmith here is
    # exercising that named exception, not drift.
    # ---------------------------------------------------------------------
    runs-on: ${{ fromJSON(vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && inputs.runner != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || inputs.runner) }}
    # Headroom for the linux-ci capacity-hook slot wait (up to 900s, counts against timeout-minutes) -- fleet#276.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # fetch-depth: 0, always -- not a caller-configurable input. The commit
      # -message scan needs the PR's full commit range reachable, and a
      # shallow clone would silently make that scan find nothing rather than
      # failing loudly, which is worse than not having the check at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Write vendored checker
        run: |
          cat <<'PY_CHECKER_EOF' > "$RUNNER_TEMP/check_pr_closing_syntax.py"
          #!/usr/bin/env python3
          """Reject PR bodies and commit messages whose closing keywords are unsafe.

          Three rules, all about the gap between what a lane *wrote* and what GitHub's
          parser *does*:

          - an ambiguous comma-separated list closes only its first reference;
          - a keyword-plus-reference adjacency anywhere outside a canonical closing
            position closes that issue anyway — quotation marks, backticks, blockquotes,
            and an explanatory sentence arguing against the close are not escapes
            (agent-infrastructure#755, three live incidents in one evening: PR #754 shut
            issue #681, PR #756 shut #732, PR #758 shut #602, each from a lane that had
            deliberately used a non-closing reference);
          - a closing keyword anywhere in an *individual commit message* on the PR's
            branch is unsafe regardless of what the final, checker-validated PR body
            says. On a squash merge, GitHub's default merge-commit message concatenates
            every squashed commit's own subject and body and scans *that* landed commit
            for closing keywords — independently of the curated PR body. PR #1080
            carried a stale `Closes #1056` in an early commit whose change was later
            reverted; the PR's final body correctly declared `Refs #1056`, and the
            checker validated that body as safe, but the squash-merge commit still
            auto-closed #1056 because the stale trailer survived inside the commit
            history (agent-infrastructure#1085).

          The second and third rules reject outright rather than warning: a PR body has
          no need to reproduce a closing directive verbatim, and a commit message has no
          legitimate reason to carry one at all — closing keywords belong in the PR
          body only.
          """

          from __future__ import annotations

          import argparse
          import json
          import os
          import re
          import subprocess
          import sys
          from dataclasses import dataclass
          from pathlib import Path

          CLOSING_KEYWORD = r"(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)"
          # Every reference form GitHub honours after a closing keyword, not just `#N`:
          # a cross-repo `owner/repo#N`, the `GH-N` autolink, and a full issue/pull URL.
          ISSUE_REFERENCE = (
              r"(?:(?:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#\d+"
              r"|GH-\d+"
              r"|https?://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/(?:issues|pull)/\d+)"
          )
          AMBIGUOUS_CLOSING_LIST = re.compile(
              rf"\b(?P<keyword>{CLOSING_KEYWORD})\s*:?\s+"
              rf"(?P<first>{ISSUE_REFERENCE})(?P<trailing>(?:\s*,\s*#\d+)+)",
              re.IGNORECASE,
          )
          CLOSING_DIRECTIVE = re.compile(
              rf"\b(?P<keyword>{CLOSING_KEYWORD})\s*:?\s+(?P<reference>{ISSUE_REFERENCE})",
              re.IGNORECASE,
          )

          # A canonical closing position is the start of a dedicated closing line or list
          # item, optionally opened by an emphasis run (`- **Closes #N** — why`). Leading
          # whitespace is canonical only behind a list marker: an indented keyword is a
          # wrapped prose line, which is how PR #756 shut issue #732.
          EMPHASIS_OPENER = r"(?:\*{1,2}|_{1,2})?"
          LINE_START_POSITION = re.compile(rf"^{EMPHASIS_OPENER}$")
          LIST_ITEM_POSITION = re.compile(rf"^[ \t]*(?:[-*+]|\d+[.)])[ \t]+{EMPHASIS_OPENER}$")
          FENCE_LINE = re.compile(r"^[ \t]{0,3}(?:```|~~~)")
          BLOCK_BOUNDARY = re.compile(r"^[ \t]{0,3}(?:#{1,6}[ \t]|(?:-{3,}|\*{3,}|_{3,})[ \t]*$)")
          # What may separate two closing directives sharing one canonical line, so that
          # `Closes #A, closes #B. Fixes #C` stays one declaration rather than three
          # positions to argue about.
          DIRECTIVE_SEPARATOR = re.compile(r"[\s,;.&+/]*(?:and[\s,;.&+/]*)?")
          CURLY_QUOTE_PAIRS = (("“", "”"), ("‘", "’"), ("«", "»"))

          # `git log -z --format=<COMMIT_LOG_FORMAT>` output shape: each commit's sha and
          # raw body (%B, which already includes the subject line) separated by \x1f,
          # each commit record terminated by NUL (the `-z` flag). Neither byte occurs in
          # ordinary commit text, so this survives multi-line, multi-paragraph bodies
          # that a newline-delimited format would not.
          COMMIT_LOG_FORMAT = "%H%x1f%B"


          @dataclass(frozen=True)
          class Finding:
              line: int
              keyword: str
              first_reference: str
              trailing_references: tuple[str, ...]


          @dataclass(frozen=True)
          class CommitFinding:
              """A closing-keyword adjacency found inside one commit's own message."""

              sha: str
              keyword: str
              reference: str
              subject: str


          class CommitRangeError(RuntimeError):
              """`git log` could not read the PR's commit range."""


          @dataclass(frozen=True)
          class Directive:
              """One keyword-plus-reference adjacency GitHub would act on."""

              line: int
              keyword: str
              reference: str
              canonical: bool
              position: str


          def find_ambiguous_closing_lists(body: str) -> list[Finding]:
              """Return closing-keyword lists whose trailing references are bare."""
              findings: list[Finding] = []
              for match in AMBIGUOUS_CLOSING_LIST.finditer(body):
                  findings.append(
                      Finding(
                          line=body.count("\n", 0, match.start()) + 1,
                          keyword=match.group("keyword"),
                          first_reference=match.group("first"),
                          trailing_references=tuple(re.findall(r"#\d+", match.group("trailing"))),
                      )
                  )
              return findings


          def _fenced_lines(lines: list[str]) -> list[bool]:
              """Flag every line a fenced code block covers, delimiter lines included."""
              inside = False
              flags: list[bool] = []
              for line in lines:
                  if FENCE_LINE.match(line):
                      flags.append(True)
                      inside = not inside
                      continue
                  flags.append(inside)
              return flags


          def _inside_curly_quotes(prefix: str) -> bool:
              """True when a typographic quotation opened before here and never closed."""
              return any(
                  prefix.rfind(opener) > prefix.rfind(closer)
                  for opener, closer in CURLY_QUOTE_PAIRS
              )


          def _position_name(prefix: str) -> str:
              """Name the non-canonical position, so the author can find the sentence.

              Delimiters are counted for parity rather than mere presence: a code span
              that already closed earlier on the line ("`refs`, deliberately not a
              closing keyword") leaves the keyword in plain prose, and the name has to
              say so or the author hunts the wrong text. The straight apostrophe is left
              out of the quotation test — it is far more often a possessive.
              """
              stripped = prefix.lstrip()
              if stripped.startswith(">"):
                  return "inside a blockquote"
              if prefix.count("`") % 2:
                  return "inside an inline code span"
              if prefix.count('"') % 2 or _inside_curly_quotes(prefix):
                  return "inside quotation marks"
              if not stripped:
                  return "on an indented continuation line"
              return "mid-sentence in prose"


          def _position_of(
              prefix: str, index: int, previous_line: str | None, fenced: list[bool]
          ) -> str:
              """Return "" for a canonical position, else the name of the one found."""
              if fenced[index]:
                  return "inside a fenced code block"
              if LIST_ITEM_POSITION.fullmatch(prefix):
                  return ""
              if LINE_START_POSITION.fullmatch(prefix):
                  if previous_line is None or not previous_line.strip():
                      return ""
                  if BLOCK_BOUNDARY.match(previous_line) or FENCE_LINE.match(previous_line):
                      return ""
                  return "on a wrapped prose line"
              return _position_name(prefix)


          def classify_closing_directives(body: str) -> list[Directive]:
              """Classify every closing directive in document order.

              A directive is canonical when it opens a dedicated closing line or list
              item, or when it continues a run of canonical directives already on that
              line (`Closes #A, closes #B`). Everything else — quoted, narrated, fenced,
              blockquoted, or reached by prose wrapping — is non-canonical and rejected.
              """
              lines = body.split("\n")
              fenced = _fenced_lines(lines)
              directives: list[Directive] = []
              run: tuple[int, int] | None = None
              for match in CLOSING_DIRECTIVE.finditer(body):
                  index = body.count("\n", 0, match.start())
                  prefix = body[body.rfind("\n", 0, match.start()) + 1 : match.start()]
                  previous_line = lines[index - 1] if index else None
                  position = _position_of(prefix, index, previous_line, fenced)
                  if position and run is not None:
                      run_line, run_end = run
                      gap = body[run_end : match.start()]
                      if run_line == index and DIRECTIVE_SEPARATOR.fullmatch(gap):
                          position = ""
                  directives.append(
                      Directive(
                          line=index + 1,
                          keyword=match.group("keyword"),
                          reference=match.group("reference"),
                          canonical=not position,
                          position=position,
                      )
                  )
                  if not position:
                      run = (index, match.end())
              return directives


          def find_misplaced_closings(body: str) -> list[Directive]:
              """Return closing directives GitHub would act on from a non-canonical spot."""
              return [
                  directive
                  for directive in classify_closing_directives(body)
                  if not directive.canonical
              ]


          def declared_closures(body: str) -> tuple[str, ...]:
              """The issue references this body declares it will close, in order.

              Printed on success so the merge ritual's bidirectional closed-set assertion
              has a stated set to compare the post-merge closed set against.
              """
              return tuple(
                  directive.reference
                  for directive in classify_closing_directives(body)
                  if directive.canonical
              )


          def find_commit_closing_keywords(commits: list[tuple[str, str]]) -> list[CommitFinding]:
              """Return every closing-keyword adjacency found in a commit's own message.

              Unlike a PR body, a commit message has no canonical closing position at
              all — GitHub's squash-merge auto-close scan applies to the whole landed
              commit message, so any keyword-plus-reference adjacency anywhere in it is
              unsafe (agent-infrastructure#1085).
              """
              findings: list[CommitFinding] = []
              for sha, message in commits:
                  stripped = message.strip()
                  subject = stripped.splitlines()[0] if stripped else ""
                  for match in CLOSING_DIRECTIVE.finditer(message):
                      findings.append(
                          CommitFinding(
                              sha=sha,
                              keyword=match.group("keyword"),
                              reference=match.group("reference"),
                              subject=subject,
                          )
                      )
              return findings


          def parse_commit_log(raw: str) -> list[tuple[str, str]]:
              """Parse `git log -z --format=<COMMIT_LOG_FORMAT>` output into (sha, message) pairs."""
              commits: list[tuple[str, str]] = []
              for record in raw.split("\x00"):
                  if not record:
                      continue
                  sha, _, message = record.partition("\x1f")
                  commits.append((sha.strip(), message))
              return commits


          def collect_commit_range(base_sha: str, head_sha: str) -> list[tuple[str, str]]:
              """Run `git log` over the PR's commit range and parse the result.

              Raises CommitRangeError rather than letting a `git` failure surface as an
              uncaught traceback — the caller turns that into a clean, fail-closed
              ``::error`` rather than a stack trace.
              """
              result = subprocess.run(
                  ["git", "log", "-z", f"--format={COMMIT_LOG_FORMAT}", f"{base_sha}..{head_sha}"],
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  raise CommitRangeError(
                      f"git log {base_sha}..{head_sha} failed: {result.stderr.strip()}"
                  )
              return parse_commit_log(result.stdout)


          def read_event_body(path: Path) -> str:
              """Read a pull-request body from a GitHub event; non-PR events are empty."""
              with path.open(encoding="utf-8") as event_file:
                  event = json.load(event_file)
              pull_request = event.get("pull_request")
              if not isinstance(pull_request, dict):
                  return ""
              body = pull_request.get("body")
              return body if isinstance(body, str) else ""


          def read_event_commit_range(path: Path) -> tuple[str, str] | None:
              """Read the PR's base/head commit shas from a GitHub event.

              Returns None for a non-PR event, or a PR event missing either sha —
              ``main()`` treats that as "nothing to scan" rather than an error, matching
              ``read_event_body``'s handling of a non-PR event.
              """
              with path.open(encoding="utf-8") as event_file:
                  event = json.load(event_file)
              pull_request = event.get("pull_request")
              if not isinstance(pull_request, dict):
                  return None
              base = pull_request.get("base")
              head = pull_request.get("head")
              if not isinstance(base, dict) or not isinstance(head, dict):
                  return None
              base_sha = base.get("sha")
              head_sha = head.get("sha")
              if not isinstance(base_sha, str) or not isinstance(head_sha, str):
                  return None
              if not base_sha or not head_sha:
                  return None
              return base_sha, head_sha


          def write_summary(
              findings: list[Finding],
              misplaced: list[Directive],
              commit_findings: list[CommitFinding],
          ) -> None:
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if not summary_path:
                  return
              with Path(summary_path).open("a", encoding="utf-8") as summary:
                  summary.write("## PR issue-closing syntax\n\n")
                  if findings:
                      summary.write(
                          f"Found {len(findings)} ambiguous comma-separated closing "
                          f"{'list' if len(findings) == 1 else 'lists'}.\n\n"
                      )
                      summary.write(
                          "Repeat the closing keyword before every issue number, or use "
                          "`Refs #N` / `Part of #N` when the issue is not fully complete.\n\n"
                      )
                  if misplaced:
                      summary.write(
                          f"Found {len(misplaced)} closing keyword"
                          f"{'' if len(misplaced) == 1 else 's'} outside a canonical "
                          "closing position.\n\n"
                      )
                      summary.write(
                          "GitHub acts on a closing keyword in quoted, narrated, "
                          "code-span, and blockquoted text too. Keep closing keywords on "
                          "the dedicated closing line or list item, and rephrase every "
                          "other mention — drop the digits (`Closes #N`), escape the "
                          "keyword, or separate it from the reference.\n\n"
                      )
                  if commit_findings:
                      summary.write(
                          f"Found {len(commit_findings)} closing keyword"
                          f"{'' if len(commit_findings) == 1 else 's'} inside a commit "
                          "message on this branch.\n\n"
                      )
                      summary.write(
                          "GitHub scans every squashed commit's own message for closing "
                          "keywords on merge, independent of the curated PR body. "
                          "Closing keywords belong in the PR body only — amend or rebase "
                          "the offending commit to remove them.\n"
                      )


          def check(body: str, commits: list[tuple[str, str]] | None = None) -> int:
              commits = commits or []
              findings = find_ambiguous_closing_lists(body)
              directives = classify_closing_directives(body)
              misplaced = [directive for directive in directives if not directive.canonical]
              commit_findings = find_commit_closing_keywords(commits)
              if not findings and not misplaced and not commit_findings:
                  declared = [directive.reference for directive in directives]
                  print(
                      "PR closing syntax: safe (declared closing set: "
                      f"{', '.join(declared) if declared else 'empty'})"
                  )
                  return 0

              for finding in findings:
                  trailing = ", ".join(finding.trailing_references)
                  print(
                      "::error title=Ambiguous issue-closing list::"
                      f"PR body line {finding.line}: {finding.keyword} applies only to "
                      f"{finding.first_reference}; repeat the keyword before {trailing}."
                  )
              for directive in misplaced:
                  print(
                      "::error title=Closing keyword out of position::"
                      f"PR body line {directive.line}: '{directive.keyword} "
                      f"{directive.reference}' sits {directive.position}, and GitHub "
                      f"closes {directive.reference} from that text regardless. Move it "
                      "to the dedicated closing line, or rephrase the mention so no "
                      "closing keyword touches an issue reference."
                  )
              for commit_finding in commit_findings:
                  print(
                      "::error title=Closing keyword in commit message::"
                      f"Commit {commit_finding.sha[:12]} (\"{commit_finding.subject}\") "
                      f"contains '{commit_finding.keyword} {commit_finding.reference}': "
                      "closing keywords belong in the PR body only. GitHub scans every "
                      "squashed commit's message for closing keywords independently of "
                      "the curated PR body (agent-infrastructure#1085) — amend or "
                      "rebase the commit to remove it."
                  )
              write_summary(findings, misplaced, commit_findings)
              return 1


          def parse_args(argv: list[str]) -> argparse.Namespace:
              parser = argparse.ArgumentParser(description=__doc__)
              source = parser.add_mutually_exclusive_group(required=True)
              source.add_argument("--body-file", type=Path)
              source.add_argument("--event", type=Path)
              parser.add_argument(
                  "--commits-file",
                  type=Path,
                  default=None,
                  help=(
                      "Path to `git log -z --format=<COMMIT_LOG_FORMAT>` output for the "
                      "PR's commit range, for local/testing use with --body-file. With "
                      "--event and no --commits-file, the base/head shas are read from "
                      "the event and `git log` is run directly."
                  ),
              )
              return parser.parse_args(argv)


          def main(argv: list[str] | None = None) -> int:
              args = parse_args(argv or sys.argv[1:])
              if args.body_file:
                  body = args.body_file.read_text(encoding="utf-8")
              else:
                  body = read_event_body(args.event)

              commits: list[tuple[str, str]] = []
              if args.commits_file:
                  commits = parse_commit_log(args.commits_file.read_text(encoding="utf-8"))
              elif args.event:
                  commit_range = read_event_commit_range(args.event)
                  if commit_range:
                      try:
                          commits = collect_commit_range(*commit_range)
                      except CommitRangeError as error:
                          print(f"::error title=Could not read commit range::{error}")
                          return 1

              return check(body, commits)


          if __name__ == "__main__":
              raise SystemExit(main())
          PY_CHECKER_EOF

      # GITHUB_EVENT_PATH is set by the Actions runner on every job by
      # default and reflects the run's original triggering event even inside
      # a called (workflow_call) job -- no extra plumbing needed to reach the
      # pull_request payload this check reads body, base sha, and head sha
      # from.
      - name: Run PR closing-syntax check
        run: python3 "$RUNNER_TEMP/check_pr_closing_syntax.py" --event "$GITHUB_EVENT_PATH"

  required:
    name: Required
    if: always()
    needs: check
    # Blacksmith overflow (see the block above this file's first routed job) -- D-CI-CAP-1 (c)/D-BLACKSMITH-2, fleet#337.
    runs-on: ${{ fromJSON(vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && inputs.runner != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || inputs.runner) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require the closing-syntax check to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          case "$CHECK_RESULT" in
            success) exit 0 ;;
            *) echo "::error::check job reported '$CHECK_RESULT'"; exit 1 ;;
          esac
