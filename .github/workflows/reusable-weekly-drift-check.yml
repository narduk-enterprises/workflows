name: Reusable Weekly Drift Check

# Canonical replacement for the blob-copied weekly-drift-check.yml that ~20
# fleet repos carried, which 404'd against the renamed narduk-nuxt-template
# repo. Runs typecheck, unit tests, and narduk-fleet template-drift detection.
# Callers pin @vN or a SHA — never @main.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      run-typecheck:
        description: "Run TypeScript type checking (pnpm -r run typecheck)"
        required: false
        type: boolean
        default: true
      run-tests:
        description: "Run unit tests (pnpm -r --if-present test:unit)"
        required: false
        type: boolean
        default: true
      run-drift-check:
        description: "Run narduk-fleet check-drift template drift detection"
        required: false
        type: boolean
        default: true
      drift-soft-fail:
        description: "If true, drift findings are reported but do not fail the run (legacy template behavior)"
        required: false
        type: boolean
        default: false
    secrets:
      NARDUK_PLATFORM_GH_PACKAGES_READ:
        required: false
      NARDUK_PLATFORM_GH_PACKAGES_RW:
        required: false

env:
  NUXT_TELEMETRY_DISABLED: 1

jobs:
  typecheck:
    name: Typecheck
    if: inputs.run-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Configure package registry auth
        env:
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || secrets.NARDUK_PLATFORM_GH_PACKAGES_RW }}
        run: |
          # Skip cleanly when the caller declined to pass a package-registry
          # token so public forks and template consumers can still run.
          if [ -z "$NARDUK_PLATFORM_GH_PACKAGES_READ" ]; then
            echo "skipping package-registry auth: no NARDUK_PLATFORM_GH_PACKAGES_READ/RW token passed"
            exit 0
          fi
          if [ -f ./scripts/package-registry-auth.mjs ]; then
            node ./scripts/package-registry-auth.mjs
          elif [ -f ./tools/configure-package-registry-auth.mjs ]; then
            node ./tools/configure-package-registry-auth.mjs
          else
            echo "skipping package-registry auth: no auth bootstrap script present"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

  test:
    name: Unit Tests
    if: inputs.run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Configure package registry auth
        env:
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || secrets.NARDUK_PLATFORM_GH_PACKAGES_RW }}
        run: |
          if [ -z "$NARDUK_PLATFORM_GH_PACKAGES_READ" ]; then
            echo "skipping package-registry auth: no NARDUK_PLATFORM_GH_PACKAGES_READ/RW token passed"
            exit 0
          fi
          if [ -f ./scripts/package-registry-auth.mjs ]; then
            node ./scripts/package-registry-auth.mjs
          elif [ -f ./tools/configure-package-registry-auth.mjs ]; then
            node ./tools/configure-package-registry-auth.mjs
          else
            echo "skipping package-registry auth: no auth bootstrap script present"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Unit Tests
        run: pnpm -r --if-present run test:unit

  drift-check:
    name: Template Drift Check
    if: inputs.run-drift-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Configure package registry auth
        env:
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || secrets.NARDUK_PLATFORM_GH_PACKAGES_RW }}
        run: |
          if [ -z "$NARDUK_PLATFORM_GH_PACKAGES_READ" ]; then
            echo "skipping package-registry auth: no NARDUK_PLATFORM_GH_PACKAGES_READ/RW token passed"
            exit 0
          fi
          if [ -f ./scripts/package-registry-auth.mjs ]; then
            node ./scripts/package-registry-auth.mjs
          elif [ -f ./tools/configure-package-registry-auth.mjs ]; then
            node ./tools/configure-package-registry-auth.mjs
          else
            echo "skipping package-registry auth: no auth bootstrap script present"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Check for template drift
        continue-on-error: ${{ inputs.drift-soft-fail }}
        run: pnpm exec narduk-fleet check-drift
