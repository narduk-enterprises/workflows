# Pull-request reviewer (agent-infrastructure#1564). One Cursor Cloud agent
# (grok-4.6, effort xhigh, `fast: false`) reviews every same-repo, non-draft PR head
# with this repo plus agent-infrastructure and company-hq attached, and the
# callable posts a real GitHub review from this run. Any blocking finding is
# REQUEST_CHANGES, which the branch rules honour. Never part of the required
# check; skips exit green, a reviewer error shows red on this job only. The
# only secret is CURSOR_CLOUD_AGENTS_API_KEY (company-hq D-CLOUD-SECRETS-1).
# Public repository: the job stays on GitHub-hosted ubuntu-latest.
name: Cursor review

# No `synchronize`: a push does not re-review. A lane that wants the new head
# reviewed adds the `review-now` label, which the callable clears again so the
# next add is a fresh event. Every other label addition skips.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

# This group MIRRORS the callable's job `if:`. A run-level cancel happens
# before any job condition is evaluated, so an event the callable would skip --
# a stray `labeled`, a draft, a `no-ai-review` pull request -- must not share a
# bucket with a live review, or it cancels the waiter and is then skipped
# without cancelling the Cursor agent behind it.
concurrency:
  group: cursor-review-caller-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'no-ai-review') && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && contains(fromJSON('["review-now","review-p0","review-p1","review-deep"]'), github.event.label.name)))) && 'review' || 'other' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cursor-review:
    uses: narduk-enterprises/workflows/.github/workflows/cursor-review.yml@246013d4284ba0c15040c333e169b90a66334d1f # workflows#125; the moving v2 tag predates this callable, keep the SHA
    permissions:
      contents: read
      pull-requests: write
    with:
      enabled: true
      runner: '"ubuntu-latest"'
    secrets:
      CURSOR_CLOUD_AGENTS_API_KEY: ${{ secrets.CURSOR_CLOUD_AGENTS_API_KEY }}
