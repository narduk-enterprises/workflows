              packageManager: pkg.packageManager || null,
              engines: pkg.engines || null,
              lockfile: lock ? `${lock.path}:${lock.sha}` : null,
              node: nodeVersionText == null ? null : nodeVersionText.trim(),
              globalDependencies: fingerprint(entries, turbo.globalDependencies || []).digest,
