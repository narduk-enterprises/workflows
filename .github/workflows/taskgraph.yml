name: taskgraph

# TASKGRAPH: Vercel CI's model on GitHub Actions (README "taskgraph.yml").
#
# Vercel CI (beta, 2026-10-28, vercel.com/docs/ci) is fast for three reasons,
# and this callable takes all three:
#
#   1. NEVER RUN THE SAME WORK TWICE. Each task gets a content key; a task
#      whose key already passed is not run again. Here the key is computed
#      from Git's own blob hashes (no file is read) and a pass is a pointer in
#      the estate's CI artifact store that GitHub's API must confirm. 85% of
#      estate merges land a tree identical to the PR head that just passed
#      (measured 2026-10-28, 169 merges), so main's run is mostly lookups.
#   2. CONFIG IS THE TASK GRAPH. The caller's turbo.json tags what CI runs
#      ("tags": ["ci"]), the same file Vercel CI reads; this callable has
#      nine inputs, not a flag per gate.
#   3. INSTALL ONCE PER MACHINE, THEN RUN SIDE BY SIDE. Every task that must
#      run starts as soon as its dependencies pass, each in its own worktree
#      (Vercel gives each task its own machine started from the post-install
#      copy; a worktree is that copy on one machine). A task tagged
#      `ci:machine` gets a machine of its own, as on Vercel.
#
# THREE JOBS. `Plan` (light) keys every task from the GitHub API, no
# checkout. `Tasks (<leg>)` runs the misses, one leg per machine. `Required`
# (light) is the verdict and Caller lint. A run whose tasks all passed before
# has no legs: Plan, then Required.
#
# What it does not do (yet): browser E2E on the isolated pool, preview checks,
# deploy dry runs. Callers keep those where they are today (an `e2e.yml`, the
# Workers Builds preview). See README "taskgraph.yml" for the adoption steps.

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          JSON runner string, labels array, or group/labels object.
          Only public callers may use GitHub-hosted runners. Private or
          unknown visibility is blocked; private hosted overrides fall back
          to linux-ci.
          Explicit routes must contain the self-hosted label or be a
          Blacksmith label. See README "Runner routing".
        type: string
        required: false
        default: ""
      lightweight-runner:
        description: >-
          JSON runs-on value for the Plan and Required jobs (API reads and
          Caller lint). Empty: org CI_LIGHTWEIGHT_RUNNER, then the runner
          route, as nuxt-cloudflare.yml's planners.
        type: string
        required: false
        default: ""
      node-version:
        description: Node.js version for actions/setup-node. Ignored when node-version-file is set.
        type: string
        required: false
        default: "24"
      node-version-file:
        description: Path to a Node version file (.node-version, .nvmrc); wins over node-version.
        type: string
        required: false
        default: ""
      package-manager:
        description: pnpm or npm. Tasks run as `<package-manager> run <task>`.
        type: string
        required: false
        default: pnpm
      install-script:
        description: >-
          Optional package.json script that performs the whole install (an
          nVault-backed wrapper), as in nuxt-cloudflare.yml. Empty: the
          callable installs with the lockfile.
        type: string
        required: false
        default: ""
      working-directory:
        description: Directory holding turbo.json and package.json, relative to the repository root.
        type: string
        required: false
        default: "."
      concurrency:
        description: >-
          CPU slots for side-by-side tasks. 0 (default): the runner's CPUs,
          capped by its cgroup and by 2 GiB of memory per slot. A task's
          `ci:cpus:N` tag is its weight.
        type: number
        required: false
        default: 0
      reuse:
        description: >-
          Honour passes from earlier runs. false runs every task (a scheduled
          full check); passes are still recorded.
        type: boolean
        required: false
        default: true
    secrets:
      NARDUK_PLATFORM_GH_PACKAGES_READ:
        required: false
      NVAULT_TOKEN:
        required: false
      CI_ARTIFACTS_R2_ACCOUNT_ID:
        required: false
      CI_ARTIFACTS_R2_ACCESS_KEY_ID:
        required: false
      CI_ARTIFACTS_R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    # A few API reads: the lightweight route, as nuxt-cloudflare.yml's planners.
    runs-on: ${{ fromJSON(toJSON(github.event.repository.private) != 'true' && toJSON(github.event.repository.private) != 'false' && '"missing-repository-visibility-do-not-run"' || (toJSON(github.event.repository.private) == 'false' && '"ubuntu-latest"' || ((toJSON(github.event.repository.private) == 'false' || inputs.lightweight-runner == '"self-hosted"' || startsWith(inputs.lightweight-runner, '[') && contains(fromJSON(inputs.lightweight-runner || '[]'), 'self-hosted') || startsWith(inputs.lightweight-runner, '{') && (fromJSON(inputs.lightweight-runner || '[]').labels == 'self-hosted' || startsWith(toJSON(fromJSON(inputs.lightweight-runner || '[]').labels), '[') && contains(fromJSON(inputs.lightweight-runner || '[]').labels, 'self-hosted')) || startsWith(inputs.lightweight-runner, '"blacksmith-')) && inputs.lightweight-runner) || ((toJSON(github.event.repository.private) == 'false' || vars.CI_LIGHTWEIGHT_RUNNER == '"self-hosted"' || startsWith(vars.CI_LIGHTWEIGHT_RUNNER, '[') && contains(fromJSON(vars.CI_LIGHTWEIGHT_RUNNER || '[]'), 'self-hosted') || startsWith(vars.CI_LIGHTWEIGHT_RUNNER, '{') && (fromJSON(vars.CI_LIGHTWEIGHT_RUNNER || '[]').labels == 'self-hosted' || startsWith(toJSON(fromJSON(vars.CI_LIGHTWEIGHT_RUNNER || '[]').labels), '[') && contains(fromJSON(vars.CI_LIGHTWEIGHT_RUNNER || '[]').labels, 'self-hosted')) || startsWith(vars.CI_LIGHTWEIGHT_RUNNER, '"blacksmith-')) && vars.CI_LIGHTWEIGHT_RUNNER) || (github.event.repository.private == true && vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && (((toJSON(github.event.repository.private) == 'false' || inputs.runner == '"self-hosted"' || startsWith(inputs.runner, '[') && contains(fromJSON(inputs.runner || '[]'), 'self-hosted') || startsWith(inputs.runner, '{') && (fromJSON(inputs.runner || '[]').labels == 'self-hosted' || startsWith(toJSON(fromJSON(inputs.runner || '[]').labels), '[') && contains(fromJSON(inputs.runner || '[]').labels, 'self-hosted')) || startsWith(inputs.runner, '"blacksmith-')) && inputs.runner) || toJSON(github.event.repository.private) != 'false' && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"') != '"ubuntu-latest"' && format('"{0}"', startsWith(vars.BLACKSMITH_LINUX_LABEL, 'blacksmith-') && vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || (((toJSON(github.event.repository.private) == 'false' || inputs.runner == '"self-hosted"' || startsWith(inputs.runner, '[') && contains(fromJSON(inputs.runner || '[]'), 'self-hosted') || startsWith(inputs.runner, '{') && (fromJSON(inputs.runner || '[]').labels == 'self-hosted' || startsWith(toJSON(fromJSON(inputs.runner || '[]').labels), '[') && contains(fromJSON(inputs.runner || '[]').labels, 'self-hosted')) || startsWith(inputs.runner, '"blacksmith-')) && inputs.runner) || toJSON(github.event.repository.private) != 'false' && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"')))) }}
    # Headroom for the linux-ci capacity-hook slot wait (up to 900s) -- fleet#276.
    timeout-minutes: 20
    permissions:
      # the trees and contents API the plan reads
      contents: read
      # confirm the run a task proof names (getWorkflowRunAttempt, its jobs)
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      run: ${{ steps.plan.outputs.run }}
      legs: ${{ steps.plan.outputs.legs }}
      restores: ${{ steps.plan.outputs.restores }}
    steps:
      - name: Install CI artifact store client
        working-directory: ${{ github.workspace }}
        run: &install_ci_artifact_store |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ci-artifact-store.cjs" <<'CI_ARTIFACT_STORE'
          'use strict';
          // CI ARTIFACT STORE CLIENT. GitHub's org artifact storage quota turned estate
          // CI red on 2026-09-26, and the owner chose to move CI handoffs to an R2
          // bucket the estate owns. This file is the whole client: AWS Signature V4
          // over Node's fetch, no dependencies, loaded by github-script steps with
          // require(). The `Install CI artifact store client` step writes it from the
          // workflow's own text, so a caller cannot substitute it.
          //
          // One bucket, lifecycle rules by prefix, every key scoped by the calling
          // repository:
          //   prebuilt/<owner>/<repo>/<run>-<attempt>-<scope>.tar.gz   E2E handoff, 7 days
          //   proof/<owner>/<repo>/<proof key>.json                    reuse pointers, 30 days
          //   probe/<owner>/<repo>/<name>                              credential probes, 1 day
          //
          // TRUST. The bucket credential is one token for the whole estate, so an
          // object proves nothing about who wrote it. Each reader checks what it reads
          // against something GitHub vouches for instead:
          //   - a prebuilt application must match the SHA-256 and size that its own
          //     run's Build job reported through job outputs, or the E2E job fails;
          //   - a proof object is only a POINTER to a run. It is honoured only when
          //     GitHub reports that run as this repository's successful pull-request
          //     run of the same caller workflow, whose Required job ran the publish
          //     step carrying this exact key in its name.
          // A missing, unreadable or unconfirmed object means "run it": the gate runs
          // in full and E2E builds its own application. Nothing here can turn a check
          // green on its own.
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const BUCKET = 'narduk-ci-artifacts';
          const REGION = 'auto';
          const SERVICE = 's3';
          // Long enough to outlast queueing on the browser pool and a same-day rerun of
          // failed E2E jobs. Past it, E2E builds its own application.
          const PRESIGN_SECONDS = 24 * 60 * 60;
          // A stalled tarball transfer must give up well inside the 30-minute job
          // limit, so Build still finishes and each E2E job still has time to build
          // its own application: 3 attempts of 120 s plus backoff is about 6 minutes.
          const TRANSFER_TIMEOUT_MS = 120 * 1000;
          const TRANSFER_ATTEMPTS = 3;
          const POINTER_SCHEMA = 'narduk-ci-proof-pointer-v1';
          const PROOF_STEP = { required: 'Publish Required proof', e2e: 'Publish full E2E proof' };
          const PROOF_KEY = { required: /^required-proof-v1-[0-9a-f]{64}$/, e2e: /^e2e-proof-v1-[0-9a-f]{64}$/ };
          const SEGMENT = /^[A-Za-z0-9._-]+$/;
          const HEX32 = /^[0-9a-f]{32}$/;
          const HEX64 = /^[0-9a-f]{64}$/;

          class IntegrityError extends Error {}

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const sha256Hex = data => crypto.createHash('sha256').update(data).digest('hex');
          const hmac = (key, data) => crypto.createHmac('sha256', key).update(data).digest();

          // RFC 3986 encoding, as SigV4 requires: encodeURIComponent leaves !'()* alone.
          function encode(value) {
            return encodeURIComponent(value).replace(/[!'()*]/g, c => `%${c.charCodeAt(0).toString(16).toUpperCase()}`);
          }

          function canonicalUri(bucket, key) {
            return `/${bucket}/${key.split('/').map(encode).join('/')}`;
          }

          function amzDate(date) {
            return date.toISOString().replace(/\.\d{3}Z$/, 'Z').replace(/[-:]/g, '');
          }

          function canonicalQuery(query) {
            return Object.entries(query)
              .map(([name, value]) => [encode(name), encode(String(value))])
              .sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0))
              .map(([name, value]) => `${name}=${value}`)
              .join('&');
          }

          function scopeOf(stamp, region = REGION, service = SERVICE) {
            return `${stamp.slice(0, 8)}/${region}/${service}/aws4_request`;
          }

          // `uri` is the canonical (already encoded) path; the request uses the same text.
          function sign({ method, uri, query = {}, headers, payloadHash, secretAccessKey, stamp, region = REGION, service = SERVICE }) {
            const normalized = Object.fromEntries(Object.entries(headers)
              .map(([name, value]) => [name.toLowerCase(), String(value).trim().replace(/ +/g, ' ')]));
            const names = Object.keys(normalized).sort();
            const canonicalRequest = [
              method, uri, canonicalQuery(query),
              names.map(name => `${name}:${normalized[name]}\n`).join(''),
              names.join(';'), payloadHash,
            ].join('\n');
            const scope = scopeOf(stamp, region, service);
            const stringToSign = ['AWS4-HMAC-SHA256', stamp, scope, sha256Hex(canonicalRequest)].join('\n');
            let key = hmac(`AWS4${secretAccessKey}`, stamp.slice(0, 8));
            for (const part of [region, service, 'aws4_request']) key = hmac(key, part);
            const signature = crypto.createHmac('sha256', key).update(stringToSign).digest('hex');
            return { signature, scope, signedHeaders: names.join(';') };
          }

          function presignQuery({ accessKeyId, stamp, expires, region = REGION, service = SERVICE }) {
            return {
              'X-Amz-Algorithm': 'AWS4-HMAC-SHA256',
              'X-Amz-Credential': `${accessKeyId}/${scopeOf(stamp, region, service)}`,
              'X-Amz-Date': stamp,
              'X-Amz-Expires': String(expires),
              'X-Amz-SignedHeaders': 'host',
            };
          }

          function presign({ host, uri, accessKeyId, secretAccessKey, stamp, expires = PRESIGN_SECONDS, region = REGION, service = SERVICE }) {
            const query = presignQuery({ accessKeyId, stamp, expires, region, service });
            return sign({ method: 'GET', uri, query, headers: { host }, payloadHash: 'UNSIGNED-PAYLOAD', secretAccessKey, stamp, region, service }).signature;
          }

          // Rebuilds a presigned URL from its parts. The Build job hands E2E only the
          // parts that are not secrets (GitHub drops a job output that contains a
          // secret's value, and the URL carries the account and access key IDs).
          function presignedUrl({ origin, uri, accessKeyId, stamp, expires, signature, region = REGION, service = SERVICE }) {
            const query = presignQuery({ accessKeyId, stamp, expires, region, service });
            return `${origin}${uri}?${canonicalQuery(query)}&X-Amz-Signature=${signature}`;
          }

          function endpoint(accountId) {
            if (!HEX32.test(accountId)) throw new Error('CI artifact store account ID is malformed (expected 32 hex characters)');
            const host = `${accountId}.r2.cloudflarestorage.com`;
            return { origin: `https://${host}`, host };
          }

          // null when the run has no credentials (fork, Dependabot, public repository,
          // or a caller that does not pass them). Never echoes a value.
          function storeConfig(env = process.env) {
            const accountId = (env.CI_ARTIFACTS_R2_ACCOUNT_ID || '').trim();
            const accessKeyId = (env.CI_ARTIFACTS_R2_ACCESS_KEY_ID || '').trim();
            const secretAccessKey = (env.CI_ARTIFACTS_R2_SECRET_ACCESS_KEY || '').trim();
            if (!accountId || !accessKeyId || !secretAccessKey) return null;
            if (!HEX32.test(accountId) || !HEX32.test(accessKeyId) || !HEX64.test(secretAccessKey)) {
              throw new Error('CI artifact store credentials are malformed: expected a 32-hex account ID, a 32-hex access key ID and a 64-hex secret access key');
            }
            return { ...endpoint(accountId), bucket: BUCKET, accessKeyId, secretAccessKey };
          }

          function repositoryOf(value) {
            const parts = String(value || '').split('/');
            if (parts.length !== 2 || !parts.every(part => SEGMENT.test(part) && part !== '.' && part !== '..')) {
              throw new Error(`not an owner/name repository: ${JSON.stringify(value)}`);
            }
            return parts.join('/');
          }

          function assertKey(key) {
            const parts = String(key).split('/');
            if (parts.length !== 4 || !['prebuilt', 'proof', 'probe'].includes(parts[0])
                || !parts.every(part => SEGMENT.test(part) && part !== '.' && part !== '..')) {
              throw new Error(`refusing CI artifact store key ${JSON.stringify(key)}`);
            }
            return key;
          }

          function prebuiltKey(repository, runId, runAttempt, scope) {
            if (!/^\d+$/.test(String(runId)) || !/^\d+$/.test(String(runAttempt))) throw new Error('run ID and attempt must be numbers');
            return assertKey(`prebuilt/${repositoryOf(repository)}/${runId}-${runAttempt}-${scope}.tar.gz`);
          }

          function proofObjectKey(repository, kind, key) {
            if (!PROOF_KEY[kind] || !PROOF_KEY[kind].test(String(key))) throw new Error(`not a ${kind} proof key: ${JSON.stringify(key)}`);
            return assertKey(`proof/${repositoryOf(repository)}/${key}.json`);
          }

          function describe(error) {
            const cause = error && error.cause ? ` (${error.cause.code || error.cause.message})` : '';
            return `${error && error.message ? error.message : error}${cause}`;
          }

          function s3Code(body) {
            const match = /<Code>([^<]{1,64})<\/Code>/.exec(body.toString('utf8'));
            return match ? ` ${match[1]}` : '';
          }

          // Retries network errors, 5xx and 429. `retryAuthMs` also retries 401/403 for
          // that long: a freshly minted R2 token is refused for a few seconds.
          async function attempt(url, init, { timeoutMs, attempts, retryAuthMs = 0 }) {
            const started = Date.now();
            for (let n = 1; ; n += 1) {
              let failure;
              try {
                const response = await fetch(url, { ...init(), signal: AbortSignal.timeout(timeoutMs) });
                const body = Buffer.from(await response.arrayBuffer());
                const auth = (response.status === 401 || response.status === 403) && Date.now() - started < retryAuthMs;
                if (!(response.status >= 500 || response.status === 429 || auth)) return { status: response.status, body };
                failure = `HTTP ${response.status}${s3Code(body)}`;
              } catch (error) {
                failure = describe(error);
              }
              if (n >= attempts) throw new Error(`${failure} after ${n} attempt(s)`);
              await sleep(Math.min(1000 * 2 ** n, 15000));
            }
          }

          async function request(cfg, method, key, { body, contentType, timeoutMs = 30000, attempts = 4, retryAuthMs = 0 } = {}) {
            const uri = canonicalUri(cfg.bucket, assertKey(key));
            const payload = body === undefined ? Buffer.alloc(0) : body;
            const payloadHash = sha256Hex(payload);
            return attempt(`${cfg.origin}${uri}`, () => {
              const stamp = amzDate(new Date());
              const headers = { host: cfg.host, 'x-amz-content-sha256': payloadHash, 'x-amz-date': stamp };
              if (contentType) headers['content-type'] = contentType;
              const { signature, scope, signedHeaders } = sign({ method, uri, headers, payloadHash, secretAccessKey: cfg.secretAccessKey, stamp });
              const { host, ...sent } = headers;
              return {
                method,
                headers: {
                  ...sent,
                  'accept-encoding': 'identity',
                  authorization: `AWS4-HMAC-SHA256 Credential=${cfg.accessKeyId}/${scope}, SignedHeaders=${signedHeaders}, Signature=${signature}`,
                },
                body: method === 'PUT' ? payload : undefined,
              };
            }, { timeoutMs, attempts, retryAuthMs });
          }

          async function putObject(cfg, key, body, options = {}) {
            const response = await request(cfg, 'PUT', key, { ...options, body });
            if (response.status !== 200) throw new Error(`R2 put ${key}: HTTP ${response.status}${s3Code(response.body)}`);
          }

          async function getObject(cfg, key, options = {}) {
            const response = await request(cfg, 'GET', key, options);
            if (response.status === 404) return null;
            if (response.status !== 200) throw new Error(`R2 get ${key}: HTTP ${response.status}${s3Code(response.body)}`);
            return response.body;
          }

          async function deleteObject(cfg, key, options = {}) {
            const response = await request(cfg, 'DELETE', key, options);
            if (![200, 204, 404].includes(response.status)) throw new Error(`R2 delete ${key}: HTTP ${response.status}${s3Code(response.body)}`);
          }

          function tar(args) {
            execFileSync('tar', args, { stdio: ['ignore', 'ignore', 'inherit'] });
          }

          // ---- Prebuilt E2E application (Build -> E2E) -------------------------------

          async function publishPrebuilt({ cfg, sourceDir, key, tmpDir, now = new Date(), expires = PRESIGN_SECONDS, timeoutMs = TRANSFER_TIMEOUT_MS }) {
            if (!fs.statSync(sourceDir).isDirectory()) throw new Error(`${sourceDir} is not a directory`);
            const tarball = path.join(tmpDir, `ci-artifact-${crypto.randomBytes(6).toString('hex')}.tar.gz`);
            try {
              tar(['-czf', tarball, '-C', sourceDir, '.']);
              const body = fs.readFileSync(tarball);
              const sha256 = sha256Hex(body);
              await putObject(cfg, key, body, { contentType: 'application/gzip', timeoutMs, attempts: TRANSFER_ATTEMPTS });
              const date = amzDate(now);
              const signature = presign({ host: cfg.host, uri: canonicalUri(cfg.bucket, key), accessKeyId: cfg.accessKeyId, secretAccessKey: cfg.secretAccessKey, stamp: date, expires });
              return { key, sha256, bytes: body.length, date, expires, signature };
            } finally {
              fs.rmSync(tarball, { force: true });
            }
          }

          function parsePrebuilt(text) {
            let object;
            try {
              object = JSON.parse(text);
            } catch {
              throw new Error('the prebuilt application reference is not JSON');
            }
            const valid = object && typeof object === 'object'
              && typeof object.key === 'string' && object.key.startsWith('prebuilt/')
              && HEX64.test(String(object.sha256)) && Number.isSafeInteger(object.bytes) && object.bytes > 0
              && /^\d{8}T\d{6}Z$/.test(String(object.date))
              && Number.isSafeInteger(object.expires) && object.expires > 0 && object.expires <= 604800
              && HEX64.test(String(object.signature));
            if (!valid) throw new Error('the prebuilt application reference is malformed');
            assertKey(object.key);
            return object;
          }

          async function fetchPrebuilt({ object, accountId, accessKeyId, destDir, tmpDir, origin, timeoutMs = TRANSFER_TIMEOUT_MS }) {
            if (!HEX32.test(accessKeyId)) throw new Error('CI artifact store access key ID is malformed (expected 32 hex characters)');
            const base = origin || endpoint(accountId).origin;
            const url = presignedUrl({ origin: base, uri: canonicalUri(BUCKET, object.key), accessKeyId, stamp: object.date, expires: object.expires, signature: object.signature });
            const response = await attempt(url, () => ({ method: 'GET', headers: { 'accept-encoding': 'identity' } }), { timeoutMs, attempts: TRANSFER_ATTEMPTS });
            if (response.status !== 200) return { ok: false, reason: `HTTP ${response.status}${s3Code(response.body)}` };
            if (response.body.length !== object.bytes || sha256Hex(response.body) !== object.sha256) {
              throw new IntegrityError(`R2 object ${object.key} does not match the SHA-256 and size its Build job reported (${response.body.length} bytes read, ${object.bytes} expected); refusing to test it`);
            }
            const tarball = path.join(tmpDir, `ci-artifact-${crypto.randomBytes(6).toString('hex')}.tar.gz`);
            try {
              fs.writeFileSync(tarball, response.body);
              fs.rmSync(destDir, { recursive: true, force: true });
              fs.mkdirSync(destDir, { recursive: true });
              tar(['-xzf', tarball, '-C', destDir]);
            } finally {
              fs.rmSync(tarball, { force: true });
            }
            return { ok: true, bytes: response.body.length };
          }

          // github-script glue for the Build job. Never fails the job: without a
          // published object each E2E job builds its own application.
          async function publishPrebuiltStep({ core, env = process.env }) {
            core.setOutput('object', '');
            let cfg;
            try {
              cfg = storeConfig(env);
            } catch (error) {
              core.warning(`${error.message}; each E2E job builds its own application instead`);
              return;
            }
            if (!cfg) {
              // A warning, not a notice (ci-reset W10, W8 item 1): every E2E
              // shard then pays for its own build and E2E proof reuse cannot
              // engage, and a notice was read by nobody.
              core.warning('No CI artifact store credentials in this run (fork, Dependabot, public repository, or a caller that does not pass CI_ARTIFACTS_R2_ACCOUNT_ID, CI_ARTIFACTS_R2_ACCESS_KEY_ID and CI_ARTIFACTS_R2_SECRET_ACCESS_KEY in its secrets: block); each E2E job builds its own application instead.');
              return;
            }
            try {
              const key = prebuiltKey(env.GITHUB_REPOSITORY, env.GITHUB_RUN_ID, env.GITHUB_RUN_ATTEMPT, env.BUILD_SCOPE);
              const object = await publishPrebuilt({ cfg, sourceDir: env.BUILD_DIR, key, tmpDir: env.RUNNER_TEMP });
              core.info(`R2 put ${object.key}: ${object.bytes} bytes, sha256 ${object.sha256}`);
              core.setOutput('object', JSON.stringify(object));
            } catch (error) {
              core.warning(`Could not publish the prebuilt E2E application to the CI artifact store; each E2E job builds its own instead: ${describe(error)}`);
            }
          }

          function buildDir(env) {
            const relative = String(env.BUILD_PATH || '');
            const root = path.resolve(env.GITHUB_WORKSPACE || '.', env.WORKING_DIRECTORY || '.');
            const target = path.resolve(root, relative);
            if (!relative || path.isAbsolute(relative) || relative.split(/[\\/]/).includes('..') || !target.startsWith(root + path.sep)) {
              throw new Error('the prebuilt application path must be a relative directory inside working-directory');
            }
            return target;
          }

          // github-script glue for each E2E job. Output `mode`: `r2` when the verified
          // application is in place, `build` when this job must build its own. Only a
          // SHA-256 or size mismatch fails the job.
          async function fetchPrebuiltStep({ core, env = process.env }) {
            core.setOutput('mode', 'build');
            const destDir = buildDir(env);
            if (!env.PREBUILT_OBJECT) {
              core.notice('Build published no prebuilt application to the CI artifact store; this job builds its own.');
              return;
            }
