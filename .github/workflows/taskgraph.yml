            const pkg = JSON.parse(packageText);
            const scripts = pkg.scripts || {};
            const { tasks, tagged, selected } = selectTasks(turbo);
            if (tagged.length === 0) throw new Error('turbo.json tags no task with "ci"; add "tags": ["ci"] to the tasks CI should run');
            const lock = entries.find(e => LOCKFILES.includes(e.path)) || rootLockfile || null;
