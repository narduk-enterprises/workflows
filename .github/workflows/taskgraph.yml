          }

          module.exports = {
            BUCKET, PRESIGN_SECONDS, TRANSFER_TIMEOUT_MS, TRANSFER_ATTEMPTS, PROOF_STEP, IntegrityError,
            sha256Hex, amzDate, canonicalUri, canonicalQuery, sign, presign, presignedUrl,
            storeConfig, endpoint, repositoryOf, assertKey, prebuiltKey, proofObjectKey,
            putObject, getObject, deleteObject,
            publishPrebuilt, parsePrebuilt, fetchPrebuilt, publishPrebuiltStep, fetchPrebuiltStep, buildDir,
            publishProof, publishProofStep, findProof,
