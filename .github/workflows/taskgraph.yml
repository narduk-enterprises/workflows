          // The restorable producers that `names` read: walk each one's dependencies,
          // looking through the passed ones that do not run, and stop at a producer.
          function restoresFor(planTasks, names, restorable) {
            const byName = new Map(planTasks.map(t => [t.task, t]));
            const running = new Set(names);
            const need = new Set();
            const walk = (name, seen) => {
              for (const dep of byName.get(name).dependsOn) {
                if (seen.has(dep) || running.has(dep)) continue;
                seen.add(dep);
                if (restorable.has(dep)) need.add(dep);
                else walk(dep, seen);
              }
            };
            for (const name of names) walk(name, new Set());
            return planTasks.map(t => t.task).filter(n => need.has(n));
          }

          // The legs, one machine each: every task tagged `ci:machine` that must run,
          // with the tasks behind it in the run (a dependent reads its outputs or
          // waits for it) and whatever those need from the shared run set; and one
          // shared leg for the rest. A task behind two machine tasks is refused: it
          // could run on only one of them.
          function legsOf(planTasks, executes) {
            const byName = new Map(planTasks.map(t => [t.task, t]));
            const running = new Set(executes);
            const memo = new Map();
            const behind = name => {
              if (!memo.has(name)) {
                const all = new Set();
                for (const d of byName.get(name).dependsOn) { all.add(d); for (const x of behind(d)) all.add(x); }
                memo.set(name, all);
              }
              return memo.get(name);
            };
            const machines = executes.filter(n => byName.get(n).machine);
            const owner = new Map();
            for (const n of executes) {
              if (byName.get(n).machine) { owner.set(n, n); continue; }
              const on = machines.filter(m => behind(n).has(m));
              if (on.length > 1) throw new Error(`task ${n} needs ci:machine tasks ${on.join(' and ')}; it can run on only one machine`);
              if (on.length === 1) owner.set(n, on[0]);
            }
            const legs = [];
            const onMachines = new Set();
            const leg = (id, members) => {
              // A member's running dependencies run on its machine too (a shared
              // `nuxt:prepare` runs once per machine that needs it).
              const set = new Set(members);
              for (const n of members) for (const d of behind(n)) if (running.has(d) && (owner.get(d) ?? null) === null) set.add(d);
              legs.push({ id, names: executes.filter(n => set.has(n)).join(',') });
              return set;
            };
            for (const m of machines) for (const n of leg(m, executes.filter(n => owner.get(n) === m))) onMachines.add(n);
            // The shared leg: the rest, less what only machine legs needed.
            const unowned = executes.filter(n => !owner.has(n));
            const wanted = unowned.filter(n => !onMachines.has(n) || unowned.some(u => !onMachines.has(u) && behind(u).has(n)));
            if (wanted.length) leg(machines.length ? 'shared' : 'all', wanted);
            return legs;
          }

          // The publish step's name carries this digest, so GitHub's record of that
          // step attests every key and the SHA-256 of every output tarball with it.
          function manifestDigest(keys, outputs = {}) {
            return sha256([...keys].sort().map(k => (outputs[k] ? `${k} ${outputs[k]}` : k)).join('\n'));
          }

          // Output tarballs live under the store's 7-day `prebuilt/` prefix, scoped by
          // the run that wrote them. Past that the proof still holds, the tarball is
          // gone, and the producer runs again.
          function outputObjectKey(store, repository, runId, runAttempt, key) {
            if (!KEY.test(String(key))) throw new Error(`not a task key: ${JSON.stringify(key)}`);
            return store.prebuiltKey(repository, runId, runAttempt, `taskout-${key}`);
          }

          // ---- Proofs -----------------------------------------------------------------

          function proofKey(store, repository, key) {
            if (!KEY.test(String(key))) throw new Error(`not a task key: ${JSON.stringify(key)}`);
            return store.assertKey(`proof/${store.repositoryOf(repository)}/task-proof-v1-${key}.json`);
          }

          // Honour a proof only when GitHub confirms the attempt it names (see the
          // header). `attempts` caches one confirmation per run attempt.
          async function findTaskProof({ github, context, store, cfg, key, workflowPath, callerBlob = null, attempts }) {
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const repositoryId = context.payload.repository.id;
            const objectKey = proofKey(store, repository, key);
            const raw = await store.getObject(cfg, objectKey, { timeoutMs: LOOKUP_TIMEOUT_MS, attempts: 2 });
            if (!raw) return { found: false, reason: 'no proof' };
            let pointer;
            try {
              pointer = JSON.parse(raw.toString('utf8'));
            } catch {
              return { found: false, reason: 'proof is not JSON' };
            }
            if (!pointer || pointer.schema !== POINTER_SCHEMA || pointer.key !== key || pointer.repository_id !== repositoryId
                || !Number.isSafeInteger(pointer.run_id) || pointer.run_id <= 0
                || !Number.isSafeInteger(pointer.run_attempt) || pointer.run_attempt <= 0
                || !Array.isArray(pointer.manifest) || !pointer.manifest.includes(key) || !pointer.manifest.every(k => KEY.test(String(k)))
                || (pointer.outputs !== undefined && (!pointer.outputs || typeof pointer.outputs !== 'object' || Array.isArray(pointer.outputs)
                  || !Object.entries(pointer.outputs).every(([k, h]) => pointer.manifest.includes(k) && SHA256.test(String(h)))))) {
              return { found: false, reason: 'proof does not describe this key and repository' };
            }
            const digest = manifestDigest(pointer.manifest, pointer.outputs || {});
            const id = `${pointer.run_id}:${pointer.run_attempt}:${digest}`;
            if (!attempts.has(id)) {
              attempts.set(id, (async () => {
                const { data: run } = await github.rest.actions.getWorkflowRunAttempt({
                  ...context.repo, run_id: pointer.run_id, attempt_number: pointer.run_attempt, request: { signal: AbortSignal.timeout(LOOKUP_TIMEOUT_MS) },
                });
                if (run.id !== pointer.run_id || run.run_attempt !== pointer.run_attempt || run.path !== workflowPath
                    || run.repository?.id !== repositoryId || run.head_repository?.id !== repositoryId) {
                  return { ok: false, reason: `run ${pointer.run_id} is not this repository's own run of ${workflowPath}` };
                }
                // The same caller workflow text, not just its path: a branch that edits
                // the workflow to fake a publish step cannot vouch for this one's keys.
                if (callerBlob) {
                  const { data: file } = await github.rest.repos.getContent({ ...context.repo, path: workflowPath, ref: run.head_sha, request: { signal: AbortSignal.timeout(LOOKUP_TIMEOUT_MS) } });
                  if (!file || file.sha !== callerBlob) return { ok: false, reason: `run ${pointer.run_id} ran another version of ${workflowPath}` };
                }
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                  ...context.repo, run_id: run.id, attempt_number: pointer.run_attempt, per_page: 100, request: { signal: AbortSignal.timeout(LOOKUP_TIMEOUT_MS) },
                });
                const stepName = `${PUBLISH_STEP} ${digest}`;
                const attested = jobs.some(job => /(^| \/ )Tasks \([A-Za-z0-9:_.\/@-]+\)$/.test(String(job.name))
                  && (job.steps || []).some(step => step.name === stepName && step.conclusion === 'success'));
                return attested ? { ok: true, run } : { ok: false, reason: `${run.html_url} shows no successful "${stepName}" step in a Tasks leg` };
              })());
            }
            const verdict = await attempts.get(id);
            if (!verdict.ok) return { found: false, reason: verdict.reason };
            const output = pointer.outputs?.[key] ? { sha256: pointer.outputs[key], run_id: pointer.run_id, run_attempt: pointer.run_attempt } : null;
            return { found: true, run: verdict.run, output };
          }

          async function publishTaskProofs({ store, cfg, context, planTasks, results, outputs = {}, outputDir = '', env = process.env, warn = () => {} }) {
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const passed = planTasks.filter(t => t.cache && results[t.task]?.status === 'passed').map(t => t.key);
            if (passed.length === 0) return [];
            const manifest = [...new Set(passed)].sort();
            const recorded = Object.fromEntries(Object.entries(outputs).filter(([k, h]) => manifest.includes(k) && SHA256.test(String(h))));
            const pointer = {
              schema: POINTER_SCHEMA,
              repository,
              repository_id: context.payload.repository.id,
              run_id: Number(env.GITHUB_RUN_ID),
              run_attempt: Number(env.GITHUB_RUN_ATTEMPT),
              sha: context.sha,
              manifest,
              ...(Object.keys(recorded).length ? { outputs: recorded } : {}),
              written_at: new Date().toISOString(),
            };
            if (!Number.isSafeInteger(pointer.run_id) || !Number.isSafeInteger(pointer.run_attempt)) throw new Error('GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT must be numbers');
            const written = [];
            // The tarballs first. One that fails to upload stays in the pointer (the
            // step name already attests it): a later run finds no tarball and runs
            // the producer, as it would without this cache.
            for (const [key, hash] of Object.entries(recorded)) {
              try {
                const body = fs.readFileSync(path.join(outputDir, `${key}.tar.gz`));
                if (sha256(body) !== hash) throw new Error('tarball changed after it was hashed');
                const objectKey = outputObjectKey(store, repository, pointer.run_id, pointer.run_attempt, key);
                await store.putObject(cfg, objectKey, body, { contentType: 'application/gzip', timeoutMs: OUTPUT_TIMEOUT_MS, attempts: 3 });
                written.push(objectKey);
              } catch (error) {
                warn(`output of ${key.slice(0, 12)} not stored, so its dependents rebuild it: ${error.message}`);
              }
            }
            for (const key of manifest) {
              const objectKey = proofKey(store, repository, key);
              await store.putObject(cfg, objectKey, Buffer.from(JSON.stringify({ ...pointer, key })), { contentType: 'application/json', timeoutMs: LOOKUP_TIMEOUT_MS, attempts: 2 });
              written.push(objectKey);
            }
            return written;
          }

          // ---- The workflow's github-script steps ------------------------------------------

          function normalizeDir(dir) {
            const parts = String(dir || '.').replace(/\\/g, '/').split('/').filter(part => part !== '' && part !== '.');
            if (parts.includes('..') || String(dir || '').startsWith('/')) throw new Error(`working-directory ${JSON.stringify(dir)} leaves the repository`);
            return parts.join('/');
          }

          // `Plan tasks`: key every task from the GitHub API (no checkout), look each
          // key's proof up, and hand the misses to `Run tasks`. Any lookup problem is a
          // miss with a warning; only a broken turbo.json or package.json fails here.
          async function planStep({ github, context, core, store, env = process.env }) {
            // The fetch-based Octokit honours an AbortSignal, not a `timeout` option;
            // one fresh signal per call.
            const request = () => ({ signal: AbortSignal.timeout(LOOKUP_TIMEOUT_MS) });
            if (!['pnpm', 'npm'].includes(env.PACKAGE_MANAGER || 'pnpm')) throw new Error(`package-manager ${JSON.stringify(env.PACKAGE_MANAGER)}: taskgraph runs tasks with pnpm or npm`);
            const repo = context.repo;
            const repository = `${repo.owner}/${repo.repo}`;
            const wd = normalizeDir(env.WORKING_DIRECTORY);
            const workflowPath = String(env.CALLER_WORKFLOW_REF || '').split('@')[0].slice(`${repository}/`.length);
            const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: context.sha, request: request() });
            const treeSha = commit.commit.tree.sha;
            const { data: tree } = await github.rest.git.getTree({ ...repo, tree_sha: treeSha, recursive: 'true', request: request() });
            if (tree.truncated) throw new Error(`the trees API truncated tree ${treeSha} (over 100,000 entries or 7 MB); taskgraph cannot key this repository`);
            const read = async file => {
              try {
                const { data } = await github.rest.repos.getContent({ ...repo, path: file, ref: context.sha, mediaType: { format: 'raw' }, request: request() });
                return typeof data === 'string' ? data : Buffer.from(data).toString('utf8');
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            };
            const inDir = file => (wd ? `${wd}/${file}` : file);
            const nodeFile = String(env.NODE_VERSION_FILE || '').replace(/^\.\//, '');
            const [turboText, packageText, nodeText] = await Promise.all([
              read(inDir('turbo.json')), read(inDir('package.json')), nodeFile ? read(nodeFile) : Promise.resolve(null),
            ]);
            if (nodeFile && nodeText == null) throw new Error(`node-version-file ${nodeFile} does not exist at ${context.sha}`);
            const caller = tree.tree.find(e => e.path === workflowPath);
            const result = plan({
              entries: entriesFromApi(tree.tree, wd),
              turboText,
              packageText,
              nodeVersionText: nodeFile ? `${nodeFile}:${nodeText}` : `node-version:${env.NODE_VERSION || ''}`,
              rootLockfile: tree.tree.find(e => e.type === 'blob' && LOCKFILES.includes(e.path)),
              context: {
                // The caller workflow pins this callable's SHA, so its blob carries the
                // callable's identity into every key, even with narrowed `inputs`.
                callerWorkflow: caller ? `${caller.path}:${caller.sha}` : workflowPath,
                packageManager: env.PACKAGE_MANAGER || 'pnpm',
                installScript: env.INSTALL_SCRIPT || '',
                workingDirectory: wd,
              },
            });

            let cfg = null;
            try {
              cfg = store.storeConfig(env);
            } catch (error) {
              core.warning(`${error.message}; every task runs and no pass is reused`);
            }
            const reuse = env.REUSE !== 'false';
            if (!cfg) core.notice('No CI artifact store credentials in this run (fork, Dependabot, or a caller missing from the CI_ARTIFACTS_R2_* secrets\' repository lists): every task runs and no pass is recorded.');
            const attempts = new Map();
            const verdicts = await Promise.all(result.tasks.map(async t => {
              if (!t.cache) return { hit: false, reason: 'cache: false' };
              if (!reuse) return { hit: false, reason: 'reuse: false' };
              if (!cfg) return { hit: false, reason: 'no store credentials' };
              try {
                const proof = await findTaskProof({ github, context, store, cfg, key: t.key, workflowPath, callerBlob: caller?.sha || null, attempts });
                return proof.found ? { hit: true, run: proof.run, output: proof.output } : { hit: false, reason: proof.reason };
              } catch (error) {
                core.warning(`${t.task}: proof lookup failed, so it runs: ${error.message}`);
                return { hit: false, reason: 'lookup failed' };
              }
            }));
            const misses = result.tasks.filter((t, i) => !verdicts[i].hit).map(t => t.task);
            // A passed producer whose proof carries its output tarball is restored
            // into its dependents' worktrees instead of run again.
            const stored = new Map(result.tasks.flatMap((t, i) => (verdicts[i].hit && verdicts[i].output && t.outputs.length ? [[t.task, { key: t.key, ...verdicts[i].output }]] : [])));
            const executes = misses.length ? executionSet(result.tasks, new Set(misses), new Set(stored.keys())) : [];
            const restores = Object.fromEntries(restoresFor(result.tasks, executes, new Set(stored.keys())).map(n => [n, stored.get(n)]));
            core.setOutput('plan', JSON.stringify(result));
            core.setOutput('restores', JSON.stringify(restores));
            core.setOutput('misses', misses.join(','));
            core.setOutput('run', executes.length ? 'true' : 'false');
            const legs = executes.length ? legsOf(result.tasks, executes) : [];
            core.setOutput('legs', JSON.stringify(legs));
            if (legs.length) core.info(`legs: ${legs.map(l => `${l.id} (${l.names.split(',').length})`).join(', ')}`);
            const rows = result.tasks.map((t, i) => {
              const v = verdicts[i];
              const state = v.hit ? `passed before ([run ${v.run.id}](${v.run.html_url}))${restores[t.task] ? '; outputs restored' : ''}` : executes.includes(t.task) ? `runs (${misses.includes(t.task) ? v.reason : 'its outputs are needed'})` : 'runs';
              core.info(`${t.task.padEnd(28)} ${t.key.slice(0, 12)}  ${v.hit ? `reused from run ${v.run.id}` : `runs: ${v.reason}`}`);
              return `| \`${t.task}\` | \`${t.key.slice(0, 12)}\` | ${t.inputFiles} | ${state} |`;
            });
            const reused = result.tasks.length - misses.length;
            await core.summary.addRaw(`### taskgraph plan: ${reused} of ${result.tasks.length} task(s) already passed on this content\n\n| Task | Key | Input files | |\n|---|---|---:|---|\n${rows.join('\n')}\n`).write();
            return { result, misses, executes, restores };
          }

          // `Publish task proofs <digest>`: one pointer per passed cacheable task.
          // Never fails the job: an unrecorded pass costs the next run time, never
          // coverage.
          async function publishStep({ context, core, store, env = process.env }) {
            let cfg;
            try {
              cfg = store.storeConfig(env);
            } catch (error) {
              core.warning(`${error.message}; no task pass recorded`);
              return [];
            }
            if (!cfg) {
              core.notice('No CI artifact store credentials in this run; no task pass recorded, so the next run of this content runs it again.');
              return [];
            }
            try {
              const written = await publishTaskProofs({
                store, cfg, context, env,
                planTasks: JSON.parse(env.TASKGRAPH_PLAN).tasks,
                results: JSON.parse(env.TASKGRAPH_RESULTS || '{}'),
                outputs: JSON.parse(env.TASKGRAPH_OUTPUTS || '{}'),
                outputDir: outputTarballDir(env),
                warn: message => core.warning(message),
              });
              core.info(`Recorded ${written.length} task pass(es): ${written.join(', ')}`);
              return written;
            } catch (error) {
              core.warning(`Could not record task passes in the CI artifact store; the next run of this content runs them again: ${error.message}`);
              return [];
            }
          }

          function outputTarballDir(env) {
            return path.join(env.RUNNER_TEMP || os.tmpdir(), 'taskgraph-outputs');
          }

          function restoreTarballDir(env) {
            return path.join(env.RUNNER_TEMP || os.tmpdir(), 'taskgraph-restore');
          }

          // The restores this leg needs, from the plan's map: the stored producers its
          // tasks read.
          function legRestores(planTasks, names, restores) {
            return restoresFor(planTasks, names, new Set(Object.keys(restores))).map(task => ({ task, ...restores[task] }));
          }

          // `Restore task outputs`: download this leg's tarballs and check each against
          // the hash its attested proof names. Never fails the job: a tarball that is
          // missing or wrong is left out, and `Run tasks` runs its producer instead.
          async function restoreStep({ context, core, store, env = process.env }) {
            const planTasks = JSON.parse(env.TASKGRAPH_PLAN).tasks;
            const names = String(env.TASKGRAPH_RUN || '').split(',').filter(Boolean);
            const wanted = legRestores(planTasks, names, JSON.parse(env.TASKGRAPH_RESTORES || '{}'));
            if (!wanted.length) return [];
            let cfg = null;
            try { cfg = store.storeConfig(env); } catch (error) { core.warning(`${error.message}; producers run instead`); }
            if (!cfg) return [];
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const dir = restoreTarballDir(env);
            fs.mkdirSync(dir, { recursive: true });
            const got = [];
            await Promise.all(wanted.map(async r => {
              try {
                const body = await store.getObject(cfg, outputObjectKey(store, repository, r.run_id, r.run_attempt, r.key), { timeoutMs: OUTPUT_TIMEOUT_MS, attempts: 3 });
                if (!body) throw new Error('no tarball (expired or never stored)');
                if (sha256(body) !== r.sha256) throw new Error('tarball does not match its proof');
                fs.writeFileSync(path.join(dir, `${r.key}.tar.gz`), body);
                got.push(r.task);
              } catch (error) {
                core.warning(`${r.task}: outputs not restored, so it runs here: ${error.message}`);
              }
            }));
            core.info(`Restored the outputs of ${got.length} of ${wanted.length} task(s): ${got.join(', ') || 'none'}`);
            return got;
          }

          // ---- Execution ----------------------------------------------------------------

          // Vercel CI starts each task on its own machine from a copy of the
          // repository taken after install, so no task sees another's build state. The
          // same isolation on one machine: a detached worktree per task for the tracked
          // files, the install's node_modules directories linked in, and everything else
          // the install left behind (a postinstall `nuxt prepare`, a generated client)
          // copied. A task that rewrites `.nuxt` or `.output` then rewrites its own.
          function isolatedWorkspace(cwd, root, name) {
            const git = args => execFileSync('git', ['-C', cwd, ...args], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
            const top = git(['rev-parse', '--show-toplevel']).trim();
            const prefix = git(['rev-parse', '--show-prefix']).trim();
            // The hash keeps `a:b` and `a_b` apart.
            const dir = path.join(root, `${name.replace(/[^A-Za-z0-9._-]/g, '_')}-${sha256(name).slice(0, 8)}`);
            fs.rmSync(dir, { recursive: true, force: true });
            // A persistent runner can hold a registration from an earlier job whose
            // directory is gone; prune it so `add` never refuses the path.
            execFileSync('git', ['-C', top, 'worktree', 'prune'], { stdio: 'ignore' });
            execFileSync('git', ['-C', top, 'worktree', 'add', '--detach', '--quiet', dir, 'HEAD'], { stdio: ['ignore', 'ignore', 'inherit'] });
            const others = execFileSync('git', ['-C', top, 'ls-files', '-z', '--others', '--directory', '--no-empty-directory'], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 })
              .split('\0').filter(Boolean).map(rel => rel.replace(/\/$/, ''));
            for (const rel of others) place(path.join(top, rel), path.join(dir, rel));
            return path.join(dir, prefix);
          }

          function place(from, to) {
            fs.mkdirSync(path.dirname(to), { recursive: true });
            const stat = fs.lstatSync(from);
            if (path.basename(from) === 'node_modules') fs.symlinkSync(from, to, 'dir');
            else if (stat.isDirectory() && holdsNodeModules(from)) {
              fs.mkdirSync(to, { recursive: true });
              for (const entry of fs.readdirSync(from)) place(path.join(from, entry), path.join(to, entry));
            } else fs.cpSync(from, to, { recursive: true, verbatimSymlinks: true });
          }

          function holdsNodeModules(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              if (entry.name === 'node_modules' || holdsNodeModules(path.join(dir, entry.name))) return true;
            }
            return false;
          }

          // A container guest can report the host's cores and memory while its cgroup
          // grants far less (a 4-CPU / 8 GiB linux-ci seat on a 64-core host), so the
          // cgroup v2 limits win when they are set.
          function cgroupLimits(read = file => fs.readFileSync(file, 'utf8')) {
            const limits = { cpus: Infinity, memory: Infinity };
            try {
              const [quota, period] = read('/sys/fs/cgroup/cpu.max').trim().split(/\s+/);
              if (quota !== 'max' && Number(period) > 0) limits.cpus = Math.max(1, Math.floor(Number(quota) / Number(period)));
            } catch { /* no cgroup v2 CPU limit */ }
            // memory.high throttles instead of killing: past it a task crawls
            // (four heavy tasks ran 20 minutes on one seat), so it counts as a limit.
            for (const file of ['memory.max', 'memory.high']) {
              try {
                const memory = read(`/sys/fs/cgroup/${file}`).trim();
                if (memory !== 'max' && Number(memory) > 0) limits.memory = Math.min(limits.memory, Number(memory));
              } catch { /* no cgroup v2 limit of that kind */ }
            }
            return limits;
          }

          // The directories a task's `outputs` globs name: the literal path before the
          // first glob character (".nuxt/**" -> ".nuxt", "dist/*.js" -> "dist"). A glob
          // with no literal directory ("**/*.d.ts") cannot be carried and is refused at
          // plan time.
          // A producer's worktree also holds the outputs it was handed (its own
          // producers', copied in before it ran), and its dependents read those too:
          // a restored build must bring the codegen it built from. Nearest last.
          function carriedOutputDirs(planTasks, name) {
            const byName = new Map(planTasks.map(t => [t.task, t]));
            const order = [];
            const seen = new Set();
            const visit = n => { for (const d of byName.get(n).dependsOn) if (!seen.has(d)) { seen.add(d); visit(d); order.push(d); } };
            visit(name);
            order.push(name);
            return [...new Set(order.flatMap(n => outputDirs(byName.get(n).outputs)))];
          }

          function outputDirs(outputs) {
            const dirs = [];
            for (const raw of outputs || []) {
              if (raw.startsWith('!')) continue;
              const parts = raw.replace(/^\.\//, '').split('/');
              const literal = [];
              for (const part of parts) {
                if (/[*?{[]/.test(part)) break;
                literal.push(part);
              }
              if (literal.length === 0) throw new Error(`output ${JSON.stringify(raw)} names no directory; write it as "<dir>/**"`);
              if (literal.includes('..')) throw new Error(`output ${JSON.stringify(raw)} leaves the package`);
              dirs.push(literal.join('/'));
            }
            return [...new Set(dirs)];
          }

          function defaultConcurrency(limits = cgroupLimits()) {
            const cpus = Math.min(os.availableParallelism ? os.availableParallelism() : os.cpus().length, limits.cpus);
            // About 3 GiB per concurrent Node tool (a Nuxt build, vue-tsc, ESLint),
            // so a seat stays under its memory limit; a heavier task takes a
            // machine of its own (`ci:machine`).
            const byMemory = Math.floor(Math.min(os.totalmem(), limits.memory) / (3 * 1024 ** 3));
            return Math.max(1, Math.min(cpus, byMemory));
          }

          // Run `names` in dependency order, at most `concurrency` CPUs at once (a
          // task's `ci:cpus:N` tag is its weight). A failed task blocks its dependents
          // and nothing else, so one push shows every independent failure.
          function runTasks({ planTasks, names, command, cwd, concurrency, isolate, restored = new Map(), env = process.env, onEvent = () => {}, timeoutMs = TASK_TIMEOUT_MS }) {
            const byName = new Map(planTasks.map(t => [t.task, t]));
            // A restored producer passed in an earlier run; its outputs sit in its own
            // directory and reach its dependents like a producer's that ran here.
            const wanted = new Set([...names, ...restored.keys()]);
            const state = new Map([...[...restored.keys()].map(n => [n, 'passed']), ...names.map(n => [n, 'pending'])]);
            const results = {};
            let free = concurrency;
            let active = 0;
            const dirs = new Map(restored);
            return new Promise(resolve => {
              // A dependency that does not run here (it passed) is looked through:
              // the running tasks behind it still come first, and their outputs
              // still reach this task.
              const depsMemo = new Map();
              const depsOf = name => {
                if (!depsMemo.has(name)) {
                  const out = [];
                  const seen = new Set();
                  const walk = n => { for (const d of byName.get(n).dependsOn) if (!seen.has(d)) { seen.add(d); if (wanted.has(d)) out.push(d); else walk(d); } };
                  walk(name);
                  depsMemo.set(name, out);
                }
                return depsMemo.get(name);
              };
              // Dependencies first, so a nearer dependency's copy of a shared output wins.
              const ancestorsOf = name => {
                const seen = [];
                const visit = n => { for (const d of depsOf(n)) { if (!seen.includes(d)) { visit(d); seen.push(d); } } };
                visit(name);
                return seen;
              };
              const pump = () => {
                for (const name of names) {
                  if (state.get(name) !== 'pending') continue;
                  if (depsOf(name).some(d => ['failed', 'blocked'].includes(state.get(d)))) {
                    state.set(name, 'blocked');
                    results[name] = { status: 'blocked', key: byName.get(name).key, durationMs: 0 };
                    onEvent({ type: 'blocked', task: name });
                    continue;
                  }
                  const weight = Math.min(byName.get(name).cpus, concurrency);
                  if (!depsOf(name).every(d => state.get(d) === 'passed') || (active > 0 && weight > free)) continue;
                  free -= weight;
                  active += 1;
                  state.set(name, 'running');
                  const started = Date.now();
                  const chunks = [];
                  let taskCwd = cwd;
                  let setupError = null;
                  try {
                    if (isolate && !byName.get(name).shared) {
                      taskCwd = isolatedWorkspace(cwd, isolate, name);
                      // What turbo restores from cache before a dependent runs: the
                      // declared `outputs` of every dependency that ran here.
                      for (const dep of ancestorsOf(name)) {
                        for (const rel of restored.has(dep) ? carriedOutputDirs(planTasks, dep) : outputDirs(byName.get(dep).outputs)) {
                          const from = path.join(dirs.get(dep), rel);
                          if (fs.existsSync(from)) {
                            fs.rmSync(path.join(taskCwd, rel), { recursive: true, force: true });
                            fs.cpSync(from, path.join(taskCwd, rel), { recursive: true, verbatimSymlinks: true });
                          }
                        }
                      }
                    }
                    dirs.set(name, taskCwd);
                  } catch (error) {
                    setupError = error;
                  }
                  onEvent({ type: 'start', task: name, cwd: taskCwd });
                  let timer = null;
                  let timedOut = false;
                  const finish = (code, signal) => {
                    clearTimeout(timer);
                    if (timedOut) signal = 'timeout';
                    free += weight;
                    active -= 1;
                    const status = code === 0 && !signal ? 'passed' : 'failed';
                    state.set(name, status);
                    results[name] = { status, key: byName.get(name).key, exitCode: code, signal: signal || null, durationMs: Date.now() - started };
                    onEvent({ type: 'end', task: name, status, durationMs: results[name].durationMs, output: Buffer.concat(chunks).toString('utf8') });
                    setImmediate(pump);
                  };
                  if (setupError) {
                    chunks.push(Buffer.from(`taskgraph: could not prepare the task's workspace: ${setupError.message}\n`));
                    setImmediate(() => finish(1, null));
                    continue;
                  }
                  const [bin, ...args] = command(name);
                  // Its own process group, so a task's leftovers can be ended with it.
                  const child = spawn(bin, args, { cwd: taskCwd, env: { ...env, TASKGRAPH_TASK: name }, stdio: ['ignore', 'pipe', 'pipe'], detached: process.platform !== 'win32' });
                  child.stdout.on('data', d => chunks.push(d));
                  child.stderr.on('data', d => chunks.push(d));
                  let done = false;
                  const settle = (code, signal) => { if (done) return; done = true; finish(code, signal); };
                  // A task past the budget is stopped, so the job still reports every
                  // other task (and its passes) inside its own timeout.
                  timer = setTimeout(() => {
                    timedOut = true;
                    chunks.push(Buffer.from(`\ntaskgraph: ${name} ran past ${Math.round(timeoutMs / 60000)} min and was stopped\n`));
                    try { process.kill(-child.pid, 'SIGTERM'); } catch { /* gone */ }
                    setTimeout(() => { try { process.kill(-child.pid, 'SIGKILL'); } catch { /* gone */ } }, 5000).unref();
                    setTimeout(() => { child.stdout.destroy(); child.stderr.destroy(); settle(null, 'timeout'); }, 6000).unref();
                  }, timeoutMs);
                  child.on('error', error => { chunks.push(Buffer.from(`taskgraph: ${error.message}\n`)); settle(127, null); });
                  child.on('close', settle);
                  // A task is over when its process exits, not when every pipe closes: a
                  // server or watcher it left behind would hold stdout open forever (a
                  // serial CI step never waited for those either). Drain briefly, then
                  // end the task's process group and move on.
                  child.on('exit', (code, signal) => {
                    setTimeout(() => {
                      if (done) return;
                      try { process.kill(-child.pid, 'SIGTERM'); } catch { /* already gone */ }
                      child.stdout.destroy();
                      child.stderr.destroy();
                      settle(code, signal);
                    }, EXIT_DRAIN_MS).unref();
                  });
                }
                if (active === 0 && [...state.values()].every(s => s !== 'pending' && s !== 'running')) resolve(results);
              };
              pump();
            });
          }

          function seconds(ms) {
            return `${(ms / 1000).toFixed(1)}s`;
          }

          // `node taskgraph.cjs`: the `Run tasks` step. Reads the plan and the misses
          // from the environment `Plan tasks` handed over, prints each task's log in its
          // own group as it finishes, and writes `digest` (the manifest a proof step
          // names) and `results` to $GITHUB_OUTPUT.
          // One tarball per passed cacheable producer (its existing `outputs`
          // directories), named by its key, with the SHA-256 the proof will carry.
          // Too big, empty or unreadable: not stored, and dependents rebuild it.
          function archiveOutputs({ planTasks, results, cwds, dir }) {
            const out = {};
            for (const t of planTasks) {
              if (!t.cache || !t.outputs.length || results[t.task]?.status !== 'passed' || !cwds.has(t.task)) continue;
              const base = cwds.get(t.task);
              const present = carriedOutputDirs(planTasks, t.task).filter(rel => fs.existsSync(path.join(base, rel)));
              if (!present.length) continue;
              try {
                fs.mkdirSync(dir, { recursive: true });
                const file = path.join(dir, `${t.key}.tar.gz`);
                execFileSync('tar', ['-czf', file, '-C', base, ...present], { stdio: ['ignore', 'ignore', 'inherit'] });
                if (fs.statSync(file).size > OUTPUT_MAX_BYTES) { fs.rmSync(file); continue; }
                out[t.key] = sha256(fs.readFileSync(file));
              } catch { /* not stored: its dependents rebuild it */ }
            }
            return out;
          }

          async function main(env = process.env) {
            const planTasks = JSON.parse(env.TASKGRAPH_PLAN).tasks;
            // A leg names exactly what it runs; without one, the misses and what they need.
            const known = new Set(planTasks.map(t => t.task));
            for (const n of String(env.TASKGRAPH_RUN || '').split(',').filter(Boolean)) if (!known.has(n)) throw new Error(`leg names unknown task ${n}`);
            const planned = env.TASKGRAPH_RUN
              ? planTasks.map(t => t.task).filter(n => String(env.TASKGRAPH_RUN).split(',').includes(n))
              : executionSet(planTasks, new Set(String(env.TASKGRAPH_MISSES || '').split(',').filter(Boolean)));
            // Stored outputs `Restore task outputs` fetched and checked: extract each
            // into its own directory. A producer whose tarball did not arrive runs
            // here instead, with whatever it needs in turn.
            const restored = new Map();
            const missing = new Set();
            for (const r of legRestores(planTasks, planned, JSON.parse(env.TASKGRAPH_RESTORES || '{}'))) {
              const file = path.join(restoreTarballDir(env), `${r.key}.tar.gz`);
              try {
                const body = fs.existsSync(file) ? fs.readFileSync(file) : null;
                if (!body || sha256(body) !== r.sha256) throw new Error('no checked tarball');
                const dir = path.join(env.RUNNER_TEMP || os.tmpdir(), 'taskgraph-restored', r.key);
                fs.rmSync(dir, { recursive: true, force: true });
                fs.mkdirSync(dir, { recursive: true });
                // The bytes just checked, not the file again.
                execFileSync('tar', ['-xzf', '-', '-C', dir, '--no-same-owner'], { input: body, stdio: ['pipe', 'ignore', 'inherit'] });
                restored.set(r.task, dir);
              } catch {
                missing.add(r.task);
              }
            }
            const names = missing.size
              ? planTasks.map(t => t.task).filter(n => planned.includes(n) || executionSet(planTasks, missing, new Set(restored.keys())).includes(n))
              : planned;
            for (const n of names) restored.delete(n);
            if (restored.size) console.log(`taskgraph: outputs restored for ${[...restored.keys()].join(', ')}`);
            if (missing.size) console.log(`taskgraph: no stored outputs for ${[...missing].join(', ')}, so they run here`);
            const pm = env.TASKGRAPH_PM === 'npm' ? 'npm' : 'pnpm';
            const requested = Number(env.TASKGRAPH_CONCURRENCY || 0);
            const concurrency = Number.isSafeInteger(requested) && requested > 0 ? requested : defaultConcurrency();
            const isolate = env.TASKGRAPH_ISOLATE === 'false' ? null : path.join(env.RUNNER_TEMP || os.tmpdir(), 'taskgraph');
            if (isolate) fs.mkdirSync(isolate, { recursive: true });
            console.log(`taskgraph: ${names.length} task(s) on ${concurrency} CPU slot(s)${isolate ? ', one isolated worktree each' : ''}: ${names.join(', ')}`);
            const t0 = Date.now();
            const failures = [];
            const running = new Map();
            // A line a minute naming what is still running, so a slow task shows in the log while it runs.
            const heartbeat = setInterval(() => {
              const now = Date.now();
              console.log(`taskgraph: ${seconds(now - t0)} in; running ${[...running].map(([n, at]) => `${n} (${seconds(now - at)})`).join(', ') || 'nothing'}`);
            }, 60000);
            heartbeat.unref();
            const requestedTimeout = Number(env.TASKGRAPH_TASK_TIMEOUT_MS || 0);
            const cwds = new Map();
            const outputs = {};
            let results;
            try {
              results = await runTasks({
                planTasks, names, cwd: process.cwd(), concurrency, isolate, restored, env,
                timeoutMs: requestedTimeout > 0 ? requestedTimeout : TASK_TIMEOUT_MS,
                command: name => [pm, 'run', name],
                onEvent: e => {
                  if (e.type === 'start') cwds.set(e.task, e.cwd);
                  if (e.type === 'start') running.set(e.task, Date.now());
                  else running.delete(e.task);
                  if (e.type === 'start') console.log(`▶ ${e.task}`);
                  else if (e.type === 'blocked') console.log(`⊘ ${e.task}: not run, a dependency failed`);
                  else if (e.type === 'end') {
                    const mark = e.status === 'passed' ? '✓' : '✗';
                    console.log(`::group::${mark} ${e.task} (${seconds(e.durationMs)})`);
                    process.stdout.write(e.output.endsWith('\n') || e.output === '' ? e.output : `${e.output}\n`);
                    console.log('::endgroup::');
                    if (e.status !== 'passed') failures.push(e);
                  }
                },
              });
              // Each passed producer's outputs, as one tarball for `Publish task
              // proofs` to store, before the worktrees go.
              Object.assign(outputs, archiveOutputs({ planTasks, results, cwds, dir: outputTarballDir(env) }));
            } finally {
              clearInterval(heartbeat);
              if (isolate) {
                fs.rmSync(isolate, { recursive: true, force: true });
                try { execFileSync('git', ['worktree', 'prune'], { stdio: 'ignore' }); } catch { /* best effort */ }
              }
            }
            // Failures again, ungrouped, so the error is the last thing in the log.
            for (const e of failures) {
              console.log(`::error title=${e.task} failed::${e.task} exited non-zero after ${seconds(e.durationMs)}; its full log is in the "✗ ${e.task}" group above`);
              process.stdout.write(e.output.split('\n').slice(-60).join('\n'));
              process.stdout.write('\n');
            }
            const passedKeys = planTasks.filter(t => t.cache && results[t.task]?.status === 'passed').map(t => t.key);
            const digest = passedKeys.length ? manifestDigest(passedKeys, outputs) : '';
            if (env.GITHUB_OUTPUT) {
              fs.appendFileSync(env.GITHUB_OUTPUT, `digest=${digest}\nresults=${JSON.stringify(results)}\noutputs=${JSON.stringify(outputs)}\n`);
            }
            const ok = Object.values(results).every(r => r.status === 'passed');
            const wall = Date.now() - t0;
            console.log(`taskgraph: ${ok ? 'all passed' : 'FAILED'} in ${seconds(wall)}`);
            // One annotation with the timings: it reaches the checks API even when the
            // log cannot be read.
            const slowest = names.map(n => [n, results[n]]).sort((a, b) => b[1].durationMs - a[1].durationMs).slice(0, 12)
              .map(([n, r]) => `${n} ${seconds(r.durationMs)}${r.status === 'passed' ? '' : ` ${r.status}${r.signal === 'timeout' ? ' (timeout)' : ''}`}`);
            const lim = cgroupLimits();
            const gib = b => (Number.isFinite(b) ? `${(b / 1024 ** 3).toFixed(1)} GiB` : 'none');
            const machine = `${os.availableParallelism ? os.availableParallelism() : os.cpus().length} cpus, ${gib(os.totalmem())} RAM, cgroup cpus ${Number.isFinite(lim.cpus) ? lim.cpus : 'none'}, cgroup memory ${gib(lim.memory)}`;
            console.log(`::notice title=taskgraph ${ok ? 'passed' : 'failed'} in ${seconds(wall)}::${names.length} task(s) on ${concurrency} slot(s) (${machine}); slowest: ${slowest.join(', ')}`);
            if (env.GITHUB_STEP_SUMMARY) {
              const mark = { passed: '✓ passed', failed: '✗ failed', blocked: '⊘ not run (a dependency failed)' };
              const rows = names.map(n => `| \`${n}\` | ${mark[results[n].status]} | ${seconds(results[n].durationMs)} |`);
              const serial = Object.values(results).reduce((sum, r) => sum + r.durationMs, 0);
              fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `### taskgraph run: ${seconds(wall)} wall for ${seconds(serial)} of task time on ${concurrency} slot(s)\n\n| Task | Result | Time |\n|---|---|---:|\n${rows.join('\n')}\n`);
            }
            return ok ? 0 : 1;
          }

          module.exports = {
            ENGINE, POINTER_SCHEMA, PUBLISH_STEP, LOCKFILES, NODE_VERSION_FILES,
            sha256, parseJsonc, globToRegExp, entriesFromApi, entriesFromLsTree, fingerprint,
            selectTasks, plan, executionSet, restoresFor, legsOf, manifestDigest, proofKey, outputObjectKey, findTaskProof, publishTaskProofs,
            normalizeDir, planStep, publishStep, restoreStep, archiveOutputs, carriedOutputDirs,
            isolatedWorkspace, outputDirs, cgroupLimits, defaultConcurrency, runTasks, main,
          };

          if (require.main === module) {
            main().then(code => process.exit(code), error => {
              console.log(`::error::taskgraph: ${error.stack || error.message}`);
              process.exit(1);
            });
          }
          TASKGRAPH_ENGINE

      # PLAN, from the GitHub API alone: the tested commit's tree (every
      # blob hash), turbo.json, package.json and the Node version file. No
      # checkout. Then one store lookup per task; GitHub must confirm each.
      # The misses are split into legs, one machine each (see `tasks`).
      - name: Plan tasks
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          NODE_VERSION: ${{ inputs.node-version }}
          NODE_VERSION_FILE: ${{ inputs.node-version-file }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          INSTALL_SCRIPT: ${{ inputs.install-script }}
          REUSE: ${{ inputs.reuse }}
          CI_ARTIFACTS_R2_ACCOUNT_ID: ${{ secrets.CI_ARTIFACTS_R2_ACCOUNT_ID }}
          CI_ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.CI_ARTIFACTS_R2_ACCESS_KEY_ID }}
          CI_ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.CI_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        with:
          script: |
            const tg = require(`${process.env.RUNNER_TEMP}/taskgraph.cjs`);
            const store = require(`${process.env.RUNNER_TEMP}/ci-artifact-store.cjs`);
            await tg.planStep({ github, context, core, store });


  # One machine per leg (Vercel CI gives every task its own). Untagged misses
  # share one leg; a task tagged `ci:machine` gets a leg of its own, with the
  # tasks that read its outputs, because one seat cannot hold several heavy
  # Node tools at once (operator-portal's build, typecheck, lint and unit
  # suite each ran past 20 minutes side by side on one linux-ci seat,
  # 2026-10-29, and took 163-258 s each on a larger machine).
  tasks:
    name: Tasks (${{ matrix.leg.id }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    # Blacksmith overflow and CI_LINUX_RUNNER exactly as nuxt-cloudflare.yml's
    # ordinary route (README "Runner routing", D-CI-CAP-1 (c)/D-BLACKSMITH-2).
    runs-on: ${{ fromJSON(toJSON(github.event.repository.private) != 'true' && toJSON(github.event.repository.private) != 'false' && '"missing-repository-visibility-do-not-run"' || (github.event.repository.private == true && vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && (github.event.repository.private == true && ((toJSON(github.event.repository.private) == 'false' || vars.CI_LINUX_RUNNER == '"self-hosted"' || startsWith(vars.CI_LINUX_RUNNER, '[') && contains(fromJSON(vars.CI_LINUX_RUNNER || '[]'), 'self-hosted') || startsWith(vars.CI_LINUX_RUNNER, '{') && (fromJSON(vars.CI_LINUX_RUNNER || '[]').labels == 'self-hosted' || startsWith(toJSON(fromJSON(vars.CI_LINUX_RUNNER || '[]').labels), '[') && contains(fromJSON(vars.CI_LINUX_RUNNER || '[]').labels, 'self-hosted')) || startsWith(vars.CI_LINUX_RUNNER, '"blacksmith-')) && vars.CI_LINUX_RUNNER) || ((toJSON(github.event.repository.private) == 'false' || inputs.runner == '"self-hosted"' || startsWith(inputs.runner, '[') && contains(fromJSON(inputs.runner || '[]'), 'self-hosted') || startsWith(inputs.runner, '{') && (fromJSON(inputs.runner || '[]').labels == 'self-hosted' || startsWith(toJSON(fromJSON(inputs.runner || '[]').labels), '[') && contains(fromJSON(inputs.runner || '[]').labels, 'self-hosted')) || startsWith(inputs.runner, '"blacksmith-')) && inputs.runner) || toJSON(github.event.repository.private) != 'false' && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"') != '"ubuntu-latest"' && format('"{0}"', startsWith(vars.BLACKSMITH_LINUX_LABEL, 'blacksmith-') && vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || (github.event.repository.private == true && ((toJSON(github.event.repository.private) == 'false' || vars.CI_LINUX_RUNNER == '"self-hosted"' || startsWith(vars.CI_LINUX_RUNNER, '[') && contains(fromJSON(vars.CI_LINUX_RUNNER || '[]'), 'self-hosted') || startsWith(vars.CI_LINUX_RUNNER, '{') && (fromJSON(vars.CI_LINUX_RUNNER || '[]').labels == 'self-hosted' || startsWith(toJSON(fromJSON(vars.CI_LINUX_RUNNER || '[]').labels), '[') && contains(fromJSON(vars.CI_LINUX_RUNNER || '[]').labels, 'self-hosted')) || startsWith(vars.CI_LINUX_RUNNER, '"blacksmith-')) && vars.CI_LINUX_RUNNER) || ((toJSON(github.event.repository.private) == 'false' || inputs.runner == '"self-hosted"' || startsWith(inputs.runner, '[') && contains(fromJSON(inputs.runner || '[]'), 'self-hosted') || startsWith(inputs.runner, '{') && (fromJSON(inputs.runner || '[]').labels == 'self-hosted' || startsWith(toJSON(fromJSON(inputs.runner || '[]').labels), '[') && contains(fromJSON(inputs.runner || '[]').labels, 'self-hosted')) || startsWith(inputs.runner, '"blacksmith-')) && inputs.runner) || toJSON(github.event.repository.private) != 'false' && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"'))) }}
    # Headroom for the linux-ci capacity-hook slot wait (up to 900s) -- fleet#276.
    timeout-minutes: 30
    permissions:
      # checkout
      contents: read
      # private GitHub Packages bundle (install)
      packages: read
      # portal-served app config for caller scripts (D-PORTAL-APP-CONFIG-1),
      # as nuxt-cloudflare.yml's caller-code jobs
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Depth 1: keys replace diff-based selection, so nothing reads HEAD^1.
          fetch-depth: 1

      - name: Install CI artifact store client
        working-directory: ${{ github.workspace }}
        run: *install_ci_artifact_store

      - name: Install taskgraph engine
        working-directory: ${{ github.workspace }}
        run: *install_taskgraph_engine

      # RESTORE: the stored outputs of passed producers this leg's tasks read
      # (a build whose content did not change), each checked against the
      # SHA-256 its attested proof names. Runs before any caller code, so the
      # store credential never shares a step with it.
      - name: Restore task outputs
        if: needs.plan.outputs.restores != '{}' && needs.plan.outputs.restores != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TASKGRAPH_PLAN: ${{ needs.plan.outputs.plan }}
          TASKGRAPH_RUN: ${{ matrix.leg.names }}
          TASKGRAPH_RESTORES: ${{ needs.plan.outputs.restores }}
          CI_ARTIFACTS_R2_ACCOUNT_ID: ${{ secrets.CI_ARTIFACTS_R2_ACCOUNT_ID }}
          CI_ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.CI_ARTIFACTS_R2_ACCESS_KEY_ID }}
          CI_ARTIFACTS_R2_SECRET_ACCESS_KEY: ${{ secrets.CI_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        with:
          script: |
            const tg = require(`${process.env.RUNNER_TEMP}/taskgraph.cjs`);
            const store = require(`${process.env.RUNNER_TEMP}/ci-artifact-store.cjs`);
            await tg.restoreStep({ context, core, store });

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.package-manager == 'pnpm'
        # Hides pnpm's '[WARN] Detected a pnpm v10 installation layout at
        # PNPM_HOME' (the action's own npm-linked bootstrap; cosmetic).
        env:
          PNPM_CONFIG_LOGLEVEL: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Mutually exclusive on setup-node: node-version-file wins when set.
          node-version-file: ${{ inputs.node-version-file }}
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          package-manager-cache: false

      # Restore-only dependency cache on GitHub-hosted runners, keyed and
      # placed exactly as nuxt-cloudflare.yml's (README "Dependency caching").
      # A self-hosted guest's store is persistent and shared (R8).
      - name: Resolve dependency cache directory
        id: dep-cache-dir
        if: (runner.environment == 'github-hosted')
        run: |
          set -euo pipefail
          # Beside the checkout, not in it, and absolute with no `..`
          # (actions/cache rejects relative patterns; workflows#177).
          cache_root="$(dirname "$GITHUB_WORKSPACE")/.ci-cache"
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm config set store-dir "$cache_root/pnpm-store"
            echo "path=$cache_root/pnpm-store" >> "$GITHUB_OUTPUT"
          else
            npm config set cache "$cache_root/npm"
            echo "path=$cache_root/npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependency cache
        id: dep-cache
        if: (runner.environment == 'github-hosted')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-

      - name: Configure package registry auth
        if: inputs.install-script == ''
        env:
