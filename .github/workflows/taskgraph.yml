              // move, so one old pass would be reused for ever (a typo such as
              // `scr/**`, or only negations).
              if (fp.files === 0) throw new Error(`turbo.json task ${name}: inputs ${JSON.stringify(inputs)} select no tracked file, so no change could ever re-run it`);
              const material = {
                engine: ENGINE,
                context,
                task: name,
                script: scripts[name],
                pre: scripts[`pre${name}`] ?? null,
                post: scripts[`post${name}`] ?? null,
                definition: { dependsOn: deps, inputs, outputs: def.outputs || [], env: [...(def.env || [])].sort(), passThroughEnv: [...(def.passThroughEnv || [])].sort(), cache: def.cache !== false },
