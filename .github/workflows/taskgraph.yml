              // itself, skipping a worktree. It cannot read another task's outputs,
              // which live in that task's worktree.
              const ancestors = [];
              const climb = n => { for (const d of localDeps(n, tasks.get(n))) if (!ancestors.includes(d)) { ancestors.push(d); climb(d); } };
