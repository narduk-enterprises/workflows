          // Vercel CI selects them.
          function selectTasks(turbo) {
            const defs = turbo.tasks || {};
            if (turbo.pipeline && !turbo.tasks) throw new Error('turbo.json uses the turbo 1 `pipeline` key; rename it to `tasks`');
            const tasks = new Map();
            for (const [rawName, def] of Object.entries(defs)) {
              const name = rawName.replace(/^\/\/#/, '');
              if (name.includes('#')) throw new Error(`task ${rawName}: package#task needs a turbo workspace; this engine runs the root package's scripts only`);
              if (!TASK_NAME.test(name)) throw new Error(`task ${JSON.stringify(rawName)}: names may use only ${TASK_NAME.source}`);
              tasks.set(name, def || {});
