          // What must execute: every miss, plus every dependency of a miss that
          // declares outputs and whose outputs cannot be restored (`restorable`: a
          // passed task whose proof carries its output tarball). A test that reads
          // the build's output gets the stored build, or a fresh one.
          function executionSet(planTasks, misses, restorable = new Set()) {
            const byName = new Map(planTasks.map(t => [t.task, t]));
            const run = new Set();
            // A passed dependency with no outputs is not re-run, but the outputs of
            // the tasks behind it are still needed, so look through it.
            const through = (name, seen) => {
              for (const dep of byName.get(name).dependsOn) {
                if (misses.has(dep)) visit(dep);
                else if (byName.get(dep).outputs.length > 0) { if (!restorable.has(dep)) visit(dep); }
                else if (!seen.has(dep)) { seen.add(dep); through(dep, seen); }
              }
            };
            const visit = name => {
              if (run.has(name)) return;
              run.add(name);
              through(name, new Set());
            };
            for (const name of misses) {
              if (!byName.has(name)) throw new Error(`unknown task ${name}`);
              visit(name);
            }
            return planTasks.map(t => t.task).filter(n => run.has(n));
