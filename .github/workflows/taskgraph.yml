          // not, `{a,b}` alternates. A glob that names a directory selects what is in it.
          function globToRegExp(glob) {
            const esc = s => s.replace(/[.+^$()|[\]\\]/g, '\\$&');
            let re = '';
            for (let i = 0; i < glob.length; i += 1) {
              const c = glob[i];
              if (c === '*' && glob[i + 1] === '*') {
                i += 1;
                if (glob[i + 1] === '/') { i += 1; re += '(?:.*/)?'; } else re += '.*';
              } else if (c === '*') re += '[^/]*';
              else if (c === '?') re += '[^/]';
              else if (c === '{') {
                const end = glob.indexOf('}', i);
                if (end < 0) throw new Error(`input glob ${JSON.stringify(glob)}: unclosed {`);
                re += `(?:${glob.slice(i + 1, end).split(',').map(alt => esc(alt).replace(/\*/g, '[^/]*')).join('|')})`;
                i = end;
              } else re += esc(c);
