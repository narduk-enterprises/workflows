          // ---- Reuse proofs (Required on a pull request -> the default-branch push) --

          async function publishProof({ cfg, kind, key, context, env = process.env }) {
            const repository = repositoryOf(`${context.repo.owner}/${context.repo.repo}`);
            const objectKey = proofObjectKey(repository, kind, key);
