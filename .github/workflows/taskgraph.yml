          if not files:
              print("no caller workflow files found under .github/workflows; nothing to audit")
              sys.exit(0)

          findings = []

          for path in files:
              text = open(path, encoding="utf-8").read()
              try:
                  doc = yaml.safe_load(text)
              except yaml.YAMLError as exc:
                  findings.append(f"{path}: does not parse as YAML ({exc})")
                  continue
              if not isinstance(doc, dict):
                  findings.append(f"{path}: does not parse as a YAML mapping")
                  continue

              # PyYAML parses the bare key `on:` as the boolean True.
              on = doc.get("on", doc.get(True))
              if isinstance(on, str):
                  on_keys = {on}
              elif isinstance(on, list):
                  on_keys = set(on)
              elif isinstance(on, dict):
                  on_keys = set(on.keys())
