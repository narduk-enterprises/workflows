          function entriesFromApi(tree, prefix) {
            const base = prefix ? `${prefix}/` : '';
            return tree
              .filter(e => (e.type === 'blob' || e.type === 'commit') && e.path.startsWith(base))
              .map(e => ({ path: e.path.slice(base.length), mode: e.mode, sha: e.sha }))
              .sort((a, b) => (a.path < b.path ? -1 : a.path > b.path ? 1 : 0));
          }

          function entriesFromLsTree(text, prefix) {
            const rows = text.split('\0').filter(Boolean).map(row => {
              const tab = row.indexOf('\t');
              const [mode, type, sha] = row.slice(0, tab).split(' ');
              return { path: row.slice(tab + 1), mode, type, sha };
            });
            return entriesFromApi(rows, prefix);
          }

          function fingerprint(entries, inputs) {
            const positive = [];
            const negative = [];
            for (const raw of inputs) {
              if (typeof raw !== 'string' || raw === '') throw new Error(`input ${JSON.stringify(raw)} is not a glob`);
              // Only `$TURBO_DEFAULT$` is understood. Any other turbo token would
              // select nothing, silently, and freeze the key.
              if (/\$TURBO_(?!DEFAULT\$$)[A-Z_]*\$/.test(raw)) throw new Error(`input ${JSON.stringify(raw)}: only $TURBO_DEFAULT$ is supported; write the path relative to the package`);
              if (raw === '$TURBO_DEFAULT$') positive.push(/^/);
              else if (raw.startsWith('!')) negative.push(globToRegExp(raw.slice(1).replace(/^\.\//, '')));
              else positive.push(globToRegExp(raw.replace(/^\.\//, '')));
            }
            const hash = crypto.createHash('sha256');
            let files = 0;
            for (const e of entries) {
              if (!positive.some(re => re.test(e.path)) || negative.some(re => re.test(e.path))) continue;
              hash.update(`${e.path}\0${e.mode}\0${e.sha}\n`);
              files += 1;
            }
            return { digest: hash.digest('hex'), files };
