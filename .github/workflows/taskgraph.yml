                core.warning(`R2 get ${object.key} failed (${result.reason}); this job builds its own application`);
                return;
              }
              core.info(`R2 get ${object.key}: ${result.bytes} bytes, sha256 ${object.sha256} verified; extracted into ${env.BUILD_PATH}`);
              core.setOutput('mode', 'r2');
            } catch (error) {
              if (error instanceof IntegrityError) {
                core.setFailed(error.message);
                return;
              }
              core.warning(`R2 get ${object.key} failed (${describe(error)}); this job builds its own application`);
            }
