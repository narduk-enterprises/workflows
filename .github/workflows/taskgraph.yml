          cat > "$RUNNER_TEMP/taskgraph.cjs" <<'TASKGRAPH_ENGINE'
          'use strict';
          // TASKGRAPH ENGINE. Vercel CI's model (vercel.com/docs/ci, 2026-10-28) on
          // GitHub Actions: the caller's turbo.json tags the tasks CI runs, each task
          // gets a content key, a task whose key already passed is never run again,
          // and the rest run side by side on one machine, in dependency order, after
          // one checkout and one install. The `Install taskgraph engine` step writes
          // this file from the workflow's own text, so a caller cannot substitute it.
          //
          // A KEY is the SHA-256 of everything that decides a task's result and can be
          // read without running it: the task's package.json script (and its pre/post
          // hooks), its turbo.json definition, the Git blob hash of every file its
          // `inputs` select (all tracked files by default), the lockfile, the declared
          // Node version and package manager, the callable inputs that change how it
          // runs, the keys of the tasks it depends on, and ENGINE. No file is read to
          // hash it: Git already hashed every blob.
          //
          // A PROOF is a pointer in the CI artifact store, never a result on its own:
          // `proof/<owner>/<repo>/task-proof-v1-<key>.json` names a run, an attempt
          // and the manifest of keys that attempt passed. It is honoured only when
          // GitHub's API shows that attempt is this repository's own run of the same
          // caller workflow and that its Required job ran the step named
          // `Publish task proofs <sha256 of the manifest>` successfully. A missing,
          // unreadable or unconfirmed proof means "run it". It can cost a run, never
          // coverage.
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawn, execFileSync } = require('node:child_process');

          // Bump when the meaning of a key changes, so no older pass is honoured.
          const ENGINE = 'narduk-taskgraph-v1';
          const SHA256 = /^[0-9a-f]{64}$/;
          // An output tarball bigger than this is not stored; its dependents rebuild it.
          const OUTPUT_MAX_BYTES = 1024 ** 3;
          const OUTPUT_TIMEOUT_MS = 180000;
          const POINTER_SCHEMA = 'narduk-taskgraph-proof-v1';
          const PUBLISH_STEP = 'Publish task proofs';
          const TASK_NAME = /^[A-Za-z0-9:_./@-]+$/;
          const KEY = /^[0-9a-f]{64}$/;
          const LOCKFILES = ['pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json', 'yarn.lock', 'bun.lock', 'bun.lockb'];
          const NODE_VERSION_FILES = ['.node-version', '.nvmrc', '.tool-versions'];
          // Flags and refs that make a script choose its checks from a diff, and a
          // script token (a name, `pnpm run x:changed`) ending in `:changed`.
          const DIFF_SCOPED = /FAST_BASE_REF|BASE_REF\b|--changed\b|--changedSince\b|--only-?[cC]hanged\b|--since\b|--affected\b|\baffected\b|merge-base|git diff\b|(?:^|\s)[\w:./@-]*:changed(?=\s|$)/;
          // Bounded so a broken store or API costs seconds, never the job budget.
          const LOOKUP_TIMEOUT_MS = 10000;
          // How long a task's pipes may stay open after its process exits.
          const EXIT_DRAIN_MS = 3000;
          // "If we have a CI job that lasts 20 minutes there better be a damn good
          // reason" (Logan, 2026-09-17): no one task may run longer.
          const TASK_TIMEOUT_MS = 20 * 60 * 1000;

          function sha256(text) {
            return crypto.createHash('sha256').update(text).digest('hex');
          }

          // turbo.json is JSONC: comments and trailing commas are legal.
          function parseJsonc(text) {
            let out = '';
            let inString = false;
            for (let i = 0; i < text.length; i += 1) {
              const c = text[i];
              if (inString) {
                out += c;
                if (c === '\\') { out += text[i + 1] ?? ''; i += 1; } else if (c === '"') inString = false;
              } else if (c === '"') { inString = true; out += c; }
              else if (c === '/' && text[i + 1] === '/') { while (i < text.length && text[i] !== '\n') i += 1; out += '\n'; }
              else if (c === '/' && text[i + 1] === '*') {
                const end = text.indexOf('*/', i + 2);
                if (end < 0) throw new Error('turbo.json: unterminated comment');
                i = end + 1;
              } else out += c;
            }
