              if (seen.has(name)) return;
              if (!tasks.has(name)) throw new Error(`${trail.at(-1)} depends on ${name}, which turbo.json does not define`);
              for (const dep of localDeps(name, tasks.get(name))) visit(dep, [...trail, name]);
              seen.add(name);
              selected.push(name);
