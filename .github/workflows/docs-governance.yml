name: Reusable Docs Governance Check

# Thin generalization of company-hq's handbook-spine-check.yml /
# untangle-project-sync.yml shape: checkout, optionally provision a Python
# and/or Node runtime, then run one repo-provided check command. Deliberately
# thin — path filtering (docs/**, the check script itself, this workflow
# file) and any script-specific setup beyond a bare interpreter (e.g. `pip
# install pyyaml`) stay in the CALLER's own trigger `paths:` block or inside
# the `command` input; this workflow does not know the caller's repo layout.
#
# THE "Required" CONVENTION (this is the point of this repo): this workflow's
# last job is named exactly `Required`, `needs:` every other job, runs with
# `if: always()`, and fails unless the check job succeeded. Callers name
# their calling job id `ci`, so GitHub composes the identical required check
# context `ci / Required` on every adopting repo, the same string produced by
# nuxt-cloudflare.yml and node-library.yml. See README for the full
# explanation.
#
# RUNNER ROUTING: `runner` is a caller-controlled, JSON-encoded string input —
# a plain string ("ubuntu-latest"), a JSON array, or a JSON object matching
# Config/github-runner-fleet.json's `runsOn` shape — decoded with fromJSON()
# at each job's `runs-on:`. A caller that is PUBLIC — or that may become
# public — must NEVER pass a self-hosted label here, because a fork PR would
# then execute attacker-controlled code on estate infrastructure. Only
# private, manifest-routed callers may pass a self-hosted runs-on value,
# resolved via `python3 scripts/github_runner_fleet.py route` in
# agent-infrastructure. The rule rests on the CALLER, not on this repo: this
# repo is private with organization-scoped Actions access (D-VIS-1, 2026-07-24
# — an earlier header here claimed it was public, which reversed CI-5 and was
# never true after D-VIS-1; workflows#2). `runner` is a free-form
# caller-supplied value and this workflow cannot police it.

on:
  workflow_call:
    inputs:
      command:
        description: >-
          Shell command that runs the repo-provided governance check script,
          e.g. `python3 scripts/check-handbook-spine.py`. May be multi-line
          to install its own light dependencies first (company-hq's
          untangle-project-sync installs PyYAML this way). Runs with bash at
          `working-directory`.
        required: true
        type: string
      runner:
        description: >-
          JSON-encoded runner for the jobs in this workflow: a plain string
          ("ubuntu-latest"), a JSON array, or a JSON object
          ({"group":"linux-ci","labels":[...]}) matching the runner-fleet
          manifest's `runsOn` shape. Decoded with fromJSON(), so the value
          must be valid JSON — a bare string needs its own quotes. Defaults
          to GitHub-hosted ubuntu-latest. A PUBLIC (or possibly-future-public)
          CALLER MUST NEVER PASS A SELF-HOSTED LABEL: a fork PR would run
          attacker-controlled code on estate self-hosted infrastructure. The
          constraint is the caller's visibility, not this repo's (private,
          org-scoped Actions access — D-VIS-1, workflows#2).
        required: false
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: "Directory to run `command` from"
        required: false
        type: string
        default: "."
      fetch-depth:
        description: >-
          actions/checkout fetch-depth. company-hq's handbook-spine-check and
          untangle-project-sync both use a shallow 1; raise it for a check
          that needs history (e.g. a diff-based drift check).
        required: false
        type: number
        default: 1
      python-version:
        description: "Python version to provision before running `command`. Empty skips Python setup."
        required: false
        type: string
        default: "3.13"
      node-version:
        description: "Node.js version to provision before running `command`. Empty skips Node/pnpm setup."
        required: false
        type: string
        default: ""
      package-manager:
        description: "Package manager for Node setup when node-version is set: pnpm or npm"
        required: false
        type: string
        default: "pnpm"
    secrets:
      NARDUK_PLATFORM_GH_PACKAGES_READ:
        required: false

jobs:
  check:
    name: check
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.node-version != '' && inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}

      # Dependency cache: restore everywhere, write only on the default branch
      # (company-hq#269). `setup-node`'s built-in `cache:` writes on every key
      # miss, scoped to the ref that ran — and a `refs/pull/N/merge` entry is
      # restorable only by that one pull request, so the write was pure cost.
      # See node-library.yml for the measured numbers behind this.
      - name: Resolve dependency cache directory
        id: dep-cache-dir
        if: inputs.node-version != ''
        run: |
          set -euo pipefail
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          else
            echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependency cache
        id: dep-cache
        if: inputs.node-version != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-

      - name: Run governance check
        env:
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: ${{ inputs.command }}

      # The governance command is what populates the store here (this workflow
      # has no separate install step), so the write goes after it.
      - name: Save dependency cache
        if: >-
          inputs.node-version != ''
          && steps.dep-cache.outputs.cache-hit != 'true'
          && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: ${{ steps.dep-cache.outputs.cache-primary-key }}

  required:
    name: Required
    if: always()
    needs: check
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the governance check to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          case "$CHECK_RESULT" in
            success) exit 0 ;;
            *) echo "::error::check job reported '$CHECK_RESULT'"; exit 1 ;;
          esac
