name: Reusable Cloudflare Version Upload

# Called after the app's ci job succeeds, in that SAME run. It consumes only
# nuxt-cloudflare.yml's production-artifact output. No source checkout, app
# dependency installation, build, bundling, migration or traffic promotion
# happens here: `--no-bundle` keeps esbuild from resolving imports on this
# credentialed host. Nitro's chunks are attached as additional modules from
# under the entrypoint; without that, an app whose config does not set them
# uploaded only its wasm and Cloudflare refused the version (10021, missing
# chunks/nitro/nitro.mjs, stonx run 41325465240).
# Caller grants: contents: read and actions: write (the cleanup job deletes the
# consumed production artifact, so a day of retention does not count against
# the organization's Actions storage). Pass the existing per-app deployment persona
# explicitly; never secrets: inherit. The artifact name binds SHA/run/attempt.
on:
  workflow_call:
    inputs:
      artifact:
        description: production-artifact output of the successful ci job in this run.
        required: true
        type: string
      node-version:
        description: Node major used only to execute the pinned Wrangler tool.
        required: false
        type: string
        default: '24'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      uploaded:
        description: True only after Wrangler uploaded this SHA; false when credentials are absent.
        value: ${{ jobs.upload.outputs.uploaded }}

permissions:
  contents: read

jobs:
  upload:
    name: Upload
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'push' || github.event.repository.full_name == github.repository)
    # Fleet resolver routes, group pinned. Unknown visibility fails closed.
    runs-on: ${{ fromJSON(toJSON(github.event.repository.private) == 'false' && '"ubuntu-latest"' || toJSON(github.event.repository.private) == 'true' && '{"group":"linux-deploy","labels":["self-hosted","Linux","X64","proxmox","proxmox-deploy"]}' || '"missing-repository-visibility-do-not-run"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: cloudflare-upload-${{ github.repository }}-main
      cancel-in-progress: true
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded || 'false' }}
    steps:
      - name: Validate artifact identity and deployment credential availability
        id: armed
        shell: bash
        env:
          ARTIFACT: ${{ inputs.artifact }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          prefix="production-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"
          [[ "$ARTIFACT" == "$prefix"* && "${ARTIFACT#"$prefix"}" =~ ^[0-9a-f]{12}$ ]]
          # The account ID is optional: without it Wrangler uses the generated
          # config's account_id, which the verify step requires.
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::warning::Runner upload NOT ARMED: the per-app Cloudflare token is absent; no version uploaded.'
            echo 'armed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.armed.outputs.armed == 'true'
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/${{ inputs.artifact }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.armed.outputs.armed == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Verify exact build identity and generated upload configuration
        if: steps.armed.outputs.armed == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/${{ inputs.artifact }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Wrangler reads a matching file through a symlink; the artifact carries none.
          if [[ -n "$(find . -type l -print -quit)" ]]; then echo '::error::Production artifact contains a symlink'; exit 1; fi
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('.narduk-build.json', 'utf8'));
          for (const [key, expected] of Object.entries({repository: process.env.GITHUB_REPOSITORY, sha: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT})) {
            if (manifest[key] !== expected) throw new Error(`Production artifact ${key} mismatch`);
          }
          const root = fs.realpathSync('.');
          const config = JSON.parse(fs.readFileSync('server/wrangler.json', 'utf8'));
          if (!config.main || config.build || config.env || config.configPath) throw new Error('Refusing custom build/env/configPath or missing entrypoint');
          const check = p => {
            const real = fs.realpathSync(path.resolve('server', p));
            if (real !== root && !real.startsWith(root + path.sep)) throw new Error('Config references a path outside the artifact');
          };
          if (!process.env.CLOUDFLARE_ACCOUNT_ID && !/^[0-9a-f]{32}$/.test(config.account_id ?? '')) throw new Error('No CLOUDFLARE_ACCOUNT_ID secret and no account_id in the generated config');
          check(config.main);
          if (config.assets?.directory) check(config.assets.directory);
          if (config.base_dir) check(config.base_dir);
          // An app's own rules win; otherwise attach every Nitro .mjs chunk under the entrypoint.
          const upload = {...config, find_additional_modules: true, rules: config.rules ?? [{type: 'ESModule', globs: ['**/*.mjs']}]};
          fs.writeFileSync('server/.narduk-upload.wrangler.json', JSON.stringify(upload), {flag: 'wx'});
          NODE

      - name: Install pinned upload tool before exposing deployment credentials
        if: steps.armed.outputs.armed == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/${{ inputs.artifact }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # The child shell resolves the tool, not this shell.
          npm exec --yes --registry=https://registry.npmjs.org --package=wrangler@4.151.1 -- \
            sh -c 'dirname "$(command -v wrangler)"' >> "$GITHUB_PATH"

      - name: Upload already-built version tagged with the exact commit SHA
        id: upload
        if: steps.armed.outputs.armed == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/${{ inputs.artifact }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || unset CLOUDFLARE_ACCOUNT_ID
          wrangler versions upload --config server/.narduk-upload.wrangler.json --no-bundle \
            --tag "$GITHUB_SHA" --message "Runner upload $GITHUB_SHA"
          echo 'uploaded=true' >> "$GITHUB_OUTPUT"

  cleanup:
    name: Delete uploaded artifact
    needs: [upload]
    if: needs.upload.outputs.uploaded == 'true'
    runs-on: ${{ fromJSON(toJSON(github.event.repository.private) == 'false' && '"ubuntu-latest"' || toJSON(github.event.repository.private) == 'true' && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"missing-repository-visibility-do-not-run"') }}
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      # Best effort: the version is already uploaded and a leftover artifact
      # expires a day later, so a failed delete warns and never fails the run
      # (promotion listens to it).
      - name: Delete this run's consumed production artifact
        shell: bash
        env:
          ARTIFACT: ${{ inputs.artifact }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE' || echo "::warning::Could not delete production artifact $ARTIFACT; it expires in a day"
          const api = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions`;
          const headers = {authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json'};
          const name = process.env.ARTIFACT;
          const list = await fetch(`${api}/runs/${process.env.GITHUB_RUN_ID}/artifacts?name=${encodeURIComponent(name)}&per_page=10`, {headers});
          if (!list.ok) throw new Error(`list artifacts answered ${list.status}`);
          for (const artifact of (await list.json()).artifacts.filter((a) => a.name === name)) {
            const del = await fetch(`${api}/artifacts/${artifact.id}`, {method: 'DELETE', headers});
            if (!del.ok) throw new Error(`delete ${artifact.id} answered ${del.status}`);
            console.log(`Deleted artifact ${artifact.id} (${name})`);
          }
          NODE

  required:
    name: Required
    needs: [upload, cleanup]
    if: always()
    runs-on: ${{ fromJSON(toJSON(github.event.repository.private) == 'false' && '"ubuntu-latest"' || toJSON(github.event.repository.private) == 'true' && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"missing-repository-visibility-do-not-run"') }}
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require upload result
        shell: bash
        env:
          RESULT: ${{ needs.upload.result }}
        run: |
          set -euo pipefail
          [[ "$RESULT" == success ]]
