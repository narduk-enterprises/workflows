name: Reusable Cloudflare Version Upload

# Called after the app's ci job succeeds, in that SAME run. It consumes only
# nuxt-cloudflare.yml's production-artifact output, and its production-object
# output when Build put the output in the CI artifact store (workflows#152).
# The object is fetched with a presigned GET (the account and access key IDs,
# never the secret key, reach this host) and must match the SHA-256 and size
# Build reported, or nothing is uploaded. No source checkout, app
# dependency installation, build, bundling, migration or traffic promotion
# happens here: `--no-bundle` keeps esbuild from resolving imports on this
# credentialed host. Nitro's chunks are attached as additional modules from
# under the entrypoint; without that, an app whose config does not set them
# uploaded only its wasm and Cloudflare refused the version (10021, missing
# chunks/nitro/nitro.mjs, stonx run 41325465240).
# Caller grants: contents: read and actions: write (the cleanup job deletes the
# consumed production artifact, so a day of retention does not count against
# the organization's Actions storage). Pass the existing per-app deployment persona
# explicitly; never secrets: inherit. The artifact name binds SHA/run/attempt.
on:
  workflow_call:
    inputs:
      artifact:
        description: production-artifact output of the successful ci job in this run.
        required: true
        type: string
      production-object:
        description: production-object output of the same ci job; empty means the GitHub artifact is the handoff.
        required: false
        type: string
        default: ''
      node-version:
        description: Node major used only to execute the pinned Wrangler tool.
        required: false
        type: string
        default: '24'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      # Required when production-object is set; only these two, never the secret key.
      CI_ARTIFACTS_R2_ACCOUNT_ID:
        required: false
      CI_ARTIFACTS_R2_ACCESS_KEY_ID:
        required: false
    outputs:
      uploaded:
        description: True only after Wrangler uploaded this SHA; false when credentials are absent.
        value: ${{ jobs.upload.outputs.uploaded }}

permissions:
  contents: read

jobs:
  upload:
    name: Upload
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.nightly != 'true' &&
      (github.event_name != 'push' || github.event.repository.full_name == github.repository)
    # Fleet resolver routes, group pinned. Unknown visibility fails closed.
    runs-on: ${{ fromJSON(toJSON(github.event.repository.private) == 'false' && '"ubuntu-latest"' || toJSON(github.event.repository.private) == 'true' && '{"group":"linux-deploy","labels":["self-hosted","Linux","X64","proxmox","proxmox-deploy"]}' || '"missing-repository-visibility-do-not-run"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: cloudflare-upload-${{ github.repository }}-main
      cancel-in-progress: true
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded || 'false' }}
    steps:
      - name: Validate artifact identity and deployment credential availability
        id: armed
        shell: bash
        env:
          ARTIFACT: ${{ inputs.artifact }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          prefix="production-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-"
          [[ "$ARTIFACT" == "$prefix"* && "${ARTIFACT#"$prefix"}" =~ ^[0-9a-f]{12}$ ]]
          # The account ID is optional: without it Wrangler uses the generated
          # config's account_id, which the verify step requires.
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::warning::Runner upload NOT ARMED: the per-app Cloudflare token is absent; no version uploaded.'
            echo 'armed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.armed.outputs.armed == 'true' && inputs.production-object == ''
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/${{ inputs.artifact }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.armed.outputs.armed == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Fetch exact production output from the CI artifact store
        if: steps.armed.outputs.armed == 'true' && inputs.production-object != ''
        shell: bash
        env:
          ARTIFACT: ${{ inputs.artifact }}
          OBJECT: ${{ inputs.production-object }}
          DEST: ${{ runner.temp }}/${{ inputs.artifact }}
          CI_ARTIFACTS_R2_ACCOUNT_ID: ${{ secrets.CI_ARTIFACTS_R2_ACCOUNT_ID }}
          CI_ARTIFACTS_R2_ACCESS_KEY_ID: ${{ secrets.CI_ARTIFACTS_R2_ACCESS_KEY_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const HEX32 = /^[0-9a-f]{32}$/;
          const HEX64 = /^[0-9a-f]{64}$/;
          const fail = message => { console.log(`::error::${message}`); process.exit(1); };
          const accountId = (process.env.CI_ARTIFACTS_R2_ACCOUNT_ID || '').trim();
          const accessKeyId = (process.env.CI_ARTIFACTS_R2_ACCESS_KEY_ID || '').trim();
          if (!HEX32.test(accountId) || !HEX32.test(accessKeyId)) {
            fail('production-object is set, but CI_ARTIFACTS_R2_ACCOUNT_ID and CI_ARTIFACTS_R2_ACCESS_KEY_ID are not both passed (32 hex each); nothing uploaded');
          }
          let object;
          try { object = JSON.parse(process.env.OBJECT); } catch { fail('production-object is not JSON; nothing uploaded'); }
          // The key binds this repository and the exact handoff name (SHA, run, attempt).
          const key = `prebuilt/${process.env.GITHUB_REPOSITORY}/${process.env.ARTIFACT}.tar.gz`;
          const valid = object && typeof object === 'object' && object.key === key
            && HEX64.test(String(object.sha256)) && Number.isSafeInteger(object.bytes) && object.bytes > 0
            && /^\d{8}T\d{6}Z$/.test(String(object.date))
            && Number.isSafeInteger(object.expires) && object.expires > 0 && object.expires <= 604800
            && HEX64.test(String(object.signature));
          if (!valid) fail(`production-object does not describe ${key}; nothing uploaded`);
          // The presigned GET Build signed (Signature V4, path style, host only).
          const encode = value => encodeURIComponent(value).replace(/[!'()*]/g, c => `%${c.charCodeAt(0).toString(16).toUpperCase()}`);
          const query = {
            'X-Amz-Algorithm': 'AWS4-HMAC-SHA256',
            'X-Amz-Credential': `${accessKeyId}/${object.date.slice(0, 8)}/auto/s3/aws4_request`,
            'X-Amz-Date': object.date,
            'X-Amz-Expires': String(object.expires),
            'X-Amz-SignedHeaders': 'host',
          };
          const search = Object.entries(query).map(([name, value]) => [encode(name), encode(value)])
            .sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0)).map(([name, value]) => `${name}=${value}`).join('&');
          const uri = `/narduk-ci-artifacts/${key.split('/').map(encode).join('/')}`;
          const url = `https://${accountId}.r2.cloudflarestorage.com${uri}?${search}&X-Amz-Signature=${object.signature}`;
          (async () => {
            let body;
            let last = 'no attempt';
            for (let n = 1; n <= 3 && !body; n += 1) {
              try {
                const response = await fetch(url, { headers: { 'accept-encoding': 'identity' }, signal: AbortSignal.timeout(120000) });
                const data = Buffer.from(await response.arrayBuffer());
                if (response.status === 200) body = data;
                else last = `HTTP ${response.status}`;
                if (!body && response.status < 500 && response.status !== 429) break;
              } catch (error) {
                last = String((error && error.message) || error);
              }
              if (!body && n < 3) await new Promise(resolve => setTimeout(resolve, 2000 * n));
            }
            if (!body) fail(`R2 get ${key} failed (${last}); nothing uploaded`);
            if (body.length !== object.bytes || crypto.createHash('sha256').update(body).digest('hex') !== object.sha256) {
              fail(`R2 object ${key} does not match the SHA-256 and size Build reported (${body.length} bytes read, ${object.bytes} expected); nothing uploaded`);
            }
            const dest = process.env.DEST;
            fs.mkdirSync(dest, { recursive: true });
            if (fs.readdirSync(dest).length) fail(`${dest} is not empty`);
            const tarball = path.join(process.env.RUNNER_TEMP, `production-${crypto.randomBytes(6).toString('hex')}.tar.gz`);
            fs.writeFileSync(tarball, body);
            try {
              execFileSync('tar', ['-xzf', tarball, '-C', dest, '--no-same-owner'], { stdio: ['ignore', 'ignore', 'inherit'] });
            } finally {
              fs.rmSync(tarball, { force: true });
            }
            console.log(`R2 get ${key}: ${body.length} bytes, sha256 ${object.sha256} verified; extracted into ${dest}`);
          })().catch(error => fail(String((error && error.message) || error)));
          NODE

      - name: Verify exact build identity and generated upload configuration
        if: steps.armed.outputs.armed == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/${{ inputs.artifact }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Wrangler reads a matching file through a symlink; the artifact carries none.
          if [[ -n "$(find . -type l -print -quit)" ]]; then echo '::error::Production artifact contains a symlink'; exit 1; fi
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifest = JSON.parse(fs.readFileSync('.narduk-build.json', 'utf8'));
          for (const [key, expected] of Object.entries({repository: process.env.GITHUB_REPOSITORY, sha: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT})) {
            if (manifest[key] !== expected) throw new Error(`Production artifact ${key} mismatch`);
          }
          const root = fs.realpathSync('.');
          const config = JSON.parse(fs.readFileSync('server/wrangler.json', 'utf8'));
          if (!config.main || config.build || config.env || config.configPath) throw new Error('Refusing custom build/env/configPath or missing entrypoint');
          const check = p => {
            const real = fs.realpathSync(path.resolve('server', p));
            if (real !== root && !real.startsWith(root + path.sep)) throw new Error('Config references a path outside the artifact');
          };
          if (!process.env.CLOUDFLARE_ACCOUNT_ID && !/^[0-9a-f]{32}$/.test(config.account_id ?? '')) throw new Error('No CLOUDFLARE_ACCOUNT_ID secret and no account_id in the generated config');
          // Wrangler prefers the config's account_id, so a secret is only a pin if they agree.
          if (process.env.CLOUDFLARE_ACCOUNT_ID && config.account_id && config.account_id !== process.env.CLOUDFLARE_ACCOUNT_ID) throw new Error('Generated config account_id differs from CLOUDFLARE_ACCOUNT_ID');
          check(config.main);
          if (config.assets?.directory) check(config.assets.directory);
          if (config.base_dir) check(config.base_dir);
          // An app's own rules win; otherwise attach every Nitro .mjs chunk under the entrypoint.
          const upload = {...config, find_additional_modules: true, rules: config.rules ?? [{type: 'ESModule', globs: ['**/*.mjs']}]};
          fs.writeFileSync('server/.narduk-upload.wrangler.json', JSON.stringify(upload), {flag: 'wx'});
          NODE

      - name: Install pinned upload tool before exposing deployment credentials
        if: steps.armed.outputs.armed == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/${{ inputs.artifact }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # The child shell resolves the tool, not this shell.
          npm exec --yes --registry=https://registry.npmjs.org --package=wrangler@4.151.1 -- \
            sh -c 'dirname "$(command -v wrangler)"' >> "$GITHUB_PATH"

      - name: Upload already-built version tagged with the exact commit SHA
        id: upload
        if: steps.armed.outputs.armed == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/${{ inputs.artifact }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || unset CLOUDFLARE_ACCOUNT_ID
          wrangler versions upload --config server/.narduk-upload.wrangler.json --no-bundle \
            --tag "$GITHUB_SHA" --message "Runner upload $GITHUB_SHA"
          echo 'uploaded=true' >> "$GITHUB_OUTPUT"

  cleanup:
    name: Delete uploaded artifact
    needs: [upload]
    if: needs.upload.outputs.uploaded == 'true'
    runs-on: ${{ fromJSON(toJSON(github.event.repository.private) == 'false' && '"ubuntu-latest"' || toJSON(github.event.repository.private) == 'true' && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"missing-repository-visibility-do-not-run"') }}
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      # Best effort: the version is already uploaded and a leftover artifact
      # expires a day later, so a failed delete warns and never fails the run
      # (promotion listens to it).
      - name: Delete this run's consumed production artifact
        shell: bash
        env:
          ARTIFACT: ${{ inputs.artifact }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE' || echo "::warning::Could not delete production artifact $ARTIFACT; it expires in a day"
          const api = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions`;
          const headers = {authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json'};
          const name = process.env.ARTIFACT;
          const list = await fetch(`${api}/runs/${process.env.GITHUB_RUN_ID}/artifacts?name=${encodeURIComponent(name)}&per_page=10`, {headers});
          if (!list.ok) throw new Error(`list artifacts answered ${list.status}`);
          for (const artifact of (await list.json()).artifacts.filter((a) => a.name === name)) {
            const del = await fetch(`${api}/artifacts/${artifact.id}`, {method: 'DELETE', headers});
            if (!del.ok) throw new Error(`delete ${artifact.id} answered ${del.status}`);
            console.log(`Deleted artifact ${artifact.id} (${name})`);
          }
          NODE

  required:
    name: Required
    needs: [upload, cleanup]
    if: always()
    runs-on: ${{ fromJSON(toJSON(github.event.repository.private) == 'false' && '"ubuntu-latest"' || toJSON(github.event.repository.private) == 'true' && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"missing-repository-visibility-do-not-run"') }}
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require upload result
        shell: bash
        env:
          RESULT: ${{ needs.upload.result }}
        run: |
          set -euo pipefail
          [[ "$RESULT" == success ]]
