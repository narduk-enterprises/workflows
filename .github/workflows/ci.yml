name: CI

# The only non-callable workflow in this repository, and the only thing that
# looks at a callable before seven adopters do.
#
# Until this landed, every file in `.github/workflows` was `on: workflow_call`,
# so nothing here ran on a pull request and nothing validated a callable before
# an adopter executed it (company-hq#269, "Noted, not filed" — left to Logan as
# a call during a CI-*speed* pass; added here on the hardening pass). A defect
# in this repo does not fail one repo. It fails every repo pinned to the tag
# that carries it, and it fails them at the moment `v1` moves, which is exactly
# when nobody is looking at this repository.
#
# Two complementary checks, because they catch different things:
#   actionlint         — is the workflow VALID? (schema, expressions, shellcheck
#                        over every `run:` block). Found a broken
#                        `# shellcheck disable=` directive in nuxt-cloudflare.yml
#                        on its first run, which had silently disabled
#                        shellcheck for that entire script.
#   lint_callables.py  — is the callable SAFE TO SHIP? (timeouts, permissions,
#                        SHA pins, `Required` completeness, concurrency).
#                        Those are local conventions, not GitHub schema, so
#                        actionlint cannot know about them.
#
# ~20s wall. It is deliberately cheap: a gate that costs real minutes on a repo
# whose whole purpose is saving other repos minutes would be self-defeating.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top so a job added later inherits it rather than the
# caller's grant. Nothing in this workflow writes anything.
permissions:
  contents: read

# Caller-level concurrency. This is the correct place for it — see README
# "Concurrency is the caller's job". Note this workflow is NOT a callable, so
# unlike the files it lints it may (and should) set this.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  empty-selection:
    uses: ./.github/workflows/node-library.yml
    permissions:
      contents: read
    with:
      # This repository is public. Keep even the no-op reusable-call proof on
      # GitHub-hosted capacity so a fork PR never reaches estate runners.
      runner: '"ubuntu-latest"'
      required-runner: '"ubuntu-latest"'
      package-matrix: '[]'

  validate:
    name: Validate workflows
    # This public repository runs untrusted fork code. Keep the gate on a
    # GitHub-hosted runner and never route through organization variables or
    # Blacksmith, which are private-CI capacity mechanisms.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/test_script_gates.py and other test_*.py extract the actual
      # `run:` snippets out of callables and execute them, so pin the Node
      # runtime used by this gate instead of relying on the hosted image.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # This gate imports PyYAML. Hosted images currently include it, but keep
      # the checked fallback so a runner-image update cannot silently remove a
      # required parser from the public gate.
      - name: Ensure PyYAML is available
        run: |
          set -euo pipefail
          if python3 -c "import yaml" 2>/dev/null; then
            echo "PyYAML already available"
          else
            echo "PyYAML missing on this guest; installing into user site-packages"
            python3 -m pip install --user --quiet pyyaml
            python3 -c "import yaml" || { echo "::error::PyYAML still unavailable after install"; exit 1; }
          fi

      # actionlint shells out to shellcheck to check every `run:` block. If
      # shellcheck is absent it skips that integration SILENTLY and still exits
      # 0 — which would make this gate quietly weaker than it looks, and
      # shellcheck is what caught the real defect that shipped with this gate.
      # Assert it rather than assume the image ships it.
      - name: Assert shellcheck is present
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::shellcheck is missing — actionlint would skip run-block linting and still pass"
            exit 1
          fi
          shellcheck --version | head -2

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          # Pinned version + checksum rather than `curl | bash` from the
          # project's install script: a linter that gates seven repos'
          # workflows is itself supply chain.
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint -version

      - name: actionlint
        run: ./actionlint -no-color -oneline .github/workflows/*.yml

      - name: Structural gate (timeouts, permissions, pins, Required, concurrency)
        run: python3 scripts/lint_callables.py

      # R10: `| tee` without pipefail reintroduces exit-code masking. The live
      # workflows currently have zero `| tee` uses; this keeps it that way.
      - name: tee-pipefail regression tests
        run: python3 scripts/test_tee_pipefail.py

      # Extracts the shipped step text out of python-data.yml and executes it,
      # so the tests cannot drift from the callable they describe (workflows#4).
      - name: extra-env behaviour tests
        run: python3 scripts/test_extra_env.py

      # Same discipline: the gate scripts are extracted from node-library.yml
      # and executed against real package.json fixtures, so a silent
      # `--if-present` regression cannot land.
      - name: script-gate behaviour tests
        run: python3 scripts/test_script_gates.py

      # Extracts node-library.yml's `Required` job package-result case
      # statement and executes it against every result GitHub can report for
      # an empty-matrix-capable `package` job (success/skipped/failure/
      # cancelled), so `skipped` (an intentionally empty package-matrix)
      # cannot silently regress back into a false-failure.
      - name: Required-job package-result gate tests
        run: python3 scripts/test_required_gate.py

      # Execute the exact isolated-route guard and image-equality preflight
      # against green, wrong-version, wrong-revision, missing-browser and
      # job-local-cache fixtures. A toolchain check never observed failing is
      # not a trustworthy check (company-hq#343).
      - name: Playwright toolchain fail-closed tests
        run: python3 scripts/test_playwright_toolchain.py

      - name: Standalone browser callable fail-closed tests
        run: python3 scripts/test_reusable_browser_tests.py

      - name: Python static-analysis gate tests
        run: python3 scripts/test_python_static_gate.py

      # Extracts the embedded checker and the two shipped run: blocks out of
      # closing-syntax-check.yml and executes them against a real temp git
      # repo, proving the vendored copy actually gates a PR body AND a
      # commit-message closing keyword (agent-infrastructure#837, #1085).
      - name: PR closing-syntax callable behaviour tests
        run: python3 scripts/test_closing_syntax_check.py

      # code-review.yml is the only callable here that must NEVER fail a
      # caller, and "never fails" is the property that rots silently: a
      # `set -e` refactor or a stray `exit 1` in a refusal branch turns an
      # advisory review into a merge blocker on the day the pool is down.
      # This executes the shipped step against every refusal path with a stub
      # curl, and re-checks the default-off no-op that makes moving `v1` safe.
      - name: Advisory review callable fail-open tests
        run: python3 scripts/test_code_review_callable.py

      # The reviewer launcher's suite was never wired in here. It shipped
      # 2026-09-20 with 98 tests -- the four spend limits, the daily-cap
      # ledger-shape fixture, the YAML-to-Python label allow-list binding --
      # none of which any gate had ever executed; they ran only when an agent
      # remembered to run them locally. That is the failure mode the estate
      # rule "trust the gate, not the worker" names: a suite CI does not run
      # is a suite that is green by assertion (workflows#132).
      - name: Cursor reviewer launcher and spend-limit tests
        run: python3 scripts/test_cursor_review.py

      - name: Apple routing and fail-capable gate tests
        run: python3 scripts/test_apple_gate.py

      # And again for the self-hosted pnpm store placement: the step's whole
      # value is that it degrades quietly on a guest whose store directory is
      # not provisioned, and "quietly" is exactly the property that rots
      # unwatched (company-hq#269).
      - name: store-placement behaviour tests
        run: python3 scripts/test_store_placement.py

      - name: cache-path stability tests
        run: python3 scripts/test_cache_paths.py

      # Extracts the opt-in web-foundation gate's two `run:` blocks out of
      # nuxt-cloudflare.yml and executes them against real package.json
      # fixtures and stubbed pnpm/npx, proving both invocation paths (already
      # a dependency vs. pinned dlx), the throwaway-npmrc auth and cleanup,
      # `|| true` fail-open on the check command itself, and the decided
      # no-warning-tier blocking rule (company-hq docs/WEB-FOUNDATION-CHECK.md
      # §5, D-WEBFOUND-2 Q9 (a)) for every artefact shape including missing,
      # empty, malformed, and unrecognized-result JSON.
      - name: web-foundation conformance gate behaviour tests
        run: python3 scripts/test_foundation_check.py

      - name: prebuilt E2E artifact fail-closed tests
        run: python3 scripts/test_e2e_build_artifact.py

      # R12's fail-capable proof. A callable job that requests a permission
      # its caller did not grant kills the caller's ENTIRE run at startup --
      # zero jobs, no logs, no annotation -- on every adopter at once, the
      # moment the moving `v1` tag advances (workflows#59). The seeded-red
      # case re-introduces the exact escalation that caused it.
      - name: Callable permission-ceiling tests
        run: python3 scripts/test_permission_ceiling.py

      # These two shipped with workflows#49/#51 but were never wired into this
      # job, so the contracts they describe were never actually gated. Both
      # extract and execute the shipped `run:` text, so they cannot drift.
      - name: e2e-skip-paths behaviour tests
        run: python3 scripts/test_e2e_skip_paths.py

      - name: E2E proof reuse behavior tests
        run: python3 scripts/test_e2e_reuse.py

      # nuxt-cloudflare.yml fast-path inputs (ci / Fast, Required reuse,
      # --only-changed, journey smoke + rollback hook) and their default-off
      # backward-compatibility contract.
      - name: Fast-path contract tests
        run: python3 scripts/test_fast_path.py

      - name: E2E report minimal-install tests
        run: python3 scripts/test_e2e_report_minimal_install.py

      # The pull-request E2E subset (`e2e-pr-shards`/`e2e-pr-args`). Two
      # halves: that leaving both unset is byte-for-byte today's behaviour on
      # every event — every pinned adopter passes neither — and that `e2e`,
      # `e2e-report` and `Required` all resolve the effective shard count from
      # the ONE place that computes it. Three copies of that conditional is
      # how `--shard=<n>/<total>` and the `Required` aggregation drift into a
      # suite that silently runs a third of its tests and reports success.
      - name: Exact candidate validation tests
        run: python3 scripts/test_exact_candidate.py

      - name: E2E pull-request subset contract tests
        run: python3 scripts/test_e2e_pr_subset.py

      # Every nuxt-cloudflare install job must either pair legacy `.npmrc.auth`
      # materialization with exact-path cleanup or delegate to a validated
      # caller-owned wrapper that receives only the nVault service token.
      # Seeded-red mutations prove both paths fail closed.
      - name: package-auth install-scope contract tests
        run: python3 scripts/test_package_auth_cleanup.py

      # DA1 (company-hq#745). The dependency audit is the one gate here whose
      # correct answer is "fail on SOME high/critical advisories and pass on
      # others", so its parser is where a silent fail-open is easiest to write:
      # a report shape it does not recognise reads as zero advisories and every
      # caller goes green with a fixable critical in the tree. These cases
      # execute the shipped step text against both report formats and prove the
      # missing/unparseable/unknown-shape paths exit non-zero.
      - name: Dependency audit gate tests
        run: python3 scripts/test_dependency_audit.py

      # V1 (company-hq#745). The preview lane's whole value is that it fails
      # when the preview is absent, stale or serving a different commit -- the
      # three states a human reviewer cannot tell apart from a working preview
      # by looking at a URL. These cases run the shipped resolver against a real
      # local origin with controlled `x-build-version` headers, prove the sticky
      # comment is EDITED rather than appended, and prove `Required` still goes
      # red when a selected preview check is skipped.
      - name: Preview lane contract tests
        run: python3 scripts/test_preview_gate.py

      # Evaluates every `runs-on:` that reads a caller runner input across
      # caller visibility x input x org variables: an empty input routes a
      # private caller to the linux-ci group route and a public or
      # visibility-unknown one to ubuntu-latest, and an explicit input
      # resolves exactly as it did before the default flipped (row 18 Q3).
      - name: Default runner route tests
        run: python3 scripts/test_runner_default.py

      # The quarantine lane can never reach the gate: continue-on-error,
      # needed by no job, e2e's exact steps, and the linter's NON_GATING_JOBS
      # exemption rejects each way of weakening that.
      - name: E2E quarantine lane tests
        run: python3 scripts/test_e2e_quarantine.py

      # Cheap belt-and-braces: actionlint parses YAML itself, but a file it
      # cannot classify as a workflow is skipped rather than failed, so an
      # unparseable stray .yml would slip past both checks above.
      - name: YAML parse
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as exc:
                  bad.append(f"{p}: {exc}")
          for b in bad:
              print(f"::error::{b}")
          print(f"parsed {len(list(pathlib.Path('.github/workflows').glob('*.yml')))} file(s)")
          sys.exit(1 if bad else 0)
          PY
