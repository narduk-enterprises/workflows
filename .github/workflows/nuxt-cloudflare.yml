name: Reusable Nuxt + Cloudflare CI

# CI gate for the `nuxt-web` / `cloudflare-worker` project-lifecycle surfaces.
# pnpm/npm install -> typecheck (worker + Nuxt split, matching hydrogen's
# .github/workflows/ci-deploy.yml `ci` job) -> build -> optional Playwright
# e2e (opt-in, default false) -> optional `wrangler deploy --dry-run` gate
# (opt-in, default false). CI ONLY: deploying with real Cloudflare secrets on
# push-to-main is a deliberately separate `nuxt-cloudflare-deploy.yml`
# sibling (matching hydrogen's existing two-job ci/deploy split) that is NOT
# built in this pass — see the workflows repo README for what's deferred.
#
# THE BROWSER-SHARD SHAPE (added for company-hq#278). The `run-e2e` input
# above shipped as a single job on the SAME runner as the build, which is not
# the shape any real browser adopter in the estate uses: status-apps,
# operator-portal, earthdata-viewer, narduk-libs and nvault all shard
# Playwright across a DEDICATED isolated pool and merge blob reports
# afterwards. Because the callable could not express that, five repos
# hand-rolled it and a sixth (been-sober-for) hand-rolled it WRONG — chromium
# installed per run on the general linux-ci guest, the runner-class violation
# company-hq#276 is about. A gate shape the shared workflow cannot express is
# a gate shape every repo re-invents, so `e2e-runner`, `e2e-shards`,
# `e2e-args`, `e2e-install-browsers` and `e2e-browsers-path` exist to make the
# correct shape the easy one. Every one of them is additive with a default
# that reproduces the previous single-lane behaviour exactly.
#
# THE UNIT-TEST LANE (added for company-hq#278, earthdata-viewer). Until
# `run-tests` existed this workflow had NO unit-test expression at all, while
# node-library.yml had one — so a Nuxt app with a vitest suite literally could
# not adopt its own class's callable without dropping its unit tests on the
# floor. That is the same defect the browser-shard gap was: the callable being
# unable to say something real, so the repo keeps hand-rolling. `extra-scripts`
# lands with it for the same reason, mirroring node-library.yml's input of the
# same name, and covers the repo-specific gate that needs the built output.
# `run-tests` defaults to FALSE on purpose: `test` is a near-universal
# package.json script, so defaulting it on would give every existing adopter a
# new gate the moment `v1` moved, and a never-before-run suite turning a
# default branch red is not backward-compatible however the input is labelled.
#
# A GREEN LANE THAT RAN NOTHING (`require-scripts`, workflows#14 finished
# here). Every gate below runs a package script, and they all used to run it
# with `--if-present` — so a gate whose script does not exist matched nothing,
# exited 0, and reported GREEN. `run-tests: true` is a caller ASSERTING tests
# exist, and this file was taking that on faith. node-library.yml got the fix;
# this file did not, and it is the worse case: 4 of its 5 adopters were running
# at least one dead lane, mostly because the `web:typecheck` and `build`
# defaults here are absent in most of the class. Each gate now probes for the
# script first — warning today, hard failure under `require-scripts: true`,
# and a silent skip when the caller passes an EMPTY script name to declare the
# lane genuinely absent. That last distinction is what makes the check
# adoptable by the repos that need it most. The gates are behaviour-tested
# against real package.json fixtures by scripts/test_script_gates.py, which
# executes the shipped step text rather than a copy of it.
#
# ROUTE ADDITIONS ARE NOT THIS FILE'S TO GRANT. `e2e-runner` accepts whatever
# the caller passes; being able to NAME the isolated pool is not the same as
# being APPROVED for it. A repo absent from the runner-fleet manifest's
# playwright group leaves `e2e-runner` empty and takes the route addition
# through the fleet flow first (company-hq#155 -> #276). Passing a group a
# repo is not registered for produces a job that queues forever, which reads
# exactly like a hung runner.
#
# THE "Required" CONVENTION (this is the point of this repo): this workflow's
# last job is named exactly `Required`, `needs:` every other job, runs with
# `if: always()`, and fails unless each needed job succeeded or was
# intentionally skipped (an opted-out input, never a silent pass). Callers
# name their calling job id `ci`, so GitHub composes the identical required
# check context `ci / Required` on every adopting repo regardless of whether
# e2e or the deploy dry-run gate ran. See README for the full explanation.
#
# RUNNER ROUTING: `runner` is a caller-controlled, JSON-encoded string input —
# a plain string ("ubuntu-latest"), a JSON array, or a JSON object matching
# Config/github-runner-fleet.json's `runsOn` shape — decoded with fromJSON()
# at each job's `runs-on:`. A caller that is PUBLIC — or that may become
# public — must NEVER pass a self-hosted label here, because a fork PR would
# then execute attacker-controlled code on estate infrastructure. Only
# private, manifest-routed callers may pass a self-hosted runs-on value,
# resolved via `python3 scripts/github_runner_fleet.py route` in
# agent-infrastructure. The rule rests on the CALLER, not on this repo: this
# repo is private with organization-scoped Actions access (D-VIS-1, 2026-07-24
# — an earlier header here claimed it was public, which reversed CI-5 and was
# never true after D-VIS-1; workflows#2). `runner` is a free-form
# caller-supplied value and this workflow cannot police it.

# Least-privilege baseline for every job in this workflow. A called workflow's
# token is capped by the caller's grant and can only be narrowed from here,
# never widened — so this costs a caller nothing and protects against the one
# real failure mode: a job added later that forgets its own `permissions:` and
# would otherwise inherit whatever the caller happened to grant.
#
# It has no runtime effect today, deliberately: every job below already
# declares its own block, and job-level `permissions:` REPLACES the workflow
# level rather than merging with it. That is also why this is not a way to
# tighten the jobs that need `packages: read` — narrowing them here would do
# nothing, and narrowing them at job level makes the run fail to START with
# `startup_failure` and no logs at all (found during software-delivery's
# adoption). Job-level grants below are audited, not inherited.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      package-manager:
        description: "Package manager: pnpm or npm (hydrogen currently runs npm)"
        required: false
        type: string
        default: "pnpm"
      runner:
        description: >-
          JSON-encoded runner for every job in this workflow: a plain string
          ("ubuntu-latest"), a JSON array
          (["self-hosted","Linux","X64","proxmox","linux-ci"]), or a JSON
          object ({"group":"linux-ci","labels":[...]}) matching the
          runner-fleet manifest's `runsOn` shape. Decoded with fromJSON(), so
          the value must be valid JSON — a bare string needs its own quotes.
          Defaults to GitHub-hosted ubuntu-latest. A PUBLIC (or
          possibly-future-public) CALLER MUST NEVER PASS A SELF-HOSTED LABEL:
          a fork PR would run attacker-controlled code on estate self-hosted
          infrastructure. The constraint is the caller's visibility, not this
          repo's (private, org-scoped Actions access — D-VIS-1, workflows#2).
        required: false
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        description: "Directory containing the root package.json / lockfile"
        required: false
        type: string
        default: "."
      typecheck-worker-script:
        description: >-
          package.json script for the Worker/server typecheck lane (hydrogen:
          `typecheck`). Run with --if-present, so callers with no worker
          split can leave this at the default and it simply no-ops.
        required: false
        type: string
        default: "typecheck"
      typecheck-web-script:
        description: >-
          package.json script for the Nuxt web typecheck lane (hydrogen:
          `web:typecheck`). Run with --if-present, so a caller with a single
          combined typecheck script can leave this unset without failing.
        required: false
        type: string
        default: "web:typecheck"
      build-script:
        description: "package.json build script, run with --if-present"
        required: false
        type: string
        default: "build"
      run-tests:
        description: >-
          Run the unit-test script in the build lane, before `build-script`.
          OPT-IN, and default `false` deliberately even though the script runs
          with --if-present: `test` is a near-universal package.json script,
          so a default of `true` would hand every existing adopter a brand-new
          gate the moment the `v1` major tag moved — a suite that was never in
          their CI turning their default branch red is not a backward-compatible
          change, whatever the semver of the input says.

          This lane exists because until it did, this workflow had NO unit-test
          expression at all while `node-library.yml` had one, so a Nuxt app with
          a vitest suite could not adopt its own class's callable without
          silently dropping its unit tests. earthdata-viewer (company-hq#278) is
          the adopter that surfaced it.
        required: false
        type: boolean
        default: false
      test-script:
        description: "package.json script for the unit-test lane, run with --if-present"
        required: false
        type: string
        default: "test"
      extra-scripts:
        description: >-
          Space-separated package scripts run after `build-script`, each with
          --if-present, in the same lane so they see the build output. Mirrors
          `node-library.yml`'s input of the same name, and for the same reason:
          it is the difference between retiring a whole local job and retiring
          half of one. A repo-specific gate that would otherwise need a second
          job with a second full install goes here instead — earthdata-viewer's
          vendored-package pin check is the first case.
        required: false
        type: string
        default: ""
      require-scripts:
        description: >-
          Fail a gate whose npm script does not exist, instead of passing
          silently. Mirrors `node-library.yml`'s input of the same name
          (workflows#14), which this file did not get in that pass — so until
          now EVERY gate here ran `--if-present` unprotected: a missing script
          matched nothing, exited 0, and reported a GREEN lane that ran no
          tests, no typecheck and no build at all.

          This class is where the trap bites hardest, and that is measured. Of
          the five nuxt-cloudflare adopters audited in workflows#14, FOUR were
          running at least one dead lane — mostly on the `web:typecheck`
          default, since marketing-web, vtraceroute, software-delivery and
          earthdata-viewer all define `typecheck` and no `web:typecheck`, and
          software-delivery additionally has no `build` script at all.

          DEFAULT IS `false` for the same measured reason it is in
          node-library.yml: turning it on by default would redden four of five
          adopters the moment the `v1` tag moved, which is not a
          backward-compatible change however the input is labelled. Until a
          repo flips this, a missing script is reported as a `::warning::` and
          in the job summary, naming the script, so the loss is visible on
          every run instead of invisible.

          TO FLIP IT, A CALLER FIRST DECLARES ITS ABSENT LANES. Pass an EMPTY
          STRING for a script input whose lane genuinely does not exist in the
          repo (`typecheck-web-script: ""` on a Worker with no web surface,
          `build-script: ""` on one with no build step). An empty name is the
          caller SAYING the lane is off, and is skipped cleanly with no
          warning — as distinct from naming a script that is simply missing,
          which is the defect this input catches. Without that distinction
          `require-scripts` would be unadoptable by exactly the repos that
          need it, because this file's `web:typecheck` and `build` defaults
          are absent in most of the class.
        required: false
        type: boolean
        default: false
      run-e2e:
        description: "Run the optional Playwright e2e suite (opt-in)"
        required: false
        type: boolean
        default: false
      e2e-script:
        description: "package.json script for the e2e suite, run with --if-present"
        required: false
        type: string
        default: "test:e2e"
      e2e-browsers:
        description: "Space-separated `playwright install --with-deps` browser list"
        required: false
        type: string
        default: "chromium"
      e2e-runner:
        description: >-
          JSON-encoded runner for the browser jobs ONLY, when they must not run
          where `runner` points. Empty (the default) reuses `runner`, which is
          the previous behaviour and stays correct for a caller with no
          isolated pool.

          This input exists because "browser tests run on the same runner as
          the build" is a runner-class violation, not a preference. The estate
          routes Playwright to a dedicated isolated pool
          ({"group":"playwright-isolated",...}) precisely so a browser job
          never shares a guest with credentialed CI, and until this input
          existed a caller wanting that had to hand-roll the whole gate — which
          is exactly how been-sober-for ended up installing chromium on the
          general linux-ci guest (company-hq#276).

          Resolve the value from the runner-fleet manifest and paste the
          route's `runsOn` object verbatim. A repo that is not in the manifest's
          playwright group must NOT pass one here — leave it empty and take the
          route addition through the fleet flow first.
        required: false
        type: string
        default: ""
      e2e-shards:
        description: >-
          Number of Playwright shards. 1 (the default) runs the suite as a
          single job, unchanged. Greater than 1 fans the e2e job out over that
          many parallel lanes, appending
          `--shard=<n>/<total> --reporter=blob` to the e2e script, and adds an
          `E2E report` job that merges the blob reports into one HTML report.
          Generalizes the status-apps (2 shards) / operator-portal /
          earthdata-viewer (3 shards) pattern.
        required: false
        type: number
        default: 1
      e2e-args:
        description: >-
          Extra arguments appended to the e2e script after `--`, alongside any
          shard/reporter arguments this workflow adds
          (e.g. `--project=chromium --workers=1`).
        required: false
        type: string
        default: ""
      e2e-install-browsers:
        description: >-
          Run `playwright install --with-deps`. Set false on a pool that
          pre-installs its browsers into an image — the isolated pool keeps
          them at /opt/playwright-ci/browsers, and re-downloading them per run
          is the disk and time cost the pool exists to avoid.
        required: false
        type: boolean
        default: true
      e2e-browsers-path:
        description: >-
          PLAYWRIGHT_BROWSERS_PATH for the browser jobs. Empty leaves whatever
          the runner already exports ALONE — it is written to $GITHUB_ENV only
          when non-empty, because a job-level `env:` would export an empty
          value and clobber the pool's own setting. Pair with
          `e2e-install-browsers: false` when the pool pre-installs; on the
          estate's ephemeral Playwright guests the value is
          `/opt/playwright-ephemeral/browsers`.
        required: false
        type: string
        default: ""
      wrangler-dry-run:
        description: "Run an opt-in `wrangler deploy --dry-run` validation gate"
        required: false
        type: boolean
        default: false
      wrangler-working-directory:
        description: "Directory to run `wrangler deploy --dry-run` from; empty defaults to working-directory"
        required: false
        type: string
        default: ""
      wrangler-env:
        description: "Optional wrangler --env passed to the dry-run gate"
        required: false
        type: string
        default: ""
    secrets:
      NARDUK_PLATFORM_GH_PACKAGES_READ:
        required: false

env:
  NUXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # v7 caches the package manager BY DEFAULT (`package-manager-cache`
          # defaults to true) — dropping the `cache:` input does NOT turn it
          # off. Without this line the explicit restore/save below is a SECOND
          # cache running alongside the built-in one, and the `Post Run
          # actions/setup-node` tar the split was meant to remove is still
          # there: measured 27s on marketing-web `Build` after the split, on
          # top of a 22s explicit save. Two caches for one dependency tree is
          # strictly worse than the one it replaced.
          package-manager-cache: false

      # Dependency cache: restore everywhere, write only on the default branch
      # (company-hq#269). `setup-node`'s built-in `cache:` writes a fresh
      # tarball on every key MISS, scoped to the ref the job ran on — and a
      # cache written on `refs/pull/N/merge` is restorable only by that same
      # pull request. Every lockfile-changing PR therefore paid a `Post Run
      # actions/setup-node` tar to produce an entry nothing would ever read,
      # and the merge to `main` paid the identical tar again. Measured before
      # this change: 19s on marketing-web `Build`, a 67s job. Restoring on
      # every ref keeps the win — a PR falls back through `restore-keys` to
      # the default-branch entry, which is the one it actually wants.
      # ================================================================
      # SELF-HOSTED RUNNERS DO NOT CACHE DEPENDENCIES.
      #
      # The guard is `runner.environment`, which exists ONLY at step level — a
      # job-level `if:` has no `runner` context (actionlint rejects it), so it
      # cannot be hoisted onto the job.
      #
      # On a self-hosted guest the pnpm/npm store is a PERSISTENT SHARED
      # directory that outlives the job and is shared by every lane running on
      # that guest. Tarballing it is not merely redundant — it is UNSOUND.
      # `actions/cache/save` archives the live store WHILE other concurrent
      # lanes write into it, so the archive is torn. `actions/cache/restore`
      # then lays that torn archive back over a live store, and pnpm
      # hard-links the result into `node_modules` — which is how a
      # `package.json` ends up holding JavaScript source:
      #
      #   ERR_PNPM_BAD_PACKAGE_JSON .../vue-tsc/package.json:
      #     Unexpected token 'i', "import {..."... is not valid JSON
      #   ERR_PNPM_BAD_PACKAGE_JSON .../svgo/package.json:
      #     '"use strict";/* * SonarQube JavaScript'
      #
      # Those are whole files of the WRONG KIND at a path that should hold
      # JSON, not truncations — the signature of a content-addressed store
      # captured mid-write. Evidence: narduk-libs `main` needed three attempts,
      # with a 481 MiB poisoned entry against a 205 MiB healthy one and
      # caniuse-lite data sitting at terser's `package.json` path; vtraceroute
      # reproduced an identical message on three different guests
      # (`linux-ci-2/3/5`), which is what proves the poison arrives through the
      # SHARED CACHE ENTRY and not from one sick guest (vtraceroute#4,
      # company-hq#269).
      #
      # RESTORE HAD TO GO TOO, not just save. An unsound writer poisons every
      # reader of the same key, so leaving restore on would let a clean guest
      # happily unpack the torn archive some other lane wrote. Nothing is lost:
      # on a persistent guest the store on disk IS the cache, already warm.
      #
      # GitHub-hosted runners are genuinely ephemeral, have no persistent
      # store, and run one job per VM — so there is no concurrent writer, the
      # tarball is sound, and both halves stay on for them.
      #
      # `python-data.yml` arrives at the same place by a different road and is
      # the precedent: it leaves `setup-uv`'s `enable-cache` at `auto`, which
      # already means "on for hosted, off for self-hosted". Do not "unify" the
      # two by forcing that one on.
      #
      # Enforced by rule R8 in scripts/lint_callables.py.
      # ================================================================
      - name: Resolve dependency cache directory
        id: dep-cache-dir
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm config set store-dir "$GITHUB_WORKSPACE/.cache/pnpm-store"
            echo "path=.cache/pnpm-store" >> "$GITHUB_OUTPUT"
          else
            npm config set cache "$GITHUB_WORKSPACE/.cache/npm"
            echo "path=.cache/npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependency cache
        id: dep-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-

      - name: Configure package registry auth
        env:
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: |
          # Skip cleanly when the caller declined to pass a package-registry
          # token so public/forked callers can still run.
          if [ -z "$NARDUK_PLATFORM_GH_PACKAGES_READ" ]; then
            echo "skipping package-registry auth: no NARDUK_PLATFORM_GH_PACKAGES_READ token passed"
            exit 0
          fi
          if [ -f ./scripts/package-registry-auth.mjs ]; then
            node ./scripts/package-registry-auth.mjs
          elif [ -f ./tools/configure-package-registry-auth.mjs ]; then
            node ./tools/configure-package-registry-auth.mjs
          else
            echo "skipping package-registry auth: no auth bootstrap script present"
          fi

      # SELF-HOSTED: THE PNPM STORE MUST SIT ON THE WORKSPACE'S OWN FILESYSTEM.
      #
      # pnpm materialises `node_modules` by HARD-LINKING out of its store, and
      # a hard link cannot cross a device boundary. When store and workspace
      # are on different filesystems pnpm silently degrades to a full file
      # COPY — no warning, no error, just a slower install and a private copy
      # of every dependency on disk.
      #
      # That is the live shape on `linux-ci` (CT 210). The runner's HOME is on
      # the guest's root volume (`pve-vm-210-disk-0`, st_dev 64519); the
      # workspace is on the separate transient volume (`pve-vm-210-disk-1`,
      # st_dev 64534). So pnpm's default store at
      # `$HOME/.local/share/pnpm/store` is ALWAYS cross-device from the
      # workspace, and every install on that guest has been copying. Measured
      # there on one nuxt+vue+typescript+vitest tree (212 MiB of
      # `node_modules`), warm store, `--offline`, three runs each:
      #
      #   store on the ROOT volume   3.93s / 3.03s / 2.83s   st_nlink=1   220 MiB
      #   store on the SAME volume   2.71s / 2.02s / 2.32s   st_nlink=2    17 MiB
      #
      # `st_nlink` is the proof, not the clock: 1 means every file was copied,
      # 2 means it was linked to the store. And the disk column is the bigger
      # win — 13x less transient volume consumed per materialised workspace, on
      # the volume whose 80% mark BLOCKS new allocations and whose hourly
      # reclaimer deletes real checkouts to stay under it.
      #
      # DERIVED, NOT HARDCODED. The store goes at the mount point of the
      # workspace's own filesystem, because "same device as the workspace" is
      # the actual requirement and a literal guest path would be a guess about
      # every other guest. When the workspace is on `/` the default store
      # already shares its device and this step does nothing. The directory
      # itself must be pre-provisioned runner-owned — the transient mount root
      # is root-owned, so the job cannot create it — and a missing or
      # unwritable one leaves pnpm's default store in place. The failure mode
      # is a slower install, never a failed one.
      #
      # GITHUB-HOSTED RUNNERS KEEP THE DEFAULT STORE. They are ephemeral, the
      # `actions/cache` restore above puts the store back on the same
      # filesystem as the workspace already, and there is no transient mount to
      # move it to. This is the same runner-class split as the cache block
      # above, for the same reason: the two runner classes have genuinely
      # different storage, not a preference.
      #
      # company-hq#269, been-sober-for#74.
      - name: Point pnpm at a workspace-local store (self-hosted)
        if: runner.environment == 'self-hosted' && inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          mount_point=$(df --output=target "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$mount_point" = "/" ]; then
            echo "workspace is on the root filesystem; pnpm's default store already shares its device"
            exit 0
          fi
          store="$mount_point/pnpm-store"
          if [ ! -d "$store" ] || [ ! -w "$store" ]; then
            echo "no writable store at $store; keeping pnpm's default store (installs will copy, not link)"
            exit 0
          fi
          echo "npm_config_store_dir=$store" >> "$GITHUB_ENV"
          echo "pnpm store -> $store (same filesystem as $GITHUB_WORKSPACE)"

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci

      # Only the default branch writes, and only this job and `e2e` write at
      # all. `e2e-report` and `deploy-dry-run` share `inputs.runner` with this
      # job, so by the time they install, the entry this step wrote is an
      # exact-key hit for them — adding a save there would only race for a key
      # that already exists. `e2e` is separate because it may be routed to a
      # different runner class, which gives the cache a different path and so
      # a genuinely different entry.
      - name: Save dependency cache
        if: >-
          runner.environment == 'github-hosted'
          &&
          steps.dep-cache.outputs.cache-hit != 'true'
          && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: ${{ steps.dep-cache.outputs.cache-primary-key }}

      # EVERY GATE BELOW PROBES BEFORE IT RUNS. `--if-present` reports a green
      # lane for a script that does not exist, so "ran nothing" and "passed"
      # are the same colour. Each gate therefore asks whether the script is
      # there first, and reacts per `require-scripts` (warn today, fail when
      # the caller opts in). An EMPTY script name is different from a missing
      # one: it is the caller declaring the lane absent, and is skipped
      # silently. See the `require-scripts` input for the measured reason the
      # default is not yet a hard failure.
      #
      # The inputs moved into `env:` in the same change. They used to be
      # interpolated straight into the shell text, which made every script
      # name a command-injection surface from the caller's `with:` block.
      - name: Typecheck Worker
        env:
          GATE: Typecheck Worker
          SCRIPT: ${{ inputs.typecheck-worker-script }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          if [ -z "$SCRIPT" ]; then
            echo "$GATE: no script name configured — caller declared this lane absent, skipping"
            exit 0
          fi
          # `npm pkg get` yields `{}` for a missing script and the bare JSON
          # value for a present one, so test the VALUE's type — never the
          # presence of a quote. Verified against real fixtures, including
          # colon-bearing names like `web:typecheck`, by
          # scripts/test_script_gates.py.
          raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            msg="$GATE is enabled but no \"$SCRIPT\" script exists — this lane ran NOTHING"
            echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::$msg (require-scripts is on)"
              exit 1
            fi
            echo "::warning::$msg. Set require-scripts: true to make this a hard failure, or pass an empty script name to declare the lane absent."
            exit 0
          fi
          if [ "$PM" = "pnpm" ]; then pnpm run "$SCRIPT"; else npm run "$SCRIPT"; fi

      - name: Typecheck Nuxt
        env:
          GATE: Typecheck Nuxt
          SCRIPT: ${{ inputs.typecheck-web-script }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          if [ -z "$SCRIPT" ]; then
            echo "$GATE: no script name configured — caller declared this lane absent, skipping"
            exit 0
          fi
          # `npm pkg get` yields `{}` for a missing script and the bare JSON
          # value for a present one, so test the VALUE's type — never the
          # presence of a quote. Verified against real fixtures, including
          # colon-bearing names like `web:typecheck`, by
          # scripts/test_script_gates.py.
          raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            msg="$GATE is enabled but no \"$SCRIPT\" script exists — this lane ran NOTHING"
            echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::$msg (require-scripts is on)"
              exit 1
            fi
            echo "::warning::$msg. Set require-scripts: true to make this a hard failure, or pass an empty script name to declare the lane absent."
            exit 0
          fi
          if [ "$PM" = "pnpm" ]; then pnpm run "$SCRIPT"; else npm run "$SCRIPT"; fi

      - name: Unit tests
        if: inputs.run-tests
        env:
          GATE: Unit tests
          SCRIPT: ${{ inputs.test-script }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          if [ -z "$SCRIPT" ]; then
            echo "$GATE: no script name configured — caller declared this lane absent, skipping"
            exit 0
          fi
          # `npm pkg get` yields `{}` for a missing script and the bare JSON
          # value for a present one, so test the VALUE's type — never the
          # presence of a quote. Verified against real fixtures, including
          # colon-bearing names like `web:typecheck`, by
          # scripts/test_script_gates.py.
          raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            msg="$GATE is enabled but no \"$SCRIPT\" script exists — this lane ran NOTHING"
            echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::$msg (require-scripts is on)"
              exit 1
            fi
            echo "::warning::$msg. Set require-scripts: true to make this a hard failure, or pass an empty script name to declare the lane absent."
            exit 0
          fi
          if [ "$PM" = "pnpm" ]; then pnpm run "$SCRIPT"; else npm run "$SCRIPT"; fi

      - name: Build
        env:
          GATE: Build
          SCRIPT: ${{ inputs.build-script }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          if [ -z "$SCRIPT" ]; then
            echo "$GATE: no script name configured — caller declared this lane absent, skipping"
            exit 0
          fi
          # `npm pkg get` yields `{}` for a missing script and the bare JSON
          # value for a present one, so test the VALUE's type — never the
          # presence of a quote. Verified against real fixtures, including
          # colon-bearing names like `web:typecheck`, by
          # scripts/test_script_gates.py.
          raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            msg="$GATE is enabled but no \"$SCRIPT\" script exists — this lane ran NOTHING"
            echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::$msg (require-scripts is on)"
              exit 1
            fi
            echo "::warning::$msg. Set require-scripts: true to make this a hard failure, or pass an empty script name to declare the lane absent."
            exit 0
          fi
          if [ "$PM" = "pnpm" ]; then pnpm run "$SCRIPT"; else npm run "$SCRIPT"; fi

      # After build, in the same lane, so a gate that needs build output does
      # not pay for a second install. Same contract as node-library.yml's
      # extra-scripts — including the presence probe, applied per script: an
      # extra-scripts entry is always something the caller wrote down by name,
      # so a typo in one of them is precisely the silent-loss case.
      - name: Extra scripts
        if: inputs.extra-scripts != ''
        env:
          GATE: Extra scripts
          SCRIPTS: ${{ inputs.extra-scripts }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          # Deliberate word splitting: extra-scripts is a space-separated list.
          # shellcheck disable=SC2086
          for SCRIPT in $SCRIPTS; do
            echo "::group::$SCRIPT"
            raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
            present=$(printf '%s' "$raw" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
            if [ "$present" != "yes" ]; then
              msg="$GATE names \"$SCRIPT\" but no such script exists — that entry ran NOTHING"
              echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
              if [ "$REQUIRE" = "true" ]; then
                echo "::error::$msg (require-scripts is on)"
                exit 1
              fi
              echo "::warning::$msg. Set require-scripts: true to make this a hard failure."
              echo "::endgroup::"
              continue
            fi
            if [ "$PM" = "pnpm" ]; then pnpm run "$SCRIPT"; else npm run "$SCRIPT"; fi
            echo "::endgroup::"
          done

  # The shard list cannot be built in an expression — there is no range() in
  # the workflow expression language — so it is computed here and consumed by
  # the e2e matrix. Skipped entirely when the caller left e2e off, which
  # `Required` treats as an intentional skip.
  e2e-plan:
    name: E2E plan
    if: inputs.run-e2e
    needs: build
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Compute shard list
        id: plan
        env:
          TOTAL: ${{ inputs.e2e-shards }}
        run: |
          set -euo pipefail
          if ! [ "$TOTAL" -ge 1 ] 2>/dev/null; then
            echo "::error::e2e-shards must be an integer >= 1 (got '$TOTAL')"
            exit 1
          fi
          echo "shards=[$(seq 1 "$TOTAL" | paste -sd, -)]" >> "$GITHUB_OUTPUT"

  e2e:
    # Just `E2E` — GitHub appends the matrix value itself (`E2E (1)`,
    # `E2E (2)`, ...). A hand-written `E2E ${{ matrix.shard }}/...` renders
    # the raw template text in the checks list when the job is SKIPPED,
    # because a skipped matrix job has no matrix context to interpolate —
    # a check whose name is visibly an unevaluated expression looks broken
    # to anyone reading the PR, which is most of the time given e2e is
    # opt-in and off by default.
    name: E2E
    if: inputs.run-e2e
    needs: [build, e2e-plan]
    # `e2e-runner` when the caller routes browsers to an isolated pool,
    # otherwise `runner` — same guest as the build, the previous behaviour.
    runs-on: ${{ fromJSON(inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Conditional, NOT a job-level `env:` block. This used to be
      # `env: PLAYWRIGHT_BROWSERS_PATH: ${{ inputs.e2e-browsers-path }}`, which
      # is set unconditionally — so a caller that left the input empty did not
      # get "unset", it got an EMPTY value that CLOBBERED the one the isolated
      # pool's runner service exports. Playwright then fell back to its default
      # $HOME/.cache/ms-playwright, which is empty on those guests, and the
      # shards died with `browserType.launch: Executable doesn't exist at
      # /opt/playwright-ephemeral/.cache/ms-playwright/...` — an error that
      # reads like a missing install rather than like an override, which is
      # what made it expensive to diagnose (earthdata-viewer, company-hq#278).
      # Writing to $GITHUB_ENV only when the input is non-empty leaves the
      # inherited value alone, which is what the input's description always
      # claimed it did.
      - name: Set Playwright browsers path
        if: inputs.e2e-browsers-path != ''
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${{ inputs.e2e-browsers-path }}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # v7 caches the package manager BY DEFAULT (`package-manager-cache`
          # defaults to true) — dropping the `cache:` input does NOT turn it
          # off. Without this line the explicit restore/save below is a SECOND
          # cache running alongside the built-in one, and the `Post Run
          # actions/setup-node` tar the split was meant to remove is still
          # there: measured 27s on marketing-web `Build` after the split, on
          # top of a 22s explicit save. Two caches for one dependency tree is
          # strictly worse than the one it replaced.
          package-manager-cache: false

      # Dependency cache: restore everywhere, write only on the default branch
      # (company-hq#269). `setup-node`'s built-in `cache:` writes a fresh
      # tarball on every key MISS, scoped to the ref the job ran on — and a
      # cache written on `refs/pull/N/merge` is restorable only by that same
      # pull request. Every lockfile-changing PR therefore paid a `Post Run
      # actions/setup-node` tar to produce an entry nothing would ever read,
      # and the merge to `main` paid the identical tar again. Measured before
      # this change: 19s on marketing-web `Build`, a 67s job. Restoring on
      # every ref keeps the win — a PR falls back through `restore-keys` to
      # the default-branch entry, which is the one it actually wants.
      - name: Resolve dependency cache directory
        id: dep-cache-dir
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm config set store-dir "$GITHUB_WORKSPACE/.cache/pnpm-store"
            echo "path=.cache/pnpm-store" >> "$GITHUB_OUTPUT"
          else
            npm config set cache "$GITHUB_WORKSPACE/.cache/npm"
            echo "path=.cache/npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependency cache
        id: dep-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-

      - name: Configure package registry auth
        env:
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: |
          if [ -z "$NARDUK_PLATFORM_GH_PACKAGES_READ" ]; then
            echo "skipping package-registry auth: no NARDUK_PLATFORM_GH_PACKAGES_READ token passed"
            exit 0
          fi
          if [ -f ./scripts/package-registry-auth.mjs ]; then
            node ./scripts/package-registry-auth.mjs
          elif [ -f ./tools/configure-package-registry-auth.mjs ]; then
            node ./tools/configure-package-registry-auth.mjs
          else
            echo "skipping package-registry auth: no auth bootstrap script present"
          fi

      # Store placement, same reasoning as the `build` job above: on a
      # self-hosted guest the workspace is on its own volume and pnpm's default
      # store is not, so every install copies instead of hard-linking. See the
      # full comment there.
      - name: Point pnpm at a workspace-local store (self-hosted)
        if: runner.environment == 'self-hosted' && inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          mount_point=$(df --output=target "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$mount_point" = "/" ]; then
            echo "workspace is on the root filesystem; pnpm's default store already shares its device"
            exit 0
          fi
          store="$mount_point/pnpm-store"
          if [ ! -d "$store" ] || [ ! -w "$store" ]; then
            echo "no writable store at $store; keeping pnpm's default store (installs will copy, not link)"
            exit 0
          fi
          echo "npm_config_store_dir=$store" >> "$GITHUB_ENV"
          echo "pnpm store -> $store (same filesystem as $GITHUB_WORKSPACE)"

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci

      # Written separately from `build` because this job may be routed to a
      # different runner class (the isolated browser pool), where the cache
      # lands under a different path and is therefore a different entry.
      # Restoring still pays for itself on a disposable one-job guest — it is
      # only the per-pull-request WRITE that was being thrown away.
      - name: Save dependency cache
        if: >-
          runner.environment == 'github-hosted'
          &&
          steps.dep-cache.outputs.cache-hit != 'true'
          && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: ${{ steps.dep-cache.outputs.cache-primary-key }}

      - name: Install Playwright browsers
        if: inputs.e2e-install-browsers
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec playwright install --with-deps ${{ inputs.e2e-browsers }}
          else
            npx playwright install --with-deps ${{ inputs.e2e-browsers }}
          fi

      - name: Run e2e suite
        env:
          GATE: Run e2e suite
          SCRIPT: ${{ inputs.e2e-script }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ inputs.e2e-shards }}
          EXTRA_ARGS: ${{ inputs.e2e-args }}
        run: |
          set -euo pipefail
          # Same probe as the build lane's gates, and it matters MORE here: a
          # caller reached this step by explicitly setting `run-e2e: true`, and
          # a browser lane that provisions a runner, installs chromium and then
          # matches no script is the most expensive way in the estate to report
          # a green check for zero coverage.
          if [ -z "$SCRIPT" ]; then
            echo "$GATE: no script name configured — caller declared this lane absent, skipping"
            exit 0
          fi
          raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            msg="$GATE is enabled but no \"$SCRIPT\" script exists — this lane ran NOTHING"
            echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::$msg (require-scripts is on)"
              exit 1
            fi
            echo "::warning::$msg. Set require-scripts: true to make this a hard failure, or pass an empty script name to declare the lane absent."
            exit 0
          fi
          ARGS=()
          # A single lane runs the suite exactly as before — no --shard, no
          # blob reporter, so a caller that never asked for sharding sees no
          # change in what runs or what it reports.
          if [ "$TOTAL" -gt 1 ]; then
            ARGS+=("--shard=${SHARD}/${TOTAL}" "--reporter=blob")
          fi
          # Deliberate word splitting: e2e-args is a caller-supplied argument
          # list, not a single argument.
          #
          # The directive below must be the bare `disable=` form on its own
          # line, and NO other comment line here may begin with the word
          # "shellcheck" — every such line is parsed as a directive. This one
          # previously carried a trailing `-- <explanation>`, which is not
          # parseable (SC1072/SC1073), so the directive was not applied AND the
          # checker bailed out of this entire script, silently taking the
          # run-block linting of the whole step with it. Caught by the
          # actionlint gate in ci.yml on its first run.
          # shellcheck disable=SC2206
          ARGS+=(${EXTRA_ARGS})
          if [ "$PM" = "pnpm" ]; then
            if [ ${#ARGS[@]} -gt 0 ]; then
              pnpm run "$SCRIPT" -- "${ARGS[@]}"
            else
              pnpm run "$SCRIPT"
            fi
          else
            if [ ${#ARGS[@]} -gt 0 ]; then
              npm run "$SCRIPT" -- "${ARGS[@]}"
            else
              npm run "$SCRIPT"
            fi
          fi

      # STEP-level `always()` is deliberate and stays: capturing evidence is
      # the whole point of this step, and a step-level upload costs seconds, not
      # a runner slot. Do not "fix" it to `!cancelled()` by analogy with the
      # job-level change above — a job killed by `timeout-minutes` needs this to
      # run, and that is precisely the case where the evidence matters most.
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-shard name: upload-artifact v4+ rejects a duplicate artifact
          # name, so a fixed name would fail the moment a caller shards.
          name: playwright-evidence-${{ matrix.shard }}
          path: |
            ${{ inputs.working-directory }}/blob-report
            ${{ inputs.working-directory }}/playwright-report
            ${{ inputs.working-directory }}/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Sharded runs produce N partial blob reports and no readable result. This
  # job is what turns them back into one HTML report — the merge step
  # status-apps, operator-portal and earthdata-viewer each hand-rolled.
  #
  # `!cancelled()` rather than `always()`, and the difference matters. The
  # intent is "still produce the report that explains WHY a shard failed", and
  # `!cancelled()` keeps exactly that — it is true on failure. What it drops is
  # the case `always()` also covered and nobody wanted: a run the user
  # CANCELLED, where this job would still claim a `linux-ci` slot to merge blob
  # reports from shards that were killed mid-suite. That is the job-level
  # `if: always()` waste pattern found on nvault (a diagnostic browser job held
  # a scarce pool slot after `Verify` had already failed, producing a result
  # that could not gate anything) — job-level `always()` is easy to miss because
  # gates that check for it usually look at steps.
  #
  # Safe for `ci / Required`: on a cancelled run this job reports `skipped`, and
  # `Required` (which must keep `always()`, or a cancelled run would leave the
  # required check permanently "Expected" — the company-hq#146 deadlock) already
  # treats `skipped` as acceptable for this job.
  e2e-report:
    name: E2E report
    if: '!cancelled() && inputs.run-e2e && inputs.e2e-shards > 1'
    needs: e2e
    # Merging is pure Node work with no browser — keep it off the scarce
    # isolated browser pool.
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # v7 caches the package manager BY DEFAULT (`package-manager-cache`
          # defaults to true) — dropping the `cache:` input does NOT turn it
          # off. Without this line the explicit restore/save below is a SECOND
          # cache running alongside the built-in one, and the `Post Run
          # actions/setup-node` tar the split was meant to remove is still
          # there: measured 27s on marketing-web `Build` after the split, on
          # top of a 22s explicit save. Two caches for one dependency tree is
          # strictly worse than the one it replaced.
          package-manager-cache: false

      # Dependency cache: restore everywhere, write only on the default branch
      # (company-hq#269). `setup-node`'s built-in `cache:` writes a fresh
      # tarball on every key MISS, scoped to the ref the job ran on — and a
      # cache written on `refs/pull/N/merge` is restorable only by that same
      # pull request. Every lockfile-changing PR therefore paid a `Post Run
      # actions/setup-node` tar to produce an entry nothing would ever read,
      # and the merge to `main` paid the identical tar again. Measured before
      # this change: 19s on marketing-web `Build`, a 67s job. Restoring on
      # every ref keeps the win — a PR falls back through `restore-keys` to
      # the default-branch entry, which is the one it actually wants.
      - name: Resolve dependency cache directory
        id: dep-cache-dir
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm config set store-dir "$GITHUB_WORKSPACE/.cache/pnpm-store"
            echo "path=.cache/pnpm-store" >> "$GITHUB_OUTPUT"
          else
            npm config set cache "$GITHUB_WORKSPACE/.cache/npm"
            echo "path=.cache/npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependency cache
        id: dep-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-

      - name: Configure package registry auth
        env:
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: |
          if [ -z "$NARDUK_PLATFORM_GH_PACKAGES_READ" ]; then
            echo "skipping package-registry auth: no NARDUK_PLATFORM_GH_PACKAGES_READ token passed"
            exit 0
          fi
          if [ -f ./scripts/package-registry-auth.mjs ]; then
            node ./scripts/package-registry-auth.mjs
          elif [ -f ./tools/configure-package-registry-auth.mjs ]; then
            node ./tools/configure-package-registry-auth.mjs
          else
            echo "skipping package-registry auth: no auth bootstrap script present"
          fi

      # Store placement, same reasoning as the `build` job above: on a
      # self-hosted guest the workspace is on its own volume and pnpm's default
      # store is not, so every install copies instead of hard-linking. See the
      # full comment there.
      - name: Point pnpm at a workspace-local store (self-hosted)
        if: runner.environment == 'self-hosted' && inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          mount_point=$(df --output=target "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$mount_point" = "/" ]; then
            echo "workspace is on the root filesystem; pnpm's default store already shares its device"
            exit 0
          fi
          store="$mount_point/pnpm-store"
          if [ ! -d "$store" ] || [ ! -w "$store" ]; then
            echo "no writable store at $store; keeping pnpm's default store (installs will copy, not link)"
            exit 0
          fi
          echo "npm_config_store_dir=$store" >> "$GITHUB_ENV"
          echo "pnpm store -> $store (same filesystem as $GITHUB_WORKSPACE)"

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci

      - name: Download shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ inputs.working-directory }}/all-blob-reports
          pattern: playwright-evidence-*
          merge-multiple: true

      - name: Merge blob reports
        run: |
          set -euo pipefail
          if [ ! -d all-blob-reports/blob-report ]; then
            echo "::warning::no blob reports found to merge"
            exit 0
          fi
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec playwright merge-reports --reporter html all-blob-reports/blob-report
          else
            npx playwright merge-reports --reporter html all-blob-reports/blob-report
          fi

      # STEP-level `always()` is deliberate and stays: capturing evidence is
      # the whole point of this step, and a step-level upload costs seconds, not
      # a runner slot. Do not "fix" it to `!cancelled()` by analogy with the
      # job-level change above — a job killed by `timeout-minutes` needs this to
      # run, and that is precisely the case where the evidence matters most.
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-merged
          path: ${{ inputs.working-directory }}/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy-dry-run:
    name: Deploy dry run
    if: inputs.wrangler-dry-run
    needs: build
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # v7 caches the package manager BY DEFAULT (`package-manager-cache`
          # defaults to true) — dropping the `cache:` input does NOT turn it
          # off. Without this line the explicit restore/save below is a SECOND
          # cache running alongside the built-in one, and the `Post Run
          # actions/setup-node` tar the split was meant to remove is still
          # there: measured 27s on marketing-web `Build` after the split, on
          # top of a 22s explicit save. Two caches for one dependency tree is
          # strictly worse than the one it replaced.
          package-manager-cache: false

      # Dependency cache: restore everywhere, write only on the default branch
      # (company-hq#269). `setup-node`'s built-in `cache:` writes a fresh
      # tarball on every key MISS, scoped to the ref the job ran on — and a
      # cache written on `refs/pull/N/merge` is restorable only by that same
      # pull request. Every lockfile-changing PR therefore paid a `Post Run
      # actions/setup-node` tar to produce an entry nothing would ever read,
      # and the merge to `main` paid the identical tar again. Measured before
      # this change: 19s on marketing-web `Build`, a 67s job. Restoring on
      # every ref keeps the win — a PR falls back through `restore-keys` to
      # the default-branch entry, which is the one it actually wants.
      - name: Resolve dependency cache directory
        id: dep-cache-dir
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm config set store-dir "$GITHUB_WORKSPACE/.cache/pnpm-store"
            echo "path=.cache/pnpm-store" >> "$GITHUB_OUTPUT"
          else
            npm config set cache "$GITHUB_WORKSPACE/.cache/npm"
            echo "path=.cache/npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependency cache
        id: dep-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-

      - name: Configure package registry auth
        env:
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: |
          if [ -z "$NARDUK_PLATFORM_GH_PACKAGES_READ" ]; then
            echo "skipping package-registry auth: no NARDUK_PLATFORM_GH_PACKAGES_READ token passed"
            exit 0
          fi
          if [ -f ./scripts/package-registry-auth.mjs ]; then
            node ./scripts/package-registry-auth.mjs
          elif [ -f ./tools/configure-package-registry-auth.mjs ]; then
            node ./tools/configure-package-registry-auth.mjs
          else
            echo "skipping package-registry auth: no auth bootstrap script present"
          fi

      # Store placement, same reasoning as the `build` job above: on a
      # self-hosted guest the workspace is on its own volume and pnpm's default
      # store is not, so every install copies instead of hard-linking. See the
      # full comment there.
      - name: Point pnpm at a workspace-local store (self-hosted)
        if: runner.environment == 'self-hosted' && inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          mount_point=$(df --output=target "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$mount_point" = "/" ]; then
            echo "workspace is on the root filesystem; pnpm's default store already shares its device"
            exit 0
          fi
          store="$mount_point/pnpm-store"
          if [ ! -d "$store" ] || [ ! -w "$store" ]; then
            echo "no writable store at $store; keeping pnpm's default store (installs will copy, not link)"
            exit 0
          fi
          echo "npm_config_store_dir=$store" >> "$GITHUB_ENV"
          echo "pnpm store -> $store (same filesystem as $GITHUB_WORKSPACE)"

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci

      - name: Validate Worker bundle (dry run)
        working-directory: ${{ inputs.wrangler-working-directory != '' && inputs.wrangler-working-directory || inputs.working-directory }}
        run: |
          set -euo pipefail
          ARGS=(deploy --dry-run)
          if [ -n "${{ inputs.wrangler-env }}" ]; then
            ARGS+=(--env "${{ inputs.wrangler-env }}")
          fi
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec wrangler "${ARGS[@]}"
          else
            npx wrangler "${ARGS[@]}"
          fi

  required:
    name: Required
    if: always()
    needs: [build, e2e-plan, e2e, e2e-report, deploy-dry-run]
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require build to succeed and opt-in gates to succeed-or-skip
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_PLAN_RESULT: ${{ needs.e2e-plan.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_REPORT_RESULT: ${{ needs.e2e-report.result }}
          DEPLOY_DRY_RUN_RESULT: ${{ needs.deploy-dry-run.result }}
        run: |
          status=0
          # build has no `if:` — it must always report success.
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 job reported '$2' (must succeed)"
              status=1
            fi
          }
          # e2e / deploy-dry-run are opt-in — "skipped" means the caller left
          # the gate off, which is fine; only an actual failure blocks Required.
          allow_skip() {
            case "$2" in
              success | skipped) ;;
              *)
                echo "::error::$1 job reported '$2' (must succeed or be skipped)"
                status=1
                ;;
            esac
          }
          require_success build "$BUILD_RESULT"
          allow_skip e2e-plan "$E2E_PLAN_RESULT"
          allow_skip e2e "$E2E_RESULT"
          # e2e-report runs only when the caller sharded; when it runs it must
          # not fail silently either — an unmergeable report means the shard
          # evidence is unreadable, which is how a sharded suite quietly stops
          # being reviewable.
          allow_skip e2e-report "$E2E_REPORT_RESULT"
          allow_skip deploy-dry-run "$DEPLOY_DRY_RUN_RESULT"
          exit "$status"
