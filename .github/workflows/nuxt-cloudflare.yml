      - name: Verify exact validation candidate
        if: inputs.expected-candidate-sha != ''
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          EXPECTED_CANDIDATE: ${{ inputs.expected-candidate-sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_CANDIDATE" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$EVENT_NAME" != push || "$EVENT_REF" != "refs/heads/narduk-validation/$EXPECTED_CANDIDATE/"* || "$EVENT_SHA" != "$EXPECTED_CANDIDATE" ]]; then
            echo '::error::Exact validation requires a full SHA matching its explicit validation ref and push event.'
            exit 1
