  # The shard list cannot be built in an expression — there is no range() in
  # the workflow expression language — so it is computed here and consumed by
  # the e2e matrix. Skipped entirely when the caller left e2e off, which
  # `Required` treats as an intentional skip.
  #
  # No `needs: build`: this job reads nothing from `build` (the skip decision
  # and the shard list come from inputs and the PR diff), so it runs beside
  # the build instead of after it. That took its queue wait and runtime off
  # the E2E critical path (~13 s + 5 s p50 on buoys). `e2e` still needs
  # `build` for the prebuilt application, and Required still fails a run
  # whose build failed.
  e2e-plan:
    name: E2E plan
    if: inputs.run-e2e
    # CI lightweight route (company-hq CI policy); caller override takes precedence.
    runs-on: ${{ fromJSON(github.event.repository.private == false && '"ubuntu-latest"' || inputs.lightweight-runner || vars.CI_LIGHTWEIGHT_RUNNER || (vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"') != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"'))) }}
    # Headroom for the linux-ci capacity-hook slot wait (up to 900s, counts against timeout-minutes) -- fleet#276.
    timeout-minutes: 20
    # `contents: read` and nothing else, deliberately. A job in a CALLED
    # workflow may only request permissions the CALLER already granted; ask
    # for one it did not and the caller's ENTIRE run dies at startup
    # (`startup_failure`, zero jobs, no logs, no annotation) before any job is
    # created. Every estate caller grants `contents: read` + `packages: read`,
    # so the `pull-requests: read` this job briefly carried for
    # `gh api .../pulls/<n>/files` took down every `@v1` nuxt-cloudflare
    # adopter at once (workflows#59). The changed-file list below is read
    # through the COMPARE endpoint instead, which is a Contents read.
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      skipped: ${{ steps.skip.outputs.skipped }}
      # `true` when `e2e-full-paths` promoted this pull request to the full
      # configuration; consumed only by the shard-list step below.
      full: ${{ steps.skip.outputs.full }}
      # The EFFECTIVE shard count and e2e arguments for this event, resolved
      # exactly once here (workflows#83). `e2e`, `e2e-report` and `required`
      # all read these rather than re-deriving the pull-request/push split
      # from `inputs.*` — three copies of one conditional is how the shard
      # total in `--shard=<n>/<total>`, the `E2E report` gate and the
      # `Required` aggregation drift apart, and a `Required` that expects a
      # report job the plan never fanned out for is a red gate on a correct
      # run.
      shard-total: ${{ steps.plan.outputs.shard-total }}
      e2e-args: ${{ steps.plan.outputs.e2e-args }}
    steps:
      # Decides BEFORE the shard list is computed, so "skipped" can force
      # shards to `[]` below. Only a pull_request(_target) event is eligible:
      # a push (main, workflow_dispatch, schedule) always runs the full
      # suite, because that is the canonical-branch validation this input is
      # not meant to weaken (workflows#49).
      - name: Decide whether E2E can be skipped
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_PATTERNS: ${{ inputs.e2e-skip-paths }}
          FULL_PATTERNS: ${{ inputs.e2e-full-paths }}
        run: |
          set -euo pipefail
          # One changed-file read serves both path inputs. `full` answers
          # "does this PR need the full configuration?" (e2e-full-paths). When
          # the files cannot be determined it is `true` for a caller that
          # opted in (they asked for full-on-risk), and `false` otherwise,
          # which leaves the pre-existing tiers untouched.
          FULL_PATTERNS="${FULL_PATTERNS:-}"
          unknown_full=false
          if [ -n "$FULL_PATTERNS" ]; then unknown_full=true; fi
          if [ -z "$SKIP_PATTERNS" ] && [ -z "$FULL_PATTERNS" ]; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "e2e-skip-paths is empty: E2E always runs"
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request|pull_request_target) ;;
            *)
              echo "skipped=false" >> "$GITHUB_OUTPUT"
              echo "full=false" >> "$GITHUB_OUTPUT"
              echo "event '$EVENT_NAME' is not a pull request: e2e-skip-paths never applies outside PR events"
              exit 0
              ;;
          esac
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "full=$unknown_full" >> "$GITHUB_OUTPUT"
            echo "no pull request base/head sha in context; running the full suite"
            exit 0
          fi
          # Self-hosted runners provision their own toolchains rather than
          # relying on runner-ambient tools; `gh` is standard on GitHub-hosted
          # runners but not guaranteed everywhere self-hosted `linux-ci`
          # capacity is drawn from. Its absence must degrade to "run the full
          # suite", never to a hard failure of the whole E2E plan.
          if ! command -v gh >/dev/null 2>&1; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "full=$unknown_full" >> "$GITHUB_OUTPUT"
            echo "::warning::gh CLI not found on this runner; e2e-skip-paths cannot be evaluated, running the full suite"
            exit 0
          fi
          # The COMPARE endpoint, never `pulls/<n>/files`: comparing two
          # commits is a Contents read and works under the `contents: read`
          # every caller already grants, where `pulls/<n>/files` needs
          # `pull-requests: read` and that escalation kills the caller's run
          # at startup (workflows#59, see the permissions comment above).
          # Any read failure degrades to running the full suite.
          if ! files=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" \
              --paginate --jq '.files[]?.filename'); then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "full=$unknown_full" >> "$GITHUB_OUTPUT"
            echo "::warning::could not compare $BASE_SHA...$HEAD_SHA; running the full suite"
            exit 0
          fi
          if [ -z "$files" ]; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "full=$unknown_full" >> "$GITHUB_OUTPUT"
            echo "no changed files reported for $BASE_SHA...$HEAD_SHA; running the full suite"
            exit 0
          fi
          # FAIL CLOSED at the compare endpoint's file cap. `.files` stops at
          # 300 entries, and it stops SILENTLY: no `Link` header, no truncation
          # flag, and `?page=2` paginates the endpoint's COMMITS, not its
          # files, so `--paginate` cannot recover the rest. Verified live
          # (nodejs/node, a single 2782-file commit -> 300 returned). A
          # truncated list can only make MORE files look matched than really
          # are, so a diff at or above the cap is "cannot determine" and must
          # run the full suite rather than skip it.
          file_count=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$file_count" -ge 300 ]; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "full=$unknown_full" >> "$GITHUB_OUTPUT"
            echo "::warning::changed-file list hit the compare API's 300-file cap (silently truncated); running the full suite"
            exit 0
          fi
          # Pure bash + grep -E glob matcher: no toolchain to provision.
          # '**' crosses '/', a lone '*' does not; everything else is
          # literal. Self-hosted `linux-ci` capacity has no ambient `node`
          # (this job deliberately never calls setup-node to stay fast and
          # install nothing), so the matcher must not depend on it.
          glob_to_regex() {
            local pattern="$1" out="^" i=0 n c nextc
            local special='.+^(){}[]|$'
            special="${special}\\"
            n=${#pattern}
            while [ "$i" -lt "$n" ]; do
              c="${pattern:$i:1}"
              if [ "$c" = "*" ]; then
                nextc="${pattern:$((i + 1)):1}"
                if [ "$nextc" = "*" ]; then
                  out+=".*"
                  i=$((i + 2))
                  if [ "${pattern:$i:1}" = "/" ]; then
                    i=$((i + 1))
                  fi
                  continue
                fi
                out+="[^/]*"
              elif case "$special" in *"$c"*) true ;; *) false ;; esac; then
                out+="\\$c"
              else
                out+="$c"
              fi
              i=$((i + 1))
            done
            printf '%s$' "$out"
          }
          unmatched=0
          total=0
          unmatched_list=""
          full=false
          full_list=""
          bq='`'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            total=$((total + 1))
            file_matched=false
            for pattern in $SKIP_PATTERNS; do
              regex=$(glob_to_regex "$pattern")
              if printf '%s' "$file" | grep -Eq -- "$regex"; then
                file_matched=true
                break
              fi
            done
            if [ "$file_matched" = false ]; then
              unmatched=$((unmatched + 1))
              unmatched_list="${unmatched_list}- ${bq}${file}${bq}\n"
            fi
            for pattern in $FULL_PATTERNS; do
              regex=$(glob_to_regex "$pattern")
              if printf '%s' "$file" | grep -Eq -- "$regex"; then
                full=true
                full_list="${full_list}- ${bq}${file}${bq}\n"
                break
              fi
            done
          done <<< "$files"
          # A full-path match vetoes the skip: those files need the whole suite.
          if [ -n "$SKIP_PATTERNS" ] && [ "$unmatched" -eq 0 ] && [ "$full" = false ]; then
            skipped=true
            reason="every changed file matches e2e-skip-paths: skipping E2E"
          elif [ "$full" = true ]; then
            skipped=false
            reason="a changed file matches e2e-full-paths: running the full E2E suite"
          else
            skipped=false
            reason="at least one changed file does not match e2e-skip-paths: running E2E"
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -n "$SKIP_PATTERNS" ]; then
            {
              printf '### E2E skip-path plan\n\n%s changed file(s), %s unmatched.\n\n' "$total" "$unmatched"
              if [ "$unmatched" -gt 0 ]; then
                printf 'Unmatched:\n'
                printf '%b' "$unmatched_list"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -n "$FULL_PATTERNS" ]; then
            {
              printf '### E2E full-path plan\n\n'
              if [ "$full" = true ]; then
                printf 'Full configuration: these changed files match e2e-full-paths:\n'
                printf '%b' "$full_list"
              else
                printf 'Pull-request tier: no changed file matches e2e-full-paths.\n'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "$reason"
          if [ -n "$FULL_PATTERNS" ]; then
            echo "e2e-full-paths matched: $full"
          fi
        shell: bash
      - name: Compute shard list
        id: plan
        env:
          TOTAL: ${{ inputs.e2e-shards }}
          PR_TOTAL: ${{ inputs.e2e-pr-shards }}
          ARGS: ${{ inputs.e2e-args }}
          PR_ARGS: ${{ inputs.e2e-pr-args }}
          EVENT_NAME: ${{ github.event_name }}
          SKIPPED: ${{ steps.skip.outputs.skipped }}
          FULL: ${{ steps.skip.outputs.full }}
        run: |
          set -euo pipefail
          # `e2e-shards`/`e2e-args` are validated FIRST and unconditionally,
          # so a malformed push-path value is still caught on a pull request
          # rather than surfacing weeks later on the merge to the default
          # branch, where it fails the branch every other lane builds on.
          if ! [ "$TOTAL" -ge 1 ] 2>/dev/null; then
            echo "::error::e2e-shards must be an integer >= 1 (got '$TOTAL')"
            exit 1
          fi
          if ! [ "$PR_TOTAL" -ge 0 ] 2>/dev/null; then
            echo "::error::e2e-pr-shards must be an integer >= 0 (got '$PR_TOTAL')"
            exit 1
          fi
          # These two travel through $GITHUB_OUTPUT to reach `e2e`, and
          # $GITHUB_OUTPUT is a line-oriented `name=value` file: an embedded
          # newline would silently truncate the value AND let the remainder be
          # read as a further output assignment. A Playwright argument list
          # has no legitimate newline in it, so reject rather than invent an
          # escaping convention or a heredoc delimiter a caller could also
          # supply.
          for candidate in "$ARGS" "$PR_ARGS"; do
            case "$candidate" in
              *$'\n'*|*$'\r'*)
                echo "::error::e2e-args and e2e-pr-args must be a single line (no newlines)"
                exit 1
                ;;
            esac
          done
          # 0 means UNSET, and only a pull-request event may take the
          # override at all: a push to the default branch is the canonical
          # validation this input must not weaken, exactly as `e2e-skip-paths`
          # is confined to pull requests one step above. Any unexpected event
          # name therefore falls through to the FULL configuration — the
          # fail-closed direction, since the cost of running too much is
          # runner time and the cost of running too little is an unproven
          # merge. workflows#83.
          effective_total="$TOTAL"
          effective_args="$ARGS"
          FULL="${FULL:-}"
          # `FULL=true` means e2e-full-paths matched a changed file: this PR
          # keeps the full configuration like a push does.
          case "$EVENT_NAME:$FULL" in
            pull_request:true|pull_request_target:true) ;;
            pull_request:*|pull_request_target:*)
              if [ "$PR_TOTAL" -ge 1 ]; then
                effective_total="$PR_TOTAL"
              fi
              if [ -n "$PR_ARGS" ]; then
                effective_args="$PR_ARGS"
              fi
              ;;
          esac
          {
            echo "shard-total=$effective_total"
            echo "e2e-args=$effective_args"
          } >> "$GITHUB_OUTPUT"
          if [ "$SKIPPED" = "true" ]; then
            echo "shards=[]" >> "$GITHUB_OUTPUT"
          else
            echo "shards=[$(seq 1 "$effective_total" | paste -sd, -)]" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '### E2E plan\n\nevent %s: %s shard(s), args: %s\n\n' \
              "$EVENT_NAME" "$effective_total" "${effective_args:-(none)}" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    # Just `E2E` — GitHub appends the matrix value itself (`E2E (1)`,
    # `E2E (2)`, ...). A hand-written `E2E ${{ matrix.shard }}/...` renders
    # the raw template text in the checks list when the job is SKIPPED,
    # because a skipped matrix job has no matrix context to interpolate —
    # a check whose name is visibly an unevaluated expression looks broken
    # to anyone reading the PR, which is most of the time given e2e is
    # opt-in and off by default.
    name: E2E
    if: inputs.run-e2e && needs.e2e-plan.outputs.skipped != 'true'
    needs: [build, e2e-plan]
    # `e2e-runner` when the caller routes browsers to an isolated pool,
    # otherwise `runner` — same guest as the build, the previous behaviour.
    runs-on: ${{ fromJSON(inputs.e2e-runner != '' && inputs.e2e-runner || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"')) }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    env:
      # Dependency installation must never acquire a browser as a side effect.
      # The explicit hosted-runner installer below remains the sole supported
      # download path, and is unreachable on playwright-isolated.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    # Anchored: `e2e-quarantine` below runs these exact steps as its one
    # `quarantine` leg, so the non-blocking lane can never drift from the
    # gate's setup. Steps branch on `matrix.shard == 'quarantine'` only for
    # the arguments, the artifact name and the summary line.
    steps: &e2e_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The producing job's artifact ID survives 'rerun failed jobs': the
      # successful build may belong to an earlier attempt of this same run.
      - name: Require prebuilt E2E artifact identity
        if: needs.build.outputs.e2e-build-path != ''
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.e2e-build-id }}
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::successful build did not export its E2E artifact ID"
            exit 1
          fi

      - name: Download prebuilt E2E application
        if: needs.build.outputs.e2e-build-path != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.e2e-build-id }}
          merge-multiple: true
          path: ${{ inputs.working-directory }}/${{ needs.build.outputs.e2e-build-path }}

      - name: Guard isolated Playwright route
        env:
          BROWSERS_OVERRIDE: ${{ inputs.e2e-browsers-path }}
          INSTALL_BROWSERS: ${{ inputs.e2e-install-browsers }}
          ROUTE: ${{ inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner }}
        # Anchored so the `preview` job's browser lane runs the IDENTICAL
        # route guard rather than a second copy that can drift (workflows#V1).
        run: &guard_isolated_playwright_route |
          set -euo pipefail
          node <<'NODE'
          const route = process.env.ROUTE || ''
          const isolated = route.includes('playwright-isolated')
            || route.includes('proxmox-playwright-x64')
          if (!isolated) {
            console.log('non-isolated browser route: image toolchain contract does not apply')
            process.exit(0)
          }
          const errors = []
          if (process.env.INSTALL_BROWSERS !== 'false') {
            errors.push('e2e-install-browsers must be false on playwright-isolated')
          }
          if (process.env.BROWSERS_OVERRIDE) {
            errors.push('e2e-browsers-path must be empty on playwright-isolated; use the guest-exported immutable path')
          }
          if (errors.length) {
            for (const error of errors) console.error(`::error::${error}`)
            process.exit(1)
          }
          console.log('isolated route locked: job-time browser install and path override are disabled')
          NODE

      # Conditional, NOT a job-level `env:` block. This used to be
      # `env: PLAYWRIGHT_BROWSERS_PATH: ${{ inputs.e2e-browsers-path }}`, which
      # is set unconditionally — so a caller that left the input empty did not
      # get "unset", it got an EMPTY value that CLOBBERED the one the isolated
      # pool's runner service exports. Playwright then fell back to its default
      # $HOME/.cache/ms-playwright, which is empty on those guests, and the
      # shards died with `browserType.launch: Executable doesn't exist at
      # /opt/playwright-ephemeral/.cache/ms-playwright/...` — an error that
      # reads like a missing install rather than like an override, which is
      # what made it expensive to diagnose (earthdata-viewer, company-hq#278).
      # Writing to $GITHUB_ENV only when the input is non-empty leaves the
      # inherited value alone, which is what the input's description always
      # claimed it did.
      - name: Set Playwright browsers path
        if: inputs.e2e-browsers-path != ''
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${{ inputs.e2e-browsers-path }}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # node-version and node-version-file are mutually exclusive on
          # setup-node (passing both is rejected), so resolve them as two
          # exclusive expressions: node-version-file wins when the caller
          # sets it, and node-version otherwise reproduces prior behaviour.
          node-version-file: ${{ inputs.node-version-file }}
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          # v7 caches the package manager BY DEFAULT (`package-manager-cache`
          # defaults to true) — dropping the `cache:` input does NOT turn it
          # off. Without this line the explicit restore/save below is a SECOND
          # cache running alongside the built-in one, and the `Post Run
          # actions/setup-node` tar the split was meant to remove is still
          # there: measured 27s on marketing-web `Build` after the split, on
          # top of a 22s explicit save. Two caches for one dependency tree is
          # strictly worse than the one it replaced.
          package-manager-cache: false

      # Dependency cache: restore everywhere, write only on the default branch
      # (company-hq#269). `setup-node`'s built-in `cache:` writes a fresh
      # tarball on every key MISS, scoped to the ref the job ran on — and a
      # cache written on `refs/pull/N/merge` is restorable only by that same
      # pull request. Every lockfile-changing PR therefore paid a `Post Run
      # actions/setup-node` tar to produce an entry nothing would ever read,
      # and the merge to `main` paid the identical tar again. Measured before
      # this change: 19s on marketing-web `Build`, a 67s job. Restoring on
      # every ref keeps the win — a PR falls back through `restore-keys` to
      # the default-branch entry, which is the one it actually wants.
      # workflows#49: this job's cache restore used to be github-hosted only.
      # The reasoning for the ORIGINAL restriction lived one job up (`build`,
      # `Point pnpm at a workspace-local store (self-hosted)`) and is about
      # pnpm's hard-link store, not about actions/cache reachability: the
      # GitHub Actions cache is a network blob service, not local disk, so it
      # is reachable from a self-hosted guest exactly when job-log upload and
      # runner registration are (both already required for the job to run at
      # all). The npm cache directory below (`.cache/npm`, under
      # `$GITHUB_WORKSPACE`) never crosses a device boundary the way pnpm's
      # HOME-rooted store can, so enabling it for self-hosted npm callers
      # carries none of the copy-not-link risk #17 fixed. pnpm keeps its
      # existing self-hosted-only mount-point store below instead of this
      # cache, to avoid two competing store-dir writers.
      - name: Resolve dependency cache directory
        id: dep-cache-dir
        if: runner.environment == 'github-hosted' || inputs.package-manager == 'npm'
        run: |
          set -euo pipefail
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm config set store-dir "$GITHUB_WORKSPACE/.cache/pnpm-store"
            echo "path=.cache/pnpm-store" >> "$GITHUB_OUTPUT"
          else
            npm config set cache "$GITHUB_WORKSPACE/.cache/npm"
            echo "path=.cache/npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependency cache
        id: dep-cache
        if: runner.environment == 'github-hosted' || inputs.package-manager == 'npm'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-

      - name: Configure package registry auth
        if: inputs.install-script == ''
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: *configure_package_registry_auth

      # Store placement, same reasoning as the `build` job above: on a
      # self-hosted guest the workspace is on its own volume and pnpm's default
      # store is not, so every install copies instead of hard-linking. See the
      # full comment there.
      - name: Point pnpm at a workspace-local store (self-hosted)
        if: runner.environment == 'self-hosted' && inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          mount_point=$(df --output=target "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$mount_point" = "/" ]; then
            echo "workspace is on the root filesystem; pnpm's default store already shares its device"
            exit 0
          fi
          store="$mount_point/pnpm-store"
          if [ ! -d "$store" ] || [ ! -w "$store" ]; then
            echo "no writable store at $store; keeping pnpm's default store (installs will copy, not link)"
            exit 0
          fi
          echo "npm_config_store_dir=$store" >> "$GITHUB_ENV"
          echo "pnpm store -> $store (same filesystem as $GITHUB_WORKSPACE)"

      - name: Install dependencies (pnpm)
        if: inputs.install-script == '' && inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Install dependencies (npm)
        if: inputs.install-script == '' && inputs.package-manager == 'npm'
        run: npm ci
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      # Self-hosted guests keep the workspace volume between jobs. Delete the
      # exact `.npmrc.auth` materialization after install on every outcome so
      # browser-lane failures/cancels cannot leave registry credentials behind.
      - name: Remove package auth materialization
        if: always() && inputs.install-script == ''
        run: rm -f "${GITHUB_WORKSPACE}/${{ inputs.working-directory }}/.npmrc.auth"

      - name: Install dependencies (caller script)
        if: inputs.install-script != ''
        env:
          INSTALL_SCRIPT: ${{ inputs.install-script }}
          NVAULT_TOKEN: ${{ secrets.NVAULT_TOKEN || (inputs.foundation-check-auth == 'nvault' && secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || '') }}
          # Dependabot runs see no Actions-only NVAULT_TOKEN. Only then, map the
          # org package-read secret to GH_PACKAGES_READ (workflows#98).
          GH_PACKAGES_READ: ${{ !secrets.NVAULT_TOKEN && inputs.foundation-check-auth != 'nvault' && secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || '' }}
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$INSTALL_SCRIPT" in
            ''|*[!A-Za-z0-9:_-]*)
              echo "::error::install-script must be one package.json script name"
              exit 1
              ;;
          esac
          raw=$(npm pkg get "scripts.$INSTALL_SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            echo "::error::install-script names \"$INSTALL_SCRIPT\" but no such script exists"
            exit 1
          fi
          "$PM" run "$INSTALL_SCRIPT"

      # Written separately from `build` because this job may be routed to a
      # different runner class (the isolated browser pool), where the cache
      # lands under a different path and is therefore a different entry.
      # Restoring still pays for itself on a disposable one-job guest — it is
      # only the per-pull-request WRITE that was being thrown away.
      - name: Save dependency cache
        if: >-
          (runner.environment == 'github-hosted' || inputs.package-manager == 'npm')
          &&
          steps.dep-cache.outputs.cache-hit != 'true'
          && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: ${{ steps.dep-cache.outputs.cache-primary-key }}

      - name: Assert isolated Playwright toolchain
        if: >-
          contains(inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner, 'playwright-isolated')
          || contains(inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner, 'proxmox-playwright-x64')
        env:
          PLAYWRIGHT_ALLOWED_BROWSER_PREFIX: /opt
          PLAYWRIGHT_TOOLCHAIN_OWNER_UID: "0"
          PLAYWRIGHT_TOOLCHAIN_ROOT: /opt/playwright-ci
          REQUIRED_BROWSERS: ${{ inputs.e2e-browsers }}
        # Anchored for the `preview` job's browser lane -- same text, not a copy.
        run: &assert_isolated_playwright_toolchain |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            appendFileSync,
            existsSync,
            readFileSync,
            realpathSync,
            statSync,
          } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { createRequire } from 'node:module'
          import { dirname, isAbsolute, join, relative, resolve, sep } from 'node:path'

          const rows = []
          const summary = process.env.GITHUB_STEP_SUMMARY
          const add = (label, value) => rows.push(`| ${label} | \`${String(value).replaceAll('|', '\\|')}\` |`)
          const digest = path => createHash('sha256').update(readFileSync(path)).digest('hex')
          const readJson = path => JSON.parse(readFileSync(path, 'utf8'))
          const fail = message => { throw new Error(message) }
          const beneath = (path, root) => {
            const rel = relative(root, path)
            return rel === '' || (!rel.startsWith(`..${sep}`) && rel !== '..' && !isAbsolute(rel))
          }
          const ownerUid = Number(process.env.PLAYWRIGHT_TOOLCHAIN_OWNER_UID)
          if (!Number.isInteger(ownerUid) || ownerUid < 0) {
            fail('PLAYWRIGHT_TOOLCHAIN_OWNER_UID must be a non-negative integer')
          }
          const requireRootOwnedReadOnly = (path, label) => {
            const observed = statSync(path)
            if (observed.uid !== ownerUid || (observed.mode & 0o022) !== 0) {
              fail(`${label} is not root-owned and read-only: ${path}`)
            }
          }

          try {
            const imageRoot = resolve(process.env.PLAYWRIGHT_TOOLCHAIN_ROOT || '')
            const imagePackagePath = join(imageRoot, 'npm/node_modules/playwright/package.json')
            const imageManifestPath = join(imageRoot, 'npm/node_modules/playwright-core/browsers.json')
            const imageBrowsersRoot = realpathSync(join(imageRoot, 'browsers'))
            for (const [path, label] of [
              [imagePackagePath, 'image Playwright package'],
              [imageManifestPath, 'image browser manifest'],
              [imageBrowsersRoot, 'image browser root'],
            ]) {
              if (!existsSync(path)) fail(`${label} is missing: ${path}`)
              requireRootOwnedReadOnly(path, label)
            }

            const manifest = readJson('package.json')
            const declared = manifest.devDependencies?.['@playwright/test']
              ?? manifest.dependencies?.['@playwright/test']
            if (!declared) fail('package.json must directly pin @playwright/test for an isolated browser job')

            const localRequire = createRequire(join(process.cwd(), 'package.json'))
            const testPackagePath = localRequire.resolve('@playwright/test/package.json')
            const testRequire = createRequire(testPackagePath)
            const playwrightPackagePath = testRequire.resolve('playwright/package.json')
            const playwrightRequire = createRequire(playwrightPackagePath)
            const corePackagePath = playwrightRequire.resolve('playwright-core/package.json')
            const consumerPackage = readJson(testPackagePath)
            const consumerPlaywrightPackage = readJson(playwrightPackagePath)
            const consumerCorePackage = readJson(corePackagePath)
            const consumerManifestPath = join(dirname(corePackagePath), 'browsers.json')
            const consumerManifest = readJson(consumerManifestPath)
            const imagePackage = readJson(imagePackagePath)
            const imageManifest = readJson(imageManifestPath)
            const consumerManifestSha = digest(consumerManifestPath)
            const imageManifestSha = digest(imageManifestPath)
            const toolchainRevision = createHash('sha256')
              .update(`playwright@${imagePackage.version}:${imageManifestSha}`)
              .digest('hex')

            add('consumer package pin', declared)
            add('consumer @playwright/test', consumerPackage.version)
            add('consumer playwright', consumerPlaywrightPackage.version)
            add('consumer playwright-core', consumerCorePackage.version)
            add('image Playwright', imagePackage.version)
            add('consumer browsers.json SHA-256', consumerManifestSha)
            add('image browsers.json SHA-256', imageManifestSha)
            add('image toolchain revision', toolchainRevision)
            add('image source path', imageBrowsersRoot)
            add('job-visible path', process.env.PLAYWRIGHT_BROWSERS_PATH || '(unset)')

            if (declared !== consumerPackage.version) {
              fail(`@playwright/test must be pinned exactly as "${consumerPackage.version}" (found "${declared}")`)
            }
            const versions = new Set([
              consumerPackage.version,
              consumerPlaywrightPackage.version,
              consumerCorePackage.version,
              imagePackage.version,
            ])
            if (versions.size !== 1) {
              fail(`Playwright version mismatch: test=${consumerPackage.version}, runtime=${consumerPlaywrightPackage.version}, core=${consumerCorePackage.version}, image=${imagePackage.version}`)
            }
            if (consumerManifestSha !== imageManifestSha) {
              fail(`browser manifest mismatch: consumer=${consumerManifestSha}, image=${imageManifestSha}`)
            }

            const jobPath = process.env.PLAYWRIGHT_BROWSERS_PATH
            if (!jobPath || !isAbsolute(jobPath)) {
              fail('PLAYWRIGHT_BROWSERS_PATH must be the absolute image-backed path exported by the isolated guest')
            }
            const forbiddenRoots = [process.env.RUNNER_TEMP, process.env.GITHUB_WORKSPACE]
              .filter(Boolean)
              .map(path => resolve(path))
            const resolvedJobPath = resolve(jobPath)
            if (forbiddenRoots.some(root => beneath(resolvedJobPath, root))) {
              fail(`job-local PLAYWRIGHT_BROWSERS_PATH is forbidden on playwright-isolated: ${resolvedJobPath}`)
            }
            const allowedPrefix = resolve(process.env.PLAYWRIGHT_ALLOWED_BROWSER_PREFIX || '')
            if (!beneath(resolvedJobPath, allowedPrefix)) {
              fail(`PLAYWRIGHT_BROWSERS_PATH must live under ${allowedPrefix} on playwright-isolated: ${resolvedJobPath}`)
            }

            const requested = [...new Set((process.env.REQUIRED_BROWSERS || '').trim().split(/\s+/).filter(Boolean))]
            if (!requested.length) fail('e2e-browsers must name at least one required engine')
            const supported = {
              chromium: {
                manifestName: 'chromium-headless-shell',
                executableParts: ['chrome-headless-shell-linux64', 'chrome-headless-shell'],
              },
              webkit: {
                manifestName: 'webkit',
                executableParts: ['pw_run.sh'],
              },
            }
            const playwright = localRequire('@playwright/test')
            for (const engineName of requested) {
              const selection = supported[engineName]
              if (!selection) {
                fail(`unsupported isolated browser "${engineName}"; supported engines are chromium and webkit`)
              }
              const { manifestName, executableParts } = selection
              const expected = consumerManifest.browsers.find(item => item.name === manifestName)
              const observed = imageManifest.browsers.find(item => item.name === manifestName)
              if (!expected || !observed) fail(`${manifestName} is absent from a browser manifest`)
              add(`${engineName} expected`, `revision ${expected.revision}, ${expected.browserVersion ?? 'no upstream version'}`)
              add(`${engineName} image`, `revision ${observed.revision}, ${observed.browserVersion ?? 'no upstream version'}`)
              if (expected.revision !== observed.revision || expected.browserVersion !== observed.browserVersion) {
                fail(`${engineName} mismatch: consumer revision=${expected.revision} version=${expected.browserVersion}, image revision=${observed.revision} version=${observed.browserVersion}`)
              }

              const engine = playwright[engineName]
              if (!engine?.launch) fail(`@playwright/test does not expose ${engineName}`)
              const browserDirectory = `${manifestName.replaceAll('-', '_')}-${observed.revision}`
              const selected = join(jobPath, browserDirectory, ...executableParts)
              if (!selected || !existsSync(selected)) fail(`${engineName} executable is missing: ${selected || '(empty path)'}`)
              const realized = realpathSync(selected)
              if (!beneath(realized, imageBrowsersRoot)) {
                fail(`${engineName} executable escapes the immutable image tree: ${realized}`)
              }
              for (let path = realized; ; path = dirname(path)) {
                requireRootOwnedReadOnly(path, `${engineName} executable path`)
                if (path === imageBrowsersRoot) break
                if (path === dirname(path)) fail(`${engineName} executable ancestry did not reach ${imageBrowsersRoot}`)
              }
              add(`${engineName} executable`, realized)

              const browser = await engine.launch({ headless: true, executablePath: selected })
              try {
                const page = await browser.newPage()
                await page.setContent('<title>playwright-isolated-canary</title>')
                if (await page.title() !== 'playwright-isolated-canary') {
                  fail(`${engineName} launch canary returned the wrong page title`)
                }
              } finally {
                await browser.close()
              }
              add(`${engineName} launch canary`, 'passed')
            }

            add('status', 'PASS — exact image toolchain selected; no installer invoked')
            console.log(`Playwright toolchain matched image ${imagePackage.version} (${toolchainRevision})`)
          } catch (error) {
            add('status', `FAIL — ${error.message}`)
            console.error(`::error::Playwright toolchain mismatch: ${error.message}`)
            console.error('Upgrade the consumer to the pool-supported exact pin, or rebuild/promote the pool image through proxmox-playwright-ci; job-time download is forbidden.')
            process.exitCode = 1
          } finally {
            if (summary) {
              appendFileSync(summary, `### Isolated Playwright toolchain\n\n| Field | Observed |\n|---|---|\n${rows.join('\n')}\n`)
            }
          }
          NODE

      - name: Install Playwright browsers
        if: >-
          inputs.e2e-install-browsers
          && !contains(inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner, 'playwright-isolated')
          && !contains(inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner, 'proxmox-playwright-x64')
        # Anchored for the `preview` job's browser lane -- same text, not a copy.
        run: &install_playwright_browsers |
          set -euo pipefail
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec playwright install --with-deps ${{ inputs.e2e-browsers }}
          else
            npx playwright install --with-deps ${{ inputs.e2e-browsers }}
          fi

      - name: Run e2e suite
        env:
          GATE: Run e2e suite
          SCRIPT: ${{ inputs.e2e-script }}
          PM: ${{ inputs.package-manager }}
          SHARD: ${{ matrix.shard }}
          # The plan job's EFFECTIVE values, not `inputs.*` — the matrix this
          # job runs was fanned out from `shard-total`, so `--shard=<n>/<total>`
          # must use the same number or Playwright is told it is shard 1 of 3
          # while only one lane exists, and two thirds of the suite never runs
          # while the gate reports success (workflows#83).
          TOTAL: ${{ needs.e2e-plan.outputs.shard-total }}
          EXTRA_ARGS: ${{ needs.e2e-plan.outputs.e2e-args }}
          QUARANTINE_ARGS: ${{ inputs.e2e-quarantine-args }}
          E2E_PREBUILT_ARTIFACT: ${{ needs.build.outputs.e2e-build-path != '' && '1' || '' }}
          E2E_BUILD_ARTIFACT_PATH: ${{ needs.build.outputs.e2e-build-path }}
        run: |
          set -euo pipefail
          # Unlike optional build-lane scripts, run-e2e=true is an assertion
          # that this exact suite exists. Missing or empty is always fatal:
          # `require-scripts: false` must never turn an isolated browser job
          # into a green no-op.
          if [ -z "$SCRIPT" ]; then
            echo "::error::$GATE is enabled but e2e-script is empty"
            exit 1
          fi
          raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            msg="$GATE is enabled but no \"$SCRIPT\" script exists — this lane ran NOTHING"
            echo "- :x: $msg" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$msg"
            exit 1
          fi
          # The quarantine leg (`e2e-quarantine`) runs only the caller's
          # quarantine selection, unsharded, and never the gate's arguments.
          if [ "$SHARD" = quarantine ]; then
            TOTAL=1
            EXTRA_ARGS="$QUARANTINE_ARGS"
          fi
          ARGS=()
          # A single lane runs the suite exactly as before — no --shard, no
          # blob reporter, so a caller that never asked for sharding sees no
          # change in what runs or what it reports.
          if [ "$TOTAL" -gt 1 ]; then
            ARGS+=("--shard=${SHARD}/${TOTAL}" "--reporter=blob")
          fi
          # Deliberate word splitting: e2e-args is a caller-supplied argument
          # list, not a single argument.
          #
          # The directive below must be the bare `disable=` form on its own
          # line, and NO other comment line here may begin with the word
          # "shellcheck" — every such line is parsed as a directive. This one
          # previously carried a trailing `-- <explanation>`, which is not
          # parseable (SC1072/SC1073), so the directive was not applied AND the
          # checker bailed out of this entire script, silently taking the
          # run-block linting of the whole step with it. Caught by the
          # actionlint gate in ci.yml on its first run.
          # shellcheck disable=SC2206
          ARGS+=(${EXTRA_ARGS})
          if [ "$PM" = "pnpm" ]; then
            if [ ${#ARGS[@]} -gt 0 ]; then
              # pnpm forwards `--` to the package script, unlike npm. Keep
              # the wrapper contract identical for both package managers.
              pnpm run "$SCRIPT" "${ARGS[@]}"
            else
              pnpm run "$SCRIPT"
            fi
          else
            if [ ${#ARGS[@]} -gt 0 ]; then
              npm run "$SCRIPT" -- "${ARGS[@]}"
            else
              npm run "$SCRIPT"
            fi
          fi

      # STEP-level `always()` is deliberate and stays: capturing evidence is
      # the whole point of this step, and a step-level upload costs seconds, not
      # a runner slot. Do not "fix" it to `!cancelled()` by analogy with the
      # job-level change above — a job killed by `timeout-minutes` needs this to
      # run, and that is precisely the case where the evidence matters most.
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-shard name: upload-artifact v4+ rejects a duplicate artifact
          # name, so a fixed name would fail the moment a caller shards. The
          # quarantine leg's name must NOT match `E2E report`'s
          # `playwright-evidence-*` pattern, or its results would be merged
          # into the gate's report.
          name: ${{ matrix.shard == 'quarantine' && 'playwright-quarantine' || format('playwright-evidence-{0}', matrix.shard) }}
          path: |
            ${{ inputs.working-directory }}/blob-report
            ${{ inputs.working-directory }}/playwright-report
            ${{ inputs.working-directory }}/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Record quarantine result
        if: always() && matrix.shard == 'quarantine'
        env:
          STATUS: ${{ job.status }}
          ARGS: ${{ inputs.e2e-quarantine-args }}
        run: |
          {
            echo "### E2E quarantine (non-blocking)"
            echo
            echo "Result: **${STATUS}**, running \`${ARGS}\`. This lane never affects \`Required\`;"
            echo "the \`playwright-quarantine\` artifact holds the report."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != success ]; then
            echo "::warning::E2E quarantine lane: ${STATUS} (non-blocking)"
          fi

  # The non-blocking quarantine lane (`e2e-quarantine-args`). A separate job,
  # not a leg of `e2e`'s matrix: `Required` reads `needs.e2e.result`, and
  # only a job `Required` does not list can fail without any way of reaching
  # the gate. `continue-on-error` keeps a red leg from failing the caller's
  # run. The matrix exists only so the shared steps see
  # `matrix.shard == 'quarantine'`; GitHub renders the name `E2E (quarantine)`.
  e2e-quarantine:
    name: E2E
    if: inputs.run-e2e && inputs.e2e-quarantine-args != '' && needs.e2e-plan.outputs.skipped != 'true'
    needs: [build, e2e-plan]
    runs-on: ${{ fromJSON(inputs.e2e-runner != '' && inputs.e2e-runner || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"')) }}
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [quarantine]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps: *e2e_steps

  # Sharded runs produce N partial blob reports and no readable result. This
  # job is what turns them back into one HTML report — the merge step
  # status-apps, operator-portal and earthdata-viewer each hand-rolled.
  #
  # `!cancelled()` rather than `always()`, and the difference matters. The
  # intent is "still produce the report that explains WHY a shard failed", and
  # `!cancelled()` keeps exactly that — it is true on failure. What it drops is
  # the case `always()` also covered and nobody wanted: a run the user
  # CANCELLED, where this job would still claim a `linux-ci` slot to merge blob
  # reports from shards that were killed mid-suite. That is the job-level
  # `if: always()` waste pattern found on nvault (a diagnostic browser job held
  # a scarce pool slot after `Verify` had already failed, producing a result
  # that could not gate anything) — job-level `always()` is easy to miss because
  # gates that check for it usually look at steps.
  #
  # Safe for `ci / Required`: on a cancelled run this job reports `skipped`, and
  # `Required` (which must keep `always()`, or a cancelled run would leave the
  # required check permanently "Expected" — the company-hq#146 deadlock) already
  # treats `skipped` as acceptable for this job.
  e2e-report:
    name: E2E report
    # `shard-total`, not `inputs.e2e-shards`: with a pull-request shard
    # override there may be exactly one lane and therefore nothing to merge,
    # and `Required` below reads the same output, so the two agree by
    # construction rather than by two conditionals staying in step
    # (workflows#83). An unset/skipped plan leaves this empty, and an empty
    # string compares false against 1 — report skipped, which is what
    # `Required` then demands.
    if: "!cancelled() && inputs.run-e2e && needs.e2e-plan.outputs.shard-total > 1 && needs.e2e-plan.result == 'success' && needs.e2e-plan.outputs.skipped != 'true'"
    needs: [e2e-plan, e2e]
    # Merging is pure Node work with no browser — keep it off the scarce
    # isolated browser pool.
    # CI lightweight route (company-hq CI policy); caller override takes precedence.
    runs-on: ${{ fromJSON(github.event.repository.private == false && '"ubuntu-latest"' || inputs.lightweight-runner || vars.CI_LIGHTWEIGHT_RUNNER || (vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"') != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"'))) }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # This job never runs the app's own dependency tree — merge-reports is
      # pure `@playwright/test` tooling. `actions/checkout` is only here to
      # read the caller's pinned version out of package.json; there is no
      # `npm ci`/`pnpm install` in this job at all (workflows#49). Measured
      # before this change (operator-portal run 33887424724, cff1ff8b):
      # setup-node 22s + `npm ci` 23s to run a 1s merge, 57s job total.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # node-version and node-version-file are mutually exclusive on
          # setup-node (passing both is rejected), so resolve them as two
          # exclusive expressions: node-version-file wins when the caller
          # sets it, and node-version otherwise reproduces prior behaviour.
          node-version-file: ${{ inputs.node-version-file }}
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}

      - name: Resolve pinned @playwright/test version
        id: playwright-version
        run: |
          set -euo pipefail
          version=$(node -e '
            const pkg = require("./package.json")
            const version = (pkg.devDependencies && pkg.devDependencies["@playwright/test"])
              || (pkg.dependencies && pkg.dependencies["@playwright/test"])
              || ""
            process.stdout.write(version)
          ')
          if [ -z "$version" ]; then
            echo "::error::package.json has no @playwright/test dependency to pin merge-reports to"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::@playwright/test must be pinned to an exact version for E2E report (found \"$version\")"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ inputs.working-directory }}/all-blob-reports
          pattern: playwright-evidence-*
          merge-multiple: true

      - name: Merge blob reports
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright-version.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -d all-blob-reports/blob-report ]; then
            echo "::warning::no blob reports found to merge"
            exit 0
          fi
          # --package pulls only @playwright/test (and its transitive deps)
          # at the caller's exact pin — not the app's dependency tree — and
          # --yes skips npx's interactive install prompt in CI.
          npx --yes --package "@playwright/test@${PLAYWRIGHT_VERSION}" \
            playwright merge-reports --reporter html all-blob-reports/blob-report

      # STEP-level `always()` is deliberate and stays: capturing evidence is
      # the whole point of this step, and a step-level upload costs seconds, not
      # a runner slot. Do not "fix" it to `!cancelled()` by analogy with the
      # job-level change above — a job killed by `timeout-minutes` needs this to
      # run, and that is precisely the case where the evidence matters most.
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-merged
          path: ${{ inputs.working-directory }}/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # PREVIEW (V1; Logan, askme round 2026-09-17, "Post URL + run the PR subset
  # on it (Recommended)"; company-hq#745, company-hq D-ORG-1 (g), 2026-09-02).
  #
  # WHAT CLOUDFLARE ACTUALLY EXPOSES. Workers Builds' GitHub App creates check
  # runs, commit statuses and a pull request comment, and "a preview URL will
  # be provided for any builds which perform `wrangler versions upload`"
  # (developers.cloudflare.com/workers/ci-cd/builds/git-integration/github-integration/).
  # It does NOT create a GitHub Deployment -- that is the Pages integration's
  # shape -- so there is no `environment_url` to read and this job does not
  # pretend there is. The two sources it offers are the comment Cloudflare
  # posts, and a caller-supplied URL template that needs no GitHub read at all.
  #
  # THE URL IS NOT THE PROOF. A preview URL appearing in a comment says a build
  # was attempted, not that the PR's head commit is what is actually serving.
  # So the wait below is not satisfied until the URL itself answers and its
  # `x-build-version` header is a prefix of the PR head SHA. That header is the
  # estate's existing live-proof convention (buoys docs/workers-builds.md, which
  # records `x-build-version: a84fa2163903` for commit a84fa216390321...), and it
  # is compared BY PREFIX because Cloudflare emits a 12-character short SHA
  # while `git rev-parse --short` defaults to 7 -- a fixed-width comparison
  # would be a gate that never passes or, worse, one somebody "fixes" by
  # deleting it.
  #
  # FAIL CLOSED. A preview that never appears inside the bound is a FAILURE,
  # not a skip. "The preview never showed up" is the single most common way a
  # Workers Builds connection silently breaks, and it is indistinguishable from
  # "this repo does not use previews" only if you refuse to make the caller say
  # which it is -- which is what `preview-checks: none` is for.
  #
  # RUNNER CLASS. Lightweight (the `caller-lint` / `E2E plan` route) unless the
  # caller selected `e2e-subset`, which needs a browser guest and therefore the
  # `e2e-runner` route. The isolated-pool preflight it runs there is the SAME
  # YAML node as the `e2e` job's, via anchors, not a second copy: an
  # image-equality gate that exists twice is an image-equality gate that drifts.
  # Callers should note that with `e2e-subset` selected the bounded wait holds a
  # `playwright-isolated` slot (three effective slots across ~ten repos), which
  # is why `preview-timeout-minutes` is a caller input and why `og` is the
  # default.
  preview:
    name: Preview
    if: >-
      inputs.preview-checks != 'none'
      && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
    needs: build
    runs-on: ${{ fromJSON(contains(inputs.preview-checks, 'e2e-subset') && (inputs.e2e-runner != '' && inputs.e2e-runner || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"')) || (github.event.repository.private == false && '"ubuntu-latest"' || inputs.lightweight-runner || vars.CI_LIGHTWEIGHT_RUNNER || (vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"') != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"')))) }}
    timeout-minutes: ${{ inputs.preview-timeout-minutes }}
    # `pull-requests: write` is a WIDENING of this callable's caller grant and
    # is the reason this change cannot ship onto a moving `v1` until every
    # adopter has granted it -- see README "Preview checks". A called workflow
    # asking for a permission its caller did not grant kills the caller's whole
    # run at startup with no logs (workflows#59). Write, not read, because the
    # same grant both reads Cloudflare's comment and updates the sticky one.
    permissions:
      contents: read
      packages: read
      pull-requests: write
    env:
      # Dependency installation must never acquire a browser as a side effect;
      # the anchored installer below stays the only download path, and it is
      # unreachable on the isolated route.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rejects a mistyped selection BEFORE spending a runner on it. `og` and
      # `e2e-subset` are the only checks; `none` is exclusive; and
      # `url-template` without a template is a configuration error, not an
      # empty URL to wait for.
      - name: Validate preview configuration
        env:
          CHECKS: ${{ inputs.preview-checks }}
          SOURCE: ${{ inputs.preview-url-source }}
          TEMPLATE: ${{ inputs.preview-url-template }}
        run: |
          set -euo pipefail
          known="og e2e-subset"
          selected=""
          IFS=','
          for raw in $CHECKS; do
            check="$(printf '%s' "$raw" | tr -d '[:space:]')"
            [ -z "$check" ] && continue
            if [ "$check" = "none" ]; then
              # Reached only when the job's own `inputs.preview-checks != 'none'`
              # condition already let the lane start, i.e. 'none' was not the
              # exact whole value -- either it has company, or it has padding.
              echo "::error::preview-checks must be exactly 'none' to turn the lane off, with no other values and no surrounding whitespace (got '$CHECKS')"
              exit 1
            fi
            case " $known " in
              *" $check "*) selected="$selected $check" ;;
              *)
                echo "::error::preview-checks contains unknown check '$check' (known: none, og, e2e-subset)"
                exit 1
                ;;
            esac
          done
          unset IFS
          if [ -z "$selected" ]; then
            echo "::error::preview-checks resolved to no checks at all ('$CHECKS') -- pass 'none' to turn the preview lane off"
            exit 1
          fi
          case "$SOURCE" in
            pr-comment) ;;
            url-template)
              if [ -z "$TEMPLATE" ]; then
                echo "::error::preview-url-source is 'url-template' but preview-url-template is empty"
                exit 1
              fi
              ;;
            *)
              echo "::error::preview-url-source must be 'pr-comment' or 'url-template' (got '$SOURCE')"
              exit 1
              ;;
          esac
          echo "preview checks:$selected; url source: $SOURCE"

      # BEFORE dependency installation, exactly as in the e2e job: once an
      # install has run, a browser could already have been acquired and the
      # guard would be auditing state it no longer controls. Same anchored text.
      - name: Guard isolated Playwright route
        if: contains(inputs.preview-checks, 'e2e-subset')
        env:
          BROWSERS_OVERRIDE: ${{ inputs.e2e-browsers-path }}
          INSTALL_BROWSERS: ${{ inputs.e2e-install-browsers }}
          ROUTE: ${{ inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner }}
        run: *guard_isolated_playwright_route

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          package-manager-cache: false

      - name: Configure package registry auth
        if: inputs.install-script == ''
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: *configure_package_registry_auth

      - name: Point pnpm at a workspace-local store (self-hosted)
        if: runner.environment == 'self-hosted' && inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          mount_point=$(df --output=target "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$mount_point" != "/" ] && [ -d "$mount_point/pnpm-store" ] && [ -w "$mount_point/pnpm-store" ]; then
            echo "npm_config_store_dir=$mount_point/pnpm-store" >> "$GITHUB_ENV"
          fi

      # The preview lane installs because both checks run the CALLER's own
      # toolchain: `og:check` comes from the caller's pinned
      # @narduk-enterprises/narduk-app-tools, and the e2e subset is the caller's
      # own Playwright suite. Resolving the tool a second way here would be a
      # second credential path and a second version to keep in step.
      - name: Install dependencies (pnpm)
        if: inputs.install-script == '' && inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null
      - name: Install dependencies (npm)
        if: inputs.install-script == '' && inputs.package-manager == 'npm'
        run: npm ci
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null
      - name: Remove package auth materialization
        if: always() && inputs.install-script == ''
        run: rm -f "${GITHUB_WORKSPACE}/${{ inputs.working-directory }}/.npmrc.auth"
      - name: Install dependencies (caller script)
        if: inputs.install-script != ''
        env:
          INSTALL_SCRIPT: ${{ inputs.install-script }}
          NVAULT_TOKEN: ${{ secrets.NVAULT_TOKEN || (inputs.foundation-check-auth == 'nvault' && secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || '') }}
          # Dependabot runs see no Actions-only NVAULT_TOKEN. Only then, map the
          # org package-read secret to GH_PACKAGES_READ (workflows#98).
          GH_PACKAGES_READ: ${{ !secrets.NVAULT_TOKEN && inputs.foundation-check-auth != 'nvault' && secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || '' }}
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$INSTALL_SCRIPT" in
            ''|*[!A-Za-z0-9:_-]*)
              echo "::error::install-script must be one package.json script name"
              exit 1
              ;;
          esac
          raw=$(npm pkg get "scripts.$INSTALL_SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            echo "::error::install-script names \"$INSTALL_SCRIPT\" but no such script exists"
            exit 1
          fi
          "$PM" run "$INSTALL_SCRIPT"

      # Same anchored image-equality assertion the e2e job runs, on the same
      # isolated-route condition, and before anything launches a browser.
      - name: Assert isolated Playwright toolchain
        if: >-
          contains(inputs.preview-checks, 'e2e-subset')
          && (contains(inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner, 'playwright-isolated')
          || contains(inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner, 'proxmox-playwright-x64'))
        env:
          PLAYWRIGHT_ALLOWED_BROWSER_PREFIX: /opt
          PLAYWRIGHT_TOOLCHAIN_OWNER_UID: "0"
          PLAYWRIGHT_TOOLCHAIN_ROOT: /opt/playwright-ci
          REQUIRED_BROWSERS: ${{ inputs.e2e-browsers }}
        run: *assert_isolated_playwright_toolchain

      - name: Resolve and verify preview deployment
        id: preview
        env:
          SOURCE: ${{ inputs.preview-url-source }}
          TEMPLATE: ${{ inputs.preview-url-template }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BUDGET_MINUTES: ${{ inputs.preview-timeout-minutes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF_PREVIEW'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          WORKERS_DEV = re.compile(
              r"https://[A-Za-z0-9][A-Za-z0-9.-]*\.workers\.dev(?:/[^\s)\]<>\"']*)?"
          )

          head_sha = (os.environ.get("HEAD_SHA") or "").strip().lower()
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              print(
                  "::error::this job resolved no pull-request head SHA -- it runs on "
                  "pull_request/pull_request_target events only"
              )
              raise SystemExit(1)
          short_sha = head_sha[:12]

          # The wait is the JOB budget minus five minutes, so the selected
          # checks and the sticky comment still have room after it. Below a
          # six-minute budget the whole budget is the wait -- a caller that
          # small has said it wants the wait and nothing else.
          budget = int(float(os.environ.get("BUDGET_MINUTES") or 20) * 60)
          wait_seconds = max(1, budget - 300) if budget > 300 else max(1, budget)
          # Derived, not configurable: a small budget must still get several
          # reads, and a large one must not hammer the API.
          poll_seconds = min(15, max(1, wait_seconds // 10))

          def branch_alias(ref: str) -> str:
              alias = re.sub(r"[^a-z0-9]+", "-", ref.lower()).strip("-")
              return alias

          def templated_url() -> str:
              template = os.environ.get("TEMPLATE") or ""
              return (
                  template.replace("{branch-alias}", branch_alias(os.environ.get("HEAD_REF") or ""))
                  .replace("{branch}", os.environ.get("HEAD_REF") or "")
                  .replace("{sha}", short_sha)
              )

          seen_authors: set[str] = set()

          def commented_url() -> str:
              """One read of the PR's comments; the Cloudflare app's URL or ''."""
              try:
                  raw = subprocess.run(
                      [
                          "gh", "api", "--paginate",
                          f"repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",
                          "--jq", ".[] | {login: .user.login, body: .body}",
                      ],
                      capture_output=True, text=True, timeout=60, check=True,
                  ).stdout
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                  stderr = getattr(exc, "stderr", "") or ""
                  print(f"::warning::could not read pull-request comments this round: {stderr.strip()[:200]}")
                  return ""
              for line in raw.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      comment = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  login = str(comment.get("login") or "")
                  seen_authors.add(login)
                  if "cloudflare" not in login.lower():
                      continue
                  match = WORKERS_DEV.search(str(comment.get("body") or ""))
                  if match:
                      return match.group(0)
              return ""

          def probe(url: str):
              """One HTTP read: (status, x-build-version) or (None, reason)."""
              request = urllib.request.Request(url, method="GET", headers={"user-agent": "narduk-ci-preview"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, (response.headers.get("x-build-version") or "").strip()
              except urllib.error.HTTPError as exc:
                  return exc.code, (exc.headers.get("x-build-version") or "").strip() if exc.headers else ""
              except Exception as exc:  # noqa: BLE001 -- any transport failure is "not ready yet"
                  return None, str(exc)

          source = os.environ.get("SOURCE") or "pr-comment"
          if source == "url-template" and not templated_url().lower().startswith("https://"):
              print("::warning::preview-url-template does not resolve to an https URL")

          deadline = time.monotonic() + wait_seconds
          url = ""
          last = "no attempt completed"
          attempts = 0
          while True:
              attempts += 1
              url = templated_url() if source == "url-template" else commented_url()
              if not url:
                  last = "no preview URL has been published for this pull request yet"
              else:
                  status, version = probe(url)
                  if status is None:
                      last = f"{url} is not answering yet ({version})"
                  elif status >= 400:
                      last = f"{url} returned HTTP {status}"
                  elif not version:
                      last = f"{url} returned HTTP {status} but no x-build-version header"
                  elif len(version) < 7 or not head_sha.startswith(version.lower()):
                      last = (
                          f"{url} is serving build {version}, not this pull request's head "
                          f"{short_sha} -- the preview build for this commit has not finished"
                      )
                  else:
                      with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                          handle.write(f"url={url}\n")
                          handle.write(f"build-version={version}\n")
                          handle.write(f"head-sha={short_sha}\n")
                      print(f"preview {url} is serving x-build-version {version} (head {short_sha}) after {attempts} read(s)")
                      raise SystemExit(0)
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  break
              print(f"waiting for preview ({attempts}): {last}")
              time.sleep(min(poll_seconds, remaining))

          print(f"::error::preview deployment did not become ready within {wait_seconds}s: {last}")
          if source == "pr-comment" and not url:
              print(
                  "::error::no comment from Cloudflare's GitHub App carried a "
                  f"*.workers.dev URL (comment authors seen: {sorted(seen_authors) or 'none'}). "
                  "A repository without Workers Builds previews must pass "
                  "`preview-checks: none` rather than leave this failing."
              )
          sys.exit(1)
          PYEOF_PREVIEW

      - name: Install Playwright browsers
        if: >-
          contains(inputs.preview-checks, 'e2e-subset')
          && inputs.e2e-install-browsers
          && !contains(inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner, 'playwright-isolated')
          && !contains(inputs.e2e-runner != '' && inputs.e2e-runner || inputs.runner, 'proxmox-playwright-x64')
        run: *install_playwright_browsers

      # `!cancelled()` rather than the implicit `success()`: when og:check fails
      # the e2e subset must still run and the sticky comment must still report
      # both, otherwise the first red check hides the second one for the whole
      # review. Both are still gated on a resolved URL, so neither runs against
      # nothing.
      - name: Check preview social previews (og:check --live)
        id: og-check
        if: ${{ !cancelled() && contains(inputs.preview-checks, 'og') && steps.preview.outputs.url != '' }}
        working-directory: ${{ inputs.preview-working-directory != '' && inputs.preview-working-directory || inputs.working-directory }}
        env:
          PM: ${{ inputs.package-manager }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          # The caller's OWN pinned @narduk-enterprises/narduk-app-tools, run
          # out of the install this job just did. No second version pin and no
          # second credential path: `foundation-check`'s dlx fallback exists
          # because that gate must work for callers who have not adopted the
          # package at all, which is not true here -- `preview-checks: og` is a
          # caller asserting it has the tool.
          if [ "$PM" = "pnpm" ]; then
            pnpm exec narduk-app og:check --live --base-url "$PREVIEW_URL"
          else
            npx --no-install narduk-app og:check --live --base-url "$PREVIEW_URL"
          fi

      - name: Run preview e2e subset
        id: preview-e2e
        if: ${{ !cancelled() && contains(inputs.preview-checks, 'e2e-subset') && steps.preview.outputs.url != '' }}
        working-directory: ${{ inputs.preview-working-directory != '' && inputs.preview-working-directory || inputs.working-directory }}
        env:
          GATE: Run preview e2e subset
          SCRIPT: ${{ inputs.e2e-script }}
          PM: ${{ inputs.package-manager }}
          # The PULL-REQUEST argument set (workflows#83, buoys#116): the caller
          # owns what "the subset" means through its own Playwright project
          # selection, and this workflow never guesses. Empty is a hard failure
          # rather than a silent full-suite run against a shared preview.
          EXTRA_ARGS: ${{ inputs.e2e-pr-args }}
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "$SCRIPT" ]; then
            echo "::error::$GATE is enabled but e2e-script is empty"
            exit 1
          fi
          if [ -z "$EXTRA_ARGS" ]; then
            echo "::error::$GATE is enabled but e2e-pr-args is empty -- name the pull-request project (e.g. --project=pr) rather than running the whole suite against a shared preview"
            exit 1
          fi
          raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            msg="$GATE is enabled but no \"$SCRIPT\" script exists — this lane ran NOTHING"
            echo "- :x: $msg" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$msg"
            exit 1
          fi
          echo "running against PLAYWRIGHT_BASE_URL=$PLAYWRIGHT_BASE_URL"
          ARGS=()
          # Deliberate word splitting: e2e-pr-args is a caller-supplied argument
          # list, not a single argument.
          # shellcheck disable=SC2206
          ARGS+=(${EXTRA_ARGS})
          if [ "$PM" = "pnpm" ]; then
            pnpm run "$SCRIPT" "${ARGS[@]}"
          else
            npm run "$SCRIPT" -- "${ARGS[@]}"
          fi

      # ONE comment, edited in place. `always()` because the most valuable
      # comment is the one on a run where the preview never appeared: a lane
      # that only reports when it is green is a lane nobody notices going away.
      - name: Post or update the sticky preview comment
        if: always()
        env:
          MARKER: "<!-- narduk-ci:preview -->"
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          BUILD_VERSION: ${{ steps.preview.outputs.build-version }}
          HEAD_SHORT: ${{ steps.preview.outputs.head-sha }}
          RESOLVE_OUTCOME: ${{ steps.preview.outcome }}
          OG_OUTCOME: ${{ steps.og-check.outcome }}
          E2E_OUTCOME: ${{ steps.preview-e2e.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF_COMMENT'
          import json
          import os
          import subprocess
          import sys
          import tempfile

          marker = os.environ["MARKER"]
          icons = {
              "success": ":white_check_mark: pass",
              "failure": ":x: FAIL",
              "cancelled": ":grey_question: cancelled",
              "skipped": ":heavy_minus_sign: not selected",
              "": ":heavy_minus_sign: not run",
          }

          def row(label: str, outcome: str) -> str:
              return f"| {label} | {icons.get(outcome, outcome)} |"

          url = os.environ.get("PREVIEW_URL") or ""
          version = os.environ.get("BUILD_VERSION") or ""
          head = os.environ.get("HEAD_SHORT") or ""
          lines = [marker, "", "### Cloudflare preview", ""]
          if url:
              lines += [
                  f"**URL:** {url}",
                  "",
                  f"**Serving build:** `{version}` (pull-request head `{head}`)",
                  "",
              ]
          else:
              lines += [
                  ":x: **No preview deployment became ready for this commit inside the "
                  "configured wait.** A repository without Workers Builds previews should "
                  "pass `preview-checks: none`.",
                  "",
              ]
          lines += [
              "| Check | Result |",
              "|---|---|",
              row("preview ready + `x-build-version`", os.environ.get("RESOLVE_OUTCOME", "")),
              row("`og:check --live`", os.environ.get("OG_OUTCOME", "")),
              row("e2e subset against the preview", os.environ.get("E2E_OUTCOME", "")),
              "",
              f"[Workflow run]({os.environ['RUN_URL']})",
              "",
          ]
          body = "\n".join(lines)

          # The same table also goes to the job summary, so the URL and the
          # verdicts survive even when the comment API call does not.
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines[2:]) + "\n")

          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]

          def gh(args, check=True):
              return subprocess.run(["gh", *args], capture_output=True, text=True, timeout=60, check=check)

          # FIND BY MARKER, then EDIT. Appending a new comment every run is how
          # a PR ends up with fourteen preview comments and reviewers reading
          # the wrong one.
          existing = ""
          try:
              listed = gh(["api", "--paginate", f"repos/{repo}/issues/{pr}/comments",
                           "--jq", ".[] | {id: .id, body: .body}"]).stdout
              for line in listed.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      comment = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if marker in str(comment.get("body") or ""):
                      existing = str(comment.get("id"))
                      break
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
              print(f"::warning::could not list pull-request comments: {(getattr(exc, 'stderr', '') or '').strip()[:200]}")

          with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False, encoding="utf-8") as handle:
              handle.write(body)
              body_file = handle.name

          if existing:
              args = ["api", "-X", "PATCH", f"repos/{repo}/issues/comments/{existing}", "-F", f"body=@{body_file}"]
              action = f"updated comment {existing}"
          else:
              args = ["api", "-X", "POST", f"repos/{repo}/issues/{pr}/comments", "-F", f"body=@{body_file}"]
              action = "posted a new comment"
          result = gh(args, check=False)
          if result.returncode != 0:
              print(f"::warning::could not post the preview comment: {result.stderr.strip()[:300]}")
              sys.exit(0)
          print(f"preview comment {action}")
          PYEOF_COMMENT

  deploy-dry-run:
    name: Deploy dry run
    if: inputs.wrangler-dry-run
    needs: build
    # Blacksmith overflow (see the block above this file's first routed job) -- D-CI-CAP-1 (c)/D-BLACKSMITH-2, fleet#337.
    runs-on: ${{ fromJSON(vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"') != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"')) }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # node-version and node-version-file are mutually exclusive on
          # setup-node (passing both is rejected), so resolve them as two
          # exclusive expressions: node-version-file wins when the caller
          # sets it, and node-version otherwise reproduces prior behaviour.
          node-version-file: ${{ inputs.node-version-file }}
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          # v7 caches the package manager BY DEFAULT (`package-manager-cache`
          # defaults to true) — dropping the `cache:` input does NOT turn it
          # off. Without this line the explicit restore/save below is a SECOND
          # cache running alongside the built-in one, and the `Post Run
          # actions/setup-node` tar the split was meant to remove is still
          # there: measured 27s on marketing-web `Build` after the split, on
          # top of a 22s explicit save. Two caches for one dependency tree is
          # strictly worse than the one it replaced.
          package-manager-cache: false

      # Dependency cache: restore everywhere, write only on the default branch
      # (company-hq#269). `setup-node`'s built-in `cache:` writes a fresh
      # tarball on every key MISS, scoped to the ref the job ran on — and a
      # cache written on `refs/pull/N/merge` is restorable only by that same
      # pull request. Every lockfile-changing PR therefore paid a `Post Run
      # actions/setup-node` tar to produce an entry nothing would ever read,
      # and the merge to `main` paid the identical tar again. Measured before
      # this change: 19s on marketing-web `Build`, a 67s job. Restoring on
      # every ref keeps the win — a PR falls back through `restore-keys` to
      # the default-branch entry, which is the one it actually wants.
      - name: Resolve dependency cache directory
        id: dep-cache-dir
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm config set store-dir "$GITHUB_WORKSPACE/.cache/pnpm-store"
            echo "path=.cache/pnpm-store" >> "$GITHUB_OUTPUT"
          else
            npm config set cache "$GITHUB_WORKSPACE/.cache/npm"
            echo "path=.cache/npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependency cache
        id: dep-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-

      - name: Configure package registry auth
        if: inputs.install-script == ''
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: *configure_package_registry_auth

      # Store placement, same reasoning as the `build` job above: on a
      # self-hosted guest the workspace is on its own volume and pnpm's default
      # store is not, so every install copies instead of hard-linking. See the
      # full comment there.
      - name: Point pnpm at a workspace-local store (self-hosted)
        if: runner.environment == 'self-hosted' && inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          mount_point=$(df --output=target "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$mount_point" = "/" ]; then
            echo "workspace is on the root filesystem; pnpm's default store already shares its device"
            exit 0
          fi
          store="$mount_point/pnpm-store"
          if [ ! -d "$store" ] || [ ! -w "$store" ]; then
            echo "no writable store at $store; keeping pnpm's default store (installs will copy, not link)"
            exit 0
          fi
          echo "npm_config_store_dir=$store" >> "$GITHUB_ENV"
          echo "pnpm store -> $store (same filesystem as $GITHUB_WORKSPACE)"

      - name: Install dependencies (pnpm)
        if: inputs.install-script == '' && inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Install dependencies (npm)
        if: inputs.install-script == '' && inputs.package-manager == 'npm'
        run: npm ci
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      # Exact-path cleanup after install on every outcome; dry-run validation
      # uses local node_modules and must not leave registry credentials on a
      # persistent guest when install fails or the job is cancelled.
      - name: Remove package auth materialization
        if: always() && inputs.install-script == ''
        run: rm -f "${GITHUB_WORKSPACE}/${{ inputs.working-directory }}/.npmrc.auth"

      - name: Install dependencies (caller script)
        if: inputs.install-script != ''
        env:
          INSTALL_SCRIPT: ${{ inputs.install-script }}
          NVAULT_TOKEN: ${{ secrets.NVAULT_TOKEN || (inputs.foundation-check-auth == 'nvault' && secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || '') }}
          # Dependabot runs see no Actions-only NVAULT_TOKEN. Only then, map the
          # org package-read secret to GH_PACKAGES_READ (workflows#98).
          GH_PACKAGES_READ: ${{ !secrets.NVAULT_TOKEN && inputs.foundation-check-auth != 'nvault' && secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || '' }}
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$INSTALL_SCRIPT" in
            ''|*[!A-Za-z0-9:_-]*)
              echo "::error::install-script must be one package.json script name"
              exit 1
              ;;
          esac
          raw=$(npm pkg get "scripts.$INSTALL_SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            echo "::error::install-script names \"$INSTALL_SCRIPT\" but no such script exists"
            exit 1
          fi
          "$PM" run "$INSTALL_SCRIPT"

      - name: Validate Worker bundle (dry run)
        working-directory: ${{ inputs.wrangler-working-directory != '' && inputs.wrangler-working-directory || inputs.working-directory }}
        run: |
          set -euo pipefail
          ARGS=(deploy --dry-run)
          if [ -n "${{ inputs.wrangler-env }}" ]; then
            ARGS+=(--env "${{ inputs.wrangler-env }}")
          fi
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec wrangler "${ARGS[@]}"
          else
            npx wrangler "${ARGS[@]}"
          fi

  caller-lint:
    name: Caller lint
    # Audits the CALLING repository's OWN .github/workflows -- not this
    # callable -- for the same baseline hygiene this repo's ci.yml enforces
    # on itself: workflow-level concurrency, per-job timeouts, SHA-pinned
    # actions, and permissions blocks (Logan, 2026-09-17 askme round,
    # "Caller lint + job timeouts in workflows (Recommended)";
    # company-hq#745). A job whose only step is `uses:` a reusable workflow
    # cannot declare a job-level timeout-minutes at all -- the called
    # workflow's own jobs own that -- so the inline audit below treats that
    # case as informational, not a finding (the same fix landed in
    # agent-infrastructure skills/ci-workflow-author/scripts/audit_workflows.py
    # for its own missing-timeout rule, which used to flag it as a false
    # positive).
    #
    # Same lightweight route as E2E plan/report and Required (company-hq CI
    # policy) -- this job does no build work, only lint over the caller's own
    # checkout.
    runs-on: ${{ fromJSON(github.event.repository.private == false && '"ubuntu-latest"' || inputs.lightweight-runner || vars.CI_LIGHTWEIGHT_RUNNER || (vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"') != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"'))) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This step imports PyYAML. Hosted images currently include it, but
      # keep the checked fallback so a runner-image update cannot silently
      # remove a required parser (mirrors ci.yml's own "Ensure PyYAML is
      # available" step).
      - name: Ensure PyYAML is available
        run: |
          set -euo pipefail
          if python3 -c "import yaml" 2>/dev/null; then
            echo "PyYAML already available"
          else
            echo "PyYAML missing on this guest; installing into user site-packages"
            python3 -m pip install --user --quiet pyyaml
            python3 -c "import yaml" || { echo "::error::PyYAML still unavailable after install"; exit 1; }
          fi

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          # Pinned version + checksum rather than `curl | bash` from the
          # project's install script (same pin ci.yml uses for its own
          # actionlint install -- keep both in sync on a bump).
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint -version

      - name: actionlint (caller's own workflows)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no workflow files found under .github/workflows; nothing to lint"
            exit 0
          fi
          ./actionlint -no-color "${files[@]}"

      - name: Caller workflow hygiene audit (concurrency, timeouts, SHA pins, permissions)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF_AUDIT'
          import glob
          import re
          import sys

          import yaml

          SHA_PIN = re.compile(r"^[0-9a-f]{40}$")
          USES_LINE = re.compile(r"^\s*(?:-\s*)?uses:\s*(\S+)\s*(#.*)?$")
          LOCAL_USES = ("./", "docker://")

          files = sorted(
              glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")
          )
          if not files:
              print("no caller workflow files found under .github/workflows; nothing to audit")
              sys.exit(0)

          findings = []

          for path in files:
              text = open(path, encoding="utf-8").read()
              try:
                  doc = yaml.safe_load(text)
              except yaml.YAMLError as exc:
                  findings.append(f"{path}: does not parse as YAML ({exc})")
                  continue
              if not isinstance(doc, dict):
                  findings.append(f"{path}: does not parse as a YAML mapping")
                  continue

              # PyYAML parses the bare key `on:` as the boolean True.
              on = doc.get("on", doc.get(True))
              if isinstance(on, str):
                  on_keys = {on}
              elif isinstance(on, list):
                  on_keys = set(on)
              elif isinstance(on, dict):
                  on_keys = set(on.keys())
              else:
                  on_keys = set()
              # A workflow_call-only file is a callable, not a caller: its concurrency
              # group would be evaluated in ITS OWN caller's context and could cancel
              # that caller's run, so it must not declare one (the reason this repo's
              # own callables never do -- see README "Concurrency is the caller's job").
              is_callable_only = bool(on_keys) and on_keys.issubset({"workflow_call"})

              if not is_callable_only and doc.get("concurrency") is None:
                  findings.append(
                      f"{path}: no workflow-level concurrency: block (repeated "
                      "pushes/PR updates queue redundant runs instead of superseding "
                      "them)"
                  )

              if doc.get("permissions") is None:
                  findings.append(f"{path}: no top-level permissions: block")

              for job_id, job in (doc.get("jobs") or {}).items():
                  if not isinstance(job, dict):
                      continue
                  # A job whose only step is `uses:` a reusable workflow cannot
                  # declare timeout-minutes at all -- the called workflow's own jobs
                  # own that. Report it as information, not a finding.
                  if "uses" in job:
                      print(
                          f"::notice::{path}: job '{job_id}' uses {job['uses']!r} -- "
                          "its timeout lives in the called workflow, not here"
                      )
                  elif job.get("timeout-minutes") is None:
                      findings.append(
                          f"{path}: job '{job_id}' has no timeout-minutes (would "
                          "inherit GitHub's 6-hour default)"
                      )
                  if job.get("permissions") is None:
                      findings.append(
                          f"{path}: job '{job_id}' has no permissions: block (job "
                          "level replaces, never merges, the workflow level)"
                      )

              for lineno, line in enumerate(text.splitlines(), start=1):
                  m = USES_LINE.match(line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if ref.startswith(LOCAL_USES):
                      continue
                  if "@" not in ref:
                      findings.append(f"{path}:{lineno}: `uses: {ref}` has no ref at all")
                      continue
                  pin = ref.rsplit("@", 1)[1]
                  if not SHA_PIN.match(pin):
                      findings.append(
                          f"{path}:{lineno}: `uses: {ref}` is not pinned to a full "
                          "40-character commit SHA"
                      )

          for item in findings:
              print(f"::error::{item}")

          print(f"\ncaller-lint: {len(files)} file(s) checked, {len(findings)} finding(s)")
          sys.exit(1 if findings else 0)
          PYEOF_AUDIT
  required:
    name: Required
    if: always()
    needs: [build, checks, extra-gate, e2e-plan, e2e, e2e-report, preview, deploy-dry-run, caller-lint]
    # Organization-wide lightweight route; unset preserves the caller fallback.
    runs-on: ${{ fromJSON(github.event.repository.private == false && '"ubuntu-latest"' || inputs.lightweight-runner || vars.CI_LIGHTWEIGHT_RUNNER || (vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"') != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"'))) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require enabled gates to succeed and disabled gates to skip
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_PLAN_RESULT: ${{ needs.e2e-plan.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_REPORT_RESULT: ${{ needs.e2e-report.result }}
          DEPLOY_DRY_RUN_RESULT: ${{ needs.deploy-dry-run.result }}
          EXTRA_GATE_RESULT: ${{ needs.extra-gate.result }}
          CALLER_LINT_RESULT: ${{ needs.caller-lint.result }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          PREVIEW_CHECKS: ${{ inputs.preview-checks }}
          # The preview lane exists only where a pull-request preview does.
          EVENT_NAME: ${{ github.event_name }}
          RUN_E2E: ${{ inputs.run-e2e }}
          # The plan job's EFFECTIVE shard count, falling back to the input
          # when the plan produced no output at all (it was skipped, or it
          # failed before writing one). The fallback keeps this aggregation
          # readable in exactly the states where it must still be able to go
          # red, and the numeric guard below rejects anything that is not a
          # count rather than letting `-gt` abort the whole gate under
          # `set -e` (workflows#83).
          E2E_SHARDS: ${{ needs.e2e-plan.outputs.shard-total || inputs.e2e-shards }}
          E2E_PLAN_SKIPPED: ${{ needs.e2e-plan.outputs.skipped }}
          RUN_DEPLOY_DRY_RUN: ${{ inputs.wrangler-dry-run }}
        run: |
          set -euo pipefail
          status=0
          # build has no `if:` — it must always report success.
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 job reported '$2' (must succeed)"
              status=1
            fi
          }
          require_skipped() {
            if [ "$2" != "skipped" ]; then
              echo "::error::$1 job reported '$2' while disabled (must be skipped)"
              status=1
            fi
          }
          require_success build "$BUILD_RESULT"
          require_success checks "$CHECKS_RESULT"
          # caller-lint has no `if:` -- it always runs, same as build.
          require_success caller-lint "$CALLER_LINT_RESULT"
          if [ -n "${{ inputs.extra-gate-scripts }}" ]; then
            require_success extra-gate "$EXTRA_GATE_RESULT"
          elif [ "$EXTRA_GATE_RESULT" != "skipped" ]; then
            echo "::error::extra-gate reported '$EXTRA_GATE_RESULT' while not configured"
            status=1
          fi
          # A skipped enabled gate is a failure, not a success substitute. This
          # is especially important for the toolchain assertion inside e2e: a
          # workflow-expression mistake must not turn "never checked" green.
          if [ "$RUN_E2E" = "true" ]; then
            require_success e2e-plan "$E2E_PLAN_RESULT"
            # e2e-skip-paths (workflows#49): the plan job itself must still
            # succeed — it made the skip decision — but a docs-only diff
            # that the plan skipped must show E2E and E2E report as
            # `skipped`, not absent, so `Required` still gates them.
            if [ "$E2E_PLAN_SKIPPED" = "true" ]; then
              require_skipped e2e "$E2E_RESULT"
              require_skipped e2e-report "$E2E_REPORT_RESULT"
            else
              require_success e2e "$E2E_RESULT"
              # Fail closed on a shard count that is not a count. `set -e`
              # does NOT rescue this: it is disabled inside an `if`
              # condition, so `[ "" -gt 1 ]` prints "integer expected" to
              # stderr, returns 2, and takes the `else` branch -- which
              # expects `e2e-report` to be SKIPPED, finds it skipped, and
              # exits 0. Proven by deleting these four lines: the empty,
              # '0' and 'abc' cases in scripts/test_e2e_pr_subset.py all
              # go rc=0. That is a false GREEN on an unresolved shard
              # count, not a noisy abort.
              if ! [ "$E2E_SHARDS" -ge 1 ] 2>/dev/null; then
                echo "::error::effective e2e shard count is not a positive integer (got '$E2E_SHARDS')"
                exit 1
              fi
              if [ "$E2E_SHARDS" -gt 1 ]; then
                require_success e2e-report "$E2E_REPORT_RESULT"
              else
                require_skipped e2e-report "$E2E_REPORT_RESULT"
              fi
            fi
          else
            require_skipped e2e-plan "$E2E_PLAN_RESULT"
            require_skipped e2e "$E2E_RESULT"
            require_skipped e2e-report "$E2E_REPORT_RESULT"
          fi
          # PREVIEW (V1). Three states, and the middle one is the point:
          #   preview-checks: none              -> must be skipped
          #   selected, on a pull request       -> must SUCCEED (a preview that
          #                                        never appeared is a failure,
          #                                        not a skip -- fail closed)
          #   selected, on any other event      -> must be skipped; a push to
          #                                        the default branch has no PR
          #                                        preview to check.
          if [ "$PREVIEW_CHECKS" = "none" ]; then
            require_skipped preview "$PREVIEW_RESULT"
          elif [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
            require_success preview "$PREVIEW_RESULT"
          else
            require_skipped preview "$PREVIEW_RESULT"
          fi
          if [ "$RUN_DEPLOY_DRY_RUN" = "true" ]; then
            require_success deploy-dry-run "$DEPLOY_DRY_RUN_RESULT"
          else
            require_skipped deploy-dry-run "$DEPLOY_DRY_RUN_RESULT"
          fi
          exit "$status"
