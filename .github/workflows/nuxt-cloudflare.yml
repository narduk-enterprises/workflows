name: Reusable Nuxt + Cloudflare CI

# CI gate for the `nuxt-web` / `cloudflare-worker` project-lifecycle surfaces.
# pnpm/npm install -> typecheck (worker + Nuxt split, matching hydrogen's
# .github/workflows/ci-deploy.yml `ci` job) -> build -> optional Playwright
# e2e (opt-in, default false) -> optional `wrangler deploy --dry-run` gate
# (opt-in, default false). CI ONLY: deploying with real Cloudflare secrets on
# push-to-main is a deliberately separate `nuxt-cloudflare-deploy.yml`
# sibling (matching hydrogen's existing two-job ci/deploy split) that is NOT
# built in this pass — see the workflows repo README for what's deferred.
#
# THE BROWSER-SHARD SHAPE (added for company-hq#278). The `run-e2e` input
# above shipped as a single job on the SAME runner as the build, which is not
# the shape any real browser adopter in the estate uses: status-apps,
# operator-portal, earthdata-viewer, narduk-libs and nvault all shard
# Playwright across a DEDICATED isolated pool and merge blob reports
# afterwards. Because the callable could not express that, five repos
# hand-rolled it and a sixth (been-sober-for) hand-rolled it WRONG — chromium
# installed per run on the general linux-ci guest, the runner-class violation
# company-hq#276 is about. A gate shape the shared workflow cannot express is
# a gate shape every repo re-invents, so `e2e-runner`, `e2e-shards`,
# `e2e-args`, `e2e-install-browsers` and `e2e-browsers-path` exist to make the
# correct shape the easy one. Every one of them is additive with a default
# that reproduces the previous single-lane behaviour exactly.
#
# THE ISOLATED TOOLCHAIN IS IMAGE-OWNED (company-hq#343). A browser shard on
# `playwright-isolated` must use the exact Playwright package and browser
# revisions sealed root-owned under `/opt/playwright-ci`; it must never repair
# drift with a job-time download. The preflight below compares the caller's
# exact package pin, installed package/core versions, complete browsers.json
# digest, required browser revisions, selected executable realpath and a real
# launch canary against that immutable tree. Missing or mismatched state fails
# before the suite starts. The hosted-runner installer remains available only
# for non-isolated routes.
#
# THE UNIT-TEST LANE (added for company-hq#278, earthdata-viewer). Until
# `run-tests` existed this workflow had NO unit-test expression at all, while
# node-library.yml had one — so a Nuxt app with a vitest suite literally could
# not adopt its own class's callable without dropping its unit tests on the
# floor. That is the same defect the browser-shard gap was: the callable being
# unable to say something real, so the repo keeps hand-rolling. `extra-scripts`
# lands with it for the same reason, mirroring node-library.yml's input of the
# same name, and covers the repo-specific gate that needs the built output.
# `run-tests` defaults to FALSE on purpose: `test` is a near-universal
# package.json script, so defaulting it on would give every existing adopter a
# new gate the moment `v1` moved, and a never-before-run suite turning a
# default branch red is not backward-compatible however the input is labelled.
#
# A GREEN LANE THAT RAN NOTHING (`require-scripts`, workflows#14 finished
# here). Every gate below runs a package script, and they all used to run it
# with `--if-present` — so a gate whose script does not exist matched nothing,
# exited 0, and reported GREEN. `run-tests: true` is a caller ASSERTING tests
# exist, and this file was taking that on faith. node-library.yml got the fix;
# this file did not, and it is the worse case: 4 of its 5 adopters were running
# at least one dead lane, mostly because the `web:typecheck` and `build`
# defaults here are absent in most of the class. Each gate now probes for the
# script first — hard failure by default under `require-scripts: true`,
# and a silent skip when the caller passes an EMPTY script name to declare the
# lane genuinely absent. That last distinction is what makes the check
# adoptable by the repos that need it most. The gates are behaviour-tested
# against real package.json fixtures by scripts/test_script_gates.py, which
# executes the shipped step text rather than a copy of it.
#
# ROUTE ADDITIONS ARE NOT THIS FILE'S TO GRANT. `e2e-runner` accepts whatever
# the caller passes; being able to NAME the isolated pool is not the same as
# being APPROVED for it. A repo absent from the runner-fleet manifest's
# playwright group leaves `e2e-runner` empty and takes the route addition
# through the fleet flow first (company-hq#155 -> #276). Passing a group a
# repo is not registered for produces a job that queues forever, which reads
# exactly like a hung runner.
#
# THE "Required" CONVENTION (this is the point of this repo): this workflow's
# last job is named exactly `Required`, `needs:` every other job, runs with
# `if: always()`, and fails unless each needed job succeeded or was
# intentionally skipped (an opted-out input, never a silent pass). Callers
# name their calling job id `ci`, so GitHub composes the identical required
# check context `ci / Required` on every adopting repo regardless of whether
# e2e or the deploy dry-run gate ran. See README for the full explanation.
#
# RUNNER ROUTING: `runner` is a caller-controlled, JSON-encoded string input —
# a plain string ("ubuntu-latest"), a JSON array, or a JSON object matching
# Config/github-runner-fleet.json's `runsOn` shape — decoded with fromJSON()
# at each job's `runs-on:`. A caller that is PUBLIC — or that may become
# public — must NEVER pass a self-hosted label here, because a fork PR would
# then execute attacker-controlled code on estate infrastructure. Only
# private, manifest-routed callers may pass a self-hosted runs-on value,
# resolved via `python3 scripts/github_runner_fleet.py route` in
# agent-infrastructure. This repository is public. Private callers retain
# reusable-workflow compatibility; public callers use hosted capacity. `runner` is a free-form
# caller-supplied value and this workflow cannot police it.

# Least-privilege baseline for every job in this workflow. A called workflow's
# token is capped by the caller's grant and can only be narrowed from here,
# never widened — so this costs a caller nothing and protects against the one
# real failure mode: a job added later that forgets its own `permissions:` and
# would otherwise inherit whatever the caller happened to grant.
#
# It has no runtime effect today, deliberately: every job below already
# declares its own block, and job-level `permissions:` REPLACES the workflow
# level rather than merging with it. That is also why this is not a way to
# tighten the jobs that need `packages: read` — narrowing them here would do
# nothing, and narrowing them at job level makes the run fail to START with
# `startup_failure` and no logs at all (found during software-delivery's
# adoption). Job-level grants below are audited, not inherited.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "24"
      node-version-file:
        description: >-
          Optional path (relative to working-directory) to a file declaring
          the Node.js version, e.g. .node-version or .nvmrc, passed straight
          through to actions/setup-node. Empty (the default) preserves prior
          behaviour: every setup-node step uses `node-version` instead.
          setup-node rejects node-version and node-version-file together, so
          when this is set every setup-node step in this workflow resolves
          node-version to an empty string rather than passing both. Lets a
          caller single-source its Node version instead of also pinning it
          as this input's own value.
        required: false
        type: string
        default: ""
      package-manager:
        description: "Package manager: pnpm or npm (hydrogen currently runs npm)"
        required: false
        type: string
        default: "pnpm"
      install-script:
        description: >-
          Optional package.json script that owns the complete dependency install,
          including private-registry credential resolution and cleanup. When set,
          every job runs this script instead of the legacy auth-materialization
          plus package-manager install path. The optional distinct workflow_call
          NVAULT_TOKEN secret is exposed to this script only as NVAULT_TOKEN,
          so an app-owned nVault wrapper can resolve the package credential in
          memory and remove it before spawning the package manager.
        required: false
        type: string
        default: ""
      runner:
        description: >-
          JSON-encoded runner for every job in this workflow: a plain string
          ("ubuntu-latest"), a JSON array
          (["self-hosted","Linux","X64","proxmox","linux-ci"]), or a JSON
          object ({"group":"linux-ci","labels":[...]}) matching the
          runner-fleet manifest's `runsOn` shape. Decoded with fromJSON(), so
          the value must be valid JSON — a bare string needs its own quotes.
          Empty (the default) routes a PRIVATE caller to the fleet manifest's
          linux-ci organization-group route (group AND labels) and a public or
          visibility-unknown caller to GitHub-hosted ubuntu-latest; an
          explicit value always wins. A private caller outside the manifest's
          linux-ci group must be added to it (or pass '"ubuntu-latest"'
          explicitly), or its jobs queue with no eligible runner. A PUBLIC (or
          possibly-future-public) CALLER MUST NEVER PASS A SELF-HOSTED LABEL:
          a fork PR would run attacker-controlled code on estate self-hosted
          infrastructure. The constraint is the caller's visibility; this
          repository is public while private callers retain compatibility.
        required: false
        type: string
        default: ''
      lightweight-runner:
        description: >-
          Optional JSON runsOn for E2E planning, report merge, and Required.
          Overrides CI_LIGHTWEIGHT_RUNNER; unset preserves the build route.
          Resolve private self-hosted routes from fleet. Public callers always
          use ubuntu-latest for these jobs, regardless of this override.
        required: false
        type: string
        default: ""
      working-directory:
        description: "Directory containing the root package.json / lockfile"
        required: false
        type: string
        default: "."
      typecheck-worker-script:
        description: >-
          package.json script for the Worker/server typecheck lane (hydrogen:
          `typecheck`). Run with --if-present, so callers with no worker
          split can leave this at the default and it simply no-ops.
        required: false
        type: string
        default: "typecheck"
      typecheck-web-script:
        description: >-
          package.json script for the optional Nuxt web typecheck lane. Empty
          by default because most callers have one combined `typecheck`
          script, not a worker/web split. Callers with a separate web lane
          (hydrogen: `web:typecheck`) opt in by naming it.
        required: false
        type: string
        default: ""
      build-script:
        description: "package.json build script, run with --if-present"
        required: false
        type: string
        default: "build"
      run-tests:
        description: >-
          Run the unit-test script in the build lane, before `build-script`.
          OPT-IN, and default `false` deliberately even though the script runs
          with --if-present: `test` is a near-universal package.json script,
          so a default of `true` would hand every existing adopter a brand-new
          gate the moment the `v1` major tag moved — a suite that was never in
          their CI turning their default branch red is not a backward-compatible
          change, whatever the semver of the input says.

          This lane exists because until it did, this workflow had NO unit-test
          expression at all while `node-library.yml` had one, so a Nuxt app with
          a vitest suite could not adopt its own class's callable without
          silently dropping its unit tests. earthdata-viewer (company-hq#278) is
          the adopter that surfaced it.
        required: false
        type: boolean
        default: false
      test-script:
        description: "package.json script for the unit-test lane, run with --if-present"
        required: false
        type: string
        default: "test"
      extra-scripts:
        description: >-
          Space-separated package scripts run after `build-script`, each with
          --if-present, in the same lane so they see the build output. Mirrors
          `node-library.yml`'s input of the same name, and for the same reason:
          it is the difference between retiring a whole local job and retiring
          half of one. A repo-specific gate that would otherwise need a second
          job with a second full install goes here instead — earthdata-viewer's
          vendored-package pin check is the first case.
        required: false
        type: string
        default: ""
      extra-gate-scripts:
        description: >-
          Space-separated package scripts for an opt-in gate that runs in
          parallel with the build. Scripts run in the supplied order after a
          fresh install. When configured, every named script must exist and
          pass; this gate is included in Required and cannot be skipped.
        required: false
        type: string
        default: ""
      require-scripts:
        description: >-
          Fail a gate whose npm script does not exist, instead of passing
          silently. Mirrors `node-library.yml`'s input of the same name
          (workflows#14), which this file did not get in that pass — so until
          now EVERY gate here ran `--if-present` unprotected: a missing script
          matched nothing, exited 0, and reported a GREEN lane that ran no
          tests, no typecheck and no build at all.

          This class is where the trap bit hardest. The old
          `typecheck-web-script: web:typecheck` default created a second,
          hollow typecheck lane for single-script apps. That default is now
          empty: a separate web typecheck is opt-in, while every non-empty
          script name remains an assertion that require-scripts can enforce.

          DEFAULT IS `true`. The coordinated caller migration declared absent
          lanes and proved every remaining script before this flipped. A
          caller may explicitly pass false only as a bounded remediation; the
          estate default no longer permits a named gate to warn and pass.

          TO DECLARE AN ABSENT LANE, pass an EMPTY STRING for a script input
          whose lane genuinely does not exist in the
          repo (`typecheck-web-script: ""` on a Worker with no web surface,
          `build-script: ""` on one with no build step). An empty name is the
          caller SAYING the lane is off, and is skipped cleanly with no
          warning — as distinct from naming a script that is simply missing,
          which is the defect this input catches. Without that distinction
          `require-scripts` would be unadoptable by exactly the repos that
          need it, because some callers genuinely have no build or split
          typecheck lane.
        required: false
        type: boolean
        default: true
      dependency-audit:
        description: >-
          Fail the build when the dependency tree carries a high or critical
          advisory THAT HAS A PUBLISHED FIX. The estate security bar
          (company-hq#745, Logan askme 2026-09-17 "Fail on fixable
          high/critical"; company-hq D-ORG-1 (g), 2026-09-02) is alerts-on plus
          no *fixable* high/critical — an advisory with no upstream patch is
          reported as a `::warning::` and does NOT block, because a gate that
          cannot tell "you have not upgraded" from "there is nothing to upgrade
          to" is a gate that gets turned off.

          DEFAULT IS `true`, unlike `run-tests` and `foundation-check`. Those
          two default false because they run a caller-specific script that may
          not exist; this one reads the lockfile every adopter already has, and
          it is a security bar rather than an optional lane. It is still a new
          gate that can turn an existing adopter red, so the `v1` tag must not
          move onto it before the adopters have been checked — see README
          "Dependency audit".

          Estate contract pins do not count as advisories; only what the
          package manager's own audit reports does.
        required: false
        type: boolean
        default: true
      audit-ignore:
        description: >-
          Comma-separated `GHSA-xxxx-xxxx-xxxx=reason` entries suppressing
          specific advisories in the dependency audit. THE REASON IS REQUIRED:
          an entry with no `=reason` fails the gate rather than silently
          muting an advisory, and every suppression is echoed as a
          `::warning::` carrying its reason, so a muted advisory can never
          become invisible tribal knowledge. This mirrors the written-reason
          convention Dependabot `ignore:` blocks carry.

          An entry matching nothing in the current report is reported as a
          stale-suppression `::warning::` so it gets removed rather than
          accumulating. `NPM-<numeric-id>` is accepted for advisories the
          report carries no GHSA id for.
        required: false
        type: string
        default: ""
      run-e2e:
        description: "Run the optional Playwright e2e suite (opt-in)"
        required: false
        type: boolean
        default: false
      e2e-script:
        description: >-
          package.json script for the e2e suite. When run-e2e is true this
          script must exist and be non-empty; a missing script is always a hard
          failure, independent of require-scripts.
        required: false
        type: string
        default: "test:e2e"
      e2e-build-artifact-path:
        description: >-
          Relative path, under working-directory, to build output that the
          build job must upload and every E2E shard must download before the
          suite runs. The default auto detects .output or apps/web/.output when
          run-e2e is enabled. Empty explicitly disables the handoff.
          When set, a missing output is a hard failure and the suite receives
          E2E_PREBUILT_ARTIFACT=1 so its launcher can require and reuse the
          downloaded output instead of rebuilding it.
        required: false
        type: string
        default: "auto"
      e2e-browsers:
        description: >-
          Space-separated required browser engines. On a non-isolated runner
          this is also passed to `playwright install --with-deps`. On
          playwright-isolated it selects the image-owned revisions and launch
          canaries the fail-closed preflight must prove (chromium and/or webkit).
        required: false
        type: string
        default: "chromium"
      e2e-runner:
        description: >-
          JSON-encoded runner for the browser jobs ONLY, when they must not run
          where `runner` points. Empty (the default) reuses `runner`, which is
          the previous behaviour and stays correct for a caller with no
          isolated pool.

          This input exists because "browser tests run on the same runner as
          the build" is a runner-class violation, not a preference. The estate
          routes Playwright to a dedicated isolated pool
          ({"group":"playwright-isolated",...}) precisely so a browser job
          never shares a guest with credentialed CI, and until this input
          existed a caller wanting that had to hand-roll the whole gate — which
          is exactly how been-sober-for ended up installing chromium on the
          general linux-ci guest (company-hq#276).

          Resolve the value from the runner-fleet manifest and paste the
          route's `runsOn` object verbatim. A repo that is not in the manifest's
          playwright group must NOT pass one here — leave it empty and take the
          route addition through the fleet flow first.
        required: false
        type: string
        default: ""
      e2e-shards:
        description: >-
          Number of Playwright shards. 1 (the default) runs the suite as a
          single job, unchanged. Greater than 1 fans the e2e job out over that
          many parallel lanes, appending
          `--shard=<n>/<total> --reporter=blob` to the e2e script, and adds an
          `E2E report` job that merges the blob reports into one HTML report.
          Generalizes the status-apps (2 shards) / operator-portal /
          earthdata-viewer (3 shards) pattern.
        required: false
        type: number
        default: 1
      e2e-args:
        description: >-
          Extra arguments appended to the e2e script after `--`, alongside any
          shard/reporter arguments this workflow adds
          (e.g. `--project=chromium --workers=1`).
        required: false
        type: string
        default: ""
      e2e-pr-shards:
        description: >-
          Shard count for `pull_request`/`pull_request_target` events only.
          0 (the default) means UNSET: pull requests use `e2e-shards`, which
          is exactly today's behaviour. Any value >= 1 replaces `e2e-shards`
          on pull-request events while a push (default branch, schedule,
          workflow_dispatch) keeps running `e2e-shards`.

          This exists because the estate's `playwright-isolated` pool is three
          effective slots against a declared seven, shared by roughly ten
          repositories, and queue — not compute — is what a pull request
          actually waits on (p90 294s; buoys PR run 35165732448 queued 295s to
          run a 128s shard). Fewer pull-request lanes is the only lever a
          caller has over that from here. workflows#83.
        required: false
        type: number
        default: 0
      e2e-pr-args:
        description: >-
          `e2e-args` replacement for `pull_request`/`pull_request_target`
          events only. Empty (the default) means UNSET: pull requests use
          `e2e-args`, which is exactly today's behaviour.

          The intended shape is a Playwright PROJECT selection, so the caller
          owns what "the pull-request subset" means in its own
          `playwright.config`, and this workflow never guesses:
          `e2e-pr-args: "--project=smoke"` with `e2e-args: ""`. A `--grep`
          tag selection works the same way.

          Because empty means "inherit", a caller that wants arguments on a
          push but NONE on a pull request cannot express that here — pass the
          push-only arguments through a `github.event_name` expression in the
          caller's own workflow instead. Deliberate: a
          sentinel for "explicitly empty" would be a second, weaker way to say
          the same thing.

          This REPLACES rather than appends, so a pull-request subset cannot
          silently inherit a conflicting `--project` from `e2e-args`.
          workflows#83.
        required: false
        type: string
        default: ""
      e2e-install-browsers:
        description: >-
          Run `playwright install --with-deps` on a non-isolated runner.
          MUST be false on playwright-isolated: that route rejects true before
          dependency installation, and the installer step also excludes the
          isolated group/label so drift can never turn into a download.
        required: false
        type: boolean
        default: true
      e2e-browsers-path:
        description: >-
          PLAYWRIGHT_BROWSERS_PATH for the browser jobs. Empty leaves whatever
          the runner already exports ALONE — it is written to $GITHUB_ENV only
          when non-empty, because a job-level `env:` would export an empty
          value and clobber the pool's own setting. On playwright-isolated this
          MUST be empty: the guest exports its immutable image-backed,
          job-visible path, and the route guard rejects every caller override
          (including $RUNNER_TEMP and workspace caches).
        required: false
        type: string
        default: ""
      e2e-skip-paths:
        description: >-
          Space-separated glob patterns (supporting `*` and `**`), relative to
          the repository root. When `run-e2e` is true, every changed path in
          a pull request event matches at least one pattern, and there is at
          least one changed path, the `E2E plan` job emits an empty shard
          list and every browser job (`E2E`, `E2E report`) is skipped —
          `Required` still gates, expecting them `skipped` rather than
          absent. Empty (the default) never skips. Applies to
          `pull_request`/`pull_request_target` events only; a push (e.g. to
          the default branch) always runs the full suite regardless of this
          input, because that is the canonical-branch validation the skip is
          not meant to weaken. workflows#49.
        required: false
        type: string
        default: ""
      e2e-full-paths:
        description: >-
          Space-separated glob patterns (same `*`/`**` syntax as
          `e2e-skip-paths`). On a pull request event, when at least one
          changed path matches, E2E runs the FULL configuration
          (`e2e-args`, `e2e-shards`) instead of the pull-request tier
          (`e2e-pr-args`, `e2e-pr-shards`). This way a PR that touches app
          or test code proves the whole suite before merge, and a
          docs/CI/config PR keeps the fast subset. Logan 2026-09-18: "lets do
          the path scoped full run ... wall clock more important than
          occasional red main". When the changed-file list cannot be
          determined (no `gh`, a failed compare, the 300-file compare cap),
          a caller that set this input gets the full suite. Empty (the
          default) leaves the tiers exactly as they were. Pushes always run
          the full configuration regardless.
        required: false
        type: string
        default: ""
      e2e-quarantine-args:
        description: >-
          Arguments that select the caller's quarantined tests (for example
          `--project=quarantine --retries=0`). When set, a separate,
          NON-BLOCKING `E2E (quarantine)` job runs `e2e-script` with exactly
          these arguments on every event E2E runs on. The job's
          prebuilt artifact, runner and setup are the same as E2E's. It is
          `continue-on-error` and `Required` never lists it, so a quarantined
          test can fail or flake without affecting the gate. Its history is
          the evidence a test needs to leave quarantine. Unsharded. Empty
          (the default) adds no job.
        required: false
        type: string
        default: ""
      preview-checks:
        description: >-
          Comma-separated checks to run against the pull request's Cloudflare
          preview deployment: `none`, `og`, `e2e-subset`, or `og,e2e-subset`.
          Default `og` (Logan, askme round 2026-09-17: "Post URL + run the PR
          subset on it"). The job runs on `pull_request` /
          `pull_request_target` events ONLY — a push to the default branch has
          no PR preview to check, and `Required` expects the job `skipped`
          there.

          A CALLER WHOSE REPOSITORY HAS NO WORKERS BUILDS PREVIEW MUST PASS
          `preview-checks: none`. This gate is fail-closed on purpose: a
          preview that never appears inside `preview-timeout-minutes` is a
          FAILURE, not a skip, because "the preview URL never showed up" is
          the single most common way a Workers Builds connection silently
          breaks, and a gate that treats it as a pass is the gate that lets a
          repo ship for weeks with no preview at all.

          `og` runs `narduk-app og:check --live --base-url <preview>` from the
          caller's own installed `@narduk-enterprises/narduk-app-tools`.
          `e2e-subset` additionally runs `e2e-script` with `e2e-pr-args`
          against the preview with `PLAYWRIGHT_BASE_URL` set — the caller's
          Playwright config must honour that variable and must NOT start its
          own `webServer`, or the suite will test localhost and report green.
        required: false
        type: string
        default: "og"
      preview-url-source:
        description: >-
          How this workflow learns the preview URL.

          `pr-comment` (default) reads the pull request's comments and takes
          the first `*.workers.dev` URL posted by Cloudflare's GitHub App.
          That is the surface Cloudflare actually documents for Workers Builds:
          the integration creates check runs, commit statuses and a pull
          request comment, and "a preview URL will be provided for any builds
          which perform `wrangler versions upload`"
          (developers.cloudflare.com/workers/ci-cd/builds/git-integration/github-integration/).

          `url-template` derives the URL from `preview-url-template` and makes
          no GitHub API read at all.

          THERE IS DELIBERATELY NO `deployment` / `environment_url` SOURCE.
          Cloudflare's *Pages* integration creates GitHub Deployments; the
          Workers Builds integration documents check runs, statuses and a
          comment, and no deployment object. A source keyed on
          `environment_url` would be dead code for this callable's class and
          would cost every adopter a `deployments: read` grant to carry it.
        required: false
        type: string
        default: "pr-comment"
      preview-url-template:
        description: >-
          Preview URL template, used only when `preview-url-source:
          url-template`. Placeholders: `{branch}` (the PR head ref verbatim),
          `{branch-alias}` (the head ref lowercased with every character
          outside `[a-z0-9]` replaced by `-`, runs collapsed and the ends
          trimmed) and `{sha}` (the PR head SHA, short form, 12 characters).

          Cloudflare's aliased preview URLs take the shape
          `<ALIAS>-<WORKER_NAME>.<SUBDOMAIN>.workers.dev`, so a typical value is
          `https://{branch-alias}-myworker.myaccount.workers.dev`.

          `{branch-alias}` reproduces the transform this estate has OBSERVED
          (buoys: branch `codex/buoys-complete` ->
          `codex-buoys-complete-buoys.narduk-enterprises.workers.dev`).
          Cloudflare does not publish the truncation rule it applies to long
          branch names, so a repository with long branch names should stay on
          `pr-comment`, which reads the URL Cloudflare actually minted instead
          of predicting it.
        required: false
        type: string
        default: ""
      preview-timeout-minutes:
        description: >-
          Whole-job budget for the preview lane, including the bounded wait for
          the preview deployment to appear and report the PR head's build. The
          wait itself is this budget minus five minutes, so the selected checks
          still have room to run and the sticky comment still gets posted;
          below a six-minute budget the whole budget becomes the wait. Keep it
          at or above 10.
        required: false
        type: number
        default: 20
      preview-working-directory:
        description: >-
          Directory to run the preview checks from; empty (the default) uses
          `working-directory`. Mirrors `wrangler-working-directory`. Set it
          when the app that owns `og:check` and the Playwright suite is a
          workspace package rather than the repository root (buoys: `apps/web`).
        required: false
        type: string
        default: ""
      wrangler-dry-run:
        description: "Run an opt-in `wrangler deploy --dry-run` validation gate"
        required: false
        type: boolean
        default: false
      wrangler-working-directory:
        description: "Directory to run `wrangler deploy --dry-run` from; empty defaults to working-directory"
        required: false
        type: string
        default: ""
      wrangler-env:
        description: "Optional wrangler --env passed to the dry-run gate"
        required: false
        type: string
        default: ""
      foundation-check:
        description: >-
          Run `narduk-app-tools foundation:check` (company-hq
          docs/WEB-FOUNDATION-CHECK.md, D-WEBFOUND-2 Q5/Q9, D-WEBFOUND-3) after
          install and fail the build job when it reports FAIL or UNKNOWN — the
          spec's decided no-warning-tier rule (§5: "the app's CI must treat
          [UNKNOWN] as a failure too"). OPT-IN and default false, on the same
          reasoning as `run-tests` above: the web-foundation program is a
          multi-wave migration (D-WEBFOUND-2 Q4/Q10), so most fleet apps do not
          conform yet, and a moving `v1` major tag must never hand an existing
          adopter a brand-new red gate it never asked for. The JSON artefact
          is uploaded as `foundation-check` regardless of the result (a
          failing run's artefact is the one the rollup most wants), and a
          short summary is written to the job summary either way.
        required: false
        type: boolean
        default: false
      foundation-check-tool-version:
        description: >-
          Exact `@narduk-enterprises/narduk-app-tools` version to run when the
          caller has not adopted it as a dependency (see the step's own
          comment for the two invocation paths). Pinned, never a range —
          bump deliberately and re-pin, the same discipline this repo applies
          to its own action SHAs.
        required: false
        type: string
        default: "0.10.0"
      foundation-check-auth:
        description: >-
          Type of the credential used for foundation checks. package-token is
          the default and consumes NARDUK_PLATFORM_GH_PACKAGES_READ. nvault is
          a legacy compatibility mode for callers that previously mapped their
          nVault service token into that package secret. New callers pass the
          canonical package-read secret and leave this at package-token.
        required: false
        type: string
        default: "package-token"
    secrets:
      # CI alias for the single estate packages-read PAT. This is the only
      # credential foundation checks and legacy direct installs may consume.
      # Callers pass secrets.NARDUK_PLATFORM_GH_PACKAGES_READ (org Actions,
      # same value as nvault GH_PACKAGES_READ). Local installs use
      # GH_PACKAGES_READ. Do not mint a per-app PAT.
      NARDUK_PLATFORM_GH_PACKAGES_READ:
        required: false
      # Caller-owned install wrappers may receive only this service token,
      # never the package PAT. It is separate so one invocation can both
      # install through nVault and run the foundation check with its canonical
      # PAT. Generic caller-owned installers may omit it.
      NVAULT_TOKEN:
        required: false

env:
  NUXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build
    outputs:
      e2e-build-path: ${{ steps.e2e-build-path.outputs.path }}
      e2e-build-id: ${{ steps.e2e-build-upload.outputs.artifact-id }}
    # ---------------------------------------------------------------------
    # Blacksmith overflow (D-CI-CAP-1 (c), extends D-BLACKSMITH-2; company-hq
    # DECISIONS.md, fleet#337). Manual, kill-switched overflow for the
    # `linux-ci` class's ordinary private CI -- never deploy or tailnet work.
    # The org Actions variable `BLACKSMITH_RUNNERS_ENABLED` (default `false`,
    # visibility: private repos) is the switch; a repo-level variable of the
    # same name overrides it for exactly that repo (GitHub's normal
    # repo > org precedence), which is how a canary is scoped to one adopter
    # without moving the org default. Exact `true` selects the vendor's
    # documented `blacksmith-2vcpu-ubuntu-2404` label (override via
    # `vars.BLACKSMITH_LINUX_LABEL`) -- a label-only route, per D-BLACKSMITH-4:
    # provider-created runner groups are not a stable contract and are never
    # pinned here. The route compared and used is the EFFECTIVE one: an
    # explicit `inputs.runner`, else (empty default) the linux-ci group route
    # for a private caller and `"ubuntu-latest"` for a public or
    # visibility-unknown one. Any effective `"ubuntu-latest"` keeps that
    # hosted route -- this never touches a public repo's runner. This is a
    # MANUAL switch, not automatic provider fallback: GitHub does not move an
    # already-queued job to another runs-on target, so the fallback is
    # flipping the variable back to false (or deleting the repo override) and
    # rerunning. Kill conditions (D-BLACKSMITH-2/3, unchanged by this
    # extension): disable at 2,400 equivalent 2-vCPU minutes in a monthly
    # cycle, at any non-zero amount due, or on any unexpected billing state --
    # whichever comes first. No payment method or paid overage is authorized.
    # Policy-exception annotation (CI-RUNNER-POLICY.md Sec 2 exception 4, as
    # expanded by D-CI-CAP-1 (c)): a job landing on Blacksmith here is
    # exercising that named exception, not drift.
    # ---------------------------------------------------------------------
    runs-on: ${{ fromJSON(vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"') != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"')) }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # node-version and node-version-file are mutually exclusive on
          # setup-node (passing both is rejected), so resolve them as two
          # exclusive expressions: node-version-file wins when the caller
          # sets it, and node-version otherwise reproduces prior behaviour.
          node-version-file: ${{ inputs.node-version-file }}
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          # v7 caches the package manager BY DEFAULT (`package-manager-cache`
          # defaults to true) — dropping the `cache:` input does NOT turn it
          # off. Without this line the explicit restore/save below is a SECOND
          # cache running alongside the built-in one, and the `Post Run
          # actions/setup-node` tar the split was meant to remove is still
          # there: measured 27s on marketing-web `Build` after the split, on
          # top of a 22s explicit save. Two caches for one dependency tree is
          # strictly worse than the one it replaced.
          package-manager-cache: false

      # Dependency cache: restore everywhere, write only on the default branch
      # (company-hq#269). `setup-node`'s built-in `cache:` writes a fresh
      # tarball on every key MISS, scoped to the ref the job ran on — and a
      # cache written on `refs/pull/N/merge` is restorable only by that same
      # pull request. Every lockfile-changing PR therefore paid a `Post Run
      # actions/setup-node` tar to produce an entry nothing would ever read,
      # and the merge to `main` paid the identical tar again. Measured before
      # this change: 19s on marketing-web `Build`, a 67s job. Restoring on
      # every ref keeps the win — a PR falls back through `restore-keys` to
      # the default-branch entry, which is the one it actually wants.
      # ================================================================
      # SELF-HOSTED RUNNERS DO NOT CACHE DEPENDENCIES.
      #
      # The guard is `runner.environment`, which exists ONLY at step level — a
      # job-level `if:` has no `runner` context (actionlint rejects it), so it
      # cannot be hoisted onto the job.
      #
      # On a self-hosted guest the pnpm/npm store is a PERSISTENT SHARED
      # directory that outlives the job and is shared by every lane running on
      # that guest. Tarballing it is not merely redundant — it is UNSOUND.
      # `actions/cache/save` archives the live store WHILE other concurrent
      # lanes write into it, so the archive is torn. `actions/cache/restore`
      # then lays that torn archive back over a live store, and pnpm
      # hard-links the result into `node_modules` — which is how a
      # `package.json` ends up holding JavaScript source:
      #
      #   ERR_PNPM_BAD_PACKAGE_JSON .../vue-tsc/package.json:
      #     Unexpected token 'i', "import {..."... is not valid JSON
      #   ERR_PNPM_BAD_PACKAGE_JSON .../svgo/package.json:
      #     '"use strict";/* * SonarQube JavaScript'
      #
      # Those are whole files of the WRONG KIND at a path that should hold
      # JSON, not truncations — the signature of a content-addressed store
      # captured mid-write. Evidence: narduk-libs `main` needed three attempts,
      # with a 481 MiB poisoned entry against a 205 MiB healthy one and
      # caniuse-lite data sitting at terser's `package.json` path; vtraceroute
      # reproduced an identical message on three different guests
      # (`linux-ci-2/3/5`), which is what proves the poison arrives through the
      # SHARED CACHE ENTRY and not from one sick guest (vtraceroute#4,
      # company-hq#269).
      #
      # RESTORE HAD TO GO TOO, not just save. An unsound writer poisons every
      # reader of the same key, so leaving restore on would let a clean guest
      # happily unpack the torn archive some other lane wrote. Nothing is lost:
      # on a persistent guest the store on disk IS the cache, already warm.
      #
      # GitHub-hosted runners are genuinely ephemeral, have no persistent
      # store, and run one job per VM — so there is no concurrent writer, the
      # tarball is sound, and both halves stay on for them.
      #
      # `python-data.yml` arrives at the same place by a different road and is
      # the precedent: it leaves `setup-uv`'s `enable-cache` at `auto`, which
      # already means "on for hosted, off for self-hosted". Do not "unify" the
      # two by forcing that one on.
      #
      # Enforced by rule R8 in scripts/lint_callables.py.
      # ================================================================
      - name: Resolve dependency cache directory
        id: dep-cache-dir
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm config set store-dir "$GITHUB_WORKSPACE/.cache/pnpm-store"
            echo "path=.cache/pnpm-store" >> "$GITHUB_OUTPUT"
          else
            npm config set cache "$GITHUB_WORKSPACE/.cache/npm"
            echo "path=.cache/npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependency cache
        id: dep-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-

      - name: Configure package registry auth
        if: inputs.install-script == ''
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: &configure_package_registry_auth |
          set -euo pipefail
          set +x
          if [ -z "$NARDUK_PLATFORM_GH_PACKAGES_READ" ]; then
            if ! package_scope=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          try {
            const pkg = fs.existsSync('package.json') ? JSON.parse(fs.readFileSync('package.json', 'utf8')) : {};
            const dependencies = Object.assign({}, pkg.dependencies, pkg.devDependencies, pkg.optionalDependencies, pkg.peerDependencies);
            const uses = scope => Object.entries(dependencies).some(([name, spec]) => new RegExp(`@narduk-${scope}/`).test(`${name} ${spec}`));
            const locked = ['pnpm-lock.yaml', 'package-lock.json', 'yarn.lock', 'bun.lock'].some(file => fs.existsSync(file) && fs.readFileSync(file, 'utf8').includes('npm.pkg.github.com'));
            // workflows#106: a committed project .npmrc that routes the
            // @narduk-enterprises scope to the anonymous npm.nard.uk mirror
            // (company-hq D-PKG-6) needs no credential. The mirror serves only
            // that scope, so @narduk-geo stays private; a lockfile or .npmrc
            // pointed back at GitHub Packages is private again (break-glass).
            const npmrc = fs.existsSync('.npmrc') ? fs.readFileSync('.npmrc', 'utf8') : '';
            const routes = [...npmrc.matchAll(/^[ \t]*@narduk-enterprises:registry[ \t]*=[ \t]*"?([^"\s]*)"?[ \t]*$/gm)].map(match => match[1]);
            const mirrored = routes.length > 0 && /^https:\/\/npm\.nard\.uk\/?$/.test(routes.at(-1));
            console.log(locked || uses('geo') || (uses('enterprises') && !mirrored) ? 'private' : 'public');
          } catch {
            console.error('Cannot determine package registry requirements from repository metadata.');
            process.exitCode = 1;
          }
          NODE
            ); then
              exit 1
            fi
            if [ "$package_scope" = private ]; then
              echo '::error::Private packages require the org NARDUK_PLATFORM_GH_PACKAGES_READ secret forwarded to this workflow. It maps to GH_PACKAGES_READ; do not substitute a GitHub App or write token.'
              exit 1
            fi
            echo 'No GitHub Packages dependencies (none, or @narduk-enterprises via npm.nard.uk) and no package-read secret; skipping registry auth.'
            exit 0
          fi
          if [[ "$NARDUK_PLATFORM_GH_PACKAGES_READ" == *[[:space:]]* ]]; then
            echo '::error::Package-read credential contains whitespace; repair the mapped secret.'
            exit 1
          fi
          if [ -f ./scripts/package-registry-auth.mjs ]; then
            node ./scripts/package-registry-auth.mjs
          elif [ -f ./tools/configure-package-registry-auth.mjs ]; then
            node ./tools/configure-package-registry-auth.mjs
          else
            # Direct org PAT path; legacy caller bootstraps keep their existing contract.
            umask 077
            # Variable reference stays literal; the token never enters this file.
            # shellcheck disable=SC2016
            printf '@narduk-enterprises:registry=https://npm.pkg.github.com\n@narduk-geo:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${GH_PACKAGES_READ}\n' > .npmrc.auth
          fi

      # SELF-HOSTED: THE PNPM STORE MUST SIT ON THE WORKSPACE'S OWN FILESYSTEM.
      #
      # pnpm materialises `node_modules` by HARD-LINKING out of its store, and
      # a hard link cannot cross a device boundary. When store and workspace
      # are on different filesystems pnpm silently degrades to a full file
      # COPY — no warning, no error, just a slower install and a private copy
      # of every dependency on disk.
      #
      # That is the live shape on `linux-ci` (CT 210). The runner's HOME is on
      # the guest's root volume (`pve-vm-210-disk-0`, st_dev 64519); the
      # workspace is on the separate transient volume (`pve-vm-210-disk-1`,
      # st_dev 64534). So pnpm's default store at
      # `$HOME/.local/share/pnpm/store` is ALWAYS cross-device from the
      # workspace, and every install on that guest has been copying. Measured
      # there on one nuxt+vue+typescript+vitest tree (212 MiB of
      # `node_modules`), warm store, `--offline`, three runs each:
      #
      #   store on the ROOT volume   3.93s / 3.03s / 2.83s   st_nlink=1   220 MiB
      #   store on the SAME volume   2.71s / 2.02s / 2.32s   st_nlink=2    17 MiB
      #
      # `st_nlink` is the proof, not the clock: 1 means every file was copied,
      # 2 means it was linked to the store. And the disk column is the bigger
      # win — 13x less transient volume consumed per materialised workspace, on
      # the volume whose 80% mark BLOCKS new allocations and whose hourly
      # reclaimer deletes real checkouts to stay under it.
      #
      # DERIVED, NOT HARDCODED. The store goes at the mount point of the
      # workspace's own filesystem, because "same device as the workspace" is
      # the actual requirement and a literal guest path would be a guess about
      # every other guest. When the workspace is on `/` the default store
      # already shares its device and this step does nothing. The directory
      # itself must be pre-provisioned runner-owned — the transient mount root
      # is root-owned, so the job cannot create it — and a missing or
      # unwritable one leaves pnpm's default store in place. The failure mode
      # is a slower install, never a failed one.
      #
      # GITHUB-HOSTED RUNNERS KEEP THE DEFAULT STORE. They are ephemeral, the
      # `actions/cache` restore above puts the store back on the same
      # filesystem as the workspace already, and there is no transient mount to
      # move it to. This is the same runner-class split as the cache block
      # above, for the same reason: the two runner classes have genuinely
      # different storage, not a preference.
      #
      # company-hq#269, been-sober-for#74.
      - name: Point pnpm at a workspace-local store (self-hosted)
        if: runner.environment == 'self-hosted' && inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          mount_point=$(df --output=target "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$mount_point" = "/" ]; then
            echo "workspace is on the root filesystem; pnpm's default store already shares its device"
            exit 0
          fi
          store="$mount_point/pnpm-store"
          if [ ! -d "$store" ] || [ ! -w "$store" ]; then
            echo "no writable store at $store; keeping pnpm's default store (installs will copy, not link)"
            exit 0
          fi
          echo "npm_config_store_dir=$store" >> "$GITHUB_ENV"
          echo "pnpm store -> $store (same filesystem as $GITHUB_WORKSPACE)"

      - name: Install dependencies (pnpm)
        if: inputs.install-script == '' && inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Install dependencies (npm)
        if: inputs.install-script == '' && inputs.package-manager == 'npm'
        run: npm ci
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      # Self-hosted guests keep the workspace volume between jobs. The auth
      # bootstrap writes mode-0600 `.npmrc.auth` under working-directory for
      # NPM_CONFIG_USERCONFIG; delete that exact path on every outcome so a
      # failed install or cancelled job cannot leave registry credentials on
      # the guest. Do not broaden this to globs or parent trees.
      - name: Remove package auth materialization
        if: always() && inputs.install-script == ''
        run: rm -f "${GITHUB_WORKSPACE}/${{ inputs.working-directory }}/.npmrc.auth"

      - name: Install dependencies (caller script)
        if: inputs.install-script != ''
        env:
          INSTALL_SCRIPT: ${{ inputs.install-script }}
          NVAULT_TOKEN: ${{ secrets.NVAULT_TOKEN || (inputs.foundation-check-auth == 'nvault' && secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || '') }}
          # Dependabot runs see no Actions-only NVAULT_TOKEN. Only then, map the
          # org package-read secret to GH_PACKAGES_READ (workflows#98).
          GH_PACKAGES_READ: ${{ !secrets.NVAULT_TOKEN && inputs.foundation-check-auth != 'nvault' && secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || '' }}
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$INSTALL_SCRIPT" in
            ''|*[!A-Za-z0-9:_-]*)
              echo "::error::install-script must be one package.json script name"
              exit 1
              ;;
          esac
          raw=$(npm pkg get "scripts.$INSTALL_SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            echo "::error::install-script names \"$INSTALL_SCRIPT\" but no such script exists"
            exit 1
          fi
          "$PM" run "$INSTALL_SCRIPT"

      # Only the default branch writes, and only this job and `e2e` write at
      # all. `e2e-report` and `deploy-dry-run` share `inputs.runner` with this
      # job, so by the time they install, the entry this step wrote is an
      # exact-key hit for them — adding a save there would only race for a key
      # that already exists. `e2e` is separate because it may be routed to a
      # different runner class, which gives the cache a different path and so
      # a genuinely different entry.
      - name: Save dependency cache
        if: >-
          runner.environment == 'github-hosted'
          &&
          steps.dep-cache.outputs.cache-hit != 'true'
          && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: ${{ steps.dep-cache.outputs.cache-primary-key }}

      # DEPENDENCY AUDIT (DA1; company-hq#745, Logan askme 2026-09-17 "Fail on
      # fixable high/critical (Recommended)"; company-hq D-ORG-1 (g),
      # 2026-09-02). The estate security bar is "alerts on, and no FIXABLE
      # high/critical advisory in the tree" -- so this gate is deliberately
      # NOT `<pm> audit --audit-level=high` with its own exit status. That
      # status goes non-zero for ANY high/critical finding, including ones with
      # no published patch, which makes the only sustainable reaction
      # `|| true`: a gate that cannot distinguish "you have not upgraded" from
      # "upstream has shipped no fix" gets switched off within a week, and then
      # the fixable ones stop being caught too.
      #
      # So the exit status of the audit command is discarded on purpose and the
      # JSON body is what decides:
      #   fixable high/critical   -> ::error:: and the build fails
      #   unfixable high/critical -> ::warning:: and the build passes
      #   moderate/low/info       -> counted in the summary, never blocking
      # A missing or unparseable report is a HARD FAILURE, not a pass: "the
      # audit did not run" must never be indistinguishable from "the audit
      # found nothing" (the same fail-closed rule `require-scripts` exists for).
      #
      # BOTH REPORT SHAPES ARE PARSED. pnpm (and npm 6) emit the `advisories`
      # map, where fixability is `patched_versions` being a real range rather
      # than the "<0.0.0" no-patch sentinel; npm 7+ emits `auditReportVersion:
      # 2` with a `vulnerabilities` map, where fixability is `fixAvailable`
      # being true or a {name,version,isSemVerMajor} object. `package-manager`
      # selects the command, never the parser -- npm changed this format once
      # already and a parser keyed on the input would silently read zero
      # advisories the next time it changes.
      #
      # Runs as a STEP IN THIS JOB rather than a separate lightweight job
      # because the tree it audits is the one this job just installed: a
      # standalone job costs a second checkout, setup-node and full install
      # (measured against this repo's adopters: 60-120s and a second runner
      # slot) to re-derive state that already exists here for the ~5-10s the
      # audit itself takes. `Required` covers it through `build`, which it
      # already demands success from.
      - name: Dependency audit
        if: inputs.dependency-audit
        env:
          PM: ${{ inputs.package-manager }}
          AUDIT_IGNORE: ${{ inputs.audit-ignore }}
        run: |
          set -euo pipefail
          tmpdir="${RUNNER_TEMP:-/tmp}"
          report="$tmpdir/dependency-audit.json"
          errlog="$tmpdir/dependency-audit.err"
          # `--audit-level=high` (the `=` form: npm parses a bare `--audit-level
          # high` as a positional) only narrows what the tool considers
          # blocking; the severity decision below is made from the report.
          set +e
          "$PM" audit --json --audit-level=high >"$report" 2>"$errlog"
          audit_status=$?
          set -e
          if [ ! -s "$report" ]; then
            echo "::error::dependency audit produced no report ($PM audit exited $audit_status) -- the audit did not run, which is a failure, not a pass"
            sed -n '1,20p' "$errlog" >&2 || true
            exit 1
          fi
          AUDIT_REPORT="$report" AUDIT_STATUS="$audit_status" python3 - <<'PYEOF_AUDIT'
          import json
          import os
          import re
          import sys

          BLOCKING = ("critical", "high")
          GHSA = re.compile(r"(GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4})", re.I)

          report_path = os.environ["AUDIT_REPORT"]
          raw = open(report_path, encoding="utf-8").read()
          try:
              doc = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(
                  f"::error::dependency audit report is not JSON ({exc}); "
                  f"`audit` exited {os.environ.get('AUDIT_STATUS')}"
              )
              print(raw[:500], file=sys.stderr)
              raise SystemExit(1)
          if not isinstance(doc, dict):
              print("::error::dependency audit report is not a JSON object")
              raise SystemExit(1)

          # audit-ignore entries are `GHSA-id=reason`, comma separated. The
          # reason is REQUIRED and is printed next to every suppression, so a
          # muted advisory can never become invisible tribal knowledge -- the
          # same contract Dependabot's `ignore:` blocks carry in writing.
          ignores: dict[str, str] = {}
          bad_ignores: list[str] = []
          for entry in os.environ.get("AUDIT_IGNORE", "").split(","):
              entry = entry.strip()
              if not entry:
                  continue
              ident, sep, reason = entry.partition("=")
              ident = ident.strip()
              reason = reason.strip()
              if not sep or not reason or not ident:
                  bad_ignores.append(entry)
                  continue
              ignores[ident.upper()] = reason

          records: list[dict] = []

          def ghsa_ids(*candidates) -> list[str]:
              """Every GHSA id embedded in the candidate strings, in order."""
              out: list[str] = []
              for candidate in candidates:
                  if candidate in (None, "", False):
                      continue
                  out.extend(m.group(1).upper() for m in GHSA.finditer(str(candidate)))
              return out

          # npm 7+ / `auditReportVersion: 2`
          vulnerabilities = doc.get("vulnerabilities")
          advisories = doc.get("advisories")
          if isinstance(vulnerabilities, dict) and not isinstance(advisories, dict):
              for name, vuln in vulnerabilities.items():
                  if not isinstance(vuln, dict):
                      continue
                  severity = str(vuln.get("severity", "")).lower()
                  fix = vuln.get("fixAvailable", False)
                  ids: list[str] = []
                  titles: list[str] = []
                  for via in vuln.get("via") or []:
                      if isinstance(via, dict):
                          ids.extend(ghsa_ids(via.get("url")))
                          source = via.get("source")
                          if source not in (None, ""):
                              ids.append(f"NPM-{source}")
                          if via.get("title"):
                              titles.append(str(via["title"]))
                  records.append(
                      {
                          "package": str(vuln.get("name", name)),
                          "severity": severity,
                          "fixable": bool(fix),
                          "ids": list(dict.fromkeys(ids)),
                          "title": titles[0] if titles else "(no title)",
                          "fix": (
                              f"{fix.get('name')}@{fix.get('version')}"
                              if isinstance(fix, dict)
                              else ("upgrade available" if fix else "no fix published")
                          ),
                      }
                  )
          elif isinstance(advisories, dict):
              # pnpm / npm 6 `advisories` map. "<0.0.0" is this format's
              # explicit "no patched version exists" sentinel.
              for key, adv in advisories.items():
                  if not isinstance(adv, dict):
                      continue
                  patched = str(adv.get("patched_versions", "") or "").strip()
                  fixable = bool(patched) and patched != "<0.0.0"
                  records.append(
                      {
                          "package": str(adv.get("module_name", "(unknown)")),
                          "severity": str(adv.get("severity", "")).lower(),
                          "fixable": fixable,
                          "ids": list(
                              dict.fromkeys(
                                  ghsa_ids(adv.get("github_advisory_id"), adv.get("url"))
                                  + [f"NPM-{adv.get('id', key)}"]
                              )
                          ),
                          "title": str(adv.get("title", "(no title)")),
                          "fix": patched if fixable else "no fix published",
                      }
                  )
          else:
              print(
                  "::error::dependency audit report has neither a "
                  "`vulnerabilities` nor an `advisories` section -- the report "
                  "format changed and this gate would have read zero advisories"
              )
              raise SystemExit(1)

          blocking = [r for r in records if r["severity"] in BLOCKING]
          matched_ignores: set[str] = set()

          def ignored_by(record) -> str:
              for ident in record["ids"]:
                  if ident in ignores:
                      matched_ignores.add(ident)
                      return ident
              return ""

          failures, warnings, suppressed = [], [], []
          for record in sorted(blocking, key=lambda r: (r["severity"], r["package"])):
              label = "/".join(record["ids"]) or "(no advisory id)"
              line = f"{record['severity']} in {record['package']} [{label}]: {record['title']}"
              ident = ignored_by(record)
              if ident:
                  suppressed.append(f"{line} -- suppressed by audit-ignore {ident}: {ignores[ident]}")
              elif record["fixable"]:
                  failures.append(f"{line} -- FIX AVAILABLE ({record['fix']})")
              else:
                  warnings.append(f"{line} -- no fix published upstream")

          for entry in bad_ignores:
              print(
                  f"::error::audit-ignore entry {entry!r} has no reason -- the "
                  "required form is `GHSA-xxxx-xxxx-xxxx=why, and when it is "
                  "reviewed`"
              )
          for ident in sorted(set(ignores) - matched_ignores):
              print(
                  f"::warning::audit-ignore lists {ident}, which no current "
                  "high/critical advisory matches -- remove the stale suppression"
              )
          for line in warnings:
              print(f"::warning::{line}")
          for line in suppressed:
              print(f"::warning::{line}")
          for line in failures:
              print(f"::error::{line}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          headline = (
              f"dependency-audit: {len(failures)} fixable, {len(warnings)} unfixable, "
              f"{len(suppressed)} suppressed high/critical advisories "
              f"({len(records)} total advisories parsed)"
          )
          print(headline)
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(f"### Dependency audit\n\n{headline}\n\n")
                  for line in failures:
                      handle.write(f"- :x: {line}\n")
                  for line in warnings + suppressed:
                      handle.write(f"- :warning: {line}\n")
                  handle.write("\n")

          if bad_ignores:
              raise SystemExit(1)
          if failures:
              print(
                  "::error::dependency audit failed: a high/critical advisory "
                  "has a published fix. Upgrade it, or add "
                  "`audit-ignore: <GHSA-id>=<reason>` with a reason and a review date."
              )
              raise SystemExit(1)
          PYEOF_AUDIT

      # OPT-IN web-foundation conformance gate (company-hq
      # docs/WEB-FOUNDATION-CHECK.md §4/§5, D-WEBFOUND-2 Q5/Q9 (a), D-WEBFOUND-3).
      # Runs right after install so `foundation:check` inspects the checkout
      # this job just materialised. Two invocation paths, chosen from the
      # caller's own package.json:
      #   - already a dependency -> run the installed binary directly
      #     (`pnpm exec` / `npx --no-install`), no network fetch needed.
      #   - not a dependency     -> `pnpm dlx --package=...@<pin>` /
      #     `npx --yes -p ...@<pin>`, so a caller can turn this gate on
      #     WITHOUT first adopting the package as a dependency — §4 item 2's
      #     "mandatory package" rule is a separate, later gate this input
      #     must not silently force.
      # Both paths need registry auth for the live N-1 lookup. Rather than lean on
      # the install steps' `.npmrc.auth` (which "Remove package auth
      # materialization" above already deleted, and which an install-script
      # caller never creates at all), it writes a throwaway npmrc scoped to
      # this one command, from the SAME secret the callable already receives
      # — no new secret, per this input's own contract.
      #
      # The command itself never fails the step (`|| true`): per spec §5 the
      # JSON artefact from a FAILING run is the one the rollup most wants, so
      # it must always be produced and uploaded. "Evaluate web-foundation
      # conformance check" below applies the decided blocking rule.
      - name: Run web-foundation conformance check
        if: inputs.foundation-check
        env:
          PM: ${{ inputs.package-manager }}
          TOOL_VERSION: ${{ inputs.foundation-check-tool-version }}
          AUTH_SOURCE: ${{ inputs.foundation-check-auth }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: |
          set -uo pipefail
          # A failed credential resolve still leaves an artifact for the
          # always-upload/evaluate steps. Never reuse a prior run's output.
          : > foundation-check.json
          # workflows#109: a caller whose committed project .npmrc routes the
          # @narduk-enterprises scope to the anonymous npm.nard.uk mirror
          # (company-hq D-PKG-6; the same last-route rule as "Configure
          # package registry auth", workflows#106) needs no credential here
          # either. narduk-app-tools >= 0.10.0 (narduk-libs#499) follows that
          # .npmrc scope route for its live registry lookup, so the check runs
          # with no token at all, whether or not the caller forwards one.
          mirrored=$(node -e '
            const fs=require("fs")
            const npmrc=fs.existsSync(".npmrc")?fs.readFileSync(".npmrc","utf8"):""
            const routes=[...npmrc.matchAll(/^[ \t]*@narduk-enterprises:registry[ \t]*=[ \t]*"?([^"\s]*)"?[ \t]*$/gm)].map(m=>m[1])
            process.stdout.write(routes.length>0&&/^https:\/\/npm\.nard\.uk\/?$/.test(routes.at(-1))?"yes":"no")
          ' 2>/dev/null || echo no)
          if [ "$mirrored" = "yes" ]; then
            echo "@narduk-enterprises routes to https://npm.nard.uk; running foundation:check with no package-read credential"
            unset NARDUK_PLATFORM_GH_PACKAGES_READ GH_PACKAGES_READ NODE_AUTH_TOKEN
          elif ! GH_PACKAGES_READ=$(node --input-type=module <<'NODE'
          const secret = process.env.NARDUK_PLATFORM_GH_PACKAGES_READ;
          const valid = value => typeof value === 'string' && value.length > 0 && value === value.trim() && !/[\0\r\n]/.test(value);
          try {
            if (!valid(secret)) throw new Error('Package-read credential is missing or invalid.');
            let token;
            if (process.env.AUTH_SOURCE === 'package-token') {
              token = secret;
            } else if (process.env.AUTH_SOURCE === 'nvault') {
              const response = await fetch('https://api.nvault.nardukenterprises.com/v1/resolve', {
                method: 'POST',
                headers: { accept: 'application/json', authorization: `Bearer ${secret}`, 'content-type': 'application/json' },
                body: '{}', cache: 'no-store', credentials: 'omit', redirect: 'error',
                signal: AbortSignal.timeout(30000),
              });
              if (!response.ok) throw new Error(`nVault package-read resolve failed (HTTP ${response.status}).`);
              const payload = await response.json();
              token = payload?.data?.secrets?.GH_PACKAGES_READ;
            } else {
              throw new Error('foundation-check-auth must be package-token or nvault.');
            }
            if (!valid(token)) throw new Error('Resolved package-read credential is missing or invalid.');
            process.stdout.write(token);
          } catch {
            console.error('Unable to resolve foundation-check package-read credential.');
            process.exitCode = 1;
          }
          NODE
          ); then
            echo "::error::foundation-check registry authentication is unavailable"
            exit 0
          else
            echo "::add-mask::$GH_PACKAGES_READ"
            export GH_PACKAGES_READ
            # workflows#85: #79 renamed this step's exported credential from
            # NODE_AUTH_TOKEN to GH_PACKAGES_READ, but narduk-app-tools's own
            # item-2.3 live registry lookup (both the installed-binary branch
            # below, which writes no npmrc at all, and the pinned-dlx branch)
            # reads NODE_AUTH_TOKEN directly rather than going through either
            # npmrc's ${GH_PACKAGES_READ} templating. That silently broke
            # package-token-mode foundation-check for every v1 adopter refreshing
            # past afbaa6051e (buoys#39 reproduced it deterministically). This
            # repo's own README (`nuxt-cloudflare.yml` catalog entry) never
            # stopped documenting "supplies NODE_AUTH_TOKEN to both the
            # installed checker and the optional pinned download" -- #79 changed
            # the code without updating that contract. Export both names, same
            # value, until narduk-app-tools reads GH_PACKAGES_READ instead.
            export NODE_AUTH_TOKEN="$GH_PACKAGES_READ"
            unset NARDUK_PLATFORM_GH_PACKAGES_READ
          fi
          has_dep=$(node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}
              const blocks=["dependencies","devDependencies","optionalDependencies"]
              const present=blocks.some(b=>v[b]&&Object.prototype.hasOwnProperty.call(v[b],"@narduk-enterprises/narduk-app-tools"))
              process.stdout.write(present?"yes":"no")
            })' < package.json 2>/dev/null || echo no)
          if [ "$has_dep" = "yes" ]; then
            echo "@narduk-enterprises/narduk-app-tools is an existing dependency; running the installed binary"
            if [ "$PM" = "pnpm" ]; then
              pnpm exec narduk-app foundation:check --json > foundation-check.json || true
            else
              npx --no-install narduk-app foundation:check --json > foundation-check.json || true
            fi
          else
            echo "@narduk-enterprises/narduk-app-tools is not a dependency; running the pinned $TOOL_VERSION release via dlx"
            npmrc_file="$(mktemp)"
            trap 'rm -f "$npmrc_file"' EXIT
            if [ "$mirrored" = "yes" ]; then
              echo "@narduk-enterprises:registry=https://npm.nard.uk" > "$npmrc_file"
            else
              {
                echo "@narduk-enterprises:registry=https://npm.pkg.github.com"
                echo "//npm.pkg.github.com/:_authToken=\${GH_PACKAGES_READ}"
              } > "$npmrc_file"
            fi
            if [ "$PM" = "pnpm" ]; then
              NPM_CONFIG_USERCONFIG="$npmrc_file" NPM_CONFIG_GLOBALCONFIG=/dev/null \
                pnpm dlx --package "@narduk-enterprises/narduk-app-tools@${TOOL_VERSION}" \
                narduk-app foundation:check --json > foundation-check.json || true
            else
              NPM_CONFIG_USERCONFIG="$npmrc_file" NPM_CONFIG_GLOBALCONFIG=/dev/null \
                npx --yes -p "@narduk-enterprises/narduk-app-tools@${TOOL_VERSION}" \
                narduk-app foundation:check --json > foundation-check.json || true
            fi
          fi

      - name: Upload web-foundation conformance check artifact
        if: always() && inputs.foundation-check
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-check
          path: ${{ inputs.working-directory }}/foundation-check.json
          if-no-files-found: warn
          retention-days: 14

      # No warning tier (D-WEBFOUND-2 Q9 (a)): FAIL and UNKNOWN both block,
      # and an unreadable/missing artefact is treated the same as UNKNOWN —
      # a check that cannot see cannot pass (WEB-FOUNDATION-CHECK.md §5, "the
      # app's CI must treat [UNKNOWN] as a failure too").
      - name: Evaluate web-foundation conformance check
        if: always() && inputs.foundation-check
        run: |
          set -uo pipefail
          echo "## Web foundation conformance check" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s foundation-check.json ]; then
            echo "- :x: **UNKNOWN** — foundation:check produced no output" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::foundation:check produced no output — treating as UNKNOWN, which blocks (company-hq docs/WEB-FOUNDATION-CHECK.md §5)"
            exit 1
          fi
          result=$(node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              let v;try{v=JSON.parse(s)}catch{return process.stdout.write("PARSE_ERROR")}
              process.stdout.write(v&&typeof v.result==="string"?v.result:"PARSE_ERROR")
            })' < foundation-check.json)
          if [ "$result" = "PARSE_ERROR" ]; then
            echo "- :x: **UNKNOWN** — foundation-check.json is not a valid conformance artefact" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::foundation-check.json did not parse as a conformance artefact — treating as UNKNOWN, which blocks"
            exit 1
          fi
          case "$result" in
            PASS)
              echo "- :white_check_mark: **PASS** — every applicable web-foundation item passed" >> "$GITHUB_STEP_SUMMARY"
              ;;
            FAIL|UNKNOWN)
              echo "- :x: **$result** — see the uploaded \`foundation-check\` artifact for the failing/undecided items" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::web-foundation conformance check reported $result — blocking (D-WEBFOUND-2 Q9 (a), company-hq docs/WEB-FOUNDATION-CHECK.md §5)"
              exit 1
              ;;
            *)
              echo "- :x: **UNKNOWN** — unrecognized result \"$result\"" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::foundation:check reported an unrecognized result \"$result\" — treating as blocking"
              exit 1
              ;;
          esac

      # EVERY GATE BELOW PROBES BEFORE IT RUNS. `--if-present` reports a green
      # lane for a script that does not exist, so "ran nothing" and "passed"
      # are the same colour. Each gate therefore asks whether the script is
      # there first, and reacts per `require-scripts` (fail by default; warn
      # only when a caller explicitly opts out). An EMPTY script name differs
      # one: it is the caller declaring the lane absent, and is skipped
      # silently. See the `require-scripts` input for the migration contract.
      #
      # The inputs moved into `env:` in the same change. They used to be
      # interpolated straight into the shell text, which made every script
      # name a command-injection surface from the caller's `with:` block.
      - name: Build
        env:
          GATE: Build
          SCRIPT: ${{ inputs.build-script }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          if [ -z "$SCRIPT" ]; then
            echo "$GATE: no script name configured — caller declared this lane absent, skipping"
            exit 0
          fi
          # `npm pkg get` yields `{}` for a missing script and the bare JSON
          # value for a present one, so test the VALUE's type — never the
          # presence of a quote. Verified against real fixtures, including
          # colon-bearing names like `web:typecheck`, by
          # scripts/test_script_gates.py.
          raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
          present=$(printf '%s' "$raw" | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          if [ "$present" != "yes" ]; then
            msg="$GATE is enabled but no \"$SCRIPT\" script exists — this lane ran NOTHING"
            echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::$msg (require-scripts is on)"
              exit 1
            fi
            echo "::warning::$msg. Set require-scripts: true to make this a hard failure, or pass an empty script name to declare the lane absent."
            exit 0
          fi
          if [ "$PM" = "pnpm" ]; then pnpm run "$SCRIPT"; else npm run "$SCRIPT"; fi

      # After build, in the same lane, so a gate that needs build output does
      # not pay for a second install. Same contract as node-library.yml's
      # extra-scripts — including the presence probe, applied per script: an
      # extra-scripts entry is always something the caller wrote down by name,
      # so a typo in one of them is precisely the silent-loss case.
      - name: Extra scripts
        if: inputs.extra-scripts != ''
        env:
          GATE: Extra scripts
          SCRIPTS: ${{ inputs.extra-scripts }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          # Deliberate word splitting: extra-scripts is a space-separated list.
          # shellcheck disable=SC2086
          for SCRIPT in $SCRIPTS; do
            echo "::group::$SCRIPT"
            raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
            present=$(printf '%s' "$raw" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
            if [ "$present" != "yes" ]; then
              msg="$GATE names \"$SCRIPT\" but no such script exists — that entry ran NOTHING"
              echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
              if [ "$REQUIRE" = "true" ]; then
                echo "::error::$msg (require-scripts is on)"
                exit 1
              fi
              echo "::warning::$msg. Set require-scripts: true to make this a hard failure."
              echo "::endgroup::"
              continue
            fi
            if [ "$PM" = "pnpm" ]; then pnpm run "$SCRIPT"; else npm run "$SCRIPT"; fi
            echo "::endgroup::"
          done

      # Resolve only known Nuxt outputs. An ambiguous or absent build is an
      # error, never permission for each shard to compile its own application.
      - name: Resolve prebuilt E2E application
        id: e2e-build-path
        env:
          BUILD_PATH: ${{ inputs.e2e-build-artifact-path }}
          RUN_E2E: ${{ inputs.run-e2e }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          let output = process.env.BUILD_PATH
          if (output === 'auto') {
            if (process.env.RUN_E2E !== 'true') process.exit(0)
            const candidates = ['.output', 'apps/web/.output'].filter(p =>
              fs.existsSync(path.join(p, 'server/index.mjs')))
            if (candidates.length !== 1) {
              throw new Error('Expected exactly one Nuxt build (.output or apps/web/.output); set e2e-build-artifact-path explicitly for other layouts')
            }
            output = candidates[0]
          }
          if (!output) process.exit(0)
          if (path.isAbsolute(output) || output.split(/[\\/]/).some(p => p === '..') || /[\r\n]/.test(output) || output === '.') {
            throw new Error('e2e-build-artifact-path must name a relative build directory inside working-directory')
          }
          const resolved = fs.realpathSync(output)
          if (!resolved.startsWith(fs.realpathSync('.') + path.sep) || !fs.statSync(resolved).isDirectory()) {
            throw new Error('Build output must be a directory inside working-directory')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${output}\n`)
          NODE

      - name: Upload prebuilt E2E application
        id: e2e-build-upload
        if: steps.e2e-build-path.outputs.path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/${{ steps.e2e-build-path.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # Typecheck and unit tests run beside `build`, not inside it (workflows row 19,
  # CI critical path). Nothing downstream consumes their output, but while they
  # ran in `build` every E2E shard, the preview and the deploy dry run waited
  # for them before the prebuilt application was released: measured 15 s
  # typecheck + 6 s unit on buoys `Build`, 11 s + 6 s on riverstatus. The cost
  # is one more checkout, setup-node and install on the same runner class,
