name: Reusable Advisory Code Review

# Requests ONE containerized advisory code review for a pull request head, from
# the estate's ephemeral agent pool (agent-infrastructure#333, D-AGENT-POOL-1).
#
# THIS WORKFLOW IS ADVISORY AND DEFAULT-OFF. It has no `Required` job, it is
# never part of `ci / Required`, and it cannot fail a caller's CI. Every refusal
# path below exits SUCCESS with a `::notice::` explaining which one fired. That
# is a deliberate design property, not laziness: a review request that blocks a
# merge turns an optional quality aid into an outage whenever the pool, the
# credential broker, or the network is having a bad day. Advisory means advisory.
#
# `enabled` defaults to FALSE. A repo that calls this workflow without passing
# `enabled: true` gets a skipped job and dispatches nothing — so moving the `v1`
# tag to a commit carrying this file changes the behaviour of exactly zero
# adopters. Enabling is a per-repo, one-line opt-in.
#
# WHAT IT ACTUALLY DOES: at most one `repository_dispatch` (`agent-review-request`)
# at narduk-enterprises/agent-infrastructure, carrying the caller repository, the
# PR number, the head SHA, and the requested provider tier. Everything after that
# — allowlist, per-repo daily budget, pool admission, the review itself, and
# posting the findings back onto the PR — belongs to the dispatcher there. This
# workflow holds no pool knowledge and never waits for a result.
#
# THREE REFUSALS, all fail-open:
#   * label `no-ai-review` on the PR  -> opted out
#   * the PR head is a FORK           -> same-org only; a fork PR must not be
#                                        able to steer estate agent capacity
#   * no `AGENT_REVIEW_DISPATCH_NVAULT_TOKEN` -> adopter is not wired up yet
#
# RUNNER ROUTING: `runner` is a caller-controlled, JSON-encoded string input,
# decoded with fromJSON() at `runs-on:` — the same shape every other callable in
# this repository uses. It defaults to GitHub-hosted `ubuntu-latest`, and that
# default is deliberately NOT the self-hosted linux-ci route even though every
# realistic caller is a private estate repo that should pass it: this repository
# never defaults a caller onto estate infrastructure, because `runner` is
# free-form and a caller can go public later (README, workflows#2, D-VIS-1).
# Private org callers pass their manifest route verbatim, group included:
#
#   runner: '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}'
#
# resolved with, not hand-copied from:
#   python3 scripts/github_runner_fleet.py route \
#     --repository <owner/repo> --visibility private --workload linux-ci
#
# Refs narduk-enterprises/agent-infrastructure#333.

# Least privilege at the top so a job added later inherits it rather than the
# caller's grant. This workflow reads nothing and writes nothing through the
# Actions token. The caller carries only a read-only, config-scoped nVault
# service token; a short-lived GitHub App token is minted in memory per request.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      enabled:
        description: >-
          Master switch. FALSE by default: a caller that does not pass
          `enabled: true` gets a skipped job and no dispatch at all. This is
          what makes adopting the tag that carries this workflow a no-op for
          every repo that has not opted in.
        required: false
        type: boolean
        default: false
      review-tier:
        description: >-
          Provider tier the pool should serve this review from. Must name a
          tier declared in the pool contract
          (skills/proxmox-agent-execution/runtime/config/pool.json in
          agent-infrastructure). The dispatcher validates it; an unknown tier
          is refused there, not here.
        required: false
        type: string
        default: cheapest-capable
      runner:
        description: >-
          JSON-encoded runner for this job: a plain string ("ubuntu-latest"),
          a JSON array, or a JSON object
          ({"group":"linux-ci","labels":[...]}) matching the runner-fleet
          manifest's `runsOn` shape. Decoded with fromJSON(), so the value must
          be valid JSON — a bare string needs its own quotes. Defaults to
          GitHub-hosted ubuntu-latest. A PUBLIC (or possibly-future-public)
          CALLER MUST NEVER PASS A SELF-HOSTED LABEL.
        required: false
        type: string
        default: '"ubuntu-latest"'
    secrets:
      AGENT_REVIEW_DISPATCH_NVAULT_TOKEN:
        description: >-
          Read-only service token scoped only to
          github/prd/narduk-enterprises-lane-automation-app. The provider App
          credential never becomes an Actions secret; nVault exposes it only to
          the short-lived mint process. OPTIONAL on purpose (R7): an unwired
          caller gets a notice and a green job rather than a hard failure.
        required: false

jobs:
  request-review:
    name: Request advisory review
    # `enabled` is checked at job level so a repo that has not opted in shows a
    # single skipped job rather than a green job full of explanations. Every
    # OTHER refusal is checked inside the step, because "skipped" cannot say
    # WHY, and the difference between "opted out", "fork", and "no token" is
    # exactly what someone debugging a missing review needs to read.
    if: ${{ inputs.enabled }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Request one advisory review for this pull request head
        env:
          # The pool's home. Hardcoded rather than an input: the dispatcher,
          # the allowlist, the budget cap, and the SSH bridge to the Proxmox
          # host all live in this one repository, so a caller-supplied target
          # could only ever be wrong.
          DISPATCH_REPOSITORY: narduk-enterprises/agent-infrastructure
          DISPATCH_EVENT_TYPE: agent-review-request
          REVIEW_TIER: ${{ inputs.review-tier }}
          CALLER_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_OPTED_OUT: ${{ contains(github.event.pull_request.labels.*.name, 'no-ai-review') }}
          NVAULT_TOKEN: ${{ secrets.AGENT_REVIEW_DISPATCH_NVAULT_TOKEN }}
        run: |
          set -euo pipefail

          # No pull request in this event (a caller wired the review into a push
          # or schedule workflow). Nothing to review; say so and stop.
          if [ -z "${PR_NUMBER}" ]; then
            echo "::notice::review skipped: this event carries no pull request"
            exit 0
          fi

          if [ "${PR_OPTED_OUT}" = "true" ]; then
            echo "::notice::review skipped: opted out (label 'no-ai-review' on PR #${PR_NUMBER})"
            exit 0
          fi

          # Same-org PRs only. A fork's head repository differs from the caller
          # repository, and a fork PR must not be able to spend estate agent
          # capacity or aim a container at a branch nobody in the org controls.
          if [ "${PR_HEAD_REPOSITORY}" != "${CALLER_REPOSITORY}" ]; then
            echo "::notice::review skipped: PR #${PR_NUMBER} head is a fork (${PR_HEAD_REPOSITORY})"
            exit 0
          fi

          if [ -z "${NVAULT_TOKEN:-}" ]; then
            echo "::notice::review skipped: AGENT_REVIEW_DISPATCH_NVAULT_TOKEN is not available to this caller"
            exit 0
          fi

          if ! command -v nvault >/dev/null 2>&1; then
            echo "::warning::advisory review not requested: pinned nvault CLI is unavailable on this runner"
            exit 0
          fi
          if [ "$(nvault version 2>/dev/null || true)" != "0.1.0" ]; then
            echo "::warning::advisory review not requested: nvault CLI is not the reviewed 0.1.0 release"
            exit 0
          fi
          for tool in bash curl jq openssl; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              echo "::warning::advisory review not requested: required tool ${tool} is unavailable"
              exit 0
            fi
          done

          payload="${RUNNER_TEMP}/agent-review-dispatch.json"
          trap 'rm -f "${payload}"' EXIT
          umask 077

          python3 - "${payload}" <<'PY'
          import json, os, sys

          json.dump(
              {
                  "event_type": os.environ["DISPATCH_EVENT_TYPE"],
                  "client_payload": {
                      "repository": os.environ["CALLER_REPOSITORY"],
                      "pull_request": int(os.environ["PR_NUMBER"]),
                      "head_sha": os.environ["PR_HEAD_SHA"],
                      "tier": os.environ["REVIEW_TIER"],
                  },
              },
              open(sys.argv[1], "w", encoding="utf-8"),
          )
          PY

          # Resolve the provider App only inside nVault, downscope its one-hour
          # installation token to this repository plus Contents Write (the
          # repository_dispatch permission), and pass both JWT and installation
          # token to curl through stdin config. Neither credential enters argv,
          # a file, an Actions expression, an artifact, or the job summary.
          status=0
          http_code="$(
            nvault -p github -e prd -c narduk-enterprises-lane-automation-app run -- \
              bash -s -- "${payload}" "${DISPATCH_REPOSITORY}" <<'BASH'
          set -euo pipefail
          set +x
          payload_path="$1"
          dispatch_repository="$2"
          : "${APP_PRIVATE_KEY:?APP_PRIVATE_KEY is missing from nVault config}"
          : "${APP_ID:?APP_ID is missing from nVault config}"
          : "${INSTALLATION_ID:?INSTALLATION_ID is missing from nVault config}"

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          claims="$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$((now - 60))" "$((now + 540))" "${APP_ID}" | b64url)"
          signing_input="${header}.${claims}"
          signature="$(printf '%s' "${signing_input}" | openssl dgst -sha256 -sign <(printf '%s' "${APP_PRIVATE_KEY}") | b64url)"
          app_jwt="${signing_input}.${signature}"
          mint_payload='{"repositories":["agent-infrastructure"],"permissions":{"contents":"write"}}'

          response="$(
            printf 'header = "Authorization: Bearer %s"\n' "${app_jwt}" |
              curl --fail-with-body --silent --show-error --request POST \
                --config - \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/json" \
                --max-time 20 --retry 2 --retry-connrefused \
                --data "${mint_payload}" \
                "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens"
          )"
          installation_token="$(
            printf '%s' "${response}" |
              jq -er '
                if (.permissions == {"contents":"write","metadata":"read"})
                   and (.repositories | length == 1)
                   and (.repositories[0].full_name == "narduk-enterprises/agent-infrastructure")
                then .token
                else empty
                end
              '
          )"
          [ -n "${installation_token}" ]

          printf 'header = "Authorization: Bearer %s"\n' "${installation_token}" |
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --config - \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --max-time 20 --retry 2 --retry-connrefused \
              --data "@${payload_path}" \
              "https://api.github.com/repos/${dispatch_repository}/dispatches"
          BASH
          )" || status=$?

          # Every failure below is a warning, never an error. See the header:
          # an advisory review that can redden a caller's CI is a liability.
          if [ "${status}" -ne 0 ]; then
            echo "::warning::advisory review not requested: credential broker or dispatch call failed (exit ${status})"
            exit 0
          fi
          if [ "${http_code}" != "204" ]; then
            echo "::warning::advisory review not requested: ${DISPATCH_REPOSITORY} dispatch returned HTTP ${http_code}"
            exit 0
          fi

          echo "::notice::advisory review requested for ${CALLER_REPOSITORY}#${PR_NUMBER} at ${PR_HEAD_SHA} (tier ${REVIEW_TIER})"
