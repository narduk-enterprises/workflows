name: Reusable Advisory Code Review

# Requests ONE containerized advisory code review for a pull request head, from
# the estate's ephemeral agent pool (agent-infrastructure#333, D-AGENT-POOL-1).
#
# THIS WORKFLOW IS ADVISORY AND DEFAULT-OFF. It has no `Required` job, it is
# never part of `ci / Required`, and it cannot fail a caller's CI. Every refusal
# path below exits SUCCESS with a `::notice::` explaining which one fired. That
# is a deliberate design property, not laziness: a review request that blocks a
# merge turns an optional quality aid into an outage whenever the pool, the
# dispatch token, or the network is having a bad day. Advisory means advisory.
#
# `enabled` defaults to FALSE. A repo that calls this workflow without passing
# `enabled: true` gets a skipped job and dispatches nothing — so moving the `v1`
# tag to a commit carrying this file changes the behaviour of exactly zero
# adopters. Enabling is a per-repo, one-line opt-in.
#
# WHAT IT ACTUALLY DOES: at most one `repository_dispatch` (`agent-review-request`)
# at narduk-enterprises/agent-infrastructure, carrying the caller repository, the
# PR number, the head SHA, and the requested provider tier. Everything after that
# — allowlist, per-repo daily budget, pool admission, the review itself, and
# posting the findings back onto the PR — belongs to the dispatcher there. This
# workflow holds no pool knowledge and never waits for a result.
#
# THREE REFUSALS, all fail-open:
#   * label `no-ai-review` on the PR  -> opted out
#   * the PR head is a FORK           -> same-org only; a fork PR must not be
#                                        able to steer estate agent capacity
#   * no `AGENT_REVIEW_DISPATCH_TOKEN` -> the adopter has not been wired up yet
#
# RUNNER ROUTING: `runner` is a caller-controlled, JSON-encoded string input,
# decoded with fromJSON() at `runs-on:` — the same shape every other callable in
# this repository uses. Its default is EMPTY, resolved per run from the
# caller's own visibility (workflows row 18 Q3, Logan 2026-09-18 "Flip the
# default"): `github.event.repository.private == true` selects the linux-ci
# organization-group route below, anything else selects GitHub-hosted
# `ubuntu-latest`. The earlier hosted-only default guarded against a caller
# going public later (README, workflows#2, D-VIS-1); reading visibility at run
# time covers that case directly, so a public caller still never lands on
# estate infrastructure. Private org callers may still pass their manifest
# route verbatim, group included, and an explicit value always wins:
#
#   runner: '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}'
#
# resolved with, not hand-copied from:
#   python3 scripts/github_runner_fleet.py route \
#     --repository <owner/repo> --visibility private --workload linux-ci
#
# Refs narduk-enterprises/agent-infrastructure#333.

# Least privilege at the top so a job added later inherits it rather than the
# caller's grant. This workflow reads nothing and writes nothing through the
# Actions token — the cross-repo dispatch travels on the caller's own secret.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      enabled:
        description: >-
          Master switch. FALSE by default: a caller that does not pass
          `enabled: true` gets a skipped job and no dispatch at all. This is
          what makes adopting the tag that carries this workflow a no-op for
          every repo that has not opted in.
        required: false
        type: boolean
        default: false
      review-tier:
        description: >-
          Provider tier the pool should serve this review from. Must name a
          tier declared in the pool contract
          (skills/proxmox-agent-execution/runtime/config/pool.json in
          agent-infrastructure). The dispatcher validates it; an unknown tier
          is refused there, not here.
        required: false
        type: string
        default: cheapest-capable
      runner:
        description: >-
          JSON-encoded runner for this job: a plain string ("ubuntu-latest"),
          a JSON array, or a JSON object ({"group":"linux-ci","labels":[...]})
          matching the runner-fleet manifest's `runsOn` shape. Decoded with
          fromJSON(), so the value must be valid JSON — a bare string needs
          its own quotes. Empty (the default) routes a PRIVATE caller to the
          fleet manifest's linux-ci organization-group route (group AND
          labels) and a public or visibility-unknown caller to GitHub-hosted
          ubuntu-latest; an explicit value always wins. A private caller
          outside the manifest's linux-ci group must be added to it (or pass
          '"ubuntu-latest"' explicitly), or its jobs queue with no eligible
          runner. A PUBLIC (or possibly-future-public) CALLER MUST NEVER PASS
          A SELF-HOSTED LABEL.
        required: false
        type: string
        default: ''
    secrets:
      AGENT_REVIEW_DISPATCH_TOKEN:
        description: >-
          Token authorized to POST /repos/narduk-enterprises/agent-infrastructure/dispatches.
          OPTIONAL on purpose (R7): a caller that has not been granted it gets a
          `::notice::` and a green job rather than a hard failure. That is the
          correct behaviour for an advisory feature — the alternative is that
          every repo which enables the review before the org secret reaches it
          starts failing CI for a review it was never going to get.
        required: false

jobs:
  request-review:
    name: Request advisory review
    # `enabled` is checked at job level so a repo that has not opted in shows a
    # single skipped job rather than a green job full of explanations. Every
    # OTHER refusal is checked inside the step, because "skipped" cannot say
    # WHY, and the difference between "opted out", "fork", and "no token" is
    # exactly what someone debugging a missing review needs to read.
    if: ${{ inputs.enabled }}
    # ---------------------------------------------------------------------
    # Blacksmith overflow (D-CI-CAP-1 (c), extends D-BLACKSMITH-2; company-hq
    # DECISIONS.md, fleet#337). Manual, kill-switched overflow for the
    # `linux-ci` class's ordinary private CI -- never deploy or tailnet work.
    # The org Actions variable `BLACKSMITH_RUNNERS_ENABLED` (default `false`,
    # visibility: private repos) is the switch; a repo-level variable of the
    # same name overrides it for exactly that repo (GitHub's normal
    # repo > org precedence), which is how a canary is scoped to one adopter
    # without moving the org default. Exact `true` selects the vendor's
    # documented `blacksmith-2vcpu-ubuntu-2404` label (override via
    # `vars.BLACKSMITH_LINUX_LABEL`) -- a label-only route, per D-BLACKSMITH-4:
    # provider-created runner groups are not a stable contract and are never
    # pinned here. The route compared and used is the EFFECTIVE one: an
    # explicit `inputs.runner`, else (empty default) the linux-ci group route
    # for a private caller and `"ubuntu-latest"` for a public or
    # visibility-unknown one. Any effective `"ubuntu-latest"` keeps that
    # hosted route -- this never touches a public repo's runner. This is a
    # MANUAL switch, not automatic provider fallback: GitHub does not move an
    # already-queued job to another runs-on target, so the fallback is
    # flipping the variable back to false (or deleting the repo override) and
    # rerunning. Kill conditions (D-BLACKSMITH-2/3, unchanged by this
    # extension): disable at 2,400 equivalent 2-vCPU minutes in a monthly
    # cycle, at any non-zero amount due, or on any unexpected billing state --
    # whichever comes first. No payment method or paid overage is authorized.
    # Policy-exception annotation (CI-RUNNER-POLICY.md Sec 2 exception 4, as
    # expanded by D-CI-CAP-1 (c)): a job landing on Blacksmith here is
    # exercising that named exception, not drift.
    # ---------------------------------------------------------------------
    runs-on: ${{ fromJSON(vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"') != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || (inputs.runner || github.event.repository.private == true && '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}' || '"ubuntu-latest"')) }}
    # Headroom for the linux-ci capacity-hook slot wait (up to 900s, counts against timeout-minutes) -- fleet#276.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Request one advisory review for this pull request head
        env:
          # The pool's home. Hardcoded rather than an input: the dispatcher,
          # the allowlist, the budget cap, and the SSH bridge to the Proxmox
          # host all live in this one repository, so a caller-supplied target
          # could only ever be wrong.
          DISPATCH_REPOSITORY: narduk-enterprises/agent-infrastructure
          DISPATCH_EVENT_TYPE: agent-review-request
          REVIEW_TIER: ${{ inputs.review-tier }}
          CALLER_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_OPTED_OUT: ${{ contains(github.event.pull_request.labels.*.name, 'no-ai-review') }}
          AGENT_REVIEW_DISPATCH_TOKEN: ${{ secrets.AGENT_REVIEW_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          # No pull request in this event (a caller wired the review into a push
          # or schedule workflow). Nothing to review; say so and stop.
          if [ -z "${PR_NUMBER}" ]; then
            echo "::notice::review skipped: this event carries no pull request"
            exit 0
          fi

          if [ "${PR_OPTED_OUT}" = "true" ]; then
            echo "::notice::review skipped: opted out (label 'no-ai-review' on PR #${PR_NUMBER})"
            exit 0
          fi

          # Same-org PRs only. A fork's head repository differs from the caller
          # repository, and a fork PR must not be able to spend estate agent
          # capacity or aim a container at a branch nobody in the org controls.
          if [ "${PR_HEAD_REPOSITORY}" != "${CALLER_REPOSITORY}" ]; then
            echo "::notice::review skipped: PR #${PR_NUMBER} head is a fork (${PR_HEAD_REPOSITORY})"
            exit 0
          fi

          if [ -z "${AGENT_REVIEW_DISPATCH_TOKEN}" ]; then
            echo "::notice::review skipped: AGENT_REVIEW_DISPATCH_TOKEN is not available to this caller"
            exit 0
          fi

          payload="${RUNNER_TEMP}/agent-review-dispatch.json"
          curl_config="${RUNNER_TEMP}/agent-review-curl.conf"
          trap 'rm -f "${payload}" "${curl_config}"' EXIT
          umask 077

          python3 - "${payload}" <<'PY'
          import json, os, sys

          json.dump(
              {
                  "event_type": os.environ["DISPATCH_EVENT_TYPE"],
                  "client_payload": {
                      "repository": os.environ["CALLER_REPOSITORY"],
                      "pull_request": int(os.environ["PR_NUMBER"]),
                      "head_sha": os.environ["PR_HEAD_SHA"],
                      "tier": os.environ["REVIEW_TIER"],
                  },
              },
              open(sys.argv[1], "w", encoding="utf-8"),
          )
          PY

          # The credential goes in a 0600 curl config, never in argv: on a
          # self-hosted guest every listener runs as the same `runner` user and
          # can read /proc/<pid>/cmdline.
          printf 'header = "Authorization: Bearer %s"\n' "${AGENT_REVIEW_DISPATCH_TOKEN}" >"${curl_config}"
          chmod 600 "${curl_config}"

          status=0
          http_code="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --config "${curl_config}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --max-time 20 --retry 2 --retry-connrefused \
              --data "@${payload}" \
              "https://api.github.com/repos/${DISPATCH_REPOSITORY}/dispatches"
          )" || status=$?

          # Every failure below is a warning, never an error. See the header:
          # an advisory review that can redden a caller's CI is a liability.
          if [ "${status}" -ne 0 ]; then
            echo "::warning::advisory review not requested: dispatch call failed (curl exit ${status})"
            exit 0
          fi
          if [ "${http_code}" != "204" ]; then
            echo "::warning::advisory review not requested: ${DISPATCH_REPOSITORY} dispatch returned HTTP ${http_code}"
            exit 0
          fi

          echo "::notice::advisory review requested for ${CALLER_REPOSITORY}#${PR_NUMBER} at ${PR_HEAD_SHA} (tier ${REVIEW_TIER})"
