name: CANARY design-ledger full grant (remove before merge)
on:
  pull_request:
permissions:
  contents: read
jobs:
  design-ledger:
    uses: ./.github/workflows/design-ledger.yml
    permissions:
      contents: read
      issues: write
    with:
      ledger: .canary/design-ledger/ledger.json
  design-ledger-flag:
    uses: ./.github/workflows/design-ledger.yml
    permissions:
      contents: read
      issues: write
    with:
      ledger: .canary/design-ledger/ledger.json
      mode: flag
