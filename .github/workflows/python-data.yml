name: Reusable Python Data CI

# CI gate for the Python / data-pipeline repo family (narduk-data and the
# repos the reshape creates around it). Fills the second half of the gap
# company-hq#173 (R-14) names: the Apple and Python-data families were not
# lagging on adoption, they had no target, so the duplication was structural.
#
# DESIGNED AGAINST narduk-data, NOT AGAINST AN IDEA OF ONE (per the #173 audit
# comment, which names narduk-data a real design input rather than a
# hypothetical adopter). Its four workflows pull in different directions —
# ci.yml is pip/venv/pytest, earth-data-ci.yml is path-filtered `uv` in a
# nested working directory, runner-canary.yml is a disposable post-transfer
# probe, and schema-gate.yml is a cross-repo Swift/Python contract test that
# straddles the Apple/Python boundary this file and apple.yml split between
# them. So the bar this file is built for is the honest one: the APPLICABLE
# generic workflows move, not every workflow in the repo. schema-gate.yml
# stays bespoke under either template, by design.
#
# Both dependency managers are first-class for the same reason: narduk-data
# uses pip in ci.yml and uv in earth-data-ci.yml, and a template that supports
# only one would leave half the flagship repo unable to adopt.
#
# THE `extra-checks` INPUT EXISTS BECAUSE OF A REAL LOSS. A caller cannot add
# steps to a called workflow's job, so any repo-specific gate that must run
# against the installed environment (earth-data's corpus-catalog schema
# validation and its deploy-cutover self-test both do) would otherwise have to
# stay behind as a second job that duplicates the whole install — or be
# dropped, which is worse. It runs inside the same environment, after the
# tests, and is covered by `ci / Required`.
#
# NO SECRETS ARE DECLARED. This workflow takes no `secrets:` at all, so
# nothing it runs can reach a caller's credentials even by accident — a
# reusable workflow only receives what it declares (there is no ambient
# inheritance without `secrets: inherit`). narduk-data's cross-repo gates that
# genuinely need GEO_SCHEMA_GATE_PAT keep their own workflow rather than
# widening this one; a data-pipeline CI gate is exactly where a broad token
# should not be.
#
# TOOLCHAINS ARE PROVISIONED EXPLICITLY, never assumed. A runner label
# describes registration, not the service PATH (agent-infrastructure issue
# #32), so uv, Python and ruff are each installed by a step rather than
# inherited from the host.
#
# THE "Required" CONVENTION (this is the point of this repo): this workflow's
# last job is named exactly `Required`, `needs:` every other job, runs with
# `if: always()`, and fails unless each needed job succeeded or was
# intentionally skipped (an opted-out input, never a silent pass). Callers
# name their calling job id `ci`, so GitHub composes the identical required
# check context `ci / Required` on every adopting repo. See README.
#
# RUNNER ROUTING: `runner` is a caller-controlled, JSON-encoded string input —
# a plain string ("ubuntu-latest"), a JSON array, or a JSON object matching
# Config/github-runner-fleet.json's `runsOn` shape — decoded with fromJSON()
# at each job's `runs-on:`. Resolve it with
# `python3 scripts/github_runner_fleet.py route` in agent-infrastructure and
# paste the returned `runsOn` verbatim; never hand-copy labels. A caller that
# is public — or that may become public — must never pass a self-hosted label,
# because a fork PR would then execute attacker-controlled code on estate
# infrastructure. That rule holds regardless of this repo's own visibility
# (private, org-scoped Actions access, per D-VIS-1): `runner` is a free-form
# caller-supplied value and this workflow cannot police it.

# Least-privilege baseline for every job in this workflow. A called workflow's
# token is capped by the caller's grant and can only be narrowed from here,
# never widened — so this costs a caller nothing and protects against the one
# real failure mode: a job added later that forgets its own `permissions:` and
# would otherwise inherit whatever the caller happened to grant.
#
# It has no runtime effect today, deliberately: every job below already
# declares its own block, and job-level `permissions:` REPLACES the workflow
# level rather than merging with it. That is also why this is not a way to
# tighten the jobs that need `packages: read` — narrowing them here would do
# nothing, and narrowing them at job level makes the run fail to START with
# `startup_failure` and no logs at all (found during software-delivery's
# adoption). Job-level grants below are audited, not inherited.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          JSON-encoded runner for every job in this workflow: a plain string
          ("ubuntu-latest"), a JSON array
          (["self-hosted","Linux","X64","proxmox","linux-ci"]), or a JSON
          object ({"group":"linux-ci","labels":[...]}) matching the
          runner-fleet manifest's `runsOn` shape. Decoded with fromJSON(), so
          the value must be valid JSON — a bare string needs its own quotes.
          Defaults to GitHub-hosted ubuntu-latest.
        required: false
        type: string
        default: '"ubuntu-latest"'
      python-version:
        description: "Python version to provision"
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: "Directory containing pyproject.toml / uv.lock — every step runs from here"
        required: false
        type: string
        default: "."
      dependency-manager:
        description: "Dependency manager: uv or pip"
        required: false
        type: string
        default: "uv"
      venv-path:
        description: >-
          Virtual environment path, relative to working-directory. Set as
          UV_PROJECT_ENVIRONMENT in uv mode and created by `python -m venv` in
          pip mode; its bin/ is prepended to PATH for every later step, so
          `extra-checks` can cd anywhere and still run the installed
          environment. Keep it off the shared runner's default `.venv` when
          the repo has one (narduk-data uses `.venv-ci`).
        required: false
        type: string
        default: ".venv"
      uv-sync-args:
        description: "Arguments appended to `uv sync` (uv mode only)"
        required: false
        type: string
        default: "--locked --extra test"
      check-lock:
        description: >-
          Run `uv lock --check` before syncing (uv mode only) so a lockfile
          that drifted from pyproject.toml fails loudly instead of being
          silently re-resolved.
        required: false
        type: boolean
        default: true
      pip-install-args:
        description: >-
          Arguments passed to `python -m pip install` (pip mode only), e.g.
          `-e ".[test]"` or `pytest pillow`. Empty installs nothing.
        required: false
        type: string
        default: ""
      run-ruff:
        description: >-
          Run `ruff check` on the lint job. Opt-in: pointing ruff at a repo
          that has never had a static-analysis gate is usually red on first
          contact, and a template should not decide for the caller when to
          take that on.
        required: false
        type: boolean
        default: false
      run-pyright:
        description: >-
          Run real static type analysis with Pyright in the installed project
          environment. Opt-in for backward compatibility, but unlike
          py_compile this checks names and types rather than syntax alone.
        required: false
        type: boolean
        default: false
      pyright-version:
        description: "Exact Pyright version; pinned so tool drift cannot change the gate"
        required: false
        type: string
        default: "1.1.411"
      pyright-args:
        description: "Arguments passed to Pyright from working-directory"
        required: false
        type: string
        default: "."
      ruff-version:
        description: "Exact ruff version to install — pinned, so a ruff release cannot turn a green repo red"
        required: false
        type: string
        default: "0.15.18"
      ruff-paths:
        description: "Paths passed to `ruff check`, relative to working-directory"
        required: false
        type: string
        default: "."
      run-tests:
        description: "Run pytest"
        required: false
        type: boolean
        default: true
      test-command:
        description: >-
          Command that runs the test suite, from working-directory with the
          environment's bin/ on PATH. Override it for a repo that needs
          several isolated pytest invocations or `unittest discover`.
        required: false
        type: string
        default: "python -m pytest tests -q"
      extra-checks:
        description: >-
          Extra shell run after the tests, from working-directory, with the
          installed environment on PATH. The home for repo-specific gates that
          must see the installed package (schema validation, deploy self-tests)
          and would otherwise need a second job duplicating the whole install.
          May cd elsewhere. Empty skips it.
        required: false
        type: string
        default: ""
      extra-env:
        description: >-
          Newline-separated KEY=VALUE pairs exported to $GITHUB_ENV for the
          test job before anything installs — for the environment a suite needs
          but a template cannot guess (narduk-data's earth-data tenant sets
          PYTHONPATH to the workspace root to make a monorepo ownership
          boundary explicit, which is `PYTHONPATH=$GITHUB_WORKSPACE`).
          `$NAME` and `${NAME}` are expanded ON THE RUNNER against its
          environment; nothing else is — no $(...), no backticks, no
          ${NAME:-default}, no globbing. WRITE RUNNER PATHS AS $GITHUB_WORKSPACE,
          NEVER AS A `github.workspace` CALLER EXPRESSION: that is evaluated
          in the caller, where a `uses:` job has no runner and it expands to the
          empty string (workflows#4). See the README for both spellings. An empty or empty-expanding value is a hard
          error rather than a silently-unset variable. Values must not be
          secrets: this workflow declares none, and $GITHUB_ENV is not a secret
          store.
        required: false
        type: string
        default: ""
      test-timeout-minutes:
        description: "Timeout for the test job"
        required: false
        type: number
        default: 30
      fetch-depth:
        description: "actions/checkout fetch-depth"
        required: false
        type: number
        default: 1

jobs:
  lint:
    name: lint
    if: inputs.run-ruff
    # ---------------------------------------------------------------------
    # Blacksmith overflow (D-CI-CAP-1 (c), extends D-BLACKSMITH-2; company-hq
    # DECISIONS.md, fleet#337). Manual, kill-switched overflow for the
    # `linux-ci` class's ordinary private CI -- never deploy or tailnet work.
    # The org Actions variable `BLACKSMITH_RUNNERS_ENABLED` (default `false`,
    # visibility: private repos) is the switch; a repo-level variable of the
    # same name overrides it for exactly that repo (GitHub's normal
    # repo > org precedence), which is how a canary is scoped to one adopter
    # without moving the org default. Exact `true` selects the vendor's
    # documented `blacksmith-2vcpu-ubuntu-2404` label (override via
    # `vars.BLACKSMITH_LINUX_LABEL`) -- a label-only route, per D-BLACKSMITH-4:
    # provider-created runner groups are not a stable contract and are never
    # pinned here. Any other value, and any caller still on the public
    # `"ubuntu-latest"` default, keeps the caller's own `inputs.runner` route
    # unchanged -- this never touches a public repo's runner. This is a
    # MANUAL switch, not automatic provider fallback: GitHub does not move an
    # already-queued job to another runs-on target, so the fallback is
    # flipping the variable back to false (or deleting the repo override) and
    # rerunning. Kill conditions (D-BLACKSMITH-2/3, unchanged by this
    # extension): disable at 2,400 equivalent 2-vCPU minutes in a monthly
    # cycle, at any non-zero amount due, or on any unexpected billing state --
    # whichever comes first. No payment method or paid overage is authorized.
    # Policy-exception annotation (CI-RUNNER-POLICY.md Sec 2 exception 4, as
    # expanded by D-CI-CAP-1 (c)): a job landing on Blacksmith here is
    # exercising that named exception, not drift.
    # ---------------------------------------------------------------------
    runs-on: ${{ fromJSON(vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && inputs.runner != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || inputs.runner) }}
    # Headroom for the linux-ci capacity-hook slot wait (up to 900s, counts against timeout-minutes) -- fleet#276.
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==${{ inputs.ruff-version }}"

      - name: Ruff
        run: ruff check ${{ inputs.ruff-paths }}

  test:
    name: test
    # Blacksmith overflow (see the block above this file's first routed job) -- D-CI-CAP-1 (c)/D-BLACKSMITH-2, fleet#337.
    runs-on: ${{ fromJSON(vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && inputs.runner != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || inputs.runner) }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      UV_PROJECT_ENVIRONMENT: ${{ inputs.venv-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Validate dependency manager and fail-capable gates
        env:
          DEPENDENCY_MANAGER: ${{ inputs.dependency-manager }}
          EXTRA_CHECKS: ${{ inputs.extra-checks }}
          RUN_PYRIGHT: ${{ inputs.run-pyright }}
          RUN_TESTS: ${{ inputs.run-tests }}
        run: |
          set -euo pipefail
          case "$DEPENDENCY_MANAGER" in
            uv | pip) ;;
            *)
              echo "::error::dependency-manager must be uv or pip (got '$DEPENDENCY_MANAGER')"
              exit 1
              ;;
          esac
          if [ "$RUN_TESTS" != "true" ] && [ "$RUN_PYRIGHT" != "true" ] && [ -z "$EXTRA_CHECKS" ]; then
            echo "::error::python-data test job must run pytest, Pyright, or extra-checks; install-only is not a gate"
            exit 1
          fi

      # `extra-env` values are expanded HERE, on the runner, not in the caller
      # (workflows#4). The caller cannot do it: a `jobs.<id>.uses:` job is never
      # assigned a runner, so `${{ github.workspace }}` in the caller's `with:`
      # block expands to the EMPTY STRING. Before this step expanded anything,
      # the documented motivating example — narduk-data's earth-data tenant
      # setting PYTHONPATH to the workspace root — was not expressible at all:
      # the runner received `PYTHONPATH=`, this step happily accepted it as a
      # well-formed KEY=VALUE, and the failure surfaced four steps later as
      # `ModuleNotFoundError: No module named 'pipelines'` with nothing anywhere
      # naming `extra-env` (narduk-data run 30168242438).
      #
      # WHAT IS EXPANDED, EXACTLY: `$NAME` and `${NAME}` against the runner's
      # environment. Nothing else. No `$(...)`, no backticks, no
      # `${NAME:-default}`, no globbing, no `eval`, no `envsubst` (which is not
      # guaranteed on the self-hosted LXC images). A `$` that is not followed by
      # a valid identifier stays literal. Each of those is unit-tested.
      #
      # This is not a new attack surface — `test-command` and `extra-checks` are
      # already caller-supplied shell that runs verbatim — but it is deliberate
      # and bounded rather than an `eval`, so a caller cannot turn an
      # environment variable into command execution.
      #
      # AND AN EMPTY RESULT IS NOW A HARD ERROR, before it can become a
      # confusing test failure somewhere else. That covers both the raw `KEY=`
      # the caller trap produces and the subtler `KEY=$UNSET_VAR`.
      - name: Export caller environment
        if: inputs.extra-env != ''
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: |
          set -euo pipefail

          # SC2016 (expressions don't expand in single quotes) is the POINT of
          # this function: the single-quoted fragments below are literal text
          # being reconstructed, not references meant to expand.
          # shellcheck disable=SC2016
          expand_runtime_refs() {
            local s=$1 out='' name
            while [[ $s == *'$'* ]]; do
              out+=${s%%\$*}
              s=${s#*\$}
              if [[ $s == \{* ]]; then
                if [[ $s != *\}* ]]; then out+='${'; s=${s#\{}; continue; fi
                name=${s#\{}; name=${name%%\}*}
                if [[ ! $name =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                  out+='${'"$name"'}'; s=${s#*\}}; continue
                fi
                s=${s#*\}}
              elif [[ $s =~ ^([A-Za-z_][A-Za-z0-9_]*) ]]; then
                name=${BASH_REMATCH[1]}; s=${s#"$name"}
              else
                out+='$'; continue
              fi
              out+=${!name-}
            done
            printf '%s' "$out$s"
          }

          # Read from a file, not a pipe: a `while` on the right of a pipe runs
          # in a subshell, so it cannot accumulate a status across lines and
          # report EVERY bad line in one go.
          printf '%s\n' "$EXTRA_ENV" > "$RUNNER_TEMP/extra-env.in"
          status=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            case "$line" in
              *=*) ;;
              *) echo "::error::extra-env line is not KEY=VALUE: $line"; status=1; continue ;;
            esac
            key=${line%%=*}
            value=${line#*=}

            if [[ ! $key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::extra-env key is not a valid environment variable name: '$key'"
              status=1; continue
            fi
            if [ -z "$value" ]; then
              echo "::error::extra-env value for '$key' is empty. If you wrote something like"
              echo "::error::  extra-env: PYTHONPATH=<a github.workspace caller expression>"
              echo "::error::that expands in the CALLER, where a \`uses:\` job has no runner and"
              echo "::error::github.workspace is the empty string. Write PYTHONPATH=\$GITHUB_WORKSPACE"
              echo "::error::instead — this step expands runner variables itself."
              status=1; continue
            fi

            expanded=$(expand_runtime_refs "$value")

            if [ -z "$expanded" ]; then
              echo "::error::extra-env value for '$key' expanded to nothing (from '$value')."
              echo "::error::Every variable it references is unset on this runner."
              status=1; continue
            fi
            case "$expanded" in
              *$'\n'*)
                echo "::error::extra-env value for '$key' expanded to a multi-line value;"
                echo "::error::writing it to \$GITHUB_ENV would inject additional variables."
                status=1; continue
                ;;
            esac

            printf '%s=%s\n' "$key" "$expanded" >> "$GITHUB_ENV"
            echo "exported $key"
          done < "$RUNNER_TEMP/extra-env.in"
          exit "$status"

      - name: Install uv
        if: inputs.dependency-manager == 'uv'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ inputs.python-version }}
          # `enable-cache` is deliberately left at its `auto` default: auto
          # means "on for GitHub-hosted, off for self-hosted", which is
          # already the right answer. A self-hosted linux-ci guest keeps
          # `~/.cache/uv` between jobs, so uploading a tarball of it would add
          # cost to a cache that is already warm on disk. Forcing
          # `enable-cache: true` here would be a regression for the only
          # current adopter (narduk-data, on linux-ci).
          #
          # `save-cache` is gated for the hosted case, for the same reason the
          # Node workflows here split restore from save (company-hq#269): a
          # cache written on `refs/pull/N/merge` is restorable only by that
          # one pull request, so the write is paid and never read. Restoring
          # stays on for every ref and falls back to the default-branch entry.
          save-cache: ${{ github.ref_name == github.event.repository.default_branch }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.dependency-manager == 'pip'
        with:
          python-version: ${{ inputs.python-version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.run-pyright
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check lockfile is up to date
        if: inputs.dependency-manager == 'uv' && inputs.check-lock
        run: uv lock --check

      - name: Install project (uv)
        if: inputs.dependency-manager == 'uv'
        run: uv sync ${{ inputs.uv-sync-args }}

      - name: Install project (pip)
        if: inputs.dependency-manager == 'pip'
        run: |
          set -euo pipefail
          python3 -m venv "${{ inputs.venv-path }}"
          "${{ inputs.venv-path }}/bin/python" -m pip install --disable-pip-version-check -U pip
          if [ -n "${{ inputs.pip-install-args }}" ]; then
            "${{ inputs.venv-path }}/bin/python" -m pip install ${{ inputs.pip-install-args }}
          fi

      - name: Put the environment on PATH
        run: |
          set -euo pipefail
          # Prepending to $GITHUB_PATH rather than `source .../activate` in
          # every step: activation dies with the step's shell, and later steps
          # (extra-checks especially) may run from a different directory.
          bin="$PWD/${{ inputs.venv-path }}/bin"
          if [ ! -x "$bin/python" ]; then
            echo "::error::no interpreter at $bin/python after install — check venv-path"
            exit 1
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/python" --version

      - name: Install pinned Pyright
        if: inputs.run-pyright
        env:
          PYRIGHT_VERSION: ${{ inputs.pyright-version }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/python-data-pyright"
          npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund "pyright@${PYRIGHT_VERSION}"
          bin="$prefix/node_modules/.bin"
          if [ ! -x "$bin/pyright" ]; then
            echo "::error::Pyright binary is missing after pinned install"
            exit 1
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/pyright" --version

      - name: Pyright
        if: inputs.run-pyright
        run: pyright ${{ inputs.pyright-args }}

      - name: Run tests
        if: inputs.run-tests
        run: ${{ inputs.test-command }}

      - name: Extra checks
        if: inputs.extra-checks != ''
        run: ${{ inputs.extra-checks }}

  required:
    name: Required
    if: always()
    needs: [lint, test]
    # Organization-wide lightweight route; unset preserves the caller fallback.
    runs-on: ${{ fromJSON(vars.CI_LIGHTWEIGHT_RUNNER || (vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && inputs.runner != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || inputs.runner)) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require the test/static job to succeed and the lint gate to succeed-or-skip
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          status=0
          # test has no `if:` — it must always report success.
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::test job reported '$TEST_RESULT' (must succeed)"
            status=1
          fi
          # lint is opt-in — "skipped" means the caller left run-ruff off;
          # only an actual failure blocks Required.
          case "$LINT_RESULT" in
            success | skipped) ;;
            *)
              echo "::error::lint job reported '$LINT_RESULT' (must succeed or be skipped)"
              status=1
              ;;
          esac
          exit "$status"
