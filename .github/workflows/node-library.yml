name: Reusable Node Library CI

# CI gate for the `library` / `cli` project-lifecycle surfaces (narduk-charts,
# narduk-skills, narduk-eslint-config, narduk-libs). Generalizes
# reusable-node-ci.yml's lint/typecheck/test/build --if-present pattern plus
# narduk-libs' package-gates matrix + verify aggregator
# (narduk-enterprises/narduk-libs .github/workflows/ci.yml) into one reusable
# workflow. reusable-node-ci.yml has zero live callers today (GitHub code
# search, 2026-07-24) so nothing breaks by adding this alongside it — see
# README "Relationship to reusable-node-ci.yml" for which file to pick.
# Publish/release stays a separate per-repo workflow; credentials and
# versioning strategy (Changesets vs manual bump) differ enough across
# publishers that this file intentionally does not cover it.
#
# THE "Required" CONVENTION (this is the point of this repo): this workflow's
# last job is named exactly `Required`, `needs:` every other job, runs with
# `if: always()`, and fails unless each needed job succeeded or was
# intentionally skipped (an opted-out input, never a silent pass). Callers
# name their calling job id `ci`, so GitHub composes the identical required
# check context `ci / Required` on every adopting repo regardless of how many
# package-matrix lanes run underneath. See README for the full explanation.
#
# RUNNER ROUTING: `runner` is a caller-controlled, JSON-encoded string input —
# a plain string ("ubuntu-latest"), a JSON array, or a JSON object matching
# Config/github-runner-fleet.json's `runsOn` shape — decoded with fromJSON()
# at each job's `runs-on:`. A caller that is PUBLIC — or that may become
# public — must NEVER pass a self-hosted label here, because a fork PR would
# then execute attacker-controlled code on estate infrastructure. Only
# private, manifest-routed callers may pass a self-hosted runs-on value,
# resolved via `python3 scripts/github_runner_fleet.py route` in
# agent-infrastructure. The rule rests on the CALLER, not on this repo: this
# repo is private with organization-scoped Actions access (D-VIS-1, 2026-07-24
# — an earlier header here claimed it was public, which reversed CI-5 and was
# never true after D-VIS-1; workflows#2). `runner` is a free-form
# caller-supplied value and this workflow cannot police it.

# Least-privilege baseline for every job in this workflow. A called workflow's
# token is capped by the caller's grant and can only be narrowed from here,
# never widened — so this costs a caller nothing and protects against the one
# real failure mode: a job added later that forgets its own `permissions:` and
# would otherwise inherit whatever the caller happened to grant.
#
# It has no runtime effect today, deliberately: every job below already
# declares its own block, and job-level `permissions:` REPLACES the workflow
# level rather than merging with it. That is also why this is not a way to
# tighten the jobs that need `packages: read` — narrowing them here would do
# nothing, and narrowing them at job level makes the run fail to START with
# `startup_failure` and no logs at all (found during software-delivery's
# adoption). Job-level grants below are audited, not inherited.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "24"
      package-manager:
        description: "Package manager: pnpm or npm"
        required: false
        type: string
        default: "pnpm"
      runner:
        description: >-
          JSON-encoded runner for package jobs and, by default, Required: a plain string
          ("ubuntu-latest"), a JSON array
          (["self-hosted","Linux","X64","proxmox","linux-ci"]), or a JSON
          object ({"group":"linux-ci","labels":[...]}) matching the
          runner-fleet manifest's `runsOn` shape. Decoded with fromJSON(), so
          the value must be valid JSON — a bare string needs its own quotes.
          Defaults to GitHub-hosted ubuntu-latest. A PUBLIC (or
          possibly-future-public) CALLER MUST NEVER PASS A SELF-HOSTED LABEL:
          a fork PR would run attacker-controlled code on estate self-hosted
          infrastructure. The constraint is the caller's visibility, not this
          repo's (private, org-scoped Actions access — D-VIS-1, workflows#2).
        required: false
        type: string
        default: '"ubuntu-latest"'
      required-runner:
        description: >-
          Optional JSON-encoded runner for the secrets-free Required gate only.
          Overrides the package runner and Blacksmith switch for this job.
          Use an independently available runner when the caller's policy permits
          it, for example '"ubuntu-slim"' for a gate before a privileged release.
          Empty uses CI_LIGHTWEIGHT_RUNNER when configured; otherwise it retains
          the existing runner and overflow behavior.
        required: false
        type: string
        default: ""
      run-lint:
        description: "Run the lint script"
        required: false
        type: boolean
        default: true
      run-typecheck:
        description: "Run the typecheck script"
        required: false
        type: boolean
        default: true
      run-tests:
        description: "Run the test script"
        required: false
        type: boolean
        default: true
      run-build:
        description: "Run the build script"
        required: false
        type: boolean
        default: true
      require-scripts:
        description: >-
          Fail a gate whose npm script does not exist, instead of passing
          silently. `run-tests: true` is a caller ASSERTING that tests exist,
          but a missing script used to match nothing, exit 0, and report a
          GREEN lane that ran no tests at all. narduk-libs found this the hard
          way — its packages define `test:unit`, not `test`. Standard and
          extra-script lanes now probe before execution so this input governs
          every named package-script gate.

          DEFAULT IS `true`. The estate migration proved every declared
          standard lane and added per-matrix extra-script declarations before
          this flipped, so a missing named script is now a hard failure unless
          a caller explicitly opts back out during a bounded remediation.
        required: false
        type: boolean
        default: true
      working-directory:
        description: "Directory containing the root package.json / lockfile"
        required: false
        type: string
        default: "."
      install-args:
        description: >-
          Extra arguments appended to `pnpm install --frozen-lockfile` /
          `npm ci`. Exists because narduk-charts cannot install without
          `--legacy-peer-deps` (histoire 1.0.0-beta peer ranges), and a
          template that cannot express that is a template that repo cannot
          adopt. Keep it to install flags — it is not a general escape hatch.
        required: false
        type: string
        default: ""
      extra-scripts:
        description: >-
          Legacy shared fallback: space-separated package scripts run after
          build in every matrix lane that omits its own `extra-scripts` field.
          A lane-level field takes precedence even when it is the empty string,
          so one package's requirements cannot leak into another package.
          Non-matrix callers can keep using this input unchanged.
        required: false
        type: string
        default: ""
      package-matrix:
        description: >-
          JSON array of {label, filter, extra-scripts} lanes, one per workspace
          package — generalizes narduk-libs' package-gates matrix input.
          `filter` is passed to `pnpm --filter` / `npm --workspace`; leave it
          "" to run scripts at the repo root. The optional lane-level
          `extra-scripts` string overrides the shared input, including when it
          is explicitly empty. Matrix callers should declare it on every lane
          so each package runs only scripts it genuinely owns. The default
          remains a single whole-repo lane for non-monorepo callers.
          For bounded batches, use a root lane (filter: "") with an
          extra-script owning the package gates and disable the standard
          run-* inputs. That script receives the complete lane as
          PACKAGE_MATRIX_JSON, including caller-defined package selections.
          The caller owns selection, strict gate validation and failure
          aggregation; checkout, installation and credential cleanup still
          happen once per lane here.
        required: false
        type: string
        default: '[{"label":"default","filter":""}]'
    secrets:
      NARDUK_PLATFORM_GH_PACKAGES_READ:
        required: false

env:
  NUXT_TELEMETRY_DISABLED: 1

jobs:
  package:
    # GitHub rejects an empty matrix before starting a lane. Skip the job
    # before strategy expansion so intentional no-op selections stay green.
    if: ${{ toJSON(fromJSON(inputs.package-matrix)) != '[]' }}
    name: package / ${{ matrix.label }}
    # ---------------------------------------------------------------------
    # Blacksmith overflow (D-CI-CAP-1 (c), extends D-BLACKSMITH-2; company-hq
    # DECISIONS.md, fleet#337). Manual, kill-switched overflow for the
    # `linux-ci` class's ordinary private CI -- never deploy or tailnet work.
    # The org Actions variable `BLACKSMITH_RUNNERS_ENABLED` (default `false`,
    # visibility: private repos) is the switch; a repo-level variable of the
    # same name overrides it for exactly that repo (GitHub's normal
    # repo > org precedence), which is how a canary is scoped to one adopter
    # without moving the org default. Exact `true` selects the vendor's
    # documented `blacksmith-2vcpu-ubuntu-2404` label (override via
    # `vars.BLACKSMITH_LINUX_LABEL`) -- a label-only route, per D-BLACKSMITH-4:
    # provider-created runner groups are not a stable contract and are never
    # pinned here. Any other value, and any caller still on the public
    # `"ubuntu-latest"` default, keeps the caller's own `inputs.runner` route
    # unchanged -- this never touches a public repo's runner. This is a
    # MANUAL switch, not automatic provider fallback: GitHub does not move an
    # already-queued job to another runs-on target, so the fallback is
    # flipping the variable back to false (or deleting the repo override) and
    # rerunning. Kill conditions (D-BLACKSMITH-2/3, unchanged by this
    # extension): disable at 2,400 equivalent 2-vCPU minutes in a monthly
    # cycle, at any non-zero amount due, or on any unexpected billing state --
    # whichever comes first. No payment method or paid overage is authorized.
    # Policy-exception annotation (CI-RUNNER-POLICY.md Sec 2 exception 4, as
    # expanded by D-CI-CAP-1 (c)): a job landing on Blacksmith here is
    # exercising that named exception, not drift.
    # ---------------------------------------------------------------------
    runs-on: ${{ fromJSON(vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && inputs.runner != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || inputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.package-matrix) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # v7 caches the package manager BY DEFAULT (`package-manager-cache`
          # defaults to true) — dropping the `cache:` input does NOT turn it
          # off. Without this line the explicit restore/save below is a SECOND
          # cache running alongside the built-in one, and the `Post Run
          # actions/setup-node` tar the split was meant to remove is still
          # there: measured 27s on marketing-web `Build` after the split, on
          # top of a 22s explicit save. Two caches for one dependency tree is
          # strictly worse than the one it replaced.
          package-manager-cache: false

      # Dependency cache: restore everywhere, write only on the default branch
      # (company-hq#269). `setup-node`'s built-in `cache:` writes a fresh
      # tarball on every key MISS, scoped to whatever ref the job ran on — and
      # a cache written on `refs/pull/N/merge` is restorable only by that same
      # pull request. So every lockfile-changing PR paid a `Post Run
      # actions/setup-node` tar to produce an entry nothing would ever read
      # again, then the merge to `main` paid the identical tar a second time.
      # Measured before this change: 14s (narduk-charts `package / default`,
      # a 52s job) and 19s (marketing-web `Build`, a 67s job), against a
      # restore that took 1s because it had missed. The PR-scoped debris is
      # visible in the API too — narduk-charts carried 8 cache entries, four
      # of them `refs/pull/*` duplicates of a `refs/heads/main` entry.
      #
      # Restoring on every ref keeps the win (a PR falls back to the
      # default-branch entry through `restore-keys`, which is the entry it
      # actually wants) and drops the write nobody reads.
      # ================================================================
      # SELF-HOSTED RUNNERS DO NOT CACHE DEPENDENCIES.
      #
      # The guard is `runner.environment`, which exists ONLY at step level — a
      # job-level `if:` has no `runner` context (actionlint rejects it), so it
      # cannot be hoisted onto the job.
      #
      # On a self-hosted guest the pnpm/npm store is a PERSISTENT SHARED
      # directory that outlives the job and is shared by every lane running on
      # that guest. Tarballing it is not merely redundant — it is UNSOUND.
      # `actions/cache/save` archives the live store WHILE other concurrent
      # lanes write into it, so the archive is torn. `actions/cache/restore`
      # then lays that torn archive back over a live store, and pnpm
      # hard-links the result into `node_modules` — which is how a
      # `package.json` ends up holding JavaScript source:
      #
      #   ERR_PNPM_BAD_PACKAGE_JSON .../vue-tsc/package.json:
      #     Unexpected token 'i', "import {..."... is not valid JSON
      #   ERR_PNPM_BAD_PACKAGE_JSON .../svgo/package.json:
      #     '"use strict";/* * SonarQube JavaScript'
      #
      # Those are whole files of the WRONG KIND at a path that should hold
      # JSON, not truncations — the signature of a content-addressed store
      # captured mid-write. Evidence: narduk-libs `main` needed three attempts,
      # with a 481 MiB poisoned entry against a 205 MiB healthy one and
      # caniuse-lite data sitting at terser's `package.json` path; vtraceroute
      # reproduced an identical message on three different guests
      # (`linux-ci-2/3/5`), which is what proves the poison arrives through the
      # SHARED CACHE ENTRY and not from one sick guest (vtraceroute#4,
      # company-hq#269).
      #
      # RESTORE HAD TO GO TOO, not just save. An unsound writer poisons every
      # reader of the same key, so leaving restore on would let a clean guest
      # happily unpack the torn archive some other lane wrote. Nothing is lost:
      # on a persistent guest the store on disk IS the cache, already warm.
      #
      # GitHub-hosted runners are genuinely ephemeral, have no persistent
      # store, and run one job per VM — so there is no concurrent writer, the
      # tarball is sound, and both halves stay on for them.
      #
      # `python-data.yml` arrives at the same place by a different road and is
      # the precedent: it leaves `setup-uv`'s `enable-cache` at `auto`, which
      # already means "on for hosted, off for self-hosted". Do not "unify" the
      # two by forcing that one on.
      #
      # Enforced by rule R8 in scripts/lint_callables.py.
      # ================================================================
      - name: Resolve dependency cache directory
        id: dep-cache-dir
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm config set store-dir "$GITHUB_WORKSPACE/.cache/pnpm-store"
            echo "path=.cache/pnpm-store" >> "$GITHUB_OUTPUT"
          else
            npm config set cache "$GITHUB_WORKSPACE/.cache/npm"
            echo "path=.cache/npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependency cache
        id: dep-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            node-deps-${{ runner.os }}-${{ runner.arch }}-${{ inputs.package-manager }}-

      - name: Configure package registry auth
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$NARDUK_PLATFORM_GH_PACKAGES_READ" ]; then
            if ! package_scope=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          try {
            const pkg = fs.existsSync('package.json') ? JSON.parse(fs.readFileSync('package.json', 'utf8')) : {};
            const dependencies = Object.assign({}, pkg.dependencies, pkg.devDependencies, pkg.optionalDependencies, pkg.peerDependencies);
            const direct = Object.entries(dependencies).some(([name, spec]) => /@narduk-(enterprises|geo)\//.test(`${name} ${spec}`));
            const locked = ['pnpm-lock.yaml', 'package-lock.json', 'yarn.lock', 'bun.lock'].some(file => fs.existsSync(file) && fs.readFileSync(file, 'utf8').includes('npm.pkg.github.com'));
            console.log(direct || locked ? 'private' : 'public');
          } catch {
            console.error('Cannot determine package registry requirements from repository metadata.');
            process.exitCode = 1;
          }
          NODE
            ); then
              exit 1
            fi
            if [ "$package_scope" = private ]; then
              echo '::error::Private packages require the org NARDUK_PLATFORM_GH_PACKAGES_READ secret forwarded to this workflow. It maps to GH_PACKAGES_READ; do not substitute a GitHub App or write token.'
              exit 1
            fi
            echo 'No private package dependencies and no package-read secret; skipping registry auth.'
            exit 0
          fi
          if [[ "$NARDUK_PLATFORM_GH_PACKAGES_READ" == *[[:space:]]* ]]; then
            echo '::error::Package-read credential contains whitespace; repair the mapped secret.'
            exit 1
          fi
          if [ -f ./scripts/package-registry-auth.mjs ]; then
            node ./scripts/package-registry-auth.mjs
          elif [ -f ./tools/configure-package-registry-auth.mjs ]; then
            node ./tools/configure-package-registry-auth.mjs
          else
            # Direct org PAT path; legacy caller bootstraps keep their existing contract.
            umask 077
            # Variable reference stays literal; the token never enters this file.
            # shellcheck disable=SC2016
            printf '@narduk-enterprises:registry=https://npm.pkg.github.com\n@narduk-geo:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${GH_PACKAGES_READ}\n' > .npmrc.auth
          fi

      # SELF-HOSTED: THE PNPM STORE MUST SIT ON THE WORKSPACE'S OWN FILESYSTEM.
      #
      # pnpm materialises `node_modules` by HARD-LINKING out of its store, and
      # a hard link cannot cross a device boundary. When store and workspace
      # are on different filesystems pnpm silently degrades to a full file
      # COPY — no warning, no error, just a slower install and a private copy
      # of every dependency on disk.
      #
      # That is the live shape on `linux-ci` (CT 210). The runner's HOME is on
      # the guest's root volume (`pve-vm-210-disk-0`, st_dev 64519); the
      # workspace is on the separate transient volume (`pve-vm-210-disk-1`,
      # st_dev 64534). So pnpm's default store at
      # `$HOME/.local/share/pnpm/store` is ALWAYS cross-device from the
      # workspace, and every install on that guest has been copying. Measured
      # there on one nuxt+vue+typescript+vitest tree (212 MiB of
      # `node_modules`), warm store, `--offline`, three runs each:
      #
      #   store on the ROOT volume   3.93s / 3.03s / 2.83s   st_nlink=1   220 MiB
      #   store on the SAME volume   2.71s / 2.02s / 2.32s   st_nlink=2    17 MiB
      #
      # `st_nlink` is the proof, not the clock: 1 means every file was copied,
      # 2 means it was linked to the store. And the disk column is the bigger
      # win — 13x less transient volume consumed per materialised workspace, on
      # the volume whose 80% mark BLOCKS new allocations and whose hourly
      # reclaimer deletes real checkouts to stay under it.
      #
      # DERIVED, NOT HARDCODED. The store goes at the mount point of the
      # workspace's own filesystem, because "same device as the workspace" is
      # the actual requirement and a literal guest path would be a guess about
      # every other guest. When the workspace is on `/` the default store
      # already shares its device and this step does nothing. The directory
      # itself must be pre-provisioned runner-owned — the transient mount root
      # is root-owned, so the job cannot create it — and a missing or
      # unwritable one leaves pnpm's default store in place. The failure mode
      # is a slower install, never a failed one.
      #
      # GITHUB-HOSTED RUNNERS KEEP THE DEFAULT STORE. They are ephemeral, the
      # `actions/cache` restore above puts the store back on the same
      # filesystem as the workspace already, and there is no transient mount to
      # move it to. This is the same runner-class split as the cache block
      # above, for the same reason: the two runner classes have genuinely
      # different storage, not a preference.
      #
      # company-hq#269, been-sober-for#74.
      - name: Point pnpm at a workspace-local store (self-hosted)
        if: runner.environment == 'self-hosted' && inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          mount_point=$(df --output=target "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$mount_point" = "/" ]; then
            echo "workspace is on the root filesystem; pnpm's default store already shares its device"
            exit 0
          fi
          store="$mount_point/pnpm-store"
          if [ ! -d "$store" ] || [ ! -w "$store" ]; then
            echo "no writable store at $store; keeping pnpm's default store (installs will copy, not link)"
            exit 0
          fi
          echo "npm_config_store_dir=$store" >> "$GITHUB_ENV"
          echo "pnpm store -> $store (same filesystem as $GITHUB_WORKSPACE)"

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile ${{ inputs.install-args }}
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci ${{ inputs.install-args }}
        # Same registry-auth env the pnpm branch already had. Without it the
        # auth step above writes .npmrc.auth and npm never reads it, so an npm
        # caller with private @narduk-enterprises/* dependencies would fail on
        # a 401 that looks like a token problem rather than a wiring one.
        env:
          GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/${{ inputs.working-directory }}/.npmrc.auth
          NPM_CONFIG_GLOBALCONFIG: /dev/null

      - name: Remove package auth materialization
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/${{ inputs.working-directory }}/.npmrc.auth"

      # Only the default branch writes. `cache-hit` is the EXACT-key hit; a
      # `restore-keys` fallback leaves it false, which is correct here — that
      # is precisely the case where the store gained packages worth saving.
      # `github.*` refers to the CALLER's event, so `ref_name` is the caller's
      # branch (`main`) on a push and `N/merge` on a pull request. If
      # `github.event.repository` is ever absent the comparison is false and
      # the job simply skips the write, which is the safe direction.
      - name: Save dependency cache
        if: >-
          runner.environment == 'github-hosted'
          &&
          steps.dep-cache.outputs.cache-hit != 'true'
          && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.dep-cache-dir.outputs.path }}
          key: ${{ steps.dep-cache.outputs.cache-primary-key }}

      - name: Lint
        if: inputs.run-lint
        env:
          SCRIPT: lint
          FILTER: ${{ matrix.filter }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          # `--if-present` turns a missing script into a silent success, so ask
          # whether it exists FIRST — otherwise "ran nothing" is indistinguishable
          # from "passed". Both probes below are verified against real package
          # shapes (root, npm workspace, pnpm filter; present and absent).
          if [ -n "$FILTER" ] && [ "$PM" = "pnpm" ]; then
            present=$(pnpm --filter "$FILTER" exec node -e \
              'const s=require("./package.json").scripts||{};process.stdout.write(s[process.argv[1]]?"yes":"no")' \
              "$SCRIPT" 2>/dev/null || echo no)
          else
            if [ -n "$FILTER" ]; then
              raw=$(npm pkg get "scripts.$SCRIPT" --workspace "$FILTER" 2>/dev/null || echo '{}')
            else
              raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
            fi
            # `npm pkg get` yields `{}` for a missing root script and
            # `{"pkg": {}}` for a missing workspace one — so test the VALUE's
            # type, never the presence of a quote (the package name has quotes).
            present=$(printf '%s' "$raw" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          fi

          if [ "$present" != "yes" ]; then
            where=${FILTER:-the root package}
            msg="Lint is enabled but no \"$SCRIPT\" script exists in $where — this lane ran NOTHING"
            echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::$msg (require-scripts is on)"
              exit 1
            fi
            echo "::warning::$msg. Set require-scripts: true to make this a hard failure."
            exit 0
          fi

          if [ "$PM" = "pnpm" ]; then
            if [ -n "$FILTER" ]; then pnpm --filter "$FILTER" run "$SCRIPT"; else pnpm run "$SCRIPT"; fi
          else
            if [ -n "$FILTER" ]; then npm run "$SCRIPT" --workspace "$FILTER"; else npm run "$SCRIPT"; fi
          fi

      - name: Typecheck
        if: inputs.run-typecheck
        env:
          SCRIPT: typecheck
          FILTER: ${{ matrix.filter }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          # `--if-present` turns a missing script into a silent success, so ask
          # whether it exists FIRST — otherwise "ran nothing" is indistinguishable
          # from "passed". Both probes below are verified against real package
          # shapes (root, npm workspace, pnpm filter; present and absent).
          if [ -n "$FILTER" ] && [ "$PM" = "pnpm" ]; then
            present=$(pnpm --filter "$FILTER" exec node -e \
              'const s=require("./package.json").scripts||{};process.stdout.write(s[process.argv[1]]?"yes":"no")' \
              "$SCRIPT" 2>/dev/null || echo no)
          else
            if [ -n "$FILTER" ]; then
              raw=$(npm pkg get "scripts.$SCRIPT" --workspace "$FILTER" 2>/dev/null || echo '{}')
            else
              raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
            fi
            # `npm pkg get` yields `{}` for a missing root script and
            # `{"pkg": {}}` for a missing workspace one — so test the VALUE's
            # type, never the presence of a quote (the package name has quotes).
            present=$(printf '%s' "$raw" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          fi

          if [ "$present" != "yes" ]; then
            where=${FILTER:-the root package}
            msg="Typecheck is enabled but no \"$SCRIPT\" script exists in $where — this lane ran NOTHING"
            echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::$msg (require-scripts is on)"
              exit 1
            fi
            echo "::warning::$msg. Set require-scripts: true to make this a hard failure."
            exit 0
          fi

          if [ "$PM" = "pnpm" ]; then
            if [ -n "$FILTER" ]; then pnpm --filter "$FILTER" run "$SCRIPT"; else pnpm run "$SCRIPT"; fi
          else
            if [ -n "$FILTER" ]; then npm run "$SCRIPT" --workspace "$FILTER"; else npm run "$SCRIPT"; fi
          fi

      - name: Test
        if: inputs.run-tests
        env:
          SCRIPT: test
          FILTER: ${{ matrix.filter }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          # `--if-present` turns a missing script into a silent success, so ask
          # whether it exists FIRST — otherwise "ran nothing" is indistinguishable
          # from "passed". Both probes below are verified against real package
          # shapes (root, npm workspace, pnpm filter; present and absent).
          if [ -n "$FILTER" ] && [ "$PM" = "pnpm" ]; then
            present=$(pnpm --filter "$FILTER" exec node -e \
              'const s=require("./package.json").scripts||{};process.stdout.write(s[process.argv[1]]?"yes":"no")' \
              "$SCRIPT" 2>/dev/null || echo no)
          else
            if [ -n "$FILTER" ]; then
              raw=$(npm pkg get "scripts.$SCRIPT" --workspace "$FILTER" 2>/dev/null || echo '{}')
            else
              raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
            fi
            # `npm pkg get` yields `{}` for a missing root script and
            # `{"pkg": {}}` for a missing workspace one — so test the VALUE's
            # type, never the presence of a quote (the package name has quotes).
            present=$(printf '%s' "$raw" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          fi

          if [ "$present" != "yes" ]; then
            where=${FILTER:-the root package}
            msg="Test is enabled but no \"$SCRIPT\" script exists in $where — this lane ran NOTHING"
            echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::$msg (require-scripts is on)"
              exit 1
            fi
            echo "::warning::$msg. Set require-scripts: true to make this a hard failure."
            exit 0
          fi

          if [ "$PM" = "pnpm" ]; then
            if [ -n "$FILTER" ]; then pnpm --filter "$FILTER" run "$SCRIPT"; else pnpm run "$SCRIPT"; fi
          else
            if [ -n "$FILTER" ]; then npm run "$SCRIPT" --workspace "$FILTER"; else npm run "$SCRIPT"; fi
          fi

      - name: Build
        if: inputs.run-build
        env:
          SCRIPT: build
          FILTER: ${{ matrix.filter }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          # `--if-present` turns a missing script into a silent success, so ask
          # whether it exists FIRST — otherwise "ran nothing" is indistinguishable
          # from "passed". Both probes below are verified against real package
          # shapes (root, npm workspace, pnpm filter; present and absent).
          if [ -n "$FILTER" ] && [ "$PM" = "pnpm" ]; then
            present=$(pnpm --filter "$FILTER" exec node -e \
              'const s=require("./package.json").scripts||{};process.stdout.write(s[process.argv[1]]?"yes":"no")' \
              "$SCRIPT" 2>/dev/null || echo no)
          else
            if [ -n "$FILTER" ]; then
              raw=$(npm pkg get "scripts.$SCRIPT" --workspace "$FILTER" 2>/dev/null || echo '{}')
            else
              raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
            fi
            # `npm pkg get` yields `{}` for a missing root script and
            # `{"pkg": {}}` for a missing workspace one — so test the VALUE's
            # type, never the presence of a quote (the package name has quotes).
            present=$(printf '%s' "$raw" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
          fi

          if [ "$present" != "yes" ]; then
            where=${FILTER:-the root package}
            msg="Build is enabled but no \"$SCRIPT\" script exists in $where — this lane ran NOTHING"
            echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REQUIRE" = "true" ]; then
              echo "::error::$msg (require-scripts is on)"
              exit 1
            fi
            echo "::warning::$msg. Set require-scripts: true to make this a hard failure."
            exit 0
          fi

          if [ "$PM" = "pnpm" ]; then
            if [ -n "$FILTER" ]; then pnpm --filter "$FILTER" run "$SCRIPT"; else pnpm run "$SCRIPT"; fi
          else
            if [ -n "$FILTER" ]; then npm run "$SCRIPT" --workspace "$FILTER"; else npm run "$SCRIPT"; fi
          fi

      - name: Extra scripts
        if: inputs.extra-scripts != '' || matrix['extra-scripts'] != ''
        env:
          PACKAGE_MATRIX_JSON: ${{ toJSON(matrix) }}
          GATE: Extra scripts
          # `toJSON` preserves the distinction the contract needs:
          #   null -> lane omitted the field; use the legacy shared fallback
          #   ""   -> lane explicitly declares no extra scripts
          #   text -> lane owns exactly those scripts
          LANE_SCRIPTS_JSON: ${{ toJSON(matrix['extra-scripts']) }}
          LEGACY_SCRIPTS: ${{ inputs.extra-scripts }}
          FILTER: ${{ matrix.filter }}
          PM: ${{ inputs.package-manager }}
          REQUIRE: ${{ inputs.require-scripts }}
        run: |
          set -euo pipefail
          if [ "$LANE_SCRIPTS_JSON" = "null" ]; then
            SCRIPTS=$LEGACY_SCRIPTS
          else
            SCRIPTS=$(printf '%s' "$LANE_SCRIPTS_JSON" | node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk).on("end", () => {
                let value;
                try { value = JSON.parse(raw); }
                catch { console.error("::error::matrix extra-scripts is not valid JSON"); process.exit(1); }
                if (typeof value !== "string") {
                  console.error("::error::matrix extra-scripts must be a string");
                  process.exit(1);
                }
                process.stdout.write(value);
              });
            ')
          fi
          if [ -z "$SCRIPTS" ]; then
            echo "$GATE: this matrix lane declared no extra scripts, skipping"
            exit 0
          fi
          # Deliberate word splitting: extra-scripts is a space-separated list.
          # shellcheck disable=SC2086
          for SCRIPT in $SCRIPTS; do
            echo "::group::$SCRIPT"
            if [ -n "$FILTER" ] && [ "$PM" = "pnpm" ]; then
              present=$(pnpm --filter "$FILTER" exec node -e \
                'const s=require("./package.json").scripts||{};process.stdout.write(s[process.argv[1]]?"yes":"no")' \
                "$SCRIPT" 2>/dev/null || echo no)
            else
              if [ -n "$FILTER" ]; then
                raw=$(npm pkg get "scripts.$SCRIPT" --workspace "$FILTER" 2>/dev/null || echo '{}')
              else
                raw=$(npm pkg get "scripts.$SCRIPT" 2>/dev/null || echo '{}')
              fi
              present=$(printf '%s' "$raw" | node -e \
                'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let v;try{v=JSON.parse(s)}catch{return process.stdout.write("no")}const vals=(v&&typeof v==="object"&&!Array.isArray(v))?Object.values(v):[v];process.stdout.write(vals.some(x=>typeof x==="string"&&x.length>0)?"yes":"no")})')
            fi

            if [ "$present" != "yes" ]; then
              where=${FILTER:-the root package}
              msg="$GATE names \"$SCRIPT\" for $where but no such script exists — that entry ran NOTHING"
              echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
              if [ "$REQUIRE" = "true" ]; then
                echo "::error::$msg (require-scripts is on)"
                exit 1
              fi
              echo "::warning::$msg. Set require-scripts: true to make this a hard failure."
              echo "::endgroup::"
              continue
            fi

            if [ "$PM" = "pnpm" ]; then
              if [ -n "$FILTER" ]; then
                pnpm --filter "$FILTER" run "$SCRIPT"
              else
                pnpm run "$SCRIPT"
              fi
            else
              if [ -n "$FILTER" ]; then
                npm run "$SCRIPT" --workspace "$FILTER"
              else
                npm run "$SCRIPT"
              fi
            fi
            echo "::endgroup::"
          done

  required:
    name: Required
    if: always()
    needs: package
    # Explicit override, then the organization lightweight route, then the
    # original package/overflow route for callers that have not adopted it.
    runs-on: ${{ fromJSON(inputs.required-runner || vars.CI_LIGHTWEIGHT_RUNNER || (vars.BLACKSMITH_RUNNERS_ENABLED == 'true' && inputs.runner != '"ubuntu-latest"' && format('"{0}"', vars.BLACKSMITH_LINUX_LABEL || 'blacksmith-2vcpu-ubuntu-2404') || inputs.runner)) }}
    # Headroom for the linux-ci capacity-hook slot wait (up to 900s, counts against timeout-minutes) -- fleet#276.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require every package lane to succeed
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          MATRIX_EMPTY: ${{ toJSON(fromJSON(inputs.package-matrix)) == '[]' }}
        run: |
          case "$PACKAGE_RESULT" in
            success) exit 0 ;;
            skipped)
              test "$MATRIX_EMPTY" = true || {
                echo "::error::package job skipped with a nonempty selection"
                exit 1
              }
              exit 0 ;;
            *) echo "::error::package job reported '$PACKAGE_RESULT'"; exit 1 ;;
          esac
