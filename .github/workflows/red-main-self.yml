# Reference adopter (narduk-reboot P3-C2): this repository listens to its
# own `CI` workflow the same way any other adopter would, so red-main-
# listener.yml has a live caller from day one instead of shipping with zero
# adopters like reusable-node-ci.yml did.
name: Red-main listener (self)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  red-main:
    # `event == 'push' || event == 'workflow_dispatch'` (not merely
    # `head_branch == default_branch`, PR review LOW finding): CI also runs
    # on `pull_request`, whose `workflow_run.head_branch` is the PR's own
    # head branch -- a branch literally named `main` (fork or same-repo)
    # would otherwise pass this filter and post a red-main issue for
    # someone else's pull request. `workflow_dispatch` is included (PR
    # review CONSIDER finding, second round): `ci.yml` also runs on manual
    # dispatch, and a red manual run dispatched against the default branch
    # is exactly as real a "main is red" signal as a red push -- the
    # `head_branch == default_branch` check still excludes a manual dispatch
    # against any other branch or ref.
    if: |
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    uses: ./.github/workflows/red-main-listener.yml
    permissions:
      contents: read
      issues: write
    with:
      workflow-name: ${{ github.event.workflow_run.name }}
      conclusion: ${{ github.event.workflow_run.conclusion }}
      run-id: ${{ github.event.workflow_run.id }}
      run-url: ${{ github.event.workflow_run.html_url }}
      head-sha: ${{ github.event.workflow_run.head_sha }}
