name: Prove the deployed commit
description: >-
  Poll a URL until it answers 200 with a body that is exactly the expected text (by default this commit's SHA), and
  fail when it never does. A deploy step that exits 0 says the upload was accepted, not that the new code is serving:
  this asks the live host.

inputs:
  url:
    description: The URL to read, e.g. https://staging.example.com/version. It must answer with the commit and nothing else.
    required: true
  expected:
    description: The text the URL must answer with.
    default: ${{ github.sha }}
  attempts:
    description: How many times to ask.
    default: '60'
  interval:
    description: Seconds between attempts.
    default: '5'

runs:
  using: composite
  steps:
    - name: Ask the live host which commit it serves
      shell: bash
      env:
        PROOF_URL: ${{ inputs.url }}
        PROOF_EXPECTED: ${{ inputs.expected }}
        PROOF_ATTEMPTS: ${{ inputs.attempts }}
        PROOF_INTERVAL: ${{ inputs.interval }}
      run: |
        set -uo pipefail
        body="$(mktemp)"; trap 'rm -f "$body"' EXIT
        live=""; said="<unreachable>"
        for i in $(seq 1 "$PROOF_ATTEMPTS"); do
          # Only a whole answer with a 200 counts. The commit in the body of a 503, or in the part of a response that
          # arrived before the transfer failed, is not a host serving that commit.
          if code=$(curl --silent --max-time 10 -o "$body" -w '%{http_code}' "$PROOF_URL"); then
            if [ "$code" = 200 ]; then live=$(cat "$body"); said="'$live'"; else live=""; said="HTTP $code"; fi
          else
            live=""; said="<unreachable>"
          fi
          echo "[$i] $PROOF_URL=$said expected=$PROOF_EXPECTED"
          [ "$live" = "$PROOF_EXPECTED" ] && break
          [ "$i" = "$PROOF_ATTEMPTS" ] || sleep "$PROOF_INTERVAL"
        done
        if [ "$live" != "$PROOF_EXPECTED" ]; then
          echo "::error::$PROOF_URL answers $said, not $PROOF_EXPECTED: the deploy shipped nothing, or shipped something else"
          exit 1
        fi
        echo "$PROOF_URL serves $PROOF_EXPECTED"
